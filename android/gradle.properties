org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
# AGP 9 asks for excludeLibraryComponentsFromConstraints (or useConstraints=false)
# to improve import performance, but disabling project constraints also drops the
# inter-module version alignment this build relies on (with the constraints on,
# feature:contacts resolves activity 1.8.2 and gets PickVisualMedia; without them
# it fell back to 1.5.1 and failed to compile). Keep the constraints and suppress
# only this advisory warning, with that reason.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
