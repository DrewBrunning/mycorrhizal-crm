# detekt configuration (issue #358 — SAST stack expansion).
# buildUponDefaultConfig is set in the convention plugin, so this file layers
# only this repo's deviations on top of detekt's curated default rule set.
#
# KOTLIN FORMATTING (issue #1901): detekt's `ktlint` wrapper rule set is enabled
# and enforced by the same `./gradlew detekt` task. The code style is
# android_studio (recorded in v1.5.1) and is mirrored in android/.editorconfig
# for IDE/editorconfig-aware tooling; the wrapper reads the `ktlint:` block
# below, not the .editorconfig. Because formatting is now a gate, every rule
# that is disabled carries a reason and there is deliberately no detekt
# baseline file — a finding must be fixed, not grandfathered.
#
# The remaining style-shaped rules turned off below are detekt's *own* style
# rules (a different rule set from ktlint's), and stay off so this gate remains
# high-signal: dead code, over-broad exception handling, file/declaration
# mismatches, and formatting, the actual complement to CodeQL/mobsfscan/Android
# Lint.

naming:
  # Compose composables are capitalized by convention (@Composable fun InfoRow),
  # which this rule (unaware of @Composable) flags as violations.
  FunctionNaming:
    active: false

complexity:
  # ViewModels/Repositories legitimately expose many functions.
  TooManyFunctions:
    active: false
  # Compose dialog/screen signatures legitimately take many params; splitting
  # them would add indirection without changing behavior.
  LongParameterList:
    active: false
  LongMethod:
    active: false
  # Validators and permission flows are naturally branchy.
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  NestedBlockDepth:
    active: false
  ComplexCondition:
    active: false

style:
  # The repo doesn't enforce line length (ktlint/editorconfig are not set up).
  MaxLineLength:
    active: false
  # Literals are used deliberately throughout (API keys, colors, offsets).
  MagicNumber:
    active: false
  # Guard clauses are preferred over early-return-free rewrites.
  ReturnCount:
    active: false
  ExplicitItLambdaParameter:
    active: false
  # detekt 2.0 split the 1.x rule in two; both stay off to preserve the
  # pre-upgrade style posture (see the file header).
  ExplicitItLambdaMultipleParameters:
    active: false
  MayBeConstant:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

# Issue #1908: Compose correctness rules (io.nlopez.compose.rules:detekt),
# loaded as a detekt plugin by configureDetekt. The rule set's defaults are
# copied here explicitly: a third-party rule set is not merged automatically,
# and a rule only runs once its `Compose:` entry is active. Deliberately no
# baseline — findings are fixed, or the rule is disabled with a reason below.
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableNestingDepth:
    # Opt-in in the plugin (max nesting = 3). Deep dialogs/screens are a
    # readability question this repo handles in review; enabling it would
    # flag legitimate layout trees without a correctness payoff.
    active: false
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # These are the app's deliberate, app-wide ambient values (server origin,
    # capabilities, date/time format, drawer state, theme and warning colors);
    # they are provided once at the root rather than threaded through every
    # screen. New locals still need adding here (and a reason).
    allowedCompositionLocals: LocalDarkTheme,LocalDateFormat,LocalDrawerOpen,LocalIs24Hour,LocalServerCapabilities,LocalServerUrl,LocalServerVersion,LocalWarningColors
  CompositionLocalNaming:
    active: true
  ConditionHoist:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  InvalidReadOnlyComposable:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    # The app is Material 3 throughout and has no Material 2 dependency; the
    # rule is opt-in in the plugin and would duplicate the dependency check.
    active: false
  MissingNonRestartableComposable:
    active: true
  MissingReadOnlyComposable:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    # Issue #1908 scopes the modifier checks to *placement*: a Modifier that is
    # not the first optional parameter (ComposableParamOrder) or not applied to
    # the root (ModifierNotUsedAtRoot). The app's screens are leaf NavHost
    # routes, not reusable components, so requiring every public entry point to
    # expose a modifier is an unrelated API-shape refactor across 50+ screens;
    # the screens in app/core/ui/feature:contacts were brought up to the
    # convention here, the rest can adopt it as they are touched.
    active: false
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierShouldBeForwardedToEveryBranch:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    # This codebase names completion/report callbacks for the event that just
    # happened (onErrorShown, onSaved, onDeleted, onFilePicked,
    # onDeepLinkHandled) rather than as commands. Renaming them across public
    # screen APIs and their tests is churn with no correctness benefit; new
    # command callbacks still follow the onX convention in review.
    active: false
  PreviewAnnotationNaming:
    active: true
  PreviewNaming:
    # Opt-in in the plugin; preview function naming is cosmetic and the
    # annotation-naming rule above already covers the correctness-shaped part.
    active: false
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  StaleRememberUpdatedStateInRemember:
    active: true
  StateParam:
    active: true
  UnnecessaryComposable:
    active: true
  UnnecessaryLaunchedEffect:
    active: true
  UnstableCollections:
    # Opt-in in the plugin and reports every List/Map/Set parameter, including
    # the many small stable-in-practice value collections the UI passes around;
    # the mutability rules (MutableParams/MutableStateParam) cover the real
    # skipping bugs.
    active: false
  VarsWithoutStateBacking:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    # Root- and pane-scoped ViewModels are acquired in place because their
    # lifetime is tied to the composition, not to a screen parameter: the
    # share-intake and permission-listener hosts exist only to observe, and
    # the persistent two-pane contact list lives outside the NavHost (see
    # MycorrhizalApp.kt). Screen ViewModels already use hiltViewModel()
    # default parameters.
    active: false

# Issue #1901: ktlint formatting rules via detekt's wrapper. Code style is
# android_studio (the recorded v1.5.1 choice); indentStyle stays explicit so
# the wrapper's per-rule editorconfig emulation matches android/.editorconfig.
ktlint:
  code_style: android_studio
  indentStyle: space
  FunctionName:
    # Compose composables are PascalCase (@Composable fun ContactRow) while the
    # rule expects camelCase. detekt 2.0.0-alpha.6's wrapper hardcodes ktlint's
    # ignore-when-annotated-with list to empty, so @Composable cannot be
    # exempted through config; keeping the rule on would flag every composable.
    active: false
  FunctionLiteral:
    # detekt 2.0.0-alpha.6's wrapper cannot reach a fixed point for a multiline
    # trailing lambda with a parameter under android_studio: autocorrect writes
    # "newline expected before parameter", then the next run reports "no newline
    # expected". One occurrence in RuntimePermissionApplicabilityTest.kt oscillates
    # forever, so the rule is off rather than leaving an unstable gate.
    active: false
  MaximumLineLength:
    # Not auto-correctable, and the tree is not wrapped at a fixed width
    # (~1,150 lines exceed 120 columns). Adopting it would turn this mechanical
    # reformat into a large hand rewrite, so it stays off and `max_line_length`
    # in android/.editorconfig remains IDE guidance only. Revisit as a separate
    # wrapping change if line length becomes a priority.
    active: false
