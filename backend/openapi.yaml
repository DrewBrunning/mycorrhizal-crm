  # --- Calendar subscriptions ---
  /calendars:
    get:
      summary: List the user's calendar subscriptions
      operationId: listCalendarSubscriptions
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's subscriptions (no pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendars:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarSubscriptionResponse"
    post:
      summary: Add an iCal/CalDAV calendar to import activities from
      operationId: createCalendarSubscription
      description: Capped at 10 subscriptions per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSubscriptionInput"
      responses:
        "201":
          description: Subscription created (raw response, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSubscriptionResponse"
        "400":
          description: Invalid URL, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The per-user cap (10 subscriptions) is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /calendars/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Update a calendar subscription
      operationId: updateCalendarSubscription
      description: Changing the URL resets the sync token (full resync on next sync); clear_password removes stored credentials; an empty password leaves the existing credential untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSubscriptionInput"
      responses:
        "200":
          description: Updated subscription (raw).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSubscriptionResponse"
        "400":
          description: Non-integer id, invalid URL, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a calendar subscription
      operationId: deleteCalendarSubscription
      description: Imported activities are kept; only the subscription and its event-link bookkeeping are removed.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /calendars/{id}/sync:
    post:
      summary: Trigger an immediate sync of one calendar subscription
      operationId: syncCalendarSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sync completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  created: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }
        "400":
          description: Non-integer id or invalid calendar URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Sync failed for an unclassified reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The remote server rejected the request, was unreachable, returned
            unparsable or oversized data, or resolved to a blocked private
            address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

