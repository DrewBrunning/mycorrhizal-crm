openapi: 3.0.3
info:
  title: Mycorrhizal CRM API
  description: >
    REST API for Mycorrhizal's contact model. As of WP-71 (P2,
    docs/fork-plan/50-integration-and-rebrand.md), the contact endpoints speak
    the neutral RFC 9553-shaped model (contactmodel.Record/Card) rather than
    the legacy flat Contact DTO. GET /contacts (list) returns a slim
    ContactSummary per item; GET/POST/PUT /contacts/{id} exchange the full
    Card/CRM shape (ContactRecordResponse / ContactRecordInput) — a
    symmetric read/write contract.


    T8 (docs/fork-plan/tickets/16-T8-openapi.md) extended this spec to cover
    the whole REST surface: every route registered by
    backend/routes/routes.go under /api/v1 plus the unversioned /health. The
    drift test (backend/openapi_test.go) enumerates the live Gin router and
    fails on any registered route with no spec entry, so this file cannot go
    stale again.

    Coverage notes:

    - **Auth:** every path under /api/v1 except the public auth group
      (register, login, logout, check-password-strength, password-reset,
      auth/oidc/config) requires a session cookie (`auth_token`, set by login
      and OIDC callback) or an `Authorization: Bearer <token>` header. API
      tokens (mycorrhizal_…) are accepted on the general REST path only when
      their scope is `full`; a `carddav`-scoped token is rejected with 403.
      API tokens cannot access the admin paths at all.
    - **OIDC:** `/auth/oidc/login` and `/auth/oidc/callback` are registered
      only when OIDC is enabled at server startup (`OIDC_ENABLED=true`); they
      are documented here for completeness but 404 on a non-OIDC build.
      `/auth/oidc/config` is always present.
    - **CardDAV:** the CardDAV surface (`.well-known/carddav`,
      `/carddav/*`) is a WebDAV/XML protocol, not JSON REST, and is out of
      scope for this spec by design. It is enabled separately via
      `CARDDAV_ENABLED`.
    - **Deliberate omissions (not bugs):** `fields=` on GET /contacts is
      gone (WP-71 Gap 3) and is silently ignored if sent;
      `includes=relationships` was removed in §3d WP4 and is likewise a no-op
      rather than an error. The only Redocly lint warnings left are on
      genuinely-public endpoints that return no 4xx by design — /health
      (200/503), /auth/oidc/config (200), the OIDC login/callback redirects
      (302), and /logout (200) — do not add fake 4xx responses to silence
      them.
    - **Pagination:** every list endpoint returns the offset-shaped envelope
      `{ <items>: [...], "total", "page", "limit" }` documented below. T17
      (docs/fork-plan/tickets/17-T17-change-feeds.md) will replace this with
      cursor-based pagination pre-alpha; when that lands, every paginated
      response in this spec must be revised together (the drift test keeps the
      route surface honest, not the envelope).
    - **Response-envelope asymmetry is real and intentional:** several create
      endpoints wrap their object (`{"note": …}`, `{"circle": …}`) while their
      update/single-GET siblings return it raw. Each operation documents what
      it actually returns; the RelationshipEdge asymmetry
      (create wraps `{"relationship_edge": …}`, update/accept return raw) has
      already burned a frontend once.
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  # Unversioned health endpoint (registered outside /api/v1 in routes.go —
  # served at the app root, hence the path-level server override).
  /health:
    servers:
      - url: /
    get:
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database is unreachable (same body shape, status unhealthy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # --- OIDC (public) ---
  /auth/oidc/config:
    get:
      summary: OIDC availability/config
      operationId: getOIDCConfig
      security: []
      description: Always registered, whether or not OIDC is enabled.
      responses:
        "200":
          description: Whether OIDC login is enabled and the provider name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCConfigResponse"
  /auth/oidc/login:
    get:
      summary: Start an OIDC login (only present when OIDC is enabled)
      operationId: oidcLogin
      security: []
      description: >
        Only registered when OIDC_ENABLED=true. Sets three httpOnly cookies
        (oidc_state, oidc_nonce, oidc_pkce) and 302-redirects to the
        provider's authorization endpoint.
      responses:
        "302":
          description: Redirect to the provider's authorization URL.
        "500":
          description: Failed to generate state/nonce.
  /auth/oidc/callback:
    get:
      summary: OIDC callback (only present when OIDC is enabled)
      operationId: oidcCallback
      security: []
      description: >
        Only registered when OIDC_ENABLED=true. Exchanges the code, verifies
        the ID token, provisions/finds the user and 302-redirects to / (or to
        /login?error=… on any failure). Sets the auth_token and id_token
        cookies on success.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to / (success) or /login?error=… (failure).

  # --- Public auth ---
  /register:
    post:
      summary: Register a new user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "201":
          description: Account created. The first account ever is made admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation failed (weak password, bad email, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Registration is disabled (REGISTRATION_ENABLED=false).
        "409":
          description: Email or username already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login:
    post:
      summary: Log in with username or email
      operationId: login
      security: []
      description: >
        Sets the httpOnly auth_token cookie on success; the token is never in
        the response body. Accepts either `identifier` (username or email) or
        the legacy `email` alias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in; auth_token cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  language: { type: string }
                  date_format: { type: string }
        "400":
          description: Missing identifier/password or malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials (deliberately identical for unknown user vs wrong password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Account temporarily locked after repeated failures.
  /logout:
    post:
      summary: Log out (clears session cookies)
      operationId: logout
      security: []
      description: >
        Always clears auth_token and id_token cookies. When the session used
        OIDC and the provider advertises an end-session endpoint, the response
        also carries a redirect_url for RP-Initiated Logout.
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /check-password-strength:
    post:
      summary: Evaluate a password's strength without changing it
      operationId: checkPasswordStrength
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Strength evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordStrength"
        "400":
          description: Missing password.
  /password-reset/request:
    post:
      summary: Request a password reset email
      operationId: requestPasswordReset
      security: []
      description: Always returns the same response whether or not the email exists (anti-enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Instructions sent (or would have been).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password changes are disabled in demo mode.
        "502":
          description: The reset email could not be sent.
  /password-reset/confirm:
    post:
      summary: Complete a password reset with the emailed token
      operationId: confirmPasswordReset
      security: []
      description: Bumps the user's token_version, invalidating all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid/expired token or weak new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password changes are disabled in demo mode.

  # --- Current user (protected) ---
  /users/change-password:
    post:
      summary: Rotate the authenticated user's password
      operationId: changePassword
      description: Bumps token_version (kills other sessions) and, for cookie sessions, re-issues a fresh auth_token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Wrong current password, or new password equals current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password changes are disabled in demo mode.
  /users/language:
    patch:
      summary: Update the authenticated user's UI language
      operationId: updateLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLanguageInput"
      responses:
        "200":
          description: Language updated (normalized to lowercase).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  language: { type: string }
        "400":
          description: Unsupported language or malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/date-format:
    patch:
      summary: Update the authenticated user's date format
      operationId: updateDateFormat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDateFormatInput"
      responses:
        "200":
          description: Date format updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  date_format: { type: string }
        "400":
          description: Unsupported date format or malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/enabled-contact-fields:
    get:
      summary: Get the user's enabled (visible) contact fields
      operationId: getEnabledContactFields
      description: enabled_contact_fields is null when the user has never configured it (the client then applies its default set).
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The enabled contact fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled_contact_fields:
                    type: array
                    items: { type: string }
                    nullable: true
    patch:
      summary: Set the user's enabled (visible) contact fields
      operationId: updateEnabledContactFields
      description: A nil/absent fields list means "reset to the default set".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledContactFieldsInput"
      responses:
        "200":
          description: Fields updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  enabled_contact_fields:
                    type: array
                    items: { type: string }
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      summary: Get the authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Contacts ---
  /contacts:
    get:
      summary: List contacts (slim projection)
      operationId: listContacts
      description: >
        Returns a page of ContactSummary items — never the full Card, so a
        mobile contact-list screen doesn't have to fetch every contact's
        nested data (see docs/fork-plan/50-integration-and-rebrand.md WP-71
        Gap 2). Pagination is cursor-based (T17): rows are ordered by the
        (updated_at, id) feed key and a page is resumed with next_cursor.
        ?since= turns the endpoint into a change feed returning every row
        changed after the cursor — including soft-deleted rows marked
        deleted:true — for incremental sync. An exact `total` count is
        deliberately gone. The fields= partial-projection param is gone (Gap
        3) and has no effect if sent.
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque resume token returned as next_cursor by the previous page.
            Resumes the list after that (updated_at, id) position. Ignored
            when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every row changed after this position —
            created, updated, AND soft-deleted (deleted:true) — ordered
            forward, ignoring search/circle/archive filters. A cursor older
            than DELETED_RETENTION_DAYS returns 410 Gone (tombstones were
            purged; full resync required).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: search
          in: query
          description: Free-text search across name/nickname/email/phone (including secondary array entries).
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: archived
          in: query
          description: When true (and include_archived is not set), return only archived contacts.
          schema: { type: boolean, default: false }
        - name: circle
          in: query
          schema: { type: string }
        - name: circle_legacy
          in: query
          description: >
            Temporary T2-migration shim that filters against the legacy flat
            contacts.circles JSON column. Remove once the migration is
            complete; do not build on it.
          schema: { type: string }
        - name: vcard_uid
          in: query
          description: >
            Repeatable batch by-VCardUID lookup (e.g. ?vcard_uid=a&vcard_uid=b).
            Bypasses pagination/search/sort entirely and returns only the
            requested contacts (the RelationshipEdge frontend uses this to
            resolve VCardUID references). Respects include_archived.
          schema: { type: string }
        - name: includes
          in: query
          description: >
            Comma-separated subset of notes,activities,reminders. When set,
            each item is a ContactSummaryWithRelations instead of a plain
            ContactSummary. includes=relationships was removed in §3d WP4 and
            is a no-op (not an error).
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Malformed cursor or since value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: >
            The ?since= cursor is older than DELETED_RETENTION_DAYS — deleted
            rows have been purged, so incremental sync can no longer converge.
            Full resync required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/ContactSummary"
                        - $ref: "#/components/schemas/ContactSummaryWithRelations"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create a contact
      operationId: createContact
      description: >
        Accepts the full neutral Card/CRM shape (ContactRecordInput), not the
        legacy flat DTO. At least one name component (kind=given) or
        card.name.full is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRecordInput"
      responses:
        "201":
          description: Contact created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Contact created successfully" }
                  contact:
                    $ref: "#/components/schemas/ContactRecordResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/circles:
    get:
      summary: List the user's circle names
      operationId: listCircleNames
      description: >
        Returns a bare JSON array of circle names (the same Circle entities
        listed by /circles, projected to names only). ?legacy=true reads the
        legacy flat contacts.circles JSON column instead (T2 triage shim).
      parameters:
        - name: legacy
          in: query
          schema: { type: boolean, default: false }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Circle names.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /contacts/random:
    get:
      summary: List five random, non-archived contacts
      operationId: getRandomContacts
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Random contacts (raw Contact rows plus photo_thumbnail).
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResponse"
  /contacts/birthdays:
    get:
      summary: List upcoming birthdays
      operationId: getUpcomingBirthdays
      description: Up to 5 results, extended to include all birthdays within two weeks.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Upcoming birthdays.
          content:
            application/json:
              schema:
                type: object
                properties:
                  birthdays:
                    type: array
                    items:
                      $ref: "#/components/schemas/Birthday"
  /contacts/merge/preview:
    post:
      summary: Preview merging two contacts
      operationId: previewContactMerge
      description: Computes the field union, conflicts, and per-association counts without mutating anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMergeRequest"
      responses:
        "200":
          description: Merge preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMergePreviewResponse"
        "400":
          description: keep_id equals merge_id, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One of the two contacts not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/merge:
    post:
      summary: Merge two contacts (keep_id survives, merge_id is absorbed)
      operationId: commitContactMerge
      description: >
        Every field conflict must be resolved in the resolutions map or the
        request fails with 400. The loser is soft-deleted; an audit note is
        attached to the keeper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMergeRequest"
      responses:
        "200":
          description: Merge committed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Contacts merged" }
                  contact:
                    $ref: "#/components/schemas/ContactRecordResponse"
        "400":
          description: keep_id equals merge_id, unresolved conflicts, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One of the two contacts not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a contact (full neutral Record/Card)
      operationId: getContact
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRecordResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a contact
      operationId: updateContact
      description: Same request/response shape as POST /contacts (symmetric read/write contract).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRecordInput"
      responses:
        "200":
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRecordResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a contact
      operationId: deleteContact
      description: Soft-deletes the contact and cascade-deletes all its associations (notes, activities links, reminders, edges, memberships, life events, field values, sync links).
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Archive a contact (and delete its reminders)
      operationId: archiveContact
      responses:
        "200":
          description: The archived contact (raw Contact JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFlat"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/unarchive:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Unarchive a contact
      operationId: unarchiveContact
      responses:
        "200":
          description: The unarchived contact (raw Contact JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFlat"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Contact import (CSV / VCF / JSContact) ---
  /contacts/import/upload:
    post:
      summary: Upload a CSV file to start a contact import (step 1 of 3)
      operationId: uploadCsvImport
      description: >
        Parses the CSV's headers and suggests column-to-field mappings.
        Returns a session_id used by POST /contacts/import/preview and
        /contacts/import/confirm. The session (and any prior expired ones)
        is cleaned up opportunistically on each upload call.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A .csv file." }
      responses:
        "200":
          description: Parsed headers, suggested mappings, and a sample of rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUploadResponse"
        "400":
          description: Missing file, wrong extension, oversized file, or malformed CSV.
  /contacts/import/vcf/upload:
    post:
      summary: Upload a VCF (vCard 3.0/4.0) file to start a contact import
      operationId: uploadVcfImport
      description: >
        No column mapping needed (vCard is self-describing): parses directly
        into a preview with duplicate detection. Confirm via
        POST /contacts/import/vcf/confirm.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A .vcf file (one or more concatenated vCards)." }
      responses:
        "200":
          description: Parsed rows with duplicate detection and per-row diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Missing file, wrong extension, oversized file, or malformed VCF.
  /contacts/import/jscontact/upload:
    post:
      summary: Upload a JSContact (RFC 9553) JSON file to start a contact import
      operationId: uploadJscontactImport
      description: >
        Mirrors /contacts/import/vcf/upload — the resulting session is
        format-agnostic (same underlying VCFContactData shape), so confirm
        via the same POST /contacts/import/vcf/confirm endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A JSContact .json file (single Card or an array of Cards)." }
      responses:
        "200":
          description: Parsed rows with duplicate detection and per-row diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Missing file, wrong extension, oversized file, or malformed JSON.
  /contacts/import/preview:
    post:
      summary: Apply column mappings to a CSV import session and get a preview (step 2 of 3)
      operationId: previewCsvImport
      description: CSV-only — VCF/JSContact sessions already have their preview from the upload step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreviewRequest"
      responses:
        "200":
          description: Row-by-row preview with duplicate detection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Unknown/expired session, or session owned by another user.
  /contacts/import/confirm:
    post:
      summary: Execute a CSV import with the caller's per-row actions (step 3 of 3)
      operationId: confirmCsvImport
      description: >
        One bad row's error does not abort the batch — other rows in the
        same request still commit. The session is deleted on completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmRequest"
      responses:
        "200":
          description: Import result summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: No prior preview cached, or unknown/expired/foreign session.
  /contacts/import/vcf/confirm:
    post:
      summary: Execute a VCF or JSContact import with the caller's per-row actions
      operationId: confirmVcfImport
      description: >
        Same contract as /contacts/import/confirm, plus photo processing:
        embedded or URL-referenced photos are saved after the row commits
        (an incoming photo never overwrites a contact that already has one
        on "update").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmRequest"
      responses:
        "200":
          description: Import result summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: A CSV-sourced session ID was sent here, no prior preview cached, or unknown/expired/foreign session.

  # --- Relationship edges ---
  /relationship-edges:
    get:
      summary: List relationship edges
      operationId: listRelationshipEdges
      description: >
        Cursor-paginated (T17). Relationship edges are a hard-delete
        collection — the sync.mode is full_resync: a client re-pulls the
        collection rather than using ?since= (edges have no tombstone).
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: contact_id
          in: query
          description: Filter to edges where this Contact.VCardUID is either endpoint.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Filter by status (confirmed or suggested).
          schema: { type: string, enum: [confirmed, suggested] }
        - name: type
          in: query
          description: Filter by relationship type token (e.g. parent_of).
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of edges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  relationship_edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelationshipEdge"
                  total: { type: integer }
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create a relationship edge
      operationId: createRelationshipEdge
      description: >
        Each endpoint is either an existing contact (source_id/target_id, a
        Contact.VCardUID) or a not-yet-existing "thin" contact described
        inline (source_thin/target_thin) — exactly one of the pair per
        endpoint. The server always sets Source=user-confirmed,
        Confidence=1.0, Status=confirmed. **Response is wrapped in a
        `relationship_edge` key** (unlike the update/accept endpoints, which
        return the raw object — a real asymmetry that has burned a frontend
        once).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipEdgeInput"
      responses:
        "201":
          description: Edge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  relationship_edge:
                    $ref: "#/components/schemas/RelationshipEdge"
        "400":
          description: Validation failed, both/neither endpoint given, or source_id == target_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: An existing endpoint contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /relationship-edges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a relationship edge
      operationId: getRelationshipEdge
      responses:
        "200":
          description: The edge (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEdge"
        "404":
          description: Edge not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a relationship edge (full replace)
      operationId: updateRelationshipEdge
      description: Status/Source/Confidence are server-derived and never changed by an update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipEdgeInput"
      responses:
        "200":
          description: The updated edge (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEdge"
        "400":
          description: Validation failed or endpoint resolution failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Edge or endpoint contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a relationship edge
      operationId: deleteRelationshipEdge
      description: Hard delete. Doubles as "reject" for suggested edges.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Edge not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /relationship-edges/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Accept a suggested relationship edge
      operationId: acceptRelationshipEdge
      description: Only valid when the edge's status is "suggested". Returns the raw updated edge.
      responses:
        "200":
          description: Edge accepted (status now confirmed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEdge"
        "404":
          description: Edge not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Edge is not a pending suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Profile pictures ---
  /contacts/{id}/profile_picture:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Set a contact's profile picture
      operationId: uploadProfilePicture
      description: >
        Multipart upload (field name `photo`). JPEG/PNG/HEIC/HEIF only, max
        10 MB. The image is center-cropped to a square, downscaled to at most
        400x400 and stored as JPEG; a base64 thumbnail is generated. An absent
        `photo` field is accepted and just re-saves the contact.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        "200":
          description: The updated contact (raw Contact JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFlat"
        "400":
          description: Invalid contact id, oversized file, or unsupported format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Profile-picture changes are disabled in demo mode.
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Get a contact's profile picture
      operationId: getProfilePicture
      description: >
        Without query params serves the stored photo file directly (binary).
        With thumbnail=true serves the base64 thumbnail as a JPEG.
      parameters:
        - name: thumbnail
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The image bytes (Content-Type image/jpeg, or the source image type).
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          description: Invalid contact id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact, photo, or thumbnail not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Image proxy ---
  /proxy/image:
    get:
      summary: Fetch and proxy an external image (SSRF-guarded)
      operationId: proxyImage
      description: >
        Fetches the image at the given URL with SSRF guards (no private/
        loopback/link-local hosts), a 10 MB cap, and an image/ content-type
        requirement. SVG is rejected outright (XSS defense).
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "200":
          description: The image bytes with the upstream Content-Type.
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          description: Missing url, or SVG images are not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The upstream fetch failed or was blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Notes ---
  /contacts/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List a contact's notes
      operationId: listContactNotes
      responses:
        "200":
          description: The contact's notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a note on a contact
      operationId: createContactNote
      description: The contact_id from the URL overrides any body contact_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note created (200, not 201).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Note created successfully" }
                  note:
                    $ref: "#/components/schemas/Note"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes:
    get:
      summary: List the user's unassigned notes (no contact)
      operationId: listUnassignedNotes
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor. Ignored when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every unassigned note changed after
            this position — including soft-deleted ones (deleted:true) —
            ordered forward, ignoring search/date filters. A cursor older than
            DELETED_RETENTION_DAYS returns 410 Gone.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: search
          in: query
          description: Free-text search on note content.
          schema: { type: string }
        - name: fromDate
          in: query
          description: Inclusive YYYY-MM-DD lower bound on note date.
          schema: { type: string, format: date }
        - name: toDate
          in: query
          description: Inclusive YYYY-MM-DD upper bound on note date.
          schema: { type: string, format: date }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The ?since= cursor is older than DELETED_RETENTION_DAYS — full resync required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of unassigned notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create an unassigned note
      operationId: createUnassignedNote
      description: A body contact_id is honored here (unlike the contact-nested route).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Note created successfully" }
                  note:
                    $ref: "#/components/schemas/Note"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The referenced contact (if any) was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a note
      operationId: getNote
      responses:
        "200":
          description: The note (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a note
      operationId: updateNote
      description: Setting contact_id to null clears the assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Note updated successfully" }
                  note:
                    $ref: "#/components/schemas/Note"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note (or referenced contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a note (soft delete)
      operationId: deleteNote
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Note not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Activities / Interactions ---
  /contacts/{id}/activities:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List a contact's activities
      operationId: listContactActivities
      responses:
        "200":
          description: The contact's activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activities:
    get:
      summary: List the user's activities
      operationId: listActivities
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor. Ignored when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every activity changed after this
            position — including soft-deleted ones (deleted:true) — ordered
            forward, ignoring search/date filters. A cursor older than
            DELETED_RETENTION_DAYS returns 410 Gone.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: include
          in: query
          description: 'When "contacts", each activity carries its participant contacts.'
          schema: { type: string, enum: [contacts] }
        - name: search
          in: query
          description: Free-text search across title/description/location and participant names.
          schema: { type: string }
        - name: fromDate
          in: query
          description: Inclusive YYYY-MM-DD lower bound on activity date.
          schema: { type: string, format: date }
        - name: toDate
          in: query
          description: Inclusive YYYY-MM-DD upper bound on activity date.
          schema: { type: string, format: date }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The ?since= cursor is older than DELETED_RETENTION_DAYS — full resync required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
