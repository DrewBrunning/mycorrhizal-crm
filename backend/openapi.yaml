        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "200":
          description: Activity created (200, not 201).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Activity created successfully" }
                  activity:
                    $ref: "#/components/schemas/Activity"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or more referenced contacts not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get an activity
      operationId: getActivity
      responses:
        "200":
          description: The activity (raw, with participant contacts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Activity not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update an activity
      operationId: updateActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "200":
          description: The updated activity (raw).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Activity (or referenced contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an activity (soft delete)
      operationId: deleteActivity
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Activity not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Circles ---
  /circles:
    get:
      summary: List circles
      operationId: listCircles
      description: >
        Cursor-paginated (T17). Circles are a hard-delete collection — the
        sync.mode is full_resync: a client re-pulls the collection rather than
        using ?since= (circles have no tombstone).
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor.
          schema: { type: string }
