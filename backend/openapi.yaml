  # --- ExternalIdentity / ExternalActivity (T14 substrate) ---
  /external-identities:
    get:
      summary: List external identities
      operationId: listExternalIdentities
      description: >
        Cursor-paginated (T17). The generic integration substrate's identity
        links (this contact IS this thing in that system), filterable by
        contact (contact_id, a Contact.VCardUID) and system. Hard-delete
        collection — sync.mode is full_resync.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: contact_id
          in: query
          description: Filter to identities for this Contact.VCardUID.
          schema: { type: string, format: uuid }
        - name: system
          in: query
          description: Filter by integration system token (e.g. immich).
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of identities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_identities:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalIdentity"
                  total: { type: integer }
                  next_cursor:
                    type: string
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create an external identity (link a contact into an external system)
      operationId: createExternalIdentity
      description: >
        The L1 "linking" write of the integration substrate. System + ExternalID
        are the natural key: creating a duplicate pair is a 409. Response is
        wrapped in an `external_identity` key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalIdentityInput"
      responses:
        "201":
          description: Identity created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_identity:
                    $ref: "#/components/schemas/ExternalIdentity"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The entity_id contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The (system, external_id) pair is already linked for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /external-identities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get an external identity
      operationId: getExternalIdentity
      responses:
        "200":
          description: The identity (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalIdentity"
        "404":
          description: Identity not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update an external identity (full replace)
      operationId: updateExternalIdentity
      description: Changing the natural key is allowed but collision-checked (409 on clash).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalIdentityInput"
      responses:
        "200":
          description: The updated identity (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalIdentity"
        "404":
          description: Identity or entity_id contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new natural key collides with another identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an external identity
      operationId: deleteExternalIdentity
      description: Hard delete — a re-link must be possible without a unique-index ghost.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Identity not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /external-activities:
    get:
      summary: List external activities
      operationId: listExternalActivities
      description: >
        Cursor-paginated (T17). Enrichment events contributed by external
        systems, filterable by contact (contact_id — this is what attaches an
        ExternalActivity into a contact's timeline) and system. Hard-delete
        collection — sync.mode is full_resync.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: contact_id
          in: query
          description: Filter to events for this Contact.VCardUID.
          schema: { type: string, format: uuid }
        - name: system
          in: query
          description: Filter by integration system token (e.g. immich).
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalActivity"
                  total: { type: integer }
                  next_cursor:
                    type: string
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create an external activity
      operationId: createExternalActivity
      description: >
        The L2 "enrichment" write of the integration substrate: an event that
        happened in an external system, linkable into the contact's timeline.
        SourceSystem + ExternalID form the natural key (409 on duplicate).
        Response is wrapped in an `external_activity` key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalActivityInput"
      responses:
        "201":
          description: Activity created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_activity:
                    $ref: "#/components/schemas/ExternalActivity"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The entity_id contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The (source_system, external_id) pair already exists for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /external-activities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get an external activity
      operationId: getExternalActivity
      responses:
        "200":
          description: The activity (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalActivity"
        "404":
          description: Activity not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update an external activity (full replace)
      operationId: updateExternalActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalActivityInput"
      responses:
        "200":
          description: The updated activity (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalActivity"
        "404":
          description: Activity or entity_id contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new natural key collides with another activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an external activity
      operationId: deleteExternalActivity
      description: Hard delete — a re-sync can recreate it.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Activity not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Immich integration (T15/T16) ---
  /immich/config:
    get:
      summary: Get the current user's Immich connection config
      operationId: getImmichConfig
      description: >
        Returns an empty default when not configured (200, not 404). The API
        key is never returned — only whether one is stored (has_api_key).
      responses:
        "200":
          description: The config (without the API key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmichConfigResponse"
    put:
      summary: Create or update the current user's Immich connection
      operationId: saveImmichConfig
      description: >
        The API key is encrypted at rest (derived from JWT_SECRET_KEY). An
        empty api_key on update keeps the stored key; a first-time connect
        requires one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImmichConfigInput"
      responses:
        "200":
          description: The updated config (without the API key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImmichConfigResponse"
        "400":
          description: Validation failed, or a first-time connect omitted the API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove the current user's Immich connection
      operationId: deleteImmichConfig
      description: Linked ExternalIdentity/ExternalActivity rows are kept.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /immich/people:
    get:
      summary: Browse the user's Immich people (L1 picker)
      operationId: listImmichPeople
      description: >
        Lists every person in the user's Immich instance so the frontend can
        search by name. Requires a configured connection.
      responses:
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The people list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImmichPerson"
        "503":
          description: Immich unreachable, or the API key is invalid/expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /immich/sync:
    post:
      summary: Trigger the Immich enrichment sync for the current user
      operationId: syncImmichNow
      description: >
        Runs the same enrichment sync the scheduler runs (T16): pull recent
        appearances into ExternalActivity rows so they land on contacts'
        timelines.
      responses:
        "200":
          description: Sync completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Immich unreachable, or the API key is invalid/expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /immich/contacts/{vcard_uid}/link:
    parameters:
      - name: vcard_uid
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Link an Immich person to a contact
      operationId: linkImmichContact
      description: >
        Persists the link as an ExternalIdentity with system "immich" — never a
        column on Contact. Body: {person_id, person_name}. 409 on a duplicate
        link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                person_id: { type: string }
                person_name: { type: string }
      responses:
        "201":
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_identity:
                    $ref: "#/components/schemas/ExternalIdentity"
        "404":
          description: Contact not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The person is already linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Unlink the Immich person from a contact
      operationId: unlinkImmichContact
      description: Keeps the contact's ExternalActivity timeline entries.
      responses:
        "200":
          description: Unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No Immich link for this contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /immich/contacts/{vcard_uid}/summary:
    parameters:
      - name: vcard_uid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a contact's Immich link summary
      operationId: getImmichContactSummary
      description: >
        Photo count + latest appearance for a contact's linked Immich person.
        No link → summary is null. An unreachable instance degrades to cached
        metadata rather than erroring the page.
      responses:
        "200":
          description: The summary (or null when no link exists).
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/ImmichPersonSummary"
        "503":
          description: Immich unreachable, or the API key is invalid/expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /immich/contacts/{vcard_uid}/thumbnail:
    parameters:
      - name: vcard_uid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Proxy a contact's Immich person thumbnail
      operationId: getImmichThumbnail
      description: >
        Serves the linked person's thumbnail through the same hardening as
        /proxy/image (SVG rejected, Content-Disposition set).
      responses:
        "200":
          description: The image bytes.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404":
          description: No Immich link for this contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Immich unreachable, or the API key is invalid/expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Admin ---
  /admin/users:
    get:
      summary: List all users (admin)
      operationId: adminListUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersListResponse"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.
  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a user (admin)
      operationId: adminGetUser
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a user (admin)
      operationId: adminUpdateUser
      description: Setting a password bumps the user's token_version (kills their sessions). You cannot remove your own admin status or demote the last admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateInput"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Non-integer id or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Cannot remove your own admin status or the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username or email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a user and all their data (admin)
      operationId: adminDeleteUser
      description: Hard-deletes the user and every dependent table in a transaction. Cannot delete your own account or the last admin.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Cannot delete your own account or the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/trigger-reminders:
    post:
      summary: Trigger the reminder email job now (admin)
      operationId: adminTriggerReminders
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Job ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: The job failed.
  /admin/trigger-purge:
    post:
      summary: Trigger the soft-delete purge job now (admin)
      operationId: adminTriggerPurge
      description: Best-effort; always reports success.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Purge ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: auth_token
      description: The httpOnly session cookie set by POST /login and the OIDC callback.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A JWT or a `mycorrhizal_…` API token. On the general REST path a
        carddav-scoped token is rejected with 403 (only `full`-scope tokens
        work); API tokens are rejected on every /admin path entirely.
  schemas:
    # --- Common ---
    Error:
      type: object
      description: The standard error envelope produced by apperrors.AbortWithError.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
    SyncInfo:
      type: object
      description: >
        T17 sync-mode contract carried by every cursor-paginated list
        response. `mode` is how THIS collection syncs; the two arrays are the
        static map of every syncable collection, so a client can plan a full
        sync without hardcoding endpoint names. Incremental collections are
        soft-deleted, support ?since= change feeds, and drop `total`;
        full_resync collections are hard-deleted, are re-pulled wholesale, and
        keep `total`.
      properties:
        mode: { type: string, enum: [incremental, full_resync] }
        incremental:
          type: array
          items: { type: string }
          description: "Collections that sync incrementally via ?since=: contacts, notes, activities, life_events, preferences, cadence_policies, conversation_agenda, gifts."
        full_resync:
          type: array
          items: { type: string }
          description: "Collections that require a full re-pull: circles, households, tags, relationship_edges, field_definitions."
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
      additionalProperties: true
    LogoutResponse:
      type: object
      properties:
        message: { type: string }
        redirect_url: { type: string, description: "Present only for OIDC sessions whose provider advertises an end-session endpoint." }
    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        timestamp: { type: string, format: date-time }
        database:
          type: object
          properties:
            status: { type: string, enum: [healthy, unhealthy] }
            response_time_ms: { type: number }
        version: { type: string, example: "0.1.0" }

    # --- Auth & users ---
    UserRegistrationInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        language: { type: string, enum: [en, de, it, es, fr] }
    LoginInput:
      type: object
      properties:
        identifier: { type: string, description: "Username or email." }
        email: { type: string, description: "Legacy alias for identifier." }
        password: { type: string }
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 16 }
        password: { type: string, minLength: 8 }
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }
    UpdateLanguageInput:
      type: object
      required: [language]
      properties:
        language: { type: string, enum: [en, de, it, es, fr] }
    UpdateDateFormatInput:
      type: object
      required: [date_format]
      properties:
        date_format: { type: string, enum: [eu, us, iso] }
    EnabledContactFieldsInput:
      type: object
      properties:
        fields:
          type: array
          items: { type: string, maxLength: 50 }
          description: "Nil/absent resets to the client default set."
    PasswordStrength:
      type: object
      properties:
        is_valid: { type: boolean }
        entropy: { type: number }
        score: { type: integer, description: "0-4 (weak..very strong)." }
        feedback: { type: string }
        min_entropy: { type: number }
        char_set_size: { type: integer }
        length: { type: integer }
    OIDCConfigResponse:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        provider_name: { type: string, description: "Present only when enabled." }
    AdminUserResponse:
      type: object
      description: A user as seen by admins (and by /users/me, which adds enabled_contact_fields).
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        language: { type: string }
        date_format: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CurrentUserResponse:
      allOf:
        - $ref: "#/components/schemas/AdminUserResponse"
        - type: object
          properties:
            enabled_contact_fields:
              type: array
              items: { type: string }
              nullable: true
    AdminUsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserResponse"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        total_pages: { type: integer }
    AdminUserUpdateInput:
      type: object
      description: All fields optional; only supplied fields are changed.
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        is_admin: { type: boolean }

    # --- Contacts ---
    ContactSummary:
      type: object
      description: >
        Slim per-item shape for GET /contacts (list) — wraps
        contactmodel.Projection's own fields plus identity/photo.
      properties:
        id: { type: integer }
        uid: { type: string }
        firstname: { type: string }
        lastname: { type: string }
        nickname: { type: string }
        fn: { type: string, description: "Full/display name (vCard FN)." }
        primary_email: { type: string }
        primary_phone: { type: string }
        birthday: { type: string, description: "ISO YYYY-MM-DD or year-less --MM-DD." }
        org: { type: string }
        photo: { type: string }
        photo_thumbnail: { type: string, description: "Base64 data URL of the thumbnail." }
        circles:
          type: array
          items: { type: string }
          nullable: true
          description: "The list query does not select this column, so it is typically null unless the backend changes; do not rely on it being populated."
        archived: { type: boolean }
        deleted:
          type: boolean
          description: >
            Change-feed tombstone marker (T17): true only when the row was
            returned by ?since= as a soft-deleted contact. Never set on a
            plain list request.
          default: false
    ContactSummaryWithRelations:
      description: ContactSummary extended with the sub-resource arrays requested via includes=.
      allOf:
        - $ref: "#/components/schemas/ContactSummary"
        - type: object
          properties:
            notes: { type: array, items: { type: object } }
            activities: { type: array, items: { type: object } }
            reminders: { type: array, items: { type: object } }
    ContactRecordInput:
      type: object
      description: >
        Request body for POST /contacts and PUT /contacts/{id}. Gender rides
        alongside card/crm since it has no neutral-model home (see
        docs/fork-plan/50-integration-and-rebrand.md's RecordFromContact
        notes).
      properties:
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
        card:
          $ref: "#/components/schemas/Card"
        crm:
          $ref: "#/components/schemas/CRMEnvelope"
        passthrough:
          $ref: "#/components/schemas/Passthrough"
    ContactRecordResponse:
      type: object
      description: Full neutral detail-view response for GET/POST/PUT /contacts.
      properties:
        id: { type: integer }
        uid: { type: string }
        etag: { type: string }
        gender: { type: string }
        card:
          $ref: "#/components/schemas/Card"
        crm:
          $ref: "#/components/schemas/CRMEnvelope"
        passthrough:
          $ref: "#/components/schemas/Passthrough"
        photo: { type: string }
        photo_thumbnail: { type: string }
        archived: { type: boolean }
        notes: { type: array, items: { type: object } }
        activities: { type: array, items: { type: object } }
        reminders: { type: array, items: { type: object } }
    ContactFlat:
      type: object
      description: >
        The raw serialization of models.Contact (legacy flat DTO) returned by
        the archive/unarchive, random, and profile-picture endpoints. Because
        Contact embeds gorm.Model (which has no JSON tags), identity/timestamp
        keys serialize in PascalCase.
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        firstname: { type: string }
        lastname: { type: string }
        nickname: { type: string }
        gender: { type: string }
        email: { type: string }
        phone: { type: string }
        birthday: { type: string }
        photo: { type: string }
        address: { type: string }
        how_we_met: { type: string }
        work_information: { type: string }
        contact_information: { type: string }
        circles:
          type: array
          items: { type: string }
        emails:
          type: array
          items: { $ref: "#/components/schemas/ContactEmail" }
        phones:
          type: array
          items: { $ref: "#/components/schemas/ContactPhone" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/ContactAddress" }
        urls:
          type: array
          items: { $ref: "#/components/schemas/ContactURL" }
        impps:
          type: array
          items: { $ref: "#/components/schemas/ContactIMPP" }
        prefix: { type: string }
        middle_name: { type: string }
        suffix: { type: string }
        organization: { type: string }
        department: { type: string }
        job_title: { type: string }
        role: { type: string }
        anniversary: { type: string }
        archived: { type: boolean }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        reminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
    ContactResponse:
      description: ContactFlat plus the always-present photo_thumbnail, as returned by GET /contacts/random.
      allOf:
        - $ref: "#/components/schemas/ContactFlat"
        - type: object
          properties:
            photo_thumbnail: { type: string }
    ContactEmail:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string, format: email }
    ContactPhone:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string }
    ContactURL:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string, format: uri, maxLength: 500 }
    ContactIMPP:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string, maxLength: 200 }
    ContactAddress:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        street: { type: string, maxLength: 500 }
        city: { type: string, maxLength: 200 }
        region: { type: string, maxLength: 200 }
        postal: { type: string, maxLength: 30 }
        country: { type: string, maxLength: 100 }
    Birthday:
      type: object
      description: One upcoming contact birthday.
      properties:
        type: { type: string, example: "contact" }
        name: { type: string }
        birthday: { type: string, description: "ISO YYYY-MM-DD." }
        photo_thumbnail: { type: string }
        contact_id: { type: integer }

    # --- Contact merge ---
    ContactMergeRequest:
      type: object
      required: [keep_id, merge_id]
      properties:
        keep_id: { type: integer, minimum: 1 }
        merge_id: { type: integer, minimum: 1 }
        resolutions:
          type: object
          additionalProperties: { type: string }
          description: "Required on commit for every conflicting field; ignored on preview. Keyed by scalar field name or FieldDefinition.ID."
    ContactMergePreviewResponse:
      type: object
      properties:
        keep_id: { type: integer }
        merge_id: { type: integer }
        resolution:
          $ref: "#/components/schemas/ContactMergeResolution"
        association_counts:
          $ref: "#/components/schemas/ContactMergeAssociationCounts"
    ContactMergeResolution:
      type: object
      properties:
        emails:
          type: array
          items: { $ref: "#/components/schemas/ContactEmail" }
        phones:
          type: array
          items: { $ref: "#/components/schemas/ContactPhone" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/ContactAddress" }
        urls:
          type: array
          items: { $ref: "#/components/schemas/ContactURL" }
        impps:
          type: array
          items: { $ref: "#/components/schemas/ContactIMPP" }
        circles:
          type: array
          items: { type: string }
        resolved_scalars:
          type: object
          additionalProperties: { type: string }
          description: Complete post-merge value of every scalar field, including agreed ones.
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ContactMergeFieldConflict" }
        field_value_conflicts:
          type: array
          items: { $ref: "#/components/schemas/ContactMergeFieldConflict" }
    ContactMergeFieldConflict:
      type: object
      properties:
        field: { type: string }
        label: { type: string }
        keeper_value: { type: string }
        loser_value: { type: string }
    ContactMergeAssociationCounts:
      type: object
      properties:
        notes: { type: integer }
        activities: { type: integer }
        reminders: { type: integer }
        reminder_completions: { type: integer }
        relationship_edges: { type: integer }
        household_memberships: { type: integer }
        circle_memberships: { type: integer }
        tags: { type: integer }
        life_events: { type: integer }
        life_event_references: { type: integer }
        field_values: { type: integer }
        contact_sync_links: { type: integer }

    # --- Notes / Activities / Reminders (gorm.Model PascalCase identity) ---
    Note:
      type: object
      description: >
        A note. Emits gorm.Model identity/timestamps in PascalCase and always
        includes a nested contact object (struct value, never omitted).
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        content: { type: string, maxLength: 5000 }
        date: { type: string, format: date-time }
        contact_id: { type: integer, nullable: true }
        contact:
          $ref: "#/components/schemas/ContactFlat"
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted note."
          default: false
    NoteInput:
      type: object
      required: [content, date]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        date: { type: string, format: date-time }
        contact_id: { type: integer, minimum: 1, nullable: true }
    Activity:
      type: object
      description: >
        An activity/Interaction. gorm.Model identity keys in PascalCase.
        Type is a conventional, open classifier (call, visit, meal, message,
        gift, photo, ...).
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        uuid: { type: string }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location: { type: string, maxLength: 300 }
        date: { type: string, format: date-time }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/ContactFlat" }
        type: { type: string }
        external_ref: { type: string }
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted activity."
          default: false
    ActivityInput:
      type: object
      required: [title, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location: { type: string, maxLength: 300 }
        date: { type: string, format: date-time }
        contact_ids:
          type: array
          items: { type: integer }
        type: { type: string }
        external_ref: { type: string }
    Reminder:
      type: object
      description: >
        A reminder. Doubles as the request body for create/update, so the
        required fields (message, remind_at, recurrence, contact_id) must be
        present on every write.
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        message: { type: string, minLength: 1, maxLength: 500 }
        by_mail: { type: boolean, nullable: true }
        remind_at: { type: string, format: date-time }
        recurrence: { type: string, enum: [once, weekly, monthly, quarterly, six-months, yearly] }
        reoccur_from_completion: { type: boolean, nullable: true }
        completed: { type: boolean }
        email_sent: { type: boolean }
        last_sent: { type: string, format: date-time, nullable: true }
        contact_id: { type: integer, nullable: true }
        life_event_id: { type: string }
        contact:
          $ref: "#/components/schemas/ContactFlat"
    ReminderCompleteResponse:
      type: object
      description: "Recurring reminders return reminder + message; once reminders are soft-deleted and return only a message."
      properties:
        message: { type: string }
        reminder:
          $ref: "#/components/schemas/Reminder"
    ReminderCompletion:
      type: object
      description: A timeline entry recording that a reminder was completed.
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        reminder_id: { type: integer, nullable: true }
        contact_id: { type: integer }
        message: { type: string }
        completed_at: { type: string, format: date-time }

    # --- Circles / Households / Tags ---
    Circle:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
    CircleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    CircleMember:
      type: object
      description: A circle membership join row.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        circle_id: { type: string, format: uuid }
        member_vcard_uid: { type: string, format: uuid }
    CircleMemberInput:
      type: object
      required: [member_vcard_uid]
      properties:
        member_vcard_uid: { type: string, format: uuid }
    Household:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
        type: { type: string, enum: [family_unit, roommates, other] }
        address:
          $ref: "#/components/schemas/Address"
    HouseholdInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [family_unit, roommates, other] }
        address:
          $ref: "#/components/schemas/Address"
    HouseholdMember:
      type: object
      description: A household membership join row.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        household_id: { type: string, format: uuid }
        member_vcard_uid: { type: string, format: uuid }
        role: { type: string }
        since: { type: string }
        until: { type: string }
    HouseholdMemberInput:
      type: object
      required: [member_vcard_uid]
      properties:
        member_vcard_uid: { type: string, format: uuid }
        role: { type: string }
        since: { type: string }
        until: { type: string }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    ContactTag:
      type: object
      description: A tagging join row (contact x tag).
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tag_id: { type: string, format: uuid }
        contact_vcard_uid: { type: string, format: uuid }
    ContactTagInput:
      type: object
      required: [contact_vcard_uid]
      properties:
        contact_vcard_uid: { type: string, format: uuid }

    # --- Relationship edges ---
    RelationshipEdge:
      type: object
      description: >
        A directed edge in the relationship graph; Type describes the source's
        role relative to the target. Only status=confirmed edges are fact;
        suggested edges await review.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        type: { type: string }
        directional: { type: boolean }
        metadata:
          type: object
          additionalProperties: true
        source: { type: string, enum: [user-confirmed, household-inferred, imported, ai-suggested] }
        confidence: { type: number }
        status: { type: string, enum: [confirmed, suggested] }
        sensitivity: { type: string, enum: [normal, private, secret] }
    RelationshipEdgeInput:
      type: object
      required: [type]
      description: >
        Exactly one of source_id/source_thin and one of target_id/target_thin
        per endpoint, enforced by the controller. Source/Confidence/Status are
        server-derived and cannot be set by a client.
      properties:
        source_id: { type: string, format: uuid }
        source_thin:
          $ref: "#/components/schemas/ThinContactInput"
        target_id: { type: string, format: uuid }
        target_thin:
          $ref: "#/components/schemas/ThinContactInput"
        type: { type: string }
        sensitivity: { type: string, enum: [normal, private, secret] }
        metadata:
          type: object
          additionalProperties: true
    ThinContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        gender: { type: string, enum: [male, female, other, prefer_not_to_say] }
        birthday: { type: string, description: "ISO YYYY-MM-DD or year-less --MM-DD." }

    # --- External identity / activity substrate (T14) ---
    ExternalIdentity:
      type: object
      description: >
        "This contact IS this thing in that external system." Keyed by
        entity_id (a Contact.VCardUID), never the numeric ID. System-specific
        data lives in metadata (JSON), never in a per-system column.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        system: { type: string, description: "Integration token, e.g. immich, paperless." }
        external_id: { type: string }
        url: { type: string }
        metadata:
          type: object
          additionalProperties: true
        sync_status: { type: string, enum: [idle, syncing, synced, error] }
        last_synced_at:
          type: string
          format: date-time
          nullable: true
    ExternalIdentityInput:
      type: object
      required: [entity_id, system, external_id]
      properties:
        entity_id: { type: string, format: uuid }
        system: { type: string }
        external_id: { type: string }
        url: { type: string }
        metadata:
          type: object
          additionalProperties: true
        sync_status: { type: string, enum: [idle, syncing, synced, error] }
    ExternalActivity:
      type: object
      description: >
        An event contributed by an external system, linkable into a contact's
        timeline. The CRM stores a reference + timeline entry; the source data
        stays in the external system.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        source_system: { type: string }
        external_id: { type: string }
        type: { type: string, description: "Open classifier, e.g. photo-appearance." }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        provenance: { type: string, enum: [external, user] }
        sync_state: { type: string, enum: [synced, pending] }
    ExternalActivityInput:
      type: object
      required: [entity_id, source_system, external_id, type, occurred_at]
      properties:
        entity_id: { type: string, format: uuid }
        source_system: { type: string }
        external_id: { type: string }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        provenance: { type: string, enum: [external, user] }
        sync_state: { type: string, enum: [synced, pending] }

    # --- Immich integration (T15/T16) ---
    ImmichConfigResponse:
      type: object
      description: The API-visible shape of a user's Immich connection. The API key is never exposed.
      properties:
        base_url: { type: string }
        has_api_key: { type: boolean }
        sync_enabled: { type: boolean }
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_sync_status: { type: string }
        last_sync_error: { type: string }
    ImmichConfigInput:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string }
        api_key: { type: string, description: "Write-only: empty on update keeps the stored key; required on first connect." }
        sync_enabled: { type: boolean }
    ImmichPerson:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    ImmichPersonSummary:
      type: object
      description: A contact's Immich link plus live (or cached, on failure) person info.
      properties:
        identity:
          $ref: "#/components/schemas/ExternalIdentity"
        person_name: { type: string }
        photo_count: { type: integer }
        latest_asset_id: { type: string }
        latest_at:
          type: string
          format: date-time
          nullable: true

    # --- Life events ---
    LifeEvent:
      type: object
      description: A permanent fact about an entity's life. remind=false is omitted on the wire (omitempty).
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        type: { type: string }
        date:
          $ref: "#/components/schemas/PartialDate"
        description: { type: string, maxLength: 2000 }
        source: { type: string, enum: [user, imported, ai-suggested] }
        related_entity_ids:
          type: array
          items: { type: string, format: uuid }
        remind: { type: boolean }
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted life event."
          default: false
    LifeEventInput:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid }
        type: { type: string }
        date:
          $ref: "#/components/schemas/PartialDate"
        description: { type: string, maxLength: 2000 }
        source: { type: string, enum: [user, imported, ai-suggested] }
        related_entity_ids:
          type: array
          items: { type: string, format: uuid }
        remind: { type: boolean }

    # --- Conversation agenda (T21) ---
    ConversationAgenda:
      type: object
      description: >
        "Things to bring up next time I see them" (§91.11). Contextual memory
        surfaced on the contact view, explicitly NOT date-scheduled. resolved
        by discussed_at, never by a timer.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        content: { type: string, maxLength: 2000 }
        reference_url: { type: string, maxLength: 2000 }
        discussed_at:
          type: string
          format: date-time
          nullable: true
          description: When the item was marked discussed; null means still open.
        activity_id:
          type: integer
          nullable: true
          description: The Activity that covered this item, if linked.
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted agenda item."
          default: false
    ConversationAgendaInput:
      type: object
      required: [entity_id, content]
      properties:
        entity_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 2000 }
        reference_url: { type: string, maxLength: 2000 }
    ConversationAgendaDiscussInput:
      type: object
      properties:
        activity_id: { type: integer, nullable: true }

    # --- Gifts (T20b) ---
    Gift:
      type: object
      description: >
        "What did I give them last year?" (§91.11) against a contact — an idea
        captured opportunistically, the offered/given gift, or a received gift.
        Status defaults to idea; any value carries an explicit ISO 4217
        currency.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        status: { type: string, enum: [idea, purchased, given, received] }
        occasion: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        date:
          type: string
          format: date-time
          nullable: true
          description: When the gift was given/received. An idea may have no date.
        value_cents:
          type: integer
          description: Optional value in the currency's minor unit; must pair with currency.
        currency:
          type: string
          maxLength: 3
          description: ISO 4217 code, explicit whenever a value is set.
        life_event_id:
          type: string
          format: uuid
          nullable: true
          description: The LifeEvent this gift relates to, if any.
        activity_id:
          type: integer
          nullable: true
          description: The Activity (interaction) this gift relates to, if any.
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted gift."
          default: false
    GiftInput:
      type: object
      required: [entity_id, description]
      properties:
        entity_id: { type: string, format: uuid }
        status: { type: string, enum: [idea, purchased, given, received] }
        occasion: { type: string, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        date: { type: string, format: date-time, nullable: true }
        value_cents: { type: integer }
        currency: { type: string, maxLength: 3 }
        life_event_id: { type: string, format: uuid }
        activity_id: { type: integer, nullable: true }

    # --- Preferences ---
    Preference:
      type: object
      description: One structured personal fact about an entity (category/key/value + provenance).
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        category: { type: string, maxLength: 100 }
        key: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 1000 }
        source: { type: string, enum: [conversation_note, user, ai-suggested, external] }
        confidence: { type: number, nullable: true }
        last_confirmed: { type: string, format: date-time, nullable: true }
        sensitivity: { type: string, enum: [normal, private, secret] }
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted preference."
          default: false
    PreferenceInput:
      type: object
      required: [entity_id, category, value]
      properties:
        entity_id: { type: string, format: uuid }
        category: { type: string, maxLength: 100 }
        key: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 1000 }
        source: { type: string, enum: [conversation_note, user, ai-suggested, external] }
        confidence: { type: number, nullable: true }
        last_confirmed: { type: string, format: date-time, nullable: true }
        sensitivity: { type: string, enum: [normal, private, secret] }

    # --- CadencePolicies (T19) ---
    CadencePolicy:
      type: object
      description: >
        A relationship-maintenance rule — "stay in touch every N days"
        (§91.10). Health is DERIVED (see CadenceHealth), never stored; this
        entity carries only the rule itself.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id:
          type: string
          format: uuid
          description: The subject Contact's VCardUID.
        target_interval_days: { type: integer, minimum: 1 }
        qualifying_types:
          type: array
          items: { type: string }
          description: >
            Which Interaction types reset the cadence (call, visit, meal...);
            empty means every default-qualifying type counts. The global
            gate is always Activity.Qualifying() — a non-qualifying type
            (photo) can never be re-admitted by listing it here.
    CadenceHealth:
      type: object
      description: >
        The DERIVED relationship-health read-model (§91.10) — computed from
        the timeline, never persisted. Undefined (has_qualifying_interaction
        false) until the contact has at least one qualifying interaction;
        cadence does NOT count from the contact's creation date.
      properties:
        has_qualifying_interaction: { type: boolean }
        last_interaction: { type: string, format: date-time, nullable: true }
        next_due: { type: string, format: date-time, nullable: true }
        overdue_by:
          type: integer
          description: >
            Whole calendar days past due. 0 when due today, in the future, or
            undefined. "Due today" is not overdue.
    CadencePolicyWithHealth:
      type: object
      description: A cadence policy with its derived health embedded.
      allOf:
        - $ref: "#/components/schemas/CadencePolicy"
        - type: object
          properties:
            health:
              $ref: "#/components/schemas/CadenceHealth"
    CadencePolicyInput:
      type: object
      required: [entity_id, target_interval_days]
      properties:
        entity_id: { type: string, format: uuid }
        target_interval_days: { type: integer, minimum: 1 }
        qualifying_types:
          type: array
          items: { type: string }
    OverdueCadence:
      type: object
      description: An overdue cadence policy joined with its contact's display identity.
      properties:
        policy:
          $ref: "#/components/schemas/CadencePolicy"
        health:
          $ref: "#/components/schemas/CadenceHealth"
        contact_id:
          type: integer
          description: The contact's numeric ID (the /contacts/<id> URL component).
        contact_name: { type: string }
        photo_thumbnail: { type: string }

    # --- Custom fields ---
    FieldDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        label: { type: string, maxLength: 200 }
        key: { type: string, maxLength: 100 }
        target: { type: string, enum: [contact] }
        type: { type: string, enum: [string, text, number, boolean, date, datetime, uri, email, phone, enum] }
        constraints:
          $ref: "#/components/schemas/FieldConstraints"
        projection: { type: string, description: "internal-only, or vcard:X-<NAME>." }
        sensitivity: { type: string, enum: [normal, private, secret] }
    FieldDefinitionInput:
      type: object
      required: [label, key, type]
      properties:
        label: { type: string, maxLength: 200 }
        key: { type: string, maxLength: 100 }
        target: { type: string, enum: [contact] }
        type: { type: string, enum: [string, text, number, boolean, date, datetime, uri, email, phone, enum] }
        constraints:
          $ref: "#/components/schemas/FieldConstraints"
        projection: { type: string }
        sensitivity: { type: string, enum: [normal, private, secret] }
    FieldConstraints:
      type: object
      properties:
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        maxLength: { type: integer, nullable: true }
        pattern: { type: string }
        values:
          type: array
          items: { type: string }
        multi: { type: boolean }
    FieldValue:
      type: object
      description: One value of a FieldDefinition for one contact.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        field_definition_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        value:
          description: "The raw JSON payload — a scalar (string/number/boolean) or, for multi fields, an array."
    FieldValueInput:
      type: object
      required: [field_definition_id, value]
      properties:
        field_definition_id: { type: string, format: uuid }
        value: {}
    ContactFieldValuesInput:
      type: object
      required: [field_values]
      properties:
        field_values:
          type: array
          items:
            $ref: "#/components/schemas/FieldValueInput"

    # --- Calendar / contact subscriptions, tokens, webhooks ---
    CalendarSubscriptionInput:
      type: object
      required: [name, url]
      description: Credentials are optional. On update, an empty password keeps the stored one; clear_password removes it.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
        username: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 500 }
        clear_password: { type: boolean }
        sync_enabled: { type: boolean, nullable: true }
        past_days: { type: integer, minimum: 0, maximum: 3650 }
        future_days: { type: integer, minimum: 0, maximum: 3650 }
    CalendarSubscriptionResponse:
      type: object
      description: Never includes the password.
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        has_password: { type: boolean }
        sync_enabled: { type: boolean }
        past_days: { type: integer }
        future_days: { type: integer }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
    ContactSubscriptionInput:
      type: object
      required: [name, url]
      description: Credentials are optional. On update, an empty password keeps the stored one; clear_password removes it.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
        username: { type: string, maxLength: 200 }
        password:
          type: string
          maxLength: 500
          description: Encrypted at rest. On update, an empty value leaves the existing credential untouched.
        clear_password: { type: boolean, description: "On update, removes any stored credential." }
        sync_enabled: { type: boolean, nullable: true, description: "Defaults to true if omitted on create." }
    ContactSubscriptionResponse:
      type: object
      description: Never includes the password or sync token.
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        has_password: { type: boolean }
        sync_enabled: { type: boolean }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
    ApiTokenInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, description: "Defaults to 90." }
        scope: { type: string, enum: [full, carddav], description: "Defaults to full. carddav tokens are rejected by the REST API." }
    ApiTokenResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        scope: { type: string }
    ApiTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiTokenResponse"
        - type: object
          properties:
            token: { type: string, description: "The plaintext token, shown only once." }
    WebhookInput:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [contact.created, contact.updated, contact.deleted, note.created, note.updated, note.deleted, activity.created, activity.updated, activity.deleted, reminder.triggered, birthday.occurred]
        is_active: { type: boolean }
    WebhookResponse:
      type: object
      description: Never includes the signing secret.
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    WebhookCreateResponse:
      allOf:
        - $ref: "#/components/schemas/WebhookResponse"
        - type: object
          properties:
            secret: { type: string, description: "The signing secret, shown only once." }
    WebhookDeliveryResponse:
      type: object
      properties:
        id: { type: integer }
        webhook_id: { type: integer }
        event_type: { type: string }
        status_code: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        attempts: { type: integer }
        next_retry_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # --- Graph ---
    GraphResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
    GraphNode:
      type: object
      properties:
        id: { type: string, description: '"c-<contactID>" or "a-<activityID>".' }
        type: { type: string, enum: [contact, activity] }
        label: { type: string }
        photo_thumbnail: { type: string }
        circles:
          type: array
          items: { type: string }
    GraphEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        type: { type: string, enum: [relationship, activity] }
        label: { type: string }

    # --- Import (preserved from WP-73b) ---
    ColumnMapping:
      type: object
      required: [csv_column]
      properties:
        csv_column: { type: string }
        contact_field: { type: string, description: "Empty means \"ignore this column\"." }
        group: { type: integer, description: "Multi-value entry index (0-based); ties value+label/parts of one entry together." }
    ImportUploadResponse:
      type: object
      description: Returned by POST /contacts/import/upload (CSV).
      properties:
        session_id: { type: string }
        headers: { type: array, items: { type: string } }
        suggested_mappings:
          type: array
          items: { $ref: "#/components/schemas/ColumnMapping" }
        row_count: { type: integer }
        sample_data:
          type: array
          items: { type: array, items: { type: string } }
    ImportPreviewRequest:
      type: object
      required: [session_id, mappings]
      properties:
        session_id: { type: string }
        mappings:
          type: array
          items: { $ref: "#/components/schemas/ColumnMapping" }
    DuplicateMatch:
      type: object
      description: Describes a potential duplicate contact found via email/name/phone matching.
      properties:
        existing_contact_id: { type: integer }
        existing_firstname: { type: string }
        existing_lastname: { type: string }
        existing_email: { type: string }
        existing_phone: { type: string }
        match_reason: { type: string, enum: [email, name, phone] }
    ImportRowPreview:
      type: object
      properties:
        row_index: { type: integer }
        parsed_contact:
          type: object
          additionalProperties: true
        validation_errors: { type: array, items: { type: string } }
        duplicate_match:
          $ref: "#/components/schemas/DuplicateMatch"
        suggested_action: { type: string, enum: [add, skip, update] }
        diagnostics:
          type: array
          items: { type: string }
          description: >
            Degradation-policy diagnostics from the vcard4/vcard3/jscontact
            adapter that parsed this row (empty for CSV-import rows, which
            don't go through an adapter).
    ImportPreviewResponse:
      type: object
      description: Returned by the VCF/JSContact upload endpoints and by POST /contacts/import/preview (CSV).
      properties:
        session_id: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRowPreview" }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        duplicate_count: { type: integer }
        error_count: { type: integer }
    RowImportAction:
      type: object
      required: [action]
      properties:
        row_index: { type: integer, minimum: 0 }
        action: { type: string, enum: [skip, add, update] }
    ImportConfirmRequest:
      type: object
      required: [session_id, actions]
      properties:
        session_id: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RowImportAction" }
    ImportResult:
      type: object
      description: Returned by POST /contacts/import/confirm and /contacts/import/vcf/confirm.
      properties:
        total_processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors: { type: array, items: { type: string } }

    # --- Neutral RFC 9553 contact model (preserved from WP-71) ---
    CRMEnvelope:
      type: object
      description: Mycorrhizal-specific data outside any contact-exchange standard.
      properties:
        circles: { type: array, items: { type: string } }
        how_we_met: { type: string }
        work_information: { type: string }
        contact_information: { type: string }
    Passthrough:
      type: object
      description: Unmapped data preserved verbatim (docs/fork-plan/00-overview.md §0.5).
      properties:
        vCardProps:
          type: array
          items:
            $ref: "#/components/schemas/JCardProp"
        jsContactProps:
          type: object
          additionalProperties: true
    JCardProp:
      type: object
      required: [name, type, value]
      properties:
        name: { type: string }
        params:
          type: object
          additionalProperties: true
        type: { type: string, example: text }
        value: {}
    Timestamp:
      type: object
      required: [utc]
      properties:
        utc: { type: string, format: date-time }
    PartialDate:
      type: object
      properties:
        year: { type: integer, nullable: true }
        month: { type: integer, nullable: true }
        day: { type: integer, nullable: true }
        calendarScale: { type: string }
    AnniversaryDate:
      type: object
      properties:
        partial:
          $ref: "#/components/schemas/PartialDate"
        timestamp: { type: string, format: date-time, nullable: true }
    Anniversary:
      type: object
      required: [kind, date]
      properties:
        id: { type: string }
        kind: { type: string, enum: [birth, death, wedding] }
        date:
          $ref: "#/components/schemas/AnniversaryDate"
        place:
          $ref: "#/components/schemas/Address"
    NameComponent:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [title, given, given2, surname, surname2, credential, generation, separator]
        value: { type: string }
        phonetic: { type: string }
    Name:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/NameComponent"
        full: { type: string }
        sortAs:
          type: object
          additionalProperties: { type: string }
        isOrdered: { type: boolean, nullable: true }
        defaultSeparator: { type: string }
        phoneticSystem: { type: string, enum: [ipa, jyut, piny] }
        phoneticScript: { type: string }
    Nickname:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
    OrgUnit:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sortAs: { type: string }
    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        units:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
        sortAs: { type: string }
    Title:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [title, role] }
        organizationId: { type: string }
    Email:
      type: object
      required: [address]
      properties:
        id: { type: string }
        address: { type: string, format: email }
        contexts: { type: array, items: { type: string, enum: [private, work] } }
        pref: { type: integer, nullable: true }
        label: { type: string }
    Phone:
      type: object
      required: [number]
      properties:
        id: { type: string }
        number: { type: string }
        features:
          type: array
          items:
            type: string
            enum: [voice, fax, cell, video, pager, text, textphone, main-number]
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
        label: { type: string }
    OnlineService:
      type: object
      properties:
        id: { type: string }
        service: { type: string }
        uri: { type: string }
        user: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
        label: { type: string }
    AddressComponent:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum:
            [room, apartment, floor, building, number, name, block,
             subdistrict, district, locality, region, postcode, country,
             direction, landmark, postOfficeBox, separator]
        value: { type: string }
        phonetic: { type: string }
    Address:
      type: object
      properties:
        id: { type: string }
        components:
          type: array
          items:
            $ref: "#/components/schemas/AddressComponent"
        countryCode: { type: string }
        coordinates: { type: string, description: "geo: URI" }
        timeZone: { type: string }
        contexts: { type: array, items: { type: string, enum: [billing, delivery, private, work] } }
        pref: { type: integer, nullable: true }
        full: { type: string }
        isOrdered: { type: boolean, nullable: true }
        defaultSeparator: { type: string }
        phoneticSystem: { type: string }
        phoneticScript: { type: string }
    GrammaticalGender:
      type: object
      required: [value]
      properties:
        id: { type: string }
        value: { type: string, enum: [animate, common, feminine, inanimate, masculine, neuter] }
        language: { type: string }
    Pronouns:
      type: object
      required: [pronouns]
      properties:
        id: { type: string }
        pronouns: { type: string, example: "she/her" }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
    SpeakToAs:
      type: object
      properties:
        grammaticalGenders:
          type: array
          items:
            $ref: "#/components/schemas/GrammaticalGender"
        pronouns:
          type: array
          items:
            $ref: "#/components/schemas/Pronouns"
    PersonalInfo:
      type: object
      required: [kind, value]
      properties:
        id: { type: string }
        kind: { type: string, enum: [expertise, hobby, interest] }
        value: { type: string }
        level: { type: string, enum: [high, medium, low, beginner, average, expert] }
        listAs: { type: integer, nullable: true }
        label: { type: string }
    Author:
      type: object
      properties:
        name: { type: string }
        uri: { type: string }
    CardNote:
      type: object
      required: [note]
      properties:
        id: { type: string }
        note: { type: string }
        author:
          $ref: "#/components/schemas/Author"
        created:
          $ref: "#/components/schemas/Timestamp"
    Resource:
      type: object
      required: [uri]
      properties:
        id: { type: string }
        kind: { type: string, description: "photo|logo|sound (Media) or directory|entry (Directories); unset for single-purpose Resource fields." }
        uri: { type: string }
        mediaType: { type: string }
        label: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
        listAs: { type: integer, nullable: true }
    LanguagePref:
      type: object
      required: [language]
      properties:
        id: { type: string }
        language: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
    Relation:
      type: object
      required: [target]
      properties:
        target: { type: string }
        relations: { type: array, items: { type: string } }
    Card:
      type: object
      description: >
        Neutral superset of a contact's standardized data (union of RFC 9553
        JSContact + the IANA vCard-elements registry). See
        docs/fork-plan/20-correspondence.md for the full field-by-field
        mapping to/from vCard 3.0/4.0 and JSContact.
      properties:
        uid: { type: string }
        kind: { type: string, enum: [individual, group, org, location, application, device] }
        language: { type: string }
        prodId: { type: string }
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"
        name:
          $ref: "#/components/schemas/Name"
        nicknames:
          type: array
          items: { $ref: "#/components/schemas/Nickname" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        titles:
          type: array
          items: { $ref: "#/components/schemas/Title" }
        emails:
