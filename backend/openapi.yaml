  # --- Life events ---
  /life-events:
    get:
      summary: List life events
      operationId: listLifeEvents
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor. Ignored when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every life event changed after this
            position — including soft-deleted ones (deleted:true) — ordered
            forward, ignoring entity_id. A cursor older than
            DELETED_RETENTION_DAYS returns 410 Gone.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: entity_id
          in: query
          description: Filter to life events whose subject contact is this Contact.VCardUID.
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
