            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a reminder
      operationId: updateReminder
      description: The Reminder model doubles as the request body — required fields (message, remind_at, recurrence, contact_id) must be re-sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reminder"
      responses:
        "200":
          description: Reminder updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Reminder updated successfully" }
                  reminder:
                    $ref: "#/components/schemas/Reminder"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reminder (or referenced contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a reminder (soft delete)
      operationId: deleteReminder
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Reminder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reminders/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Complete a reminder
      operationId: completeReminder
      description: >
        Marks the reminder complete. With ?skip=true the timeline completion
        record is skipped. Recurring reminders are rescheduled (and return the
        reminder); once reminders are hard-deleted (message-only response).
      parameters:
        - name: skip
          in: query
          description: Skip writing the ReminderCompletion timeline record.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Completed (and rescheduled if recurring).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderCompleteResponse"
        "404":
          description: Reminder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/reminders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List a contact's reminders
      operationId: listContactReminders
      responses:
        "200":
          description: The contact's reminders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a reminder for a contact
      operationId: createReminder
      description: >
        The contact_id from the URL overrides any body contact_id, but the
        field is still required in the body by validation (the Reminder model
        is the request schema). remind_at's time-of-day is zeroed server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reminder"
      responses:
        "200":
          description: Reminder created (200, not 201).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Reminder created successfully" }
                  reminder:
                    $ref: "#/components/schemas/Reminder"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/reminder-completions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List a contact's reminder completions (timeline)
      operationId: listContactReminderCompletions
      responses:
        "200":
          description: The contact's completions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  completions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReminderCompletion"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reminder-completions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Delete a reminder completion record
      operationId: deleteReminderCompletion
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Completion record not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Export ---
  /export:
    get:
      summary: Export all personal data as CSV
      operationId: exportDataCsv
      description: >
        The full per-user backup as a single CSV file with section banner
        rows (CONTACTS/RELATIONSHIPS/ACTIVITIES/NOTES/REMINDERS) and header
        rows per section. Values are formula-injection-neutralized. This
        endpoint does not take sections/include_sensitive params — those
        apply only to the vCard/JSContact exports.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A CSV file.
          content:
            text/csv:
              schema: { type: string, format: binary }
  /export/vcf:
    get:
      summary: Export all contacts as a vCard (.vcf) file
      operationId: exportContactsVcf
      parameters:
        - name: version
          in: query
          description: vCard version to export. Defaults to 4.0.
          schema: { type: string, enum: ["4", "4.0", "3", "3.0"], default: "4" }
        - name: sections
          in: query
          description: >
            Comma-separated field sections to include (WP-97/T9 selective
            export). One of: emails, phones, addresses, organizations,
            anniversaries, media, online_services, links, notes, keywords,
            related_to, personal_info, speak_to_as, members, languages,
            custom_fields. Absent means all sections. Identity (name/UID) is
            always included. An unknown token is a 400.
          schema:
            type: string
            example: "emails,phones,addresses"
        - name: include_sensitive
          in: query
          description: >
            Explicit opt-in override (91.13): when true, private/secret
            items in the selected sensitivity-bearing sections (related_to,
            personal_info, custom_fields) are included in this one export.
            Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A .vcf file (one or more concatenated vCard blocks).
          content:
            text/vcard:
              schema: { type: string, format: binary }
        "400":
          description: An unknown sections token was supplied.
  /export/jscontact:
    get:
      summary: Export all contacts as a JSContact (RFC 9553) JSON document
      operationId: exportContactsJscontact
      description: A JSON array of JSContact Card objects, one per contact.
      parameters:
        - name: sections
          in: query
          description: >
            Comma-separated field sections to include (WP-97/T9 selective
            export). One of: emails, phones, addresses, organizations,
            anniversaries, media, online_services, links, notes, keywords,
            related_to, personal_info, speak_to_as, members, languages,
            custom_fields. Absent means all sections. Identity (name/UID) is
            always included.
          schema:
            type: string
            example: "emails,phones,addresses"
        - name: include_sensitive
          in: query
          description: >
            Explicit opt-in override (91.13): when true, private/secret
            items in the selected sensitivity-bearing sections (related_to,
            personal_info, custom_fields) are included in this one export.
            Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A JSON array of JSContact Card documents.
          content:
            application/jscontact+json:
              schema:
                type: array
                items:
                  type: object
                  description: An RFC 9553 JSContact Card document.
        "400":
          description: An unknown sections token was supplied.

  # --- Graph ---
  /graph:
    get:
      summary: Get the network graph (contacts + confirmed edges + activities)
      operationId: getGraph
      description: >
        Contact nodes (all non-archived contacts), activity nodes (only
        activities with 2+ participants), relationship edges (only status=confirmed),
        and activity star-edges. Error responses on this endpoint use a plain
        {"error": "..."} body, not the standard Error envelope.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "500":
          description: Failed to fetch contacts/edges/activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

