  # --- CadencePolicies (T19) ---
  /cadence-policies/overdue:
    get:
      summary: List overdue cadence policies
      operationId: listOverdueCadences
      description: >
        Every cadence policy that is currently overdue, most-overdue first,
        joined with the contact's numeric ID and display name. Health is
        derived from the timeline (never stored); a policy with no qualifying
        interaction ever can never be overdue.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The overdue list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overdue:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverdueCadence"
  /cadence-policies:
    get:
      summary: List cadence policies
      operationId: listCadencePolicies
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor. Ignored when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every cadence policy changed after this
            position — including soft-deleted ones (deleted:true) — ordered
            forward, ignoring entity_id. A cursor older than
            DELETED_RETENTION_DAYS returns 410 Gone.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: entity_id
          in: query
          description: Filter to the cadence policy whose subject contact is this Contact.VCardUID (the contact-page query).
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The ?since= cursor is older than DELETED_RETENTION_DAYS — full resync required.
          content:
            application/json:
              schema:
