                    $ref: "#/components/schemas/CadencePolicyWithHealth"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The subject contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
