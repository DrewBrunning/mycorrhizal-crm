# Generated by `cd backend && go run ./cmd/genmutationscope` (issue #915).
# Do not hand-edit: TestGeneratedConfigsAreCurrent fails until this file
# matches internal/mutationscope.Scopes again.
unleash:
    exclude-files:
        - ^account_limiter_reset\.go$
        - ^auth_velocity\.go$
        - ^body_limit\.go$
        - ^client_version\.go$
        - ^deprecation\.go$
        - ^logging\.go$
        - ^metrics\.go$
        - ^password_strength\.go$
        - ^rate_limiter\.go$
        - ^request_id\.go$
        - ^security_headers\.go$
        - ^validation\.go$
    threshold:
        efficacy: 95
        mutant-coverage: 93
