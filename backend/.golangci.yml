# golangci-lint configuration (issue #358 — SAST stack expansion).
#
# The "standard" linters (errcheck, govet, ineffassign, staticcheck, unused)
# are the fast correctness layer. gosec, bodyclose and noctx are the
# security-focused layer that complements CodeQL:
#   - gosec      — Go-specific crypto / file-mode / injection patterns
#   - bodyclose  — HTTP response bodies that are never closed (the CardDAV /
#                  CalDAV / webpush / Resend clients all make outbound calls)
#   - noctx      — net/http calls that skip an explicit context
#
# The gocron scheduler excludes match the standing position documented in
# unit-tests.yml for the old standalone `go run gosec` step: the return
# values of Scheduler.Do are intentional best-effort registrations, not bugs
# (G104 was excluded for exactly these lines).
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - noctx
  settings:
    errcheck:
      exclude-functions:
        - '(*github.com/go-co-op/gocron.Scheduler).Do'
    gosec:
      excludes:
        - G104

  exclusions:
    rules:
      # Best-effort cleanup / seek / test-helper paths. Tests get a blanket
      # exemption from the security layer: they exercise hostile input by
      # design, and go test -race + CodeQL already cover the non-test code.
      - path: '(_test\.go)$'
        linters:
          - gosec
          - bodyclose
          - noctx
