# golangci-lint configuration (issue #358 — SAST stack expansion).
#
# The gate is the security-focused layer the issue asked for, consolidated
# from the old standalone `go run gosec` step:
#   - gosec     — Go-specific crypto / file-mode / injection patterns
#   - bodyclose — HTTP response bodies that are never closed (the CardDAV /
#                 CalDAV / webpush / Resend clients all make outbound calls)
#   - govet     — the correctness pass CI already runs via `go vet`; kept here
#                 so golangci-lint is self-contained.
#
# Deliberately NOT enabled, each with a documented reason:
#   - errcheck / staticcheck / unused / ineffassign (the rest of `standard`):
#     unhandled errors in best-effort paths are a documented, accepted pattern
#     here — the old gosec step excluded G104 for exactly this ("the findings
#     are intentional best-effort paths (cron scheduling, cleanup os.Remove,
#     src.Seek), not bugs"). Gating errcheck would force a ~50-site refactor
#     of accepted code. Revisit if that discipline changes.
#   - noctx: the HTTP helpers and the database layer (the golang-migrate
#     sqlite driver in database/) do not thread contexts through their
#     signatures; wiring them in is a context-propagation refactor across the
#     SSRF-guarded fetcher, the SMTP client, and the DB driver, tracked
#     separately rather than rushed behind a red gate.
#
# gosec G104 (unhandled errors) stays excluded, matching the standing position
# above. Tests are exempt from the security layer: they exercise hostile input
# by design, and `go test -race` + CodeQL already cover the non-test code.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - gosec
    - bodyclose
  settings:
    gosec:
      excludes:
        - G104

  exclusions:
    rules:
      - path: '(_test\.go)$'
        linters:
          - gosec
          - bodyclose
