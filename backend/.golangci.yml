# golangci-lint configuration (issue #358 — SAST stack expansion; widened to
# the correctness layer by the code-quality-checks review).
#
# Pinned version: v2.14.0 (unit-tests.yml, .githooks/pre-commit). v2.12.2 —
# the previous pin — panics inside staticcheck/unused (`buildir`) under the Go
# 1.27 toolchain this module pins; v2.14.0 is the first pin that runs them.
#
# Enabled:
#   - gosec       — Go-specific crypto / file-mode / injection patterns
#   - bodyclose   — HTTP response bodies that are never closed (the CardDAV /
#                   CalDAV / webpush / Resend clients all make outbound calls)
#   - govet       — the correctness pass CI already runs via `go vet`; kept
#                   here so golangci-lint is self-contained.
#   - errcheck    — CLAUDE.md backend trap #4 ("check .Error on every
#                   db.Updates/db.Save") generalised to every error return.
#                   GORM's chained `*gorm.DB` result is invisible to errcheck,
#                   so the GORM half of trap #4 is the separate custom
#                   analyzer `go run ./cmd/gormerrcheck ./...`
#                   (internal/lint/gormerr), run next to this in CI and the
#                   pre-commit hook. Likewise `go run ./cmd/rawtimecheck ./...`
#                   (internal/lint/rawtime, issue #1494) flags a raw
#                   time.Now/Since/Until in controllers/services/middleware.
#   - errorlint   — `==` / type assertions on errors that may be wrapped
#                   (gorm.ErrRecordNotFound, *apperrors.AppError, migrate
#                   sentinels). See the `errorf: false` note below.
#   - ineffassign — assignments whose value is never read.
#   - staticcheck — SA (bugs), S (simplifications), ST/QF (style) with the
#                   opt-outs listed under settings.
#   - unused      — dead code.
#   - exhaustive  — switches over enum-like types (sensitivity, contact/edge
#                   status, activity/job/notification/score reason codes,
#                   cursor and soak kinds) must handle every value. A new
#                   enum member silently falling through is a recurring bug
#                   class; a `default` is not accepted as covering the enum.
#   - rowserrcheck — a `*sql.Rows` iteration whose `Err()` is never checked
#                   loses the iteration error (database/, FTS, backfills).
#   - sqlclosecheck — a `*sql.Rows`/Stmt that is never closed leaks a
#                   connection; the `database/` driver and schema fixtures are
#                   the raw-SQL paths this guards.
#   - nilerr      — `if err != nil { return nil }` swallows an error (the same
#                   class as CLAUDE.md backend trap #4). Every current hit is
#                   a documented best-effort path with a reasoned `nolint`.
#   - bidichk     — bidirectional Unicode control characters ("trojan
#                   source"), cheap supply-chain hygiene. The adversarial
#                   fixtures that deliberately carry an RTL override are the
#                   only exceptions, each with a reasoned `nolint`.
#   - durationcheck — `time.Duration * time.Duration` mistakes in cadence,
#                   reminder and job-staleness math.
#   - copyloopvar — redundant per-iteration copies of a loop variable; Go
#                   1.22+ already gives each iteration its own binding.
#   - unconvert   — conversions that do not change the type.
#   - misspell    — spelling in comments and identifiers, with autofix.
#
# Deliberately NOT enabled:
#   - forcetypeassert: 588 findings on main (353 outside tests), 334 of them
#     in controllers — overwhelmingly `c.MustGet("db").(*gorm.DB)` and the
#     CardDAV/CalDAV principal `username.(string)`, where the router or
#     middleware installed the concrete type hours earlier. Rewriting all of
#     those as checked assertions is a large, low-value sweep that would bury
#     the few genuine unchecked assertions in noise. Rejected for this
#     adoption pass; revisit as a targeted cleanup if a real panic surfaces.
#   - noctx / contextcheck: the HTTP helpers and the database layer (the
#     golang-migrate sqlite driver in database/) do not thread contexts
#     through their signatures; wiring them in is a context-propagation
#     refactor across the SSRF-guarded fetcher, the SMTP client, and the DB
#     driver. That refactor is tracked in issue #1939 rather than rushed
#     behind a red gate.
#
# gosec G104 (unhandled errors) stays excluded — errcheck is now the one
# owner of that rule, with a real exclusion list instead of a blanket skip.
#
# Test files are exempt from gosec/bodyclose (they exercise hostile input by
# design) and from the correctness linters below (errcheck & co., exhaustive,
# rowserrcheck, sqlclosecheck, nilerr, durationcheck) — a test's intentional
# partial switch or deliberately leaked rows test would otherwise need a
# `nolint` on every case, and `go test -race` exercises the runtime behavior
# anyway. copyloopvar, unconvert and misspell DO run over tests: those
# findings are mechanical, and leaving them on keeps test code held to the
# same hygiene bar as production.
version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - gosec
    - bodyclose
    - errcheck
    - errorlint
    - ineffassign
    - staticcheck
    - unused
    - exhaustive
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - bidichk
    - durationcheck
    - copyloopvar
    - unconvert
    - misspell
  settings:
    exhaustive:
      # A `default` must not hide a newly added enum member: the missing case
      # is the signal. Intentional partial switches get an explicit case (or
      # a reasoned `nolint`) instead.
      default-signifies-exhaustive: false
    gosec:
      excludes:
        - G104
    errcheck:
      exclude-functions:
        # A bufio.Writer's error is sticky and surfaces from Flush(), which
        # every caller here checks (metrics.Registry.WritePrometheus).
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).WriteRune
        # rows.Err() is the iteration error that matters; Close() after a
        # full iteration reports nothing new.
        - (*database/sql.Rows).Close
        # Interface-typed closers. In production code these are HTTP response
        # bodies (bodyclose enforces the Close; its error is not actionable)
        # and read-only multipart upload files. A concrete *os.File is NOT
        # covered, so a written file's Close stays checked (photo saves).
        - (io.Closer).Close
        # Pool teardown after every statement/transaction on the handle has
        # already committed or returned its own checked error.
        - (*database/sql.DB).Close
        # Builder methods: they mutate the receiver in place and return it
        # only for chaining (errors/errors.go), so the discarded result is
        # the same pointer the caller already holds, not a new error.
        - (*mycorrhizal/errors.AppError).WithDetails
        - (*mycorrhizal/errors.AppError).WithError
    errorlint:
      # The `fmt.Errorf("%w: %v", ErrSentinel, err)` idiom used throughout
      # services/ and monica/ is deliberate: the sentinel is the
      # classification callers errors.Is against, and the transport cause is
      # text only. Wrapping the cause too (`%w: %w`) would let errors.Is/As
      # match net/url/context errors through the chain and change the
      # transient-vs-permanent classification (integrations.Dispositions).
      # `comparison` and `asserts` — the checks that catch real bugs — stay on.
      errorf: false
    staticcheck:
      checks:
        - all
        # golangci-lint's own defaults:
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error strings lead with a product name (Immich, Paperless,
        # Nextcloud, Seafile, Google) and are surfaced to the user verbatim.
        - -ST1005
        # "Use fmt.Fprintf instead of WriteString(fmt.Sprintf(...))" on a
        # strings.Builder: pure style, and Fprintf's (never-non-nil) error
        # would then trip errcheck.
        - -QF1012

  exclusions:
    rules:
      - path: '(_test\.go)$'
        linters:
          - gosec
          - bodyclose
          - errcheck
          - errorlint
          - ineffassign
          - staticcheck
          - unused
          - exhaustive
          - rowserrcheck
          - sqlclosecheck
          - nilerr
          - durationcheck
      # CLI tools under cmd/ print reports to stdout/stderr; a failed write
      # to the terminal has no recovery path worth writing.
      - path: '^cmd/'
        linters:
          - errcheck
        text: 'Error return value of `fmt\.Fprint(f|ln)?` is not checked'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
