# Codecov config — issue #294 (visibility) + issue #267 (the diff gate).
#
# Two statuses, deliberately asymmetric:
#   - project: informational only. An absolute "must be at least N%" floor is
#     the worst variant of a coverage gate (issue #267) and stays off.
#   - patch: the hard gate. `target: 100%` fails a PR that adds any changed
#     line the coverage tooling records as uncovered (Go coverprofile, vitest
#     lcov, JaCoCo aggregated XML — all three upload via the flags below).
#     `only_pulls: true` scopes it to PRs, where the author can act on it; a
#     commit pushed straight to main has no PR diff to gate and passes. The
#     override path is documented in docs/development/coverage.md: write the
#     test, or `# pragma: no cover` a line that genuinely cannot be covered
#     (rare, needs a reason), or add a file to `ignore:` below.
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 100%
        threshold: 0%
        only_pulls: true

# CI is path-gated (dorny/paths-filter — see unit-tests.yml / android-tests.yml
# "Detect Changes"), so a PR touching only one area never uploads the other
# flags. Without carryforward, Codecov would treat that PR's single flag as
# the whole repo's coverage, which is wrong and makes the diff comment
# misleading. carryforward: true reuses each flag's last known coverage on
# commits/PRs that don't touch that area.
flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true
  android:
    paths:
      - android/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  # Hand-written SQL migrations (no .go source lives here today, but this
  # guards against a future embed.go/helper landing in the same directory).
  - "backend/database/migrations/**"
  # No codegen exists yet anywhere in the repo (checked when this file was
  # written); this is a placeholder for whenever one shows up, per CLAUDE.md's
  # "frontend enum/registry lists are hardcoded mirrors" note — nothing here
  # is actually generated today.
  - "frontend/src/generated/**"
