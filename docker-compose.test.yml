# Mycorrhizal CRM Docker Compose - E2E Testing
#
# Builds and runs the all-in-one image for end-to-end testing with Playwright.
# This exercises the same artifact that ships to users (nginx + backend under
# supervisord, same-origin /api). Uses a fresh database for each test run.
#
# USAGE:
#   docker compose -f docker-compose.test.yml up -d --build --wait
#   npx playwright test
#   docker compose -f docker-compose.test.yml down -v

services:
  mycorrhizal:
    image: mycorrhizal-crm-test:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycorrhizal-test
    environment:
      - SQLITE_DB_PATH=/app/data/test.db
      - JWT_SECRET_KEY=test-secret-key-for-e2e-testing-minimum-32-chars
      - PROFILE_PHOTO_DIR=/app/static/photos
      - ATTACHMENTS_DIR=/app/static/attachments
      - FRONTEND_URL=http://localhost:7300
      - DISABLE_REGISTRATION=false
      # CalDAV serving (T12b) enabled so the e2e suite can exercise it.
      - CALDAV_ENABLED=true
      # The e2e suite drives the whole app from one IP, so every worker shares
      # a single rate-limit bucket. A full run is several thousand requests
      # (one contact page alone fires ~18), which exhausted the production
      # default and produced 429s late in the suite. Raised here rather than
      # in the shipped defaults so the test run does not dictate the
      # production limit.
      - API_RATE_LIMIT_INTERVAL_MS=1
      - API_RATE_LIMIT_BURST=100000
      # The restore drill (issue #275) does a full VACUUM INTO copy + reopen
      # + migrate of the whole database on every container boot — unneeded
      # I/O on a throwaway e2e database every CI run, and the mechanism is
      # already covered deterministically by the real-DB Go tests. The
      # integrity check (issue #273) is a cheap PRAGMA against the live
      # connection and stays enabled.
      - DB_RESTORE_DRILL_ENABLED=false
    volumes:
      - test-data:/app/data
      - test-photos:/app/static/photos
      - test-attachments:/app/static/attachments
    ports:
      # Frontend and same-origin /api are both served by nginx on 8080
      - "7300:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  test-data:
  test-photos:
  test-attachments:
