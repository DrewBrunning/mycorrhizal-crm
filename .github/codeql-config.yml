# CodeQL configuration (issue #368 — DAST).
#
# backend/cmd/dastcanary is a deliberately-vulnerable DAST canary: its
# reflected-XSS sink is the point (the DAST gate asserts ZAP detects it), so
# the static Go analysis must not flag it. It is excluded here rather than
# inline because CodeQL's `// lgtm[<id>]` suppression comment cannot suppress a
# column-specific path-problem alert — the go/reflected-xss sink is reported at
# the exact argument column, not the whole line, and the suppression comment
# only covers whole-line locations.
#
# The canary's deliberate sinks are still gated elsewhere: gosec via inline
# `#nosec G705` (unit-tests.yml's golangci-lint step), and their *presence* is
# asserted by the DAST self-test (backend/cmd/zapgate) so the canary cannot be
# silently removed or neutered.
paths-ignore:
  - backend/cmd/dastcanary/**
