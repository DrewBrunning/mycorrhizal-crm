name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # Issue #578, B5: the instrumented E2E job (android-e2e) moved OFF the PR
  # path — it stays on push:main and now also sweeps every night + on demand.
  # The `test` job (Robolectric + detekt + lint + assembleDebug) remains the
  # fast PR gate. See the android-e2e job's header for the trade-off.
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly
  workflow_dispatch:
  workflow_call:
    inputs:
      release_compose:
        description: 'True when called by the release composer (release-validate.yml): skip non-gating advisory jobs to reduce runner contention (issue #1174).'
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: android-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.resolve.outputs.android }}
      backend: ${{ steps.resolve.outputs.backend }}
      openapi: ${{ steps.resolve.outputs.openapi }}
      infra: ${{ steps.resolve.outputs.infra }}
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      # Passed as env vars rather than inline ${{ }} so zizmor's
      # template-injection audit has nothing to flag. workflow_dispatch forces
      # every area true (issue #543): the `test` job below (the "Android
      # (Gradle)" mandatory gate) had NO event_name exemption of its own,
      # unlike android-e2e further down -- a real, pre-existing gap this
      # closes at the source rather than patching that job's `if:` directly.
      - name: Resolve gating decision
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            android=true; backend=true; openapi=true; infra=true; workflows=true
          else
            android="$ANDROID_CHANGED"; backend="$BACKEND_CHANGED"; openapi="$OPENAPI_CHANGED"
            infra="$INFRA_CHANGED"; workflows="$WORKFLOWS_CHANGED"
          fi
          {
            echo "android=$android"
            echo "backend=$backend"
            echo "openapi=$openapi"
            echo "infra=$infra"
            echo "workflows=$workflows"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_CHANGED: ${{ steps.filter.outputs.android }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  test:
    permissions:
      contents: read
    name: Android (Gradle)
    runs-on: ubuntu-latest
    # The job runs the full Robolectric suite + jacoco + lint + assembleDebug;
    # typical time is ~26-30m, and a slightly slow runner has hit the 30m cap
    # (cancelled mid-assemble). 40m keeps the bound meaningful while giving the
    # variance headroom so a flaky timeout doesn't fail the required check.
    timeout-minutes: 40
    needs: changes
    # Issue #974: this was the one job in this file with no schedule
    # exemption (every other job here — android-e2e, android-e2e-min-sdk,
    # android-below-min-sdk, android-macrobenchmark — already runs
    # unconditionally on the nightly cron). Without it, the test-retry
    # plugin's maxRetries=0-on-schedule tier (AndroidConfig.kt) would never
    # actually fire on a normal night, since paths-filter's diff against the
    # previous commit is false most nights with no android/** change.
    if: github.event_name == 'schedule' || needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # core/data/schemas/*.json are generated by KSP (room.schemaLocation) but
      # committed: they are the "before" databases a MigrationTestHelper test
      # builds from, so a stale dump describes a schema the compiled AppDatabase
      # rejects. I18N-02 (issue #485) shipped exactly that — its 18.json was the
      # v17 dump copied verbatim (wrong FTS tokenizer, wrong identityHash). A
      # plain build leaves the stale file untouched (the KSP task is up-to-date),
      # so --rerun forces the schema export to run; the diff must then be empty.
      # RoomSchemaDumpTest pins the same invariant in-suite; this is the
      # ground-truth regeneration check that catches any unregenerated change.
      - name: Room schema dumps are current
        working-directory: android
        run: |
          ./gradlew :core:data:kspDebugKotlin --rerun
          # --porcelain (not just `git diff`) so an uncommitted *new* schema
          # dump for a bumped version is caught too, not only edits to the
          # existing files.
          if [ -n "$(git status --porcelain -- core/data/schemas)" ]; then
            git status --porcelain -- core/data/schemas
            git diff -- core/data/schemas
            echo "::error::Room schema dumps are stale; run './gradlew :core:data:kspDebugKotlin --rerun' in android/ and commit the diff."
            exit 1
          fi

      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest

      # Issue #268: the test-retry plugin (configured in build-logic) reruns a
      # failed Robolectric test once in CI. Gradle retains the failed attempt
      # in the test-results XML even when the retry passed, so when the task
      # SUCCEEDED any remaining <failure>/<error> in the XML marks a test that
      # only passed on retry — i.e. a flake. That's the signal: the required
      # check stays green, but the flake is called out here (and in the check
      # run from test-report.yml, where dorny/test-reporter will also show it).
      - name: Detect flaky unit tests (failed once, passed on retry)
        if: success()
        working-directory: android
        run: |
          flaky=$(grep -rlE '<failure|<error' --include='TEST-*.xml' . | grep '/build/test-results/' || true)
          if [ -n "$flaky" ]; then
            echo "::warning::Flaky tests detected (passed only on retry):"
            echo "$flaky"
          else
            echo "No flaky tests this run."
          fi

      # Issue #251: the project-wide number stays informational. The hard
      # gate is the diff-based codecov/patch status (issue #267) — new
      # uncovered lines in the changed files fail the PR. Runs the
      # *aggregated* report (issue #342) — a single JaCoCo XML built from
      # every module's exec data, rather than the per-module
      # `jacocoTestReport` tasks. Codecov mis-merged the 22 per-module XMLs
      # and reported most `feature/*` modules at 0% despite the local reports
      # showing ~70%.
      - name: Coverage report (JaCoCo, aggregated)
        working-directory: android
        run: ./gradlew jacocoTestReportAggregated

      # Issue #294: see unit-tests.yml's backend job for why
      # fail_ci_if_error is false — informational only, see codecov.yml.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: android/build/reports/jacoco/jacocoTestReportAggregated/jacocoTestReportAggregated.xml
          flags: android
          fail_ci_if_error: false

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      # Issue #358: detekt is the Kotlin correctness/smell analyzer (dead
      # code, over-broad exception handling, declaration/file mismatches) that
      # complements CodeQL + mobsfscan + Android Lint for the app. Applied to
      # every module by the build-logic convention plugins with the shared
      # config at android/config/detekt/detekt.yml (the style rules the repo
      # doesn't enforce are disabled there, so this gates regressions of the
      # high-signal set rather than a style baseline). Requires the JDK 17
      # from setup-java above: detekt 1.23.x's JVM-version parser can't handle
      # JDK 25, and the convention plugin pins its --jvm-target to 17 anyway.
      - name: detekt
        working-directory: android
        run: ./gradlew detekt

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-coverage
          path: android/build/reports/jacoco/jacocoTestReportAggregated/
          retention-days: 7

      # Issue #268: JUnit XML from the Robolectric unit tests, consumed by
      # test-report.yml (dorny/test-reporter). `if: always()` keeps the report
      # available even when the test step failed.
      - name: Upload unit test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unit-test-results
          path: |
            android/**/build/test-results/testDebugUnitTest/TEST-*.xml
            android/**/build/reports/tests/
          retention-days: 7

  # Issue #238: instrumented E2E tests (app/src/androidTest) — the real app
  # driven against the real docker-compose.test.yml backend on an emulator.
  # The web Playwright suite cannot drive Android; this is its Android
  # equivalent. Local runbook: README-developer.md → "Android E2E".
  #
  # Issue #578, B5 (tiering): this is deliberately NOT on pull_request
  # anymore. Per CLAUDE.md it replaced the manual on-device Pixel 8a gate,
  # and it was the single heaviest PR check in the repo (~60 min: emulator +
  # all-in-one image build + compose). Moving it to push:main + nightly
  # means an Android PR is gated by Robolectric only (the `test` job, fast);
  # the emulator signal lands post-merge and every night. That is the
  # intended trade-off — called out explicitly in the issue's PR notes.
  # test-report.yml reports on the workflow via workflow_run, unchanged; it
  # will simply report these (now main/nightly) results the same way.
  android-e2e:
    permissions:
      contents: read
      actions: read
    name: Android E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    # Runs on the nightly schedule and manual dispatch unconditionally; on
    # push:main it's path-gated (builds the all-in-one image + starts
    # docker-compose.test.yml (infra), plus android/** and the openapi
    # contract the app consumes). Pure backend/** changes are covered by the
    # Go checks in unit-tests.yml and don't re-run the emulator suite. The
    # pull_request event matches none of these branches, so a PR never
    # triggers it.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || (github.event_name == 'push' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Creates the docker-container buildx builder the cache export below
      # needs (the default docker driver cannot write `type=gha` caches) —
      # same setup the web E2E workflow uses.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The same all-in-one image the web E2E suite builds (nginx + backend
      # under supervisord, same-origin /api, registration enabled, fresh DB).
      - name: Build all-in-one backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Frontend + same-origin /api on 7300; the emulator reaches it via
          # 10.0.2.2 (or adb reverse 127.0.0.1 — the tests pass the serverUrl
          # below so the transport doesn't matter).
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # Issue #528: a second all-in-one backend (port 7301) booted with
      # MIN_CLIENT_VERSION set above the debug APK's versionName. Only
      # ForceUpdateGateE2ETest talks to it; the rest of the suite keeps using
      # the floor-less 7300 instance (the policy's default posture).
      # Issue #914: a third backend (port 7302), pinned to the real v0.6.0
      # release image — this app's actual migration floor, not a stub.
      # OldServerCompatibilityE2ETest / ServerTooOldGateE2ETest talk to it
      # (the latter stubs its OWN below-floor response; only the real-server
      # test needs this container up).
      - name: Start compatibility backends (issues #528, #914)
        run: |
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml up -d
          echo "Waiting for compatibility backends to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7301/health/live > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -s http://localhost:7302/health > /dev/null 2>&1; do sleep 2; done'
          curl -s http://localhost:7301/health
          echo ""
          curl -s http://localhost:7302/health
          echo ""
          echo "Compatibility backends are ready"

      # Hardware acceleration for the emulator (required by android-emulator-runner).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # adb reverse tunnels the device's 127.0.0.1:7300 to the host's loopback
      # — the exact path the Pixel 8a runbook uses — so the suite is immune to
      # emulator NAT quirks (10.0.2.2 varies by image/API level).
      #
      # Issue #268: the connected suite is retried once on failure (the
      # org.gradle.test-retry plugin only covers JVM `Test` tasks, not AGP's
      # connected tasks, so this is the "equivalent" for instrumented E2E).
      # When a retry is triggered the failing attempt's JUnit XML is preserved
      # under app/build/flaky-attempt-*/ (uploaded below) — if the retry then
      # passes, those files are the flake signal to triage.
      - name: Run instrumented E2E tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          # Script lines run as individual sh -c commands (parseScript splits on
          # newlines), so the retry loop below is a single line — no backslash
          # line continuations. :app-scoped: a bare `connectedDebugAndroidTest`
          # would expand to every module, including libraries with no
          # instrumented tests whose connected tasks fail.
          #
          # Issue #974: max_attempts is 1 (no retry) on the nightly `schedule`
          # run — GITHUB_EVENT_NAME is a default Actions env var, inherited by
          # every sh -c the action spawns, not a script-local variable, so it
          # survives the per-line-shell split. Without this, a flaky
          # instrumented test could pass on retry every night forever with no
          # run ever hard-failing on it.
          script: |
            adb reverse tcp:7300 tcp:7300
            adb reverse tcp:7301 tcp:7301
            adb reverse tcp:7302 tcp:7302
            max_attempts=$([ "$GITHUB_EVENT_NAME" = "schedule" ] && echo 1 || echo 2); attempt=1; while true; do if ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300; then exit 0; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "connectedDebugAndroidTest failed after $max_attempts attempts" >&2; exit 1; fi; echo "connectedDebugAndroidTest failed on attempt $attempt/$max_attempts; preserving failing results and retrying"; mkdir -p "app/build/flaky-attempt-$attempt"; cp app/build/outputs/androidTest-results/connected/*.xml "app/build/flaky-attempt-$attempt/" 2>/dev/null || true; attempt=$((attempt + 1)); done

      # Issue #268: if the suite passed but only after a retry, the preserved
      # flaky-attempt-* XMLs are the flake signal (the final connected run
      # overwrote the failing attempt). Printed here for the log and uploaded
      # with the results artifact for triage.
      - name: Report instrumented flakes (passed only on retry)
        if: success()
        working-directory: android
        run: |
          if ls app/build/flaky-attempt-*/ >/dev/null 2>&1; then
            echo "::warning::Instrumented suite passed only after retry. Preserved failing attempt(s):"
            ls -d app/build/flaky-attempt-*/
          else
            echo "No instrumented retries this run."
          fi

      - name: Upload E2E results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-e2e-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/flaky-attempt-*/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml down -v

  # COMPAT-02 (issue #473): the same instrumented E2E suite as android-e2e
  # above, but on an emulator at API 26 -- the declared minSdk floor
  # (android/build-logic/.../AndroidConfig.kt) -- instead of API 35. Proves
  # the floor is a fact, not just a number in a build file.
  #
  # Issue #927: this is a named `release-tier` gate in .github/release-gates.json
  # ("Android E2E (emulator, minSdk 26)") -- release-gates.json previously had
  # NO row for this job, and the "Android E2E (emulator)" gate's own criterion
  # wrongly claimed API-26 coverage while android-e2e above actually runs API
  # 35, so the declared floor was never exercised pre-tag. `if:` now includes
  # push:main, mirroring migration-tests.yml's `large-dataset` job, so a real
  # release commit (the release.yml fixture-commit push for a final release,
  # or its explicit workflow_dispatch for an RC ref) genuinely runs this job
  # rather than release.yml's push:main-already-covered heuristic silently
  # skipping the one gate it was added for. This doubles the emulator cost of
  # an already-heavy suite on every main merge (was schedule/dispatch-only),
  # which is the accepted trade-off for making the floor a real gate.
  android-e2e-min-sdk:
    permissions:
      contents: read
      actions: read
    name: Android E2E (emulator, minSdk 26)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build all-in-one backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # Issue #528/#914: the compatibility backends android-e2e's step of the
      # same name starts (ForceUpdateGateE2ETest / OldServerCompatibilityE2ETest).
      - name: Start compatibility backends (issues #528, #914)
        run: |
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml up -d
          echo "Waiting for compatibility backends to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7301/health/live > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -s http://localhost:7302/health > /dev/null 2>&1; do sleep 2; done'
          echo "Compatibility backends are ready"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Issue #974: same non-retried nightly leg as android-e2e above —
      # max_attempts is 1 on the `schedule` run.
      - name: Run instrumented E2E tests (API 26)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          script: |
            adb reverse tcp:7300 tcp:7300
            adb reverse tcp:7301 tcp:7301
            adb reverse tcp:7302 tcp:7302
            max_attempts=$([ "$GITHUB_EVENT_NAME" = "schedule" ] && echo 1 || echo 2); attempt=1; while true; do if ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300; then exit 0; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "connectedDebugAndroidTest failed after $max_attempts attempts" >&2; exit 1; fi; echo "connectedDebugAndroidTest failed on attempt $attempt/$max_attempts; preserving failing results and retrying"; mkdir -p "app/build/flaky-attempt-$attempt"; cp app/build/outputs/androidTest-results/connected/*.xml "app/build/flaky-attempt-$attempt/" 2>/dev/null || true; attempt=$((attempt + 1)); done

      - name: Upload E2E results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-e2e-min-sdk-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/flaky-attempt-*/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml down -v

  # COMPAT-02 (issue #473 action 4 / the milestone's "unsupported
  # environments fail clearly" criterion): a device one API level BELOW
  # minSdk 26 must refuse the install outright, not run a broken app. This
  # is standard Android PackageManager behavior (INSTALL_FAILED_OLDER_SDK)
  # -- the assertion is that this project's minSdk declaration actually
  # reaches the merged manifest and takes effect, not that Android itself
  # works.
  android-below-min-sdk:
    permissions:
      contents: read
    name: Android below minSdk fails clearly (API 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assert install fails clearly on an API 24 device (below minSdk 26)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          # The action runs each physical line of an inline `script:` in its own
          # shell, so the multi-line assertion (shared `$apk`, `set +e`) has to
          # live in a real script file -- see its header. Bounded retry (issue
          # #1177): the assertion is deterministic, but booting the API 24
          # emulator can flake under load; 1 attempt on `schedule` per #974.
          script: max_attempts=$([ "$GITHUB_EVENT_NAME" = "schedule" ] && echo 1 || echo 2); attempt=1; while true; do if bash "$GITHUB_WORKSPACE/.github/scripts/assert-below-min-sdk-install.sh"; then exit 0; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "below-minSdk assertion failed after $max_attempts attempts" >&2; exit 1; fi; echo "below-minSdk assertion failed on attempt $attempt/$max_attempts; retrying" >&2; attempt=$((attempt + 1)); done

  # Issue #263: startup + dashboard-render macrobenchmark. Same emulator + same
  # docker-compose.test.yml backend as android-e2e, and the same triggers
  # (nightly / dispatch / path-gated push:main — never on a PR). Deliberately
  # NON-GATING: `continue-on-error` keeps a red result from blocking the
  # workflow, and the benchmark asserts no timing threshold — emulator numbers
  # are noisy, so this is a trend signal + a local dev tool, not a budget (that
  # is a separate follow-up). The trace/JSON is published as a run artifact.
  android-macrobenchmark:
    permissions:
      contents: read
      actions: read
    name: Android macrobenchmark (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    needs: changes
    # Skipped when the release composer calls this workflow (release_compose:
    # true): the benchmark is non-gating and would only add a fourth emulator
    # to a contended release run (issue #1174). It still runs on its own
    # schedule / dispatch / path-gated push:main.
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || (github.event_name == 'push' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'))) && !inputs.release_compose }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Reuses the scope=combined build cache the android-e2e / web E2E jobs
      # populate, so this is normally a near-instant cache hit.
      - name: Build all-in-one backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `connectedCheck` builds+installs the app's `benchmark` variant (see
      # app/build.gradle.kts) and runs StartupBenchmark + DashboardRenderBenchmark.
      # The emulator-not-a-valid-perf-device guard is suppressed in
      # macrobenchmark/build.gradle.kts (defaultConfig.testInstrumentationRunnerArguments) —
      # an emulator's numbers are still a useful relative trend and this job
      # never gates on them. The dashboard scenario reads the backend via
      # adb-reversed 127.0.0.1:7300.
      - name: Run macrobenchmark
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          script: |
            adb reverse tcp:7300 tcp:7300
            max_attempts=$([ "$GITHUB_EVENT_NAME" = "schedule" ] && echo 1 || echo 2); attempt=1; while true; do if ./gradlew :macrobenchmark:connectedCheck -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300; then exit 0; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "macrobenchmark failed after $max_attempts attempts" >&2; exit 1; fi; echo "macrobenchmark failed on attempt $attempt/$max_attempts; retrying" >&2; attempt=$((attempt + 1)); done

      - name: Upload macrobenchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-macrobenchmark-results
          path: |
            android/macrobenchmark/build/outputs/
            android/macrobenchmark/build/reports/
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml down -v
