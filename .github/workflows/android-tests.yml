name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # Issue #578, B5: the instrumented E2E job (android-e2e) moved OFF the PR
  # path onto push:main + nightly + on demand; `test` (Robolectric + detekt
  # + lint) is the fast PR gate. See android-e2e's header for the trade-off.
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly
  workflow_dispatch:
  workflow_call:
    inputs:
      release_compose:
        description: 'True when called by the release composer (release-validate.yml): skip non-gating advisory jobs to reduce runner contention (issue #1174).'
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: android-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.resolve.outputs.android }}
      backend: ${{ steps.resolve.outputs.backend }}
      openapi: ${{ steps.resolve.outputs.openapi }}
      infra: ${{ steps.resolve.outputs.infra }}
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only (see unit-tests.yml), via env for zizmor.
      # workflow_dispatch forces every area true (#543): `test` below had NO
      # event_name exemption of its own -- closed at the source here.
      - name: Resolve gating decision
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            android=true; backend=true; openapi=true; infra=true; workflows=true
          else
            android="$ANDROID_CHANGED"; backend="$BACKEND_CHANGED"; openapi="$OPENAPI_CHANGED"
            infra="$INFRA_CHANGED"; workflows="$WORKFLOWS_CHANGED"
          fi
          {
            echo "android=$android"
            echo "backend=$backend"
            echo "openapi=$openapi"
            echo "infra=$infra"
            echo "workflows=$workflows"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          ANDROID_CHANGED: ${{ steps.filter.outputs.android }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  test:
    permissions:
      contents: read
    name: Android (Gradle)
    runs-on: ubuntu-latest
    # Typical time ~26-30m; a slightly slow runner has hit a 30m cap
    # mid-assemble. 40m keeps the bound meaningful with variance headroom.
    timeout-minutes: 40
    needs: changes
    # Issue #974: was the one job here with no schedule exemption -- without
    # it the test-retry plugin's maxRetries=0-on-schedule tier would never
    # fire on a normal night (paths-filter is usually false with no
    # android/** change).
    if: github.event_name == 'schedule' || needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # core/data/schemas/*.json are KSP-generated but committed -- the
      # "before" databases a MigrationTestHelper test builds from, so a
      # stale dump describes a schema the compiled AppDatabase rejects
      # (I18N-02/#485 shipped exactly that: 18.json was v17's dump copied
      # verbatim). --rerun forces the export to run since a plain build
      # leaves a stale file untouched; the diff must then be empty.
      - name: Room schema dumps are current
        working-directory: android
        run: |
          ./gradlew :core:data:kspDebugKotlin --rerun
          # --porcelain also catches an uncommitted *new* dump, not just edits.
          if [ -n "$(git status --porcelain -- core/data/schemas)" ]; then
            git status --porcelain -- core/data/schemas
            git diff -- core/data/schemas
            echo "::error::Room schema dumps are stale; run './gradlew :core:data:kspDebugKotlin --rerun' in android/ and commit the diff."
            exit 1
          fi

      # Issue #1133: `testDebugUnitTest` only matches unflavored library
      # modules now; :app's tests are flavor-qualified. Run `obtainium`
      # (coverage/release) + `foss` (must compile its FCM-free Hilt graph).
      # `play` is source-identical to `obtainium` and exercised by the
      # APK-build workflow instead.
      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest :app:testObtainiumDebugUnitTest :app:testFossDebugUnitTest

      # Issue #268: the test-retry plugin reruns a failed Robolectric test
      # once; Gradle retains the failed attempt in the XML even when the
      # retry passed, so a SUCCEEDED task with a remaining <failure>/<error>
      # marks a flake.
      - name: Detect flaky unit tests (failed once, passed on retry)
        if: success()
        working-directory: android
        run: |
          flaky=$(grep -rlE '<failure|<error' --include='TEST-*.xml' . | grep '/build/test-results/' || true)
          if [ -n "$flaky" ]; then
            echo "::warning::Flaky tests detected (passed only on retry):"
            echo "$flaky"
          else
            echo "No flaky tests this run."
          fi

      # Issue #251: project-wide coverage stays informational; the hard
      # gate is codecov/patch (#267). Runs the *aggregated* report (#342) --
      # Codecov mis-merged the 22 per-module XMLs and reported most
      # `feature/*` modules at 0% despite local reports showing ~70%.
      - name: Coverage report (JaCoCo, aggregated)
        working-directory: android
        run: ./gradlew jacocoTestReportAggregated

      # Issue #294: informational only, see unit-tests.yml's backend job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: android/build/reports/jacoco/jacocoTestReportAggregated/jacocoTestReportAggregated.xml
          flags: android
          fail_ci_if_error: false

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug :app:lintObtainiumDebug :app:lintFossDebug

      # Issue #358: detekt, the Kotlin correctness/smell analyzer
      # complementing CodeQL + mobsfscan + Android Lint (shared config:
      # android/config/detekt/detekt.yml, style rules disabled). Requires
      # JDK 17: detekt 1.23.x's JVM-version parser can't handle JDK 25.
      - name: detekt
        working-directory: android
        run: ./gradlew detekt

      # Issue #1133: obtainium (gold-standard) + foss (proves the
      # Firebase-free flavor builds end to end, the F-Droid precondition).
      # Issue #1200: play too, for its restricted-permission carve-out below.
      - name: Assemble debug APKs (obtainium + foss + play)
        working-directory: android
        run: ./gradlew :app:assembleObtainiumDebug :app:assembleFossDebug :app:assemblePlayDebug

      # Issue #1133: F-Droid requires the FOSS APK carry no Firebase/GMS
      # code. obtainium is checked for the opposite, so this can't pass by
      # FCM having been dropped from the project entirely.
      - name: FOSS APK is Firebase-free; obtainium APK keeps FCM
        working-directory: android
        run: |
          count_gms() {
            local apk="$1"
            for d in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
              unzip -p "$apk" "$d"
            done | strings | grep -icE 'com/google/firebase|com/google/android/gms' || true
          }
          foss="app/build/outputs/apk/foss/debug/app-foss-debug.apk"
          obtainium="app/build/outputs/apk/obtainium/debug/app-obtainium-debug.apk"
          foss_hits="$(count_gms "$foss")"
          obtainium_hits="$(count_gms "$obtainium")"
          echo "foss Firebase/GMS references: $foss_hits (must be 0)"
          echo "obtainium Firebase/GMS references: $obtainium_hits (must be > 0)"
          if [ "$foss_hits" -ne 0 ]; then
            echo "::error::$foss contains $foss_hits Firebase/GMS references; F-Droid forbids them."
            exit 1
          fi
          if [ "$obtainium_hits" -eq 0 ]; then
            echo "::error::$obtainium carries no Firebase/GMS reference -- FCM was dropped from the obtainium/play flavors."
            exit 1
          fi

      # Issue #1200: play must not request permissions Google Play
      # restricts to default dialer/SMS apps; obtainium must still declare
      # them, so the shipping build can't silently lose the capture feature.
      - name: Play APK omits restricted call/SMS permissions
        working-directory: android
        run: |
          aapt2="$(find "${ANDROID_HOME}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -1)"
          if [ -z "$aapt2" ]; then
            echo "::error::aapt2 not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          perms() {
            "$aapt2" dump badging "$1" \
              | grep -oE "uses-permission: name='[^']+'" \
              | sed "s/.*name='//;s/'//" | sort -u
          }
          play="app/build/outputs/apk/play/debug/app-play-debug.apk"
          obtainium="app/build/outputs/apk/obtainium/debug/app-obtainium-debug.apk"
          restricted="android.permission.READ_CALL_LOG android.permission.READ_PHONE_STATE android.permission.RECEIVE_SMS android.permission.READ_SMS"
          echo "play permissions:"; perms "$play"
          for p in $restricted; do
            if perms "$play" | grep -qx "$p"; then
              echo "::error::play APK requests restricted permission $p; Play restricts it to default dialer/SMS apps."
              exit 1
            fi
            if ! perms "$obtainium" | grep -qx "$p"; then
              echo "::error::obtainium APK lost $p -- the call/SMS capture feature must stay in the shipping build."
              exit 1
            fi
          done
          echo "OK: play omits the restricted permissions; obtainium keeps them."

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-coverage
          path: android/build/reports/jacoco/jacocoTestReportAggregated/
          retention-days: 7

      # Issue #268: JUnit XML consumed by test-report.yml.
      - name: Upload unit test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unit-test-results
          path: |
            android/**/build/test-results/test*UnitTest/TEST-*.xml
            android/**/build/reports/tests/
          retention-days: 7

  # Issue #238: instrumented E2E (app/src/androidTest) -- the real app
  # against the real docker-compose.test.yml backend on an emulator, the
  # Android equivalent of the web Playwright suite. Runbook:
  # README-developer.md -> "Android E2E".
  #
  # Issue #578, B5: deliberately NOT on pull_request -- it replaced the
  # manual on-device Pixel 8a gate but was the heaviest PR check (~60min).
  # Moved to push:main + nightly so a PR is gated by Robolectric only
  # (`test`, fast); the emulator signal lands post-merge and nightly.
  android-e2e:
    permissions:
      contents: read
      actions: read
    name: Android E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    # Unconditional on schedule/dispatch; path-gated on push:main (android/**,
    # the openapi contract, infra). Pure backend/** changes don't re-run the
    # emulator suite (covered by unit-tests.yml's Go checks); pull_request
    # matches no branch here, so a PR never triggers it.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || (github.event_name == 'push' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Creates the docker-container buildx builder the cache export below
      # needs (the default docker driver can't write `type=gha` caches).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same image the web E2E suite builds.
      - name: Build all-in-one backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # Issue #528: a second backend (7301) with MIN_CLIENT_VERSION above the
      # debug APK's versionName -- only ForceUpdateGateE2ETest uses it.
      # Issue #914: a third (7302), pinned to the real v1.0.0 release image
      # (this app's real migration floor since 1.0, #1170) --
      # OldServerCompatibilityE2ETest uses it; ServerTooOldGateE2ETest stubs
      # its own response and needs no real container.
      - name: Start compatibility backends (issues #528, #914)
        run: |
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml up -d
          echo "Waiting for compatibility backends to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7301/health/live > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -s http://localhost:7302/health > /dev/null 2>&1; do sleep 2; done'
          curl -s http://localhost:7301/health
          echo ""
          curl -s http://localhost:7302/health
          echo ""
          echo "Compatibility backends are ready"

      # Hardware acceleration required by android-emulator-runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # adb reverse tunnels the device's 127.0.0.1:7300 to the host loopback
      # (the Pixel 8a runbook's exact path), immune to emulator NAT quirks.
      #
      # Issue #268: retried once on failure -- AGP's connected tasks have no
      # test-retry-plugin equivalent, so this job does it manually. Two
      # attempts, each a FRESH emulator boot: a retry inside `script` reuses
      # the same booted emulator, which doesn't recover once ANR'ing (proven
      # by the DAVx5 leg). Attempt 1 is continue-on-error except on
      # `schedule` (#974: nightly must hard-fail, not stay green behind a
      # retry); attempt 2 runs only when attempt 1 failed and not scheduled.
      # Attempt 1's JUnit XML is preserved under app/build/flaky-attempt-1/
      # as the flake signal.
      - name: Run instrumented E2E tests
        id: android-e2e-attempt-1
        continue-on-error: ${{ github.event_name != 'schedule' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          # :app-scoped and flavor-qualified (#1133): a bare
          # `connectedDebugAndroidTest` would expand to every module,
          # including libraries whose connected tasks fail with no tests.
          script: |
            adb reverse tcp:7300 tcp:7300
            adb reverse tcp:7301 tcp:7301
            adb reverse tcp:7302 tcp:7302
            ./gradlew :app:connectedObtainiumDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      - name: Preserve attempt-1 instrumented results (flake triage)
        if: steps.android-e2e-attempt-1.outcome == 'failure'
        working-directory: android
        run: |
          mkdir -p app/build/flaky-attempt-1
          cp app/build/outputs/androidTest-results/connected/*.xml app/build/flaky-attempt-1/ 2>/dev/null || true

      - name: Run instrumented E2E tests (retry, fresh emulator)
        id: android-e2e-attempt-2
        if: ${{ steps.android-e2e-attempt-1.outcome == 'failure' && github.event_name != 'schedule' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          script: |
            adb reverse tcp:7300 tcp:7300
            adb reverse tcp:7301 tcp:7301
            adb reverse tcp:7302 tcp:7302
            ./gradlew :app:connectedObtainiumDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      # Issue #268: if the suite passed only after a retry, the preserved
      # flaky-attempt-* XMLs are the flake signal.
      - name: Report instrumented flakes (passed only on retry)
        if: success()
        working-directory: android
        run: |
          if ls app/build/flaky-attempt-*/ >/dev/null 2>&1; then
            echo "::warning::Instrumented suite passed only after retry. Preserved failing attempt(s):"
            ls -d app/build/flaky-attempt-*/
          else
            echo "No instrumented retries this run."
          fi

      - name: Upload E2E results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-e2e-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/flaky-attempt-*/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml down -v

  # COMPAT-02 (#473): the same instrumented E2E suite as android-e2e above,
  # but at API 26 -- the declared minSdk floor -- instead of API 35, proving
  # the floor is a fact, not just a build-file number.
  #
  # Issue #927: a named release-tier gate (release-gates.json had no row for
  # this job, and android-e2e's own criterion wrongly claimed API-26
  # coverage while actually running API 35, so the floor was never
  # exercised pre-tag). `if:` includes push:main so a real release commit
  # genuinely runs this job, doubling emulator cost on every main merge --
  # the accepted trade-off for making the floor a real gate.
  android-e2e-min-sdk:
    permissions:
      contents: read
      actions: read
    name: Android E2E (emulator, minSdk 26)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all-in-one backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # Issue #528/#914: same as android-e2e's step of the same name.
      - name: Start compatibility backends (issues #528, #914)
        run: |
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml up -d
          echo "Waiting for compatibility backends to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7301/health/live > /dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -s http://localhost:7302/health > /dev/null 2>&1; do sleep 2; done'
          echo "Compatibility backends are ready"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Two attempts, each a FRESH emulator boot (see android-e2e above).
      # Attempt 1 is continue-on-error except on `schedule` (#974); attempt 2
      # runs only when attempt 1 failed and we are not on `schedule`.
      - name: Run instrumented E2E tests (API 26)
        id: android-e2e-min-sdk-attempt-1
        continue-on-error: ${{ github.event_name != 'schedule' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          script: |
            adb reverse tcp:7300 tcp:7300
            adb reverse tcp:7301 tcp:7301
            adb reverse tcp:7302 tcp:7302
            ./gradlew :app:connectedObtainiumDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      - name: Preserve attempt-1 instrumented results (API 26, flake triage)
        if: steps.android-e2e-min-sdk-attempt-1.outcome == 'failure'
        working-directory: android
        run: |
          mkdir -p app/build/flaky-attempt-1
          cp app/build/outputs/androidTest-results/connected/*.xml app/build/flaky-attempt-1/ 2>/dev/null || true

      - name: Run instrumented E2E tests (API 26, retry, fresh emulator)
        id: android-e2e-min-sdk-attempt-2
        if: ${{ steps.android-e2e-min-sdk-attempt-1.outcome == 'failure' && github.event_name != 'schedule' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          script: |
            adb reverse tcp:7300 tcp:7300
            adb reverse tcp:7301 tcp:7301
            adb reverse tcp:7302 tcp:7302
            ./gradlew :app:connectedObtainiumDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      - name: Upload E2E results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-e2e-min-sdk-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/flaky-attempt-*/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml down -v

  # COMPAT-02 (#473 action 4): a device one API level BELOW minSdk 26 must
  # refuse the install outright (standard PackageManager
  # INSTALL_FAILED_OLDER_SDK) -- asserts the minSdk declaration actually
  # reaches the merged manifest, not that Android itself works.
  android-below-min-sdk:
    permissions:
      contents: read
    name: Android below minSdk fails clearly (API 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleObtainiumDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assert install fails clearly on an API 24 device (below minSdk 26)
        id: below-minsdk-attempt-1
        continue-on-error: ${{ github.event_name != 'schedule' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          # Two attempts, fresh emulator each (#1177): booting API 24 can
          # flake under load even though the assertion is deterministic.
          # The action runs each script line in its own shell, so the
          # multi-line assertion lives in a real script file instead.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/assert-below-min-sdk-install.sh"

      - name: Assert install fails clearly on an API 24 device (retry, fresh emulator)
        id: below-minsdk-attempt-2
        if: ${{ steps.below-minsdk-attempt-1.outcome == 'failure' && github.event_name != 'schedule' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/assert-below-min-sdk-install.sh"

  # Issue #263: startup + dashboard-render macrobenchmark, same
  # emulator/backend/triggers as android-e2e. Deliberately NON-GATING
  # (continue-on-error, no timing threshold asserted) -- emulator numbers
  # are noisy, so this is a trend signal + local dev tool, not a budget.
  android-macrobenchmark:
    permissions:
      contents: read
      actions: read
    name: Android macrobenchmark (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    needs: changes
    # Skipped when the release composer calls this workflow: non-gating and
    # would only add a fourth emulator to a contended release run (#1174).
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || (github.event_name == 'push' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'))) && !inputs.release_compose }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reuses the scope=combined cache android-e2e/web E2E populate.
      - name: Build all-in-one backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"


      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `connectedCheck` builds the `benchmark` variant and runs
      # StartupBenchmark + DashboardRenderBenchmark; the
      # emulator-not-a-valid-perf-device guard is suppressed in
      # macrobenchmark/build.gradle.kts since this job never gates on the
      # numbers. Two attempts, fresh emulator each (#1177); advisory, so
      # the retry just improves the trend signal.
      - name: Run macrobenchmark
        id: macrobenchmark-attempt-1
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          script: |
            adb reverse tcp:7300 tcp:7300
            ./gradlew :macrobenchmark:connectedCheck -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      - name: Run macrobenchmark (retry, fresh emulator)
        id: macrobenchmark-attempt-2
        if: ${{ steps.macrobenchmark-attempt-1.outcome == 'failure' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          disable-animations: true
          script: |
            adb reverse tcp:7300 tcp:7300
            ./gradlew :macrobenchmark:connectedCheck -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      - name: Upload macrobenchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-macrobenchmark-results
          path: |
            android/macrobenchmark/build/outputs/
            android/macrobenchmark/build/reports/
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose -p mycorrhizal-compat -f docker-compose.compat-test.yml down -v
