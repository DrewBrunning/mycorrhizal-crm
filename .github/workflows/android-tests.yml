name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      - name: Report gating decision
        run: |
          echo "android=${{ steps.filter.outputs.android }}"
          echo "backend=${{ steps.filter.outputs.backend }}"
          echo "openapi=${{ steps.filter.outputs.openapi }}"
          echo "infra=${{ steps.filter.outputs.infra }}"
          echo "workflows=${{ steps.filter.outputs.workflows }}"

  test:
    permissions:
      contents: read
    name: Android (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest

      # Issue #251: visibility only, no threshold/gate. Runs `jacocoTestReport`
      # in every module (bare task name, same pattern as testDebugUnitTest
      # above) off the exec data the step above just produced.
      - name: Coverage report (Jacoco)
        working-directory: android
        run: ./gradlew jacocoTestReport

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: android/**/build/reports/jacoco/jacocoTestReport/
          retention-days: 7

  # Issue #238: instrumented E2E tests (app/src/androidTest) — the real app
  # driven against the real docker-compose.test.yml backend on an emulator.
  # The web Playwright suite cannot drive Android; this is its Android
  # equivalent. Local runbook: README-developer.md → "Android E2E".
  android-e2e:
    permissions:
      contents: read
      actions: read
    name: Android E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    # Builds the all-in-one image + starts docker-compose.test.yml (infra),
    # so it re-runs when those change, plus android/** and the openapi
    # contract the app consumes. Pure backend/** changes are covered by the
    # Go checks in unit-tests.yml and don't re-run the emulator suite.
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Creates the docker-container buildx builder the cache export below
      # needs (the default docker driver cannot write `type=gha` caches) —
      # same setup the web E2E workflow uses.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The same all-in-one image the web E2E suite builds (nginx + backend
      # under supervisord, same-origin /api, registration enabled, fresh DB).
      - name: Build all-in-one backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Frontend + same-origin /api on 7300; the emulator reaches it via
          # 10.0.2.2 (or adb reverse 127.0.0.1 — the tests pass the serverUrl
          # below so the transport doesn't matter).
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # Hardware acceleration for the emulator (required by android-emulator-runner).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # adb reverse tunnels the device's 127.0.0.1:7300 to the host's loopback
      # — the exact path the Pixel 8a runbook uses — so the suite is immune to
      # emulator NAT quirks (10.0.2.2 varies by image/API level).
      - name: Run instrumented E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          # Script lines run as individual sh -c commands, so no backslash
          # line continuations — one command per line. :app-scoped: a bare
          # `connectedDebugAndroidTest` would expand to every module, including
          # libraries with no instrumented tests whose connected tasks fail.
          script: |
            adb reverse tcp:7300 tcp:7300
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
