name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Issue #578, B5: the instrumented E2E job (android-e2e) moved OFF the PR
  # path — it stays on push:main and now also sweeps every night + on demand.
  # The `test` job (Robolectric + detekt + lint + assembleDebug) remains the
  # fast PR gate. See the android-e2e job's header for the trade-off.
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      # Passed as env vars rather than inline ${{ }} so zizmor's
      # template-injection audit has nothing to flag.
      - name: Report gating decision
        run: |
          echo "android=$ANDROID_CHANGED"
          echo "backend=$BACKEND_CHANGED"
          echo "openapi=$OPENAPI_CHANGED"
          echo "infra=$INFRA_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          ANDROID_CHANGED: ${{ steps.filter.outputs.android }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  test:
    permissions:
      contents: read
    name: Android (Gradle)
    runs-on: ubuntu-latest
    # The job runs the full Robolectric suite + jacoco + lint + assembleDebug;
    # typical time is ~26-30m, and a slightly slow runner has hit the 30m cap
    # (cancelled mid-assemble). 40m keeps the bound meaningful while giving the
    # variance headroom so a flaky timeout doesn't fail the required check.
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest

      # Issue #268: the test-retry plugin (configured in build-logic) reruns a
      # failed Robolectric test once in CI. Gradle retains the failed attempt
      # in the test-results XML even when the retry passed, so when the task
      # SUCCEEDED any remaining <failure>/<error> in the XML marks a test that
      # only passed on retry — i.e. a flake. That's the signal: the required
      # check stays green, but the flake is called out here (and in the check
      # run from test-report.yml, where dorny/test-reporter will also show it).
      - name: Detect flaky unit tests (failed once, passed on retry)
        if: success()
        working-directory: android
        run: |
          flaky=$(grep -rlE '<failure|<error' --include='TEST-*.xml' . | grep '/build/test-results/' || true)
          if [ -n "$flaky" ]; then
            echo "::warning::Flaky tests detected (passed only on retry):"
            echo "$flaky"
          else
            echo "No flaky tests this run."
          fi

      # Issue #251: visibility only, no threshold/gate. Runs the *aggregated*
      # report (issue #342) — a single JaCoCo XML built from every module's
      # exec data, rather than the per-module `jacocoTestReport` tasks. Codecov
      # mis-merged the 22 per-module XMLs and reported most `feature/*` modules
      # at 0% despite the local reports showing ~70%.
      - name: Coverage report (JaCoCo, aggregated)
        working-directory: android
        run: ./gradlew jacocoTestReportAggregated

      # Issue #294: see unit-tests.yml's backend job for why
      # fail_ci_if_error is false — informational only, see codecov.yml.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: android/build/reports/jacoco/jacocoTestReportAggregated/jacocoTestReportAggregated.xml
          flags: android
          fail_ci_if_error: false

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      # Issue #358: detekt is the Kotlin correctness/smell analyzer (dead
      # code, over-broad exception handling, declaration/file mismatches) that
      # complements CodeQL + mobsfscan + Android Lint for the app. Applied to
      # every module by the build-logic convention plugins with the shared
      # config at android/config/detekt/detekt.yml (the style rules the repo
      # doesn't enforce are disabled there, so this gates regressions of the
      # high-signal set rather than a style baseline). Requires the JDK 17
      # from setup-java above: detekt 1.23.x's JVM-version parser can't handle
      # JDK 25, and the convention plugin pins its --jvm-target to 17 anyway.
      - name: detekt
        working-directory: android
        run: ./gradlew detekt

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-coverage
          path: android/build/reports/jacoco/jacocoTestReportAggregated/
          retention-days: 7

      # Issue #268: JUnit XML from the Robolectric unit tests, consumed by
      # test-report.yml (dorny/test-reporter). `if: always()` keeps the report
      # available even when the test step failed.
      - name: Upload unit test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unit-test-results
          path: |
            android/**/build/test-results/testDebugUnitTest/TEST-*.xml
            android/**/build/reports/tests/
          retention-days: 7

  # Issue #238: instrumented E2E tests (app/src/androidTest) — the real app
  # driven against the real docker-compose.test.yml backend on an emulator.
  # The web Playwright suite cannot drive Android; this is its Android
  # equivalent. Local runbook: README-developer.md → "Android E2E".
  #
  # Issue #578, B5 (tiering): this is deliberately NOT on pull_request
  # anymore. Per CLAUDE.md it replaced the manual on-device Pixel 8a gate,
  # and it was the single heaviest PR check in the repo (~60 min: emulator +
  # all-in-one image build + compose). Moving it to push:main + nightly
  # means an Android PR is gated by Robolectric only (the `test` job, fast);
  # the emulator signal lands post-merge and every night. That is the
  # intended trade-off — called out explicitly in the issue's PR notes.
  # test-report.yml reports on the workflow via workflow_run, unchanged; it
  # will simply report these (now main/nightly) results the same way.
  android-e2e:
    permissions:
      contents: read
      actions: read
    name: Android E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    # Runs on the nightly schedule and manual dispatch unconditionally; on
    # push:main it's path-gated (builds the all-in-one image + starts
    # docker-compose.test.yml (infra), plus android/** and the openapi
    # contract the app consumes). Pure backend/** changes are covered by the
    # Go checks in unit-tests.yml and don't re-run the emulator suite. The
    # pull_request event matches none of these branches, so a PR never
    # triggers it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Creates the docker-container buildx builder the cache export below
      # needs (the default docker driver cannot write `type=gha` caches) —
      # same setup the web E2E workflow uses.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The same all-in-one image the web E2E suite builds (nginx + backend
      # under supervisord, same-origin /api, registration enabled, fresh DB).
      - name: Build all-in-one backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start test backend
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Frontend + same-origin /api on 7300; the emulator reaches it via
          # 10.0.2.2 (or adb reverse 127.0.0.1 — the tests pass the serverUrl
          # below so the transport doesn't matter).
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # Hardware acceleration for the emulator (required by android-emulator-runner).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # adb reverse tunnels the device's 127.0.0.1:7300 to the host's loopback
      # — the exact path the Pixel 8a runbook uses — so the suite is immune to
      # emulator NAT quirks (10.0.2.2 varies by image/API level).
      #
      # Issue #268: the connected suite is retried once on failure (the
      # org.gradle.test-retry plugin only covers JVM `Test` tasks, not AGP's
      # connected tasks, so this is the "equivalent" for instrumented E2E).
      # When a retry is triggered the failing attempt's JUnit XML is preserved
      # under app/build/flaky-attempt-*/ (uploaded below) — if the retry then
      # passes, those files are the flake signal to triage.
      - name: Run instrumented E2E tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./android
          # Script lines run as individual sh -c commands (parseScript splits on
          # newlines), so the retry loop below is a single line — no backslash
          # line continuations. :app-scoped: a bare `connectedDebugAndroidTest`
          # would expand to every module, including libraries with no
          # instrumented tests whose connected tasks fail.
          script: |
            adb reverse tcp:7300 tcp:7300
            max_attempts=2; attempt=1; while true; do if ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://127.0.0.1:7300; then exit 0; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "connectedDebugAndroidTest failed after $max_attempts attempts" >&2; exit 1; fi; echo "connectedDebugAndroidTest failed on attempt $attempt/$max_attempts; preserving failing results and retrying"; mkdir -p "app/build/flaky-attempt-$attempt"; cp app/build/outputs/androidTest-results/connected/*.xml "app/build/flaky-attempt-$attempt/" 2>/dev/null || true; attempt=$((attempt + 1)); done

      # Issue #268: if the suite passed but only after a retry, the preserved
      # flaky-attempt-* XMLs are the flake signal (the final connected run
      # overwrote the failing attempt). Printed here for the log and uploaded
      # with the results artifact for triage.
      - name: Report instrumented flakes (passed only on retry)
        if: success()
        working-directory: android
        run: |
          if ls app/build/flaky-attempt-*/ >/dev/null 2>&1; then
            echo "::warning::Instrumented suite passed only after retry. Preserved failing attempt(s):"
            ls -d app/build/flaky-attempt-*/
          else
            echo "No instrumented retries this run."
          fi

      - name: Upload E2E results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-e2e-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/flaky-attempt-*/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
