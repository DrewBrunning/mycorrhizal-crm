name: Nightly failure alert

# Nightly is the only zero-retry CI tier here: a PR/push flake gets retried
# automatically, a scheduled run does not. It is also where mutation testing,
# large-dataset benchmarks, chaos injection, and the real-server CardDAV suite
# all live -- and until this workflow, none of the (now 30) scheduled
# workflows in this repo alerted anyone on failure. A red nightly run just
# sat there; nobody was watching the schedule tab.
#
# This event-driven path has one known gap: a `workflow_run` webhook
# delivery can be silently dropped by GitHub (observed once: a
# Reference-Client E2E nightly failure this workflow never even ran for --
# no run of this workflow anywhere referenced it, and no issue existed for
# it). nightly-failure-reconcile.yml is the backstop: it polls the Actions
# API once a day for each scheduled workflow's latest `schedule` run and
# drives the same ensure-alert.sh, so a dropped delivery self-heals within a
# day instead of alerting no one indefinitely.
#
# This workflow reacts to the completion of every scheduled workflow (listed
# below by `name:`, one entry per workflow that declares a top-level
# `schedule:` trigger -- `go run ./cmd/nightlyalertcheck`, wired into
# unit-tests.yml's docs-citations job, fails the build if this list and that
# set of names ever diverge) and, for the run that actually fired on its
# `schedule` event (never a push/PR/dispatch run of the same workflow):
#
#   - on failure/timed_out/startup_failure/cancelled: opens a `nightly-
#     failure`-labelled issue titled for that workflow, or comments on the
#     one already open for it, linking the run and naming the failed jobs;
#   - on success: comments on that workflow's open nightly-failure issue (if
#     any) and closes it -- the alarm clears itself once the workflow is
#     green again.
#
on:
  # zizmor: ignore[dangerous-triggers] workflow_run is the entire point of this
  # workflow, same rationale as test-report.yml: the job below runs only when
  # the triggering event was `schedule` (never a PR), and it executes no code
  # from the triggering run -- it only reads the Actions API for that run's
  # own id/conclusion/jobs (already computed by GitHub, not
  # attacker-controlled) and writes an issue/comment through `gh api`. The
  # checkout below fetches this workflow's own ensure-alert.sh, not anything
  # from the triggering run: a `workflow_run`-triggered job's default
  # checkout resolves to the ref this workflow file itself lives on (the
  # repository's default branch), never the triggering run's head_sha, so
  # this is still main-branch-authored script content, same trust boundary
  # as the inline bash it replaced. No PR-controlled code ever executes in
  # this workflow's context.
  workflow_run:
    workflows:
      - Android Tests
      - ASVS attestation staleness
      - CardDAV Real-Server E2E (reference-server matrix)
      - Chaos Tests (failure injection)
      - CodeQL
      - Container Hardening (CIS)
      - Clean-install Smoke Test
      - Differential E2E (calcard)
      - Docker image build (cache-busted)
      - E2E Tests
      - Flake ledger
      - Mutation Testing (Go)
      - Soak Test
      - Governance drift
      - Vulnerability Scan (Grype)
      - License Compliance
      - Migration Tests
      - Minimum Version Tests
      - Pentest harness drift
      - Reference-Client E2E (vdirsyncer + DAVx5 against our server)
      - Release dry-run rehearsal
      - Reproducible builds
      - SAST (mobsfscan + hadolint + semgrep)
      - Schemathesis API fuzzing
      - OpenSSF Scorecard
      - Security stewardship cadence
      - Mutation Testing (Stryker)
      - Secret Scan (TruffleHog)
      - Unit Tests
      - DAST (OWASP ZAP)
      - GitHub Actions Security (zizmor)
      - Nightly failure alert reconciliation
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    name: Alert on nightly failure/recovery
    runs-on: ubuntu-latest
    # Only react to the run that actually fired on its own schedule -- the
    # same workflow's push/pull_request/workflow_dispatch runs are not the
    # zero-retry tier this workflow exists to watch, and would otherwise
    # double-report every red PR check here too.
    if: github.event.workflow_run.event == 'schedule'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The open/comment/close logic lives in ensure-alert.sh, shared with
      # nightly-failure-reconcile.yml's polling sweep (issue: a
      # Reference-Client E2E nightly failure never raised an alert here
      # because its `workflow_run` delivery was silently dropped -- the
      # reconciler is the backstop, and it drives this exact same script so
      # the two paths can never answer "should this open/close an issue"
      # differently).
      - name: Open/update or close the nightly-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Every field below comes from the workflow_run event, which for a
          # `schedule` run (the only event this job's `if:` admits) describes
          # a run of a workflow file already committed to the default branch
          # -- there is no PR-controlled content here. Still routed through
          # env, never inlined into a script, per this repo's zizmor
          # convention for any event-derived value.
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: .github/scripts/nightly-alert/ensure-alert.sh
