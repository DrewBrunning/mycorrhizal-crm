name: Agent evaluation (dispatch only)

# Issue #1959: a dispatch-only harness that runs one representative task per
# suite in a disposable worktree and scores it against the same Suite commands
# the skills, CI and the eval harness share. The select mode runs the versioned
# trigger prompts and scores which SKILL.md the agent opens (issue #2030).
#
# This workflow is deliberately NOT a merge gate, a release gate, or part of
# the release battery. Never add a pull_request/pull_request_target trigger:
# the agent executes code and receives a model credential. If a schedule: is
# ever added, it must run the trusted main tree only and be registered in
# cmd/nightlyalertcheck.
#
# DeepSeek bills 01:00-04:00 and 06:00-10:00 UTC Monday-Friday at the peak
# rate; all weekend is off-peak at half price. A dispatch that would run into
# a peak window stops before the agent is invoked unless allow_peak is set.
on:
  workflow_dispatch:
    inputs:
      allow_peak:
        description: Accept possible DeepSeek peak billing (the run may extend into a peak window)
        type: boolean
        required: false
        default: false
      mode:
        description: task (produce a change) or select (score skill routing)
        type: choice
        required: true
        default: task
        options:
          - task
          - select
      task:
        description: Eval task name (task mode)
        type: choice
        required: false
        default: database-migration
        options:
          - database-migration
          - contact-data-fidelity
          - relationship-semantics-change
          - api-contract-change
          - security-sensitive-change
          - release-readiness
          - localization-change
          - dependency-update-review
          - documentation-maintenance
          - performance-investigation
          - add-quality-gate
          - database-migration-refuse
          - api-contract-change-refuse
      profile:
        description: Pinned agent profile from testdata/agent-eval/agents.yaml (task or select mode, preferred)
      skill:
        description: Only run prompts expecting this skill (select mode; for sharding)
        type: string
        required: false
        default: ""
      agent_command:
        description: 'Pinned agent command template ({prompt} is substituted). Keep the version pinned. Required in select mode unless profile is set; ignored when profile is set.'
        type: string
        required: true
        default: "true"
      agent_name:
        description: Agent name recorded in the artifact
        type: string
        required: true
        default: dry-run
      agent_model:
        description: Model id recorded in the artifact
        type: string
        required: true
        default: none
      agent_version:
        description: Agent CLI version recorded in the artifact (pin it)
        type: string
        required: true
        default: "0"
      base_ref:
        description: Commit SHA to evaluate (defaults to the dispatch commit)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: agent-eval-${{ inputs.mode }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Agent eval (${{ inputs.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The harness is advisory by design: a red eval is data, never a merge or
    # release blocker.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The task spec's base_ref is a commit SHA; a shallow checkout would
          # not contain it.
          fetch-depth: 0
          persist-credentials: false

      # A dry-run profile costs nothing, so the window guard only applies to a
      # real agent configuration.
      - name: Enforce DeepSeek off-peak billing window
        id: offpeak
        if: ${{ inputs.profile != '' || inputs.agent_name != 'dry-run' || inputs.agent_command != 'true' }}
        env:
          ALLOW_PEAK: ${{ inputs.allow_peak }}
        run: |
          set -euo pipefail
          args=(--margin-minutes 90)
          if [ "$ALLOW_PEAK" = "true" ]; then
            args+=(--allow-peak)
          fi
          bash .github/scripts/deepseek-offpeak.sh "${args[@]}"

      # The job is continue-on-error, so a guard refusal would otherwise look
      # like a completed run with no artifact. Make the refusal explicit.
      - name: Report a refused eval
        if: ${{ always() && steps.offpeak.outcome == 'failure' }}
        run: |
          set -euo pipefail
          echo "::error::Agent eval did not run: the DeepSeek off-peak guard refused this dispatch."
          {
            echo "## Agent eval refused (off-peak guard)"
            echo
            echo "No agent was invoked and no model tokens were spent. The dispatch would have started or run into DeepSeek peak billing hours (01:00-04:00 or 06:00-10:00 UTC, Mon-Fri)."
            echo
            echo "Re-dispatch off-peak, or set \`allow_peak: true\` to accept possible peak-rate billing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Set up Java
        # The api-contract suites run the Android contract-fixture test.
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run eval (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
          TASK: ${{ inputs.task }}
          PROFILE: ${{ inputs.profile }}
          SKILL: ${{ inputs.skill }}
          AGENT_COMMAND: ${{ inputs.agent_command }}
          AGENT_NAME: ${{ inputs.agent_name }}
          AGENT_MODEL: ${{ inputs.agent_model }}
          AGENT_VERSION: ${{ inputs.agent_version }}
          BASE_REF: ${{ inputs.base_ref }}
          # Only the model credential is exposed to the agent subprocess; the
          # workflow token is read-only and no unrelated repo secrets are set.
          AGENT_EVAL_MODEL_KEY: ${{ secrets.AGENT_EVAL_MODEL_KEY }}
        run: |
          set -euo pipefail
          args=(-mode "$MODE")
          if [ "$MODE" = "select" ]; then
            if [ -n "$PROFILE" ]; then
              args+=(-profile "$PROFILE")
            else
              args+=(-agent-command "$AGENT_COMMAND" -agent-name "$AGENT_NAME" -agent-model "$AGENT_MODEL" -agent-version "$AGENT_VERSION")
            fi
            args+=(-triggers testdata/agent-eval/triggers.yaml)
            if [ -n "$SKILL" ]; then
              args+=(-skill "$SKILL")
            fi
          elif [ -n "$PROFILE" ]; then
            args+=(-task "$TASK" -profile "$PROFILE")
          else
            args+=(-task "$TASK" -agent-command "$AGENT_COMMAND" -agent-name "$AGENT_NAME" -agent-model "$AGENT_MODEL" -agent-version "$AGENT_VERSION")
          fi
          if [ -n "$BASE_REF" ]; then
            args+=(-base-ref "$BASE_REF")
          fi
          (
            cd backend
            go run ./cmd/agenteval "${args[@]}"
          )

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-${{ inputs.mode }}-${{ inputs.mode == 'task' && inputs.task || inputs.skill || 'all' }}
          path: agent-eval-results/
          retention-days: 14
          if-no-files-found: warn
