name: Test Report

# Issue #268: surfaces the JUnit XML emitted by the Go, vitest, and Android
# suites as GitHub Check Runs with code annotations on the PR.
#
# This runs as a *separate* workflow triggered by `workflow_run` instead of
# running dorny/test-reporter inside the test workflows. dorny/test-reporter
# needs `checks: write`, which `pull_request` workflows cannot get for fork
# PRs (the GITHUB_TOKEN is read-only there); `workflow_run` runs in the
# context of the default branch with write access even when the triggering
# workflow came from a fork. dorny/test-reporter v3 resolves the PR head SHA
# from the workflow_run payload (see its getCheckRunContext), so annotations
# land on the contributor's changes.
#
# Each suite job uploads its JUnit XML (+ flake reports) as a named artifact;
# each report step below fetches its own artifact directly (dorny/test-
# reporter's `artifact:` input, not a separate download step) and creates one
# check run per suite. The suite jobs themselves remain the required checks
# (issue #264) — these report runs are informational, so `fail-on-error`
# (default true) failing here on a test failure does not gate merge.
#
# Deliberately no `actions/checkout` here. This workflow runs with an
# elevated `checks: write` token even for fork PRs (that's the whole reason
# it's split out via `workflow_run`), and checking out an untrusted PR head
# SHA in that context is the "pwn request" antipattern GitHub's Scorecard
# flags under Dangerous-Workflow — see
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/.
# dorny/test-reporter's `artifact:` input avoids needing a checkout at all:
# it downloads the artifact itself via the Checks/Actions API (octokit) and
# resolves annotation file paths from the API's tracked-file listing at the
# triggering SHA, rather than shelling out to `git ls-files` against a local
# checkout. (An earlier version of this workflow paired manual
# dawidd6/action-download-artifact steps with dorny's `path:` input, which
# for annotations falls back to `git ls-files` and fails outright with no
# checkout present — fixed by switching to `artifact:` instead of adding a
# checkout.)

on:
  workflow_run:
    workflows: [Unit Tests, Android Tests]
    types: [completed]

permissions:
  # Least-privilege at the workflow level; the write grant this job needs
  # (checks: write for dorny/test-reporter's Check Runs, actions: read to
  # download the test-result artifacts) is scoped on the job instead, so the
  # default token is read-only everywhere else.
  contents: read

jobs:
  report:
    name: Test Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      # Each step creates its own check run (`name`). `use-actions-summary:
      # false` makes dorny create a Check Run with annotations (its default
      # true writes only a job summary, which annotations cannot attach to
      # the diff). `fail-on-empty: false` keeps a report step green when its
      # suite was path-gated out (issue #264) and uploaded no artifact —
      # dorny's own artifact lookup warns and no-ops rather than failing the
      # step.
      #
      # `path:` is matched against paths *inside* the artifact zip, not the
      # local filesystem — actions/upload-artifact strips each artifact's
      # longest common ancestor directory, so these are relative to that,
      # not to the repo root.
      #
      # Note: the gradle test-retry plugin and gotestsum retain a failed
      # attempt in the JUnit XML even when the test passed on retry, so a
      # flaky test shows up as a failure in these reports while the required
      # check is green — exactly the flake-vs-regression distinction issue
      # #268 is after. The suite jobs also print/upload their own flake
      # reports for triage.
      - name: Backend test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          artifact: backend-junit-results
          name: Backend Test Report
          path: junit.xml
          reporter: java-junit
          use-actions-summary: false
          fail-on-empty: false

      - name: Frontend test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          artifact: frontend-junit-results
          name: Frontend Test Report
          path: junit.xml
          reporter: jest-junit
          use-actions-summary: false
          fail-on-empty: false

      - name: Android unit test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          artifact: android-unit-test-results
          name: Android Unit Test Report
          path: '**/TEST-*.xml'
          reporter: java-junit
          use-actions-summary: false
          fail-on-empty: false

      # Scoped to the final connected-run XMLs: a retried attempt's failing
      # XML is preserved under app/build/flaky-attempt-*/ (uploaded with this
      # artifact for triage) and would otherwise double-count as failures.
      - name: Android instrumented E2E report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          artifact: android-e2e-results
          name: Android E2E Test Report
          path: '**/androidTest-results/**/*.xml'
          reporter: java-junit
          use-actions-summary: false
          fail-on-empty: false
