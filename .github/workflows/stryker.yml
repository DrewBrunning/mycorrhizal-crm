name: Mutation Testing (Stryker)

# Issue #578: mutation testing measures whether the test suite would notice a
# planted bug — a mutant that survives means a behavior the tests don't pin.
# Complementary to coverage (a line can be covered without any assertion
# noticing it changed).
#
# Tier 3 (nightly) + manual dispatch only — deliberately NOT on PR or push:
# mutation testing is O(test suite × mutant count), too slow to gate every
# diff. The scope (stryker.conf.json's `mutate`) is every src/api/*.ts module,
# every src/hooks/use*.ts hook (issue #1482; it was 6 files) and every
# src/utils/*.ts pure helper (issue #1624 §3) — not the whole tree — and the
# vitest-runner's `related` mode narrows each mutant to the tests that touch
# it.
#
# Parallel legs (issues #1571, #1624, #2857). The scope is ~12.4k mutants on
# the 4-vCPU ubuntu-latest runner, where a leg's wall clock is dominated by
# per-mutant test startup, not by CPU. The first split (#1571) cut one 180-min
# job into api/hooks/utils legs at 240 minutes; by 2026-11-21 that was no
# longer enough: the hooks leg reached only 2795/3709 mutants in 3h49m
# (~12 mutants/min, ~5h projected) and the 240-minute timeout cancelled it,
# while the api leg did 5630 mutants in 165 minutes (~34/min) the same night.
# Per-leg rates are noisy (hooks measured ~19/min on 2026-11-19), so the fix
# is more, smaller legs rather than a bigger timeout alone:
#
#   leg      glob                        mutants  score
#   api-a    src/api/[a-eA-E]*.ts         2838   86.56%
#   api-b    src/api/[^a-eA-E]*.ts        2827   90.27%
#   hooks-a  src/hooks/use[a-gA-G]*.ts    1949   96.39%
#   hooks-b  src/hooks/use[^a-gA-G]*.ts   1852   96.86%
#   utils    src/utils/*.ts               2923   80.44%
#
# (Mutant counts measured on 2026-11-21; the scores are the same file subsets
# of the 2026-11-19 CI report, the last run that produced a full one.)
#
# The two halves of a scope are a partition by construction -- a character is
# either in [a-eA-E] or not -- so a new src/api/*.ts or src/hooks/use*.ts file
# lands in exactly one leg with no registry to update, and the leg's `compgen`
# guard fails the job if a pattern matches nothing. At the slowest rate
# observed per leg (12-25 mutants/min) the split projects ~125-175 minutes per
# leg, so the 300-minute timeout leaves ~1.7x margin on the worst leg and ~2.4x
# on api. Each leg derives its config from stryker.conf.json with jq -- the
# leg's glob replaces its scope entry, the exclusions come from the committed
# config unchanged -- so the combined config still serves a local full run.
#
# Threshold-gated (issue #915): each leg's `break` stays at its scope's value
# (docs/development/testing.md), so the split changes which mutants a number
# covers, never the number: api 83 against 86.56/90.27 measured (the [a-eA-E]
# half includes contacts.ts and errorHandling.ts, the two weaker api modules,
# so its margin is ~3.5 points rather than the old ~6), hooks 93 against
# 96.39/96.86 (the 99.18% estimate below was a per-file re-measure substituted
# into the CI report; the whole-leg number is what a leg's break can be
# measured against), utils 79 against 80.44 -- the thinnest margin here,
# carried over unchanged from the pre-split gate. `npx stryker run` itself
# exits non-zero — and this job goes red — on a mutation-score drop below the
# leg's break, rather than the score being printed and ignored. Splitting the
# gate makes it stricter for api and stops a strong api score masking a
# hooks/utils regression. The HTML report still uploads as an artifact either
# way. Still advisory at release time (docs/development/release-gates.md):
# nightly-only, so a regression is caught by morning rather than blocking the
# PR that introduced it.
#
# `Mutation test (core modules)` is kept as a small aggregate job so the check
# name .github/release-gates.json registers still exists.

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker leg (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # SCOPES: the two halves of each scope are a partition -- a file's
          # first letter after the scope's stem is either in [a-eA-E] (api) /
          # [a-gA-G] (hooks) or not. Keep that shape if you re-tune a
          # boundary; a plain [f-z] half would silently drop a file whose name
          # starts with an underscore or a digit.
          - leg: api-a
            glob: 'src/api/[a-eA-E]*.ts'
            break: 83
          - leg: api-b
            glob: 'src/api/[^a-eA-E]*.ts'
            break: 83
          # Issue #1624 §3: baseline 2026-10-12 measured 66.40% (3261 mutants,
          # 865 survivors); 70.18% on 2026-10-13. Issue #1662 classified the
          # residual (only 156 of 969 were dependency-array candidates) and
          # killed the real gaps with hook tests; proven-equivalent mutants
          # carry per-site `// Stryker disable` reasons. A follow-up audit of
          # every disable removed the ones that also hid a real replacement
          # (first-render loading state, never-clear/never-truncate branches,
          # empty-id create guards) and killed them with tests: per-file
          # re-measure estimate 99.18% (3134 killed / 3160 valid; 26 known
          # survivors, 88 disable comments left, was 113). Break stays at the
          # pre-split 93; the two halves measured 96.39% and 96.86% whole-leg
          # on 2026-11-19.
          - leg: hooks-a
            glob: 'src/hooks/use[a-gA-G]*.ts'
            break: 93
          - leg: hooks-b
            glob: 'src/hooks/use[^a-gA-G]*.ts'
            break: 93
          # Issue #1624 §3: pure src/utils/*.ts helpers (date/cadence
          # formatting, the graph budget, CSV/vCard helpers) are cheap,
          # high-yield Stryker targets. Measured 2026-10-12 at 85.07%
          # (587 killed / 92 survived / 11 no-coverage, 9m12s on 16 cores) on
          # the then-701 mutant scope; the modules added since (markdown.ts,
          # jscontactDisplay.ts) are weaker, so the 2026-11-19 whole-leg score
          # is 80.44% against this unchanged 79 break. Not split: it is the
          # shortest leg (~2h20m worst observed) and its two halves straddle
          # the break (84.73% / 76.88%), so splitting would need a per-leg
          # threshold change rather than a pure capacity change.
          - leg: utils
            glob: 'src/utils/*.ts'
            break: 79

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Derive this leg's Stryker config
        working-directory: frontend
        env:
          GLOB: ${{ matrix.glob }}
          BREAK: ${{ matrix.break }}
        run: |
          # A leg whose glob matches nothing would mutate zero files and go
          # green. Stryker only warns about that; fail closed instead.
          if ! compgen -G "$GLOB" > /dev/null; then
            echo "::error::leg glob matched no files: $GLOB"
            exit 1
          fi
          jq --arg glob "$GLOB" --argjson brk "$BREAK" '
            .mutate = ([$glob] + [.mutate[] | select(startswith("!"))])
            | .thresholds.break = $brk
            | .htmlReporter.fileName = "reports/mutation/index.html"
          ' stryker.conf.json > stryker.leg.conf.json
          jq -c '{mutate, thresholds}' stryker.leg.conf.json

      - name: Run Stryker (fails below thresholds.break)
        working-directory: frontend
        run: npx stryker run stryker.leg.conf.json --concurrency 4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-mutation-report-${{ matrix.leg }}
          path: frontend/reports/mutation/
          retention-days: 30

  # Aggregate under the pre-split job name so release-gates.json's
  # check_context keeps resolving; red if any leg is red or cancelled.
  stryker-result:
    name: Mutation test (core modules)
    needs: stryker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every leg to have passed
        env:
          RESULT: ${{ needs.stryker.result }}
        run: |
          echo "stryker legs: $RESULT"
          test "$RESULT" = "success"
