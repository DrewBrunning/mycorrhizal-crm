name: Container Hardening (CIS)

# Issue #362: nothing else in CI checks the CIS Docker Benchmark controls
# that keep the runtime images hardened (non-root appuser, pinned bases,
# HEALTHCHECK, no secrets in layers) -- a regression (re-adding `USER root`,
# a setuid binary, `privileged: true`) would otherwise go unnoticed.
#
# Builds the shipped all-in-one image and runs docker/cis-hardening.sh
# against it (4.1 non-root, 4.6 HEALTHCHECK, 4.8 setuid/setgid removed, 5.3
# no privileged/cap_add, appuser-owned writable dirs). Non-PASS fails unless
# accepted in docker/cis-hardening.ignore. docker-bench-security is
# deliberately not used: its image checks need --privileged + host mounts
# and its 4.8 check never scans the filesystem.
#
# Path-gated on `infra`/`workflows` (issue #264 pattern); the scheduled run
# re-scans everything regardless.
#
# Issue #376: two more trivy passes alongside the CIS scan, both HARD GATES
# per issue #578 (exit-code: '1'; first findings triaged into .trivyignore,
# e.g. DS-0002's documented no-USER-instruction design) -- complementary to
# docker-publish.yml's release-time image scan, catching misconfig/secrets
# on every PR that touches infra instead:
#   - `trivy config` over the Dockerfiles/compose files themselves.
#   - `trivy fs --scanners secret` over the checked-out workspace, a CI
#     backstop behind the gitleaks pre-commit hook for contributors who
#     haven't opted into it locally.
#
# Issue #578, A7: a report-only Checkov spike found nothing net-new over
# trivy config + the CIS script, so Checkov was not added.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: '20 1 * * *' # 01:20 UTC nightly
  # Issue #543: lets the release mandatory-gate step dispatch this against
  # an exact release commit (see unit-tests.yml's workflow_dispatch comment
  # for why not a `push: release/**` trigger). Not for ad hoc manual runs.
  workflow_dispatch:
  workflow_call:

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: container-hardening-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.resolve.outputs.infra }}
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # workflow_dispatch forces every area true (issue #543) -- see
      # unit-tests.yml's "Resolve gating decision" comment for why.
      - name: Resolve gating decision
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            infra=true; workflows=true
          else
            infra="$INFRA_CHANGED"; workflows="$WORKFLOWS_CHANGED"
          fi
          {
            echo "infra=$infra"
            echo "workflows=$workflows"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          # Boolean outputs only (the *_files outputs are the
          # attacker-influenced ones on PRs); passed as env vars so zizmor's
          # template-injection audit has nothing to flag in this workflow.
          EVENT_NAME: ${{ github.event_name }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  hardening:
    name: CIS container hardening scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same image e2e-tests.yml builds, so the scan inspects the actual
      # shipped artifact. `load: true` puts it in the local daemon for
      # docker/cis-hardening.sh; cache scope shared with e2e-tests.yml.
      - name: Build all-in-one image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Run CIS hardening scan
        run: docker/cis-hardening.sh mycorrhizal-crm-test:latest docker/cis-hardening.ignore

      # Issue #376: misconfig scan over the Dockerfiles/compose files, not
      # the built image -- deliberately independent of "Build all-in-one
      # image" above, so it still runs if that build is skipped. Same pin
      # as docker-publish.yml's trivy step (pre-1.0, tracked via #269).
      #
      # Issue #578: hard gate. `limit-severities-for-sarif` is required --
      # without it trivy-action unsets TRIVY_SEVERITY for SARIF mode and a
      # LOW finding hard-fails the gate even though CRITICAL,HIGH is the
      # declared severity (DS-0026 tripped this before HEALTHCHECKs were
      # added to the split Dockerfiles).
      - name: Trivy misconfig scan (Dockerfiles/compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Upload Trivy misconfig results to GitHub Security tab
        if: always() && github.event_name != 'workflow_call'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

      # Backstop behind the gitleaks pre-commit hook, not a replacement.
      # Hard gate (#578): the committed tree is secret-clean, so any finding
      # here is a real regression.
      - name: Trivy filesystem secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secret-results.sarif'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Upload Trivy secret-scan results to GitHub Security tab
        if: always() && github.event_name != 'workflow_call'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'trivy-secret-results.sarif'
          category: 'trivy-secret'

  # Issue #349: `.dockerignore` must keep editor/OS cruft out of shipped
  # images -- a bare `.DS_Store` pattern only matches the context root, so
  # an untracked frontend/public/.DS_Store would otherwise be copied into
  # the web root and served publicly. Plants that cruft, then inspects with
  # `docker export | tar -t` (not `docker run find`, so the check doesn't
  # depend on the runtime image's own tools).
  dockerignore-cruft:
    name: Build context excludes editor & OS cruft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Plant editor/OS cruft in the build context
        run: |
          set -eu
          mkdir -p frontend/public/.idea frontend/public/.vscode backend/internal/.idea
          printf 'cruft\n' | tee \
            .DS_Store \
            frontend/public/.DS_Store \
            frontend/public/.idea/workspace.xml \
            frontend/public/.vscode/settings.json \
            backend/.DS_Store \
            backend/internal/.idea/x.xml >/dev/null

      # cache-from only: nothing is written back, so this job can't poison
      # the caches e2e-tests.yml and docker-build-check.yml read.
      - name: Build all-in-one image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-dockerignore-test:latest
          cache-from: type=gha,scope=combined

      - name: Build split frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: mycorrhizal-frontend-dockerignore-test:latest
          cache-from: type=gha,scope=./frontend/Dockerfile

      - name: Assert neither image carries editor/OS cruft
        run: |
          set -eu
          fail=0
          for image in mycorrhizal-dockerignore-test:latest mycorrhizal-frontend-dockerignore-test:latest; do
            cid=$(docker create "$image")
            # tar entries look like `usr/share/nginx/html/.DS_Store` or
            # `.../.idea/`; match the basename in either position.
            leaked=$(docker export "$cid" | tar -t | grep -E '(^|/)\.(DS_Store|idea|vscode)(/|$)' || true)
            docker rm "$cid" >/dev/null
            if [ -n "$leaked" ]; then
              echo "::error::$image contains editor/OS cruft that .dockerignore should have excluded:"
              echo "$leaked"
              fail=1
            else
              echo "OK: $image is free of .DS_Store / .idea / .vscode"
            fi
          done
          exit "$fail"
