name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # The nightly run is the full web suite (all specs + loadsmoke) the PR
  # path skips for pure backend/** changes -- a backend-only change that
  # breaks a shipped user flow is caught here (docs/development/testing.md
  # "Layers vs CI path gating"). Same schedule-exemption pattern as
  # unit-tests.yml.
  schedule:
    - cron: '25 3 * * *' # 03:25 UTC nightly (consolidated nightly suite)
  # Issue #543: lets the release mandatory-gate step dispatch this against
  # an exact release commit (see unit-tests.yml's workflow_dispatch comment
  # for why not a `push: release/**` trigger). Not for ad hoc manual runs.
  workflow_dispatch:
  workflow_call:

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: e2e-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      openapi: ${{ steps.resolve.outputs.openapi }}
      infra: ${{ steps.resolve.outputs.infra }}
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, via env for zizmor (see unit-tests.yml).
      # workflow_dispatch forces every area true (#543).
      - name: Resolve gating decision
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            backend=true; frontend=true; openapi=true; infra=true; workflows=true
          else
            backend="$BACKEND_CHANGED"; frontend="$FRONTEND_CHANGED"; openapi="$OPENAPI_CHANGED"
            infra="$INFRA_CHANGED"; workflows="$WORKFLOWS_CHANGED"
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "openapi=$openapi"
            echo "infra=$infra"
            echo "workflows=$workflows"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  e2e:
    permissions:
      contents: read
      actions: read
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # Pure backend/** changes are covered by unit-tests.yml's Go checks and
    # don't re-run the full e2e stack; the scheduled nightly run re-runs the
    # full suite with no diff to gate on.
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all-in-one image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (#472): floor comes from package.json's engines.node.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # backupRestore.spec.ts (N6) compiles the backend from source and drives
      # the real `make backup` target, so the e2e host needs the same Go
      # toolchain the backend CI uses.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        # Runs every spec, including visual.spec.ts's screenshot regression
        # (#258) against committed baselines -- regenerate with
        # `npx playwright test visual.spec.ts --update-snapshots`.
        #
        # --project=chromium: playwright.config.ts also declares a `webkit`
        # project (#992, scoped to webkitSmoke.spec.ts, its own dedicated
        # `e2e-webkit-smoke` job below) this job never installs a browser
        # for -- without this flag an un-scoped run fails with "Executable
        # doesn't exist" once a second engine's project exists.
        run: npx playwright test --project=chromium
        env:
          CI: true
          # Issue #556: the @perf-heavy specs (listPerf, networkGraphScale)
          # self-skip unless RUN_PERF_HEAVY is set, so they run nightly
          # only; light @perf specs run unconditionally.
          RUN_PERF_HEAVY: ${{ github.event_name == 'schedule' && '1' || '' }}
          # Issue #1177: the release composer runs this suite under heavy
          # load, where two workers racing the shared test user's settings
          # flaked RC2. Pin to one worker there.
          PLAYWRIGHT_WORKERS: ${{ github.event_name == 'workflow_call' && '1' || '' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      # Issue #262: a short concurrent-write smoke test against the real
      # deployed artifact, not just the in-process pin
      # (database/concurrent_write_test.go). Runs after Playwright so the
      # two don't share the same rate-limit bucket/log stream.
      - name: Run concurrency/load smoke test
        working-directory: backend
        run: go run ./cmd/loadsmoke
        env:
          LOADSMOKE_BASE_URL: http://localhost:7300

      # Issue #498, "many users" axis: ten accounts, forty workers, so
      # contention is cross-user writers against the one SQLite writer -- a
      # profile one user with ten times the data never produces.
      - name: Run many-users concurrency smoke test
        working-directory: backend
        run: go run ./cmd/loadsmoke
        env:
          LOADSMOKE_BASE_URL: http://localhost:7300
          LOADSMOKE_USERS: "10"
          LOADSMOKE_WORKERS: "40"
          LOADSMOKE_DURATION: "12s"

      # Issue #498: runs against a *quiesced* snapshot -- stopping the
      # stack first checkpoints the WAL and closes the DB cleanly. Copying
      # the live DB out of a still-running container (.db/-wal/-shm as
      # three separate instants) is a torn snapshot: a checkpoint landing
      # between copies reads two generations and reports corruption that
      # isn't on disk (observed twice on PR #783). -shm is never copied (a
      # transient index SQLite rebuilds). Same cold-DB assertion the chaos
      # suite's SIGKILL jobs make.
      - name: Assert the database is not corrupt after the load
        run: |
          rm -f /tmp/loadsmoke.db /tmp/loadsmoke.db-wal /tmp/loadsmoke.db-shm
          docker compose -f docker-compose.test.yml stop
          docker compose -f docker-compose.test.yml cp mycorrhizal:/app/data/test.db /tmp/loadsmoke.db
          docker compose -f docker-compose.test.yml cp mycorrhizal:/app/data/test.db-wal /tmp/loadsmoke.db-wal || true
          result="$(sqlite3 /tmp/loadsmoke.db 'PRAGMA integrity_check')"
          echo "integrity_check: $result"
          [ "$result" = "ok" ] || { echo "::error::post-load integrity_check failed: $result"; exit 1; }

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Issue #274: a second, smaller pass under production-default settings.
  # The main suite runs against docker-compose.test.yml, which raises the
  # API rate limit and enables CalDAV so a full parallel run finishes -- so
  # shipped defaults (real rate limit, CardDAV off) are otherwise never
  # exercised. Boots the same image with the prod-defaults override and
  # runs only @prod-defaults-tagged specs, staying under the production
  # rate limit.
  e2e-prod-defaults:
    permissions:
      contents: read
      actions: read
    name: Run E2E Tests (production defaults)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Same path gating + nightly schedule-exemption as the main e2e job.
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all-in-one image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services (production-default config)
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.prod-defaults.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (#472): floor comes from package.json's engines.node.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (production-default subset)
        working-directory: frontend
        # A single worker keeps request volume under the production rate
        # limit. --project=chromium for the same reason as the main `e2e`
        # job (webkit has its own dedicated job below, #992).
        run: npx playwright test --grep @prod-defaults --workers=1 --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-prod-defaults
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-prod-defaults
          path: frontend/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml -f docker-compose.prod-defaults.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml -f docker-compose.prod-defaults.yml down -v

  # Issue #476 (WEB-02): the service-worker upgrade suite, a SEPARATE
  # Playwright config that deliberately does NOT run against the docker
  # stack -- an upgrade needs an origin that swaps between two builds
  # mid-test, which the main stack's single fixed build can't do. Its own
  # harness (frontend/e2e/sw-upgrade/) takes over port 7300 and stages two
  # real `vite build` fixtures; no backend involved. Exercises Chromium AND
  # Firefox (the wrong-MIME failure this suite guards was a Firefox report).
  e2e-sw-upgrade:
    permissions:
      contents: read
    name: Run E2E Service-Worker Upgrade Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (#472): floor comes from package.json's engines.node.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        # Both engines: service-worker behaviour genuinely differs (the
        # wrong-MIME registration failure this ticket exists because of was
        # Firefox-specific).
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright service-worker upgrade tests
        working-directory: frontend
        run: npx playwright test -c playwright.sw.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-sw
          path: frontend/playwright-report-sw/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-sw
          path: frontend/test-results-sw/
          retention-days: 7

  # Issue #992 (split from #917 finding G6): the only WebKit coverage here
  # -- every other browser job drives Chromium or Firefox, leaving the
  # documented Safari/iOS >=16.4 floor untested. See webkitSmoke.spec.ts's
  # header for what this proves (app loads, service worker registers) and
  # does not (the Push API -- absent from every CI-available WebKit build).
  #
  # Same docker-compose.test.yml stack as `e2e`, but only `webkit` and a
  # single spec -- a smoke check on one engine, not the full suite, which
  # has never been verified on anything but Chromium.
  e2e-webkit-smoke:
    permissions:
      contents: read
    name: Run E2E WebKit Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all-in-one image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (#472): floor comes from package.json's engines.node.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps webkit

      - name: Run Playwright WebKit smoke test
        working-directory: frontend
        run: npx playwright test --project=webkit
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-webkit
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-webkit
          path: frontend/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
