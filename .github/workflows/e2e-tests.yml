          cache-to: type=gha,scope=combined,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (#472): floor comes from package.json's engines.node.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        # chromium too: the `setup` project (auth.setup.ts, which `firefox`
        # depends on) runs on the default Chromium engine.
        # Bounded and retried (issue #1549): 3 attempts of 240 s, apt/dpkg
        # left by a timed-out attempt released between them. 16 min covers the
        # script's worst case (915 s); backend/internal/e2einstall enforces it.
        timeout-minutes: 16
        working-directory: frontend
        run: bash ../.github/scripts/playwright-install-retry.sh chromium firefox

