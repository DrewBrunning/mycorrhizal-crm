        timeout-minutes: 16
        working-directory: frontend
        run: bash ../.github/scripts/playwright-install-retry.sh chromium firefox

      - name: Run Playwright suite on Firefox
        working-directory: frontend
        run: npx playwright test --project=firefox
        env:
          CI: true
          E2E_ALL_BROWSERS: '1'
          MYCORRHIZAL_REQUIRE_REFERENCES: '1'
