        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Issue #1479: the nightly widening -- the WHOLE chromium suite re-run on
  # Firefox (E2E_ALL_BROWSERS=1 makes playwright.config.ts's `firefox` project
