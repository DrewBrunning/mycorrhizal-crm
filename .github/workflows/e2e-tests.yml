name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      # Passed as env vars rather than inline ${{ }} so zizmor's
      # template-injection audit has nothing to flag.
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "frontend=$FRONTEND_CHANGED"
          echo "openapi=$OPENAPI_CHANGED"
          echo "infra=$INFRA_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  e2e:
    permissions:
      contents: read
      actions: read
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # The web Playwright suite exercises the frontend and the deployed
    # artifact (all-in-one image + compose + nginx), and the openapi contract
    # the frontend consumes. Pure backend/** changes are covered by the Go
    # checks in unit-tests.yml and don't re-run the full e2e stack.
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build all-in-one image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for the app to be ready (frontend + same-origin /api on 7300)
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # backupRestore.spec.ts (N6) compiles the backend from source and drives
      # the real `make backup` target, so the e2e host needs the same Go
      # toolchain the backend CI uses.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      # Issue #262: a short concurrent-write smoke test against the actual
      # deployed artifact (nginx + backend under supervisord), not just the
      # in-process pin (database/concurrent_write_test.go). Runs after
      # Playwright rather than alongside it so the two don't share (and
      # confuse) the same rate-limit bucket/log stream. Uses the same
      # running instance already up for Playwright above.
      - name: Run concurrency/load smoke test
        working-directory: backend
        run: go run ./cmd/loadsmoke
        env:
          LOADSMOKE_BASE_URL: http://localhost:7300

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
