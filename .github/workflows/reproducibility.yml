name: Reproducible builds

# REL-04 (issue #448): the standing double-build check. Each run builds an
# artifact twice with identical, fixed inputs and fails if the two results are
# not byte-identical (Go binary) or do not share the same image config + layer
# digests (all-in-one image, linux/amd64). The per-run output in the job
# summary *is* the recorded double-build comparison the issue asks for.
#
# go-binary / all-in-one-image build both copies on the *same* runner (only a
# different path), so per-PR they prove *path*-independence, not an
# independent-builder reproduction -- and they only run on PRs that touch
# backend/build inputs (see the `paths:` filter below), never on every PR.
# go-binary-independent-rebuild is the artifact-level check that actually
# substantiates "byte-reproducible": it builds on two different GitHub-hosted
# runner images and compares across them, but only weekly (and on manual
# dispatch) -- see issue #947.
#
# What this does NOT gate: the published multi-arch manifest digest (arm64 is
# built under emulation; the manifest list carries per-arch descriptors), and
# the Android APK (not bit-reproducible by design — keystore signature).
# docs/security/reproducible-builds.md is the full per-artifact statement.

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker/**'
      - '.github/workflows/reproducibility.yml'
  push:
    branches: [main]
  schedule:
    - cron: '40 3 * * 1' # Monday 03:40 UTC
  workflow_dispatch:

permissions:
  contents: read

# Fixed stamp values: reproducibility is a property of the toolchain + source,
# not of the ldflags -X strings, so both builds pin the same placeholder values.
env:
  REPRO_SOURCE_DATE_EPOCH: '1700000000'
  REPRO_APP_VERSION: repro
  REPRO_APP_COMMIT: '0000000000000000000000000000000000000000'
  REPRO_APP_BUILD_DATE: '1970-01-01T00:00:00Z'

jobs:
  go-binary:
    name: Go server binary is byte-reproducible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # No build cache: a warm content-addressed cache would still produce
          # identical output, but a cold double-build is the honest test.
          cache: false

      - name: Build the server twice from different paths
        run: |
          set -eu
          ldflags="-X mycorrhizal/buildinfo.Version=${REPRO_APP_VERSION} \
                   -X mycorrhizal/buildinfo.Commit=${REPRO_APP_COMMIT} \
                   -X mycorrhizal/buildinfo.BuildDate=${REPRO_APP_BUILD_DATE}"

          build() { # $1 = source dir, $2 = output
            ( cd "$1" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                SOURCE_DATE_EPOCH="${REPRO_SOURCE_DATE_EPOCH}" \
                go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "$2" . )
          }

          # The second build runs from a different absolute path — exactly what
          # -trimpath has to neutralise. Without -trimpath these two differ.
          cp -r backend /tmp/src-b
          build backend /tmp/repro-a
          build /tmp/src-b /tmp/repro-b

          a=$(sha256sum /tmp/repro-a | cut -d' ' -f1)
          b=$(sha256sum /tmp/repro-b | cut -d' ' -f1)
          {
            echo "### Go server binary — double build"
            echo
            echo "| build | path | sha256 |"
            echo "|---|---|---|"
            echo "| a | \`backend/\` | \`$a\` |"
            echo "| b | \`/tmp/src-b/\` | \`$b\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! cmp -s /tmp/repro-a /tmp/repro-b; then
            echo "::error::Go server binary is not byte-reproducible ($a != $b). A path or timestamp is leaking into the build."
            cmp /tmp/repro-a /tmp/repro-b || true
            exit 1
          fi
          echo "Reproducible: $a"

  all-in-one-image:
    name: All-in-one image (linux/amd64) is reproducible
    runs-on: ubuntu-latest
    # Not a hard gate yet: the Go binary check above is proven bit-reproducible,
    # but the image adds an `apk add` layer and BuildKit's own metadata, and
    # this has not yet been observed green across enough runs to block a merge
    # on. It still builds twice and records the config/layer-digest comparison
    # in the job summary every run -- a red run is a real signal to investigate.
    # Flip to a hard gate (drop this line) once it is reliably green on `main`.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the all-in-one image twice and compare digests
        run: |
          set -eu
          build() { # $1 = OCI tar dest
            SOURCE_DATE_EPOCH="${REPRO_SOURCE_DATE_EPOCH}" docker buildx build \
              --platform linux/amd64 \
              --no-cache \
              --build-arg APP_VERSION="${REPRO_APP_VERSION}" \
              --build-arg APP_COMMIT="${REPRO_APP_COMMIT}" \
              --build-arg APP_BUILD_DATE="${REPRO_APP_BUILD_DATE}" \
              --output "type=oci,dest=$1,rewrite-timestamp=true" \
              -f Dockerfile .
          }
          build /tmp/img-a.tar
          build /tmp/img-b.tar

          rc=0
          python3 - /tmp/img-a.tar /tmp/img-b.tar > /tmp/cmp.json <<'PY' || rc=$?
          import json, sys, tarfile

          def summary(path):
              with tarfile.open(path) as t:
                  index = json.load(t.extractfile("index.json"))
                  algo, hexd = index["manifests"][0]["digest"].split(":")
                  manifest = json.load(t.extractfile(f"blobs/{algo}/{hexd}"))
                  return {
                      "config": manifest["config"]["digest"],
                      "layers": [layer["digest"] for layer in manifest["layers"]],
                  }

          a, b = summary(sys.argv[1]), summary(sys.argv[2])
          print(json.dumps({"a": a, "b": b}, indent=2))
          sys.exit(0 if a == b else 1)
          PY

          {
            echo "### All-in-one image (linux/amd64) — double build"
            echo
            echo '```json'
            cat /tmp/cmp.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "::error::All-in-one image is not reproducible: config/layer digests differ between the two builds. See the job summary and docs/security/reproducible-builds.md."
            exit 1
          fi
          echo "Reproducible: image config + layer digests match."

  go-binary-independent-rebuild:
    name: Go server binary — independent rebuild (${{ matrix.runner }})
    # go-binary above double-builds on one runner and only proves the build
    # doesn't leak an absolute path. This job is the true independent
    # rebuild: two separate GitHub-hosted runner images (different machine,
    # OS, filesystem layout), compared by go-binary-independent-rebuild-compare
    # below. It's weekly/manual-only, not a per-PR gate -- a full matrix on
    # every PR would be slow for a property (toolchain + source determinism)
    # that doesn't change PR-to-PR the way the source tree does.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Build the server and hash it
        run: |
          set -eu
          ldflags="-X mycorrhizal/buildinfo.Version=${REPRO_APP_VERSION} \
                   -X mycorrhizal/buildinfo.Commit=${REPRO_APP_COMMIT} \
                   -X mycorrhizal/buildinfo.BuildDate=${REPRO_APP_BUILD_DATE}"
          ( cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              SOURCE_DATE_EPOCH="${REPRO_SOURCE_DATE_EPOCH}" \
              go build -trimpath -buildvcs=false -ldflags "$ldflags" -o /tmp/repro-independent . )
          sha256sum /tmp/repro-independent | cut -d' ' -f1 > /tmp/repro-independent.sha256
          {
            echo "### Go server binary — independent rebuild (${{ matrix.runner }})"
            echo
            echo "\`$(cat /tmp/repro-independent.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hash
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-independent-${{ matrix.runner }}
          path: /tmp/repro-independent.sha256
          retention-days: 7

  go-binary-independent-rebuild-compare:
    name: Independent rebuild — cross-runner comparison
    needs: go-binary-independent-rebuild
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all runner hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repro-independent-*
          path: /tmp/hashes

      - name: Compare hashes across independent runners
        run: |
          set -eu
          {
            echo "### Go server binary — independent rebuild (different runners)"
            echo
            echo "| runner | sha256 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          first=""
          mismatch=0
          for dir in /tmp/hashes/repro-independent-*; do
            runner=$(basename "$dir" | sed 's/^repro-independent-//')
            hash=$(cat "$dir/repro-independent.sha256")
            echo "| $runner | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$first" ]; then
              first="$hash"
            elif [ "$hash" != "$first" ]; then
              mismatch=1
            fi
          done

          if [ "$mismatch" -ne 0 ]; then
            echo "::error::Go server binary is not reproducible across independent runners -- see the job summary."
            exit 1
          fi
          echo "Reproducible across independent runners: $first"
