name: Minimum Version Tests

# COMPAT-02 (#473). Every other workflow here builds/tests at CURRENT
# versions -- the opposite of the MINIMUM this project claims to support
# (docs/development/supported-runtime-matrix.md, COMPAT-01/#472). A stated
# floor nothing exercises drifts upward silently (the Node.js job below
# exists because COMPAT-02 caught exactly that). These jobs install the
# DECLARED MINIMUM per row and prove both that it still works and that one
# version *below* it fails with a comprehensible message (#473 action 4).
# backend/internal/compatci structurally couples this: a matrix row with no
# job here fails TestMatrixRowsHaveCoverage.
#
# Deliberately NOT on pull_request/push: slow, and the floor moves rarely
# -- "a scheduled run plus a required run before release" is the cadence.
# workflow_call is exposed for a future release-gate workflow; nothing
# calls it yet.
#
# Coverage by row (docs/development/supported-runtime-matrix.md):
#   Go              -> go-minimum / go-below-minimum
#   Node.js, Yarn   -> node-yarn-minimum / node-below-minimum
#   Browsers        -> browser-minimum (below-floor case: a frontend unit
#                      test, not a job here — see that test's file header)
#   SQLite          -> rides on Go (no version of its own)
#   Docker Engine,
#   Docker Compose  -> docker-compose-minimum
#   Host OS / arch  -> not independently checkable (see compatci)
#   Android         -> android-tests.yml's android-e2e-min-sdk /
#                      android-below-min-sdk (a separate workflow because it
#                      shares android-tests.yml's emulator/backend setup)

on:
  schedule:
    - cron: '30 5 * * 1' # 05:30 UTC every Monday
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # --- Go -----------------------------------------------------------------
  # go.mod declares `go 1.26.0` (this row's floor) and `toolchain go1.27.1`
  # (what every other job builds with); go-version-file would install the
  # toolchain, not the floor, so the version is hardcoded here instead.
  go-minimum:
    name: Go minimum version (1.26.0)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # internal/schemafixture alone can take >10m under load; #1177's
    # follow-up found the RC2 floor leg timed out at the 10m default, not on
    # a hang -- give real headroom.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go at the declared floor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          check-latest: false

      # GOTOOLCHAIN=local is load-bearing: without it go.mod's `toolchain
      # go1.27.1` line would silently switch the 1.26.0 binary to 1.27.1,
      # passing regardless of whether the floor itself still builds.
      - name: Build, vet, and test at the floor
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go build ./...
          go vet ./...
          go test -timeout 25m ./...

  go-below-minimum:
    name: Go below minimum fails clearly (1.25.5)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a Go one patch below the floor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.5'
          check-latest: false

      - name: Assert the too-old toolchain refuses with a comprehensible message
        working-directory: backend
        env:
          GOTOOLCHAIN: local
        run: |
          set +e
          output="$(go build ./... 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::go build succeeded on Go 1.25.5 -- the declared >=1.26.0 floor is no longer real, or this job stopped testing it"
            exit 1
          fi
          if ! echo "$output" | grep -qF 'go.mod requires go >= 1.26.0'; then
            echo "::error::build failed as expected but not with the comprehensible go.mod floor message: $output"
            exit 1
          fi
          echo "OK: below-floor Go failed clearly."

  # Yarn Classic is downloaded as a standalone script, invoked via `node
  # <yarn.js>` rather than whatever `yarn` the runner ships, so the pinned
  # 1.22.0 floor is what actually runs regardless of PATH order.
  node-yarn-minimum:
    name: Node.js + Yarn minimum version (22.22.2 / 1.22.0)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hardcoded, not node-version-file: that's the floor being proven, so
      # it must not be masked by setup-node's own resolution.
      - name: Install Node.js at the declared floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'

      # Hash computed by hand against this exact release asset -- Yarn's
      # tarball has no published checksum file. Bumping the version means
      # recomputing the hash, not copying it forward.
      - name: Install Yarn Classic at the declared floor
        run: |
          curl -fsSL -o /tmp/yarn-1.22.0.tar.gz https://github.com/yarnpkg/yarn/releases/download/v1.22.0/yarn-v1.22.0.tar.gz
          echo "de8871c4e2822cba80d58c2e72366fb78567ec56e873493c9ca0cca76c60f9a5  /tmp/yarn-1.22.0.tar.gz" | sha256sum -c -
          mkdir -p /tmp/yarn-1.22.0
          tar -xzf /tmp/yarn-1.22.0.tar.gz -C /tmp/yarn-1.22.0 --strip-components=1
          node /tmp/yarn-1.22.0/bin/yarn.js --version
          echo "YARN_MIN_BIN=/tmp/yarn-1.22.0/bin/yarn.js" >> "$GITHUB_ENV"

      # frontend/.yarnrc's engine-strict enforces engines.node for frontend
      # AND every dependency (jsdom@30, react-router@8) -- succeeding at
      # exactly 22.22.2 proves the declared floor is real.
      - name: Install dependencies at the floor
        working-directory: frontend
        run: node "$YARN_MIN_BIN" install --frozen-lockfile

      - name: Type check at the floor
        working-directory: frontend
        run: node "$YARN_MIN_BIN" tsc --noEmit

      - name: Unit tests at the floor
        working-directory: frontend
        run: node "$YARN_MIN_BIN" test

      - name: Production build at the floor
        working-directory: frontend
        run: node "$YARN_MIN_BIN" build

  node-below-minimum:
    name: Node.js below minimum fails clearly (22.22.1)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a Node one patch below the floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'

      # Same pinned asset + hash as node-yarn-minimum's identical step above.
      - name: Install Yarn Classic at the declared floor
        run: |
          curl -fsSL -o /tmp/yarn-1.22.0.tar.gz https://github.com/yarnpkg/yarn/releases/download/v1.22.0/yarn-v1.22.0.tar.gz
          echo "de8871c4e2822cba80d58c2e72366fb78567ec56e873493c9ca0cca76c60f9a5  /tmp/yarn-1.22.0.tar.gz" | sha256sum -c -
          mkdir -p /tmp/yarn-1.22.0
          tar -xzf /tmp/yarn-1.22.0.tar.gz -C /tmp/yarn-1.22.0 --strip-components=1
          echo "YARN_MIN_BIN=/tmp/yarn-1.22.0/bin/yarn.js" >> "$GITHUB_ENV"

      - name: Assert the too-old Node refuses with a comprehensible message
        working-directory: frontend
        run: |
          set +e
          output="$(node "$YARN_MIN_BIN" install --frozen-lockfile 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::yarn install succeeded on Node 22.22.1 -- the declared >=22.22.2 floor is no longer real, or this job stopped testing it"
            exit 1
          fi
          if ! echo "$output" | grep -qF 'engine "node" is incompatible'; then
            echo "::error::install failed as expected but not with a comprehensible engine message: $output"
            exit 1
          fi
          echo "OK: below-floor Node failed clearly (frontend/.yarnrc engine-strict)."

  # Drives real, pinned browser binaries through raw WebDriver (see
  # .github/scripts/min-browser-check.sh) to prove the browserslist floor
  # works end to end, not just that build.target compiled without error.
  browser-minimum:
    name: Browser minimum version (Firefox 111 / Chrome 115)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build the production bundle (browserslist-targeted)
        working-directory: frontend
        run: yarn build

      - name: Serve the built bundle
        working-directory: frontend/build
        run: |
          nohup python3 -m http.server 8899 > /tmp/static-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8899/index.html && break
            sleep 1
          done

      # Both hashes checked before anything downloaded runs. Firefox's
      # matches Mozilla's published SHA256SUMS; geckodriver's has none
      # published, so it was computed by hand and re-verified. Bumping
      # either version means recomputing its hash, not copying forward.
      #
      # Firefox 111's libxul.so links libdbus-glib-1.so.2 directly (later
      # releases don't); ubuntu-latest no longer ships it by default, so
      # the pinned build fails to load ("Couldn't load XPCOM") -- a
      # runner-image drift this job exists to catch (found via #543).
      # `libgl1 xvfb libgl1-mesa-dri libglx-mesa0` fix a separate GLX
      # segfault ("RenderCompositorSWGL failed mapping default framebuffer"):
      # the hosted runner has no /dev/dri render node, so Firefox needs a
      # real GLX connection even to a fake display -- Xvfb + Mesa's
      # software rasterizer (llvmpipe) is the standard portable fix.
      - name: Install Firefox 111's runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-glib-1-2 libgl1 xvfb libgl1-mesa-dri libglx-mesa0

      - name: Start a virtual X display (Xvfb)
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 30); do
            [ -e /tmp/.X11-unix/X99 ] && break
            sleep 0.5
          done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Download Firefox 111.0 (the documented floor) + a compatible geckodriver
        run: |
          curl -fsSL -o /tmp/firefox-111.tar.bz2 https://ftp.mozilla.org/pub/firefox/releases/111.0/linux-x86_64/en-US/firefox-111.0.tar.bz2
          echo "49599b5b0b24400b564af91f4578314c0e069347aea76602e7eca9d8055b6fc0  /tmp/firefox-111.tar.bz2" | sha256sum -c -
          mkdir -p /tmp/firefox-111
          tar -xjf /tmp/firefox-111.tar.bz2 -C /tmp/firefox-111 --strip-components=1
          curl -fsSL -o /tmp/geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
          echo "0bde38707eb0a686a20c6bd50f4adcc7d60d4f73c60eb83ee9e0db8f65823e04  /tmp/geckodriver.tar.gz" | sha256sum -c -
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          chmod +x /tmp/geckodriver /tmp/firefox-111/firefox-bin

      # Advisory, not blocking (#1002): Firefox 111 headless still segfaults
      # on this runner despite all three fixes above confirmed present --
      # a known, unresolved Firefox bug (Mozilla Bugzilla #1693011,
      # #1832201), not specific to this repo. Chrome for Testing 115 below
      # is the real, blocking browser-floor signal.
      - name: Assert the app loads on Firefox 111 (the documented floor)
        continue-on-error: true
        run: |
          /tmp/geckodriver --port 4444 > /tmp/geckodriver.log 2>&1 &
          .github/scripts/min-browser-check.sh 4444 firefox /tmp/firefox-111/firefox-bin http://127.0.0.1:8899/index.html

      # Google publishes no downloadable Chrome 111 build; Chrome for
      # Testing starts at 113, and 113/114 lack a matching chromedriver.
      # 115.0.5763.0 is the earliest version with both artifacts -- the
      # closest reproducible stand-in (docs/development/
      # supported-runtime-matrix.md; Edge shares Chrome's engine/floor and
      # isn't tested separately for the same reason). No published
      # checksum, so both hashes were computed by hand, same as geckodriver.
      - name: Download Chrome for Testing 115 (closest official pin to the 111 floor) + matching chromedriver
        run: |
          curl -fsSL -o /tmp/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/115.0.5763.0/linux64/chrome-linux64.zip
          echo "629a0f81ec0ab6f2a8a494628d63ed06eece090696c09279b6206559c7c6aa28  /tmp/chrome.zip" | sha256sum -c -
          curl -fsSL -o /tmp/chromedriver.zip https://storage.googleapis.com/chrome-for-testing-public/115.0.5763.0/linux64/chromedriver-linux64.zip
          echo "639cc2932f10ba58d7979469eae0f02464de9039f6040aeab15f81161f61471b  /tmp/chromedriver.zip" | sha256sum -c -
          mkdir -p /tmp/chrome /tmp/chromedriver
          unzip -q /tmp/chrome.zip -d /tmp/chrome
          unzip -q /tmp/chromedriver.zip -d /tmp/chromedriver
          chmod +x /tmp/chrome/chrome-linux64/chrome /tmp/chromedriver/chromedriver-linux64/chromedriver

      - name: Assert the app loads on Chrome for Testing 115
        run: |
          # Issue #1177: a browser floor check can flake on a loaded runner;
          # bounded retry (1 attempt on `schedule` per #974), restarting the
          # driver between attempts so a stuck one doesn't hold the port.
          max_attempts=$([ "$GITHUB_EVENT_NAME" = "schedule" ] && echo 1 || echo 2)
          attempt=1
          while true; do
            pkill -f chromedriver-linux64/chromedriver || true
            /tmp/chromedriver/chromedriver-linux64/chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
            if .github/scripts/min-browser-check.sh 9515 chrome /tmp/chrome/chrome-linux64/chrome http://127.0.0.1:8899/index.html; then
              exit 0
            fi
            pkill -f chromedriver-linux64/chromedriver || true
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Chrome minimum check failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "Chrome minimum check failed on attempt $attempt/$max_attempts; retrying" >&2
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Show driver/server logs on failure
        if: failure()
        run: |
          echo "--- static server ---"; cat /tmp/static-server.log 2>/dev/null || true
          echo "--- geckodriver ---"; cat /tmp/geckodriver.log 2>/dev/null || true
          echo "--- chromedriver ---"; cat /tmp/chromedriver.log 2>/dev/null || true

  # Swaps in the earliest Compose V2 release as a standalone client binary
  # against the runner's own current dockerd, validating "compose file
  # syntax and behavior changes across versions" with the real
  # docker-compose.yml. Does NOT run an actual Engine 23.0 daemon: pinning
  # the daemon on a shared runner is separate, higher-risk work outside
  # this ticket's scope.
  docker-compose-minimum:
    name: Docker Compose minimum version (v2.17.2)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      # Checked against docker/compose's own published .sha256 release
      # asset. Bumping the version means fetching that release's own file.
      - name: Download Docker Compose at the floor
        run: |
          curl -fsSL -o /tmp/docker-compose https://github.com/docker/compose/releases/download/v2.17.2/docker-compose-linux-x86_64
          echo "895e20812231543eae9f6b98ef9395327f4f21f1f31fa51fc252d21415802dda  /tmp/docker-compose" | sha256sum -c -
          chmod +x /tmp/docker-compose
          /tmp/docker-compose version

      # Same recipe as deploy-smoke.yml (issue #450): fresh .env from the
      # documented template, real generated secret.
      - name: Prepare a fresh .env from the documented template
        run: |
          set -euo pipefail
          cp .env.example .env
          secret="$(openssl rand -base64 32)"
          sed -i "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${secret}|" .env

      - name: Bring up the stack with the pinned Compose client
        run: /tmp/docker-compose -f docker-compose.yml up -d --build --wait --wait-timeout 240

      - name: Run the end-to-end workflow against the stack
        working-directory: backend
        run: go run ./cmd/deploysmoke
        env:
          DEPLOYSMOKE_BASE_URL: http://localhost:7300

      - name: Show container logs on failure
        if: failure()
        run: /tmp/docker-compose -f docker-compose.yml logs --no-color mycorrhizal

      - name: Tear down
        if: always()
        run: /tmp/docker-compose -f docker-compose.yml down -v
