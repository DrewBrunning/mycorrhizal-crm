name: Promote a release candidate

# RC-02 (#446): promote a release candidate to its final release WITHOUT
# rebuilding -- the artifact tested must be the artifact shipped. This
# workflow copies, never rebuilds: the three images are re-tagged by
# DIGEST (`docker buildx imagetools create`), every Release asset is
# downloaded from the RC Release and re-uploaded unchanged (verified
# against the RC's SHA256SUMS), and the final `vX.Y.Z` tag is pushed with
# GITHUB_TOKEN, which by design does NOT trigger docker-publish.yml.
#
# Also does the two things release.yml deferred for the RC: registers the
# final tag in schemafixture.SupportedReleases + commits the schema dump
# (locked once, here, against the RC's tree), and merges
# `release/vX.Y.0` back into `main`.
#
# `promotion-metadata.json` records `digest_rc == digest_final` for every
# image -- the machine-checkable proof of copy-not-rebuild.
#
# Full policy: docs/release-candidate-process.md. One-time setup is
# release.yml's (the GitHub App + RELEASE_APP_* vars/secrets).

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'The release-candidate tag to promote, e.g. v1.0.0-rc.3'
        required: true
        type: string
      ack_asvs_current:
        description: 'Reason the ASVS/MASVS claim is current without a new re-verification row (leave blank to require the row)'
        required: false
        type: string
        default: ''
      ack_adversarial_delta:
        description: 'Reason to proceed without a recorded per-release adversarial delta for added surface (leave blank to require it)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the final tag + Release; push the fixture merge
      packages: write # re-tag the images in GHCR by digest
      id-token: write # cosign keyless + attest-build-provenance on the final tag
      attestations: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The App pushes the fixture commit to release/* and the merge to
          # main. The final tag is pushed with GITHUB_TOKEN (no rebuild).
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate the RC tag and resolve the final tag
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! printf '%s' "$RC_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::error::'$RC_TAG' is not a release-candidate tag (expected vMAJOR.MINOR.PATCH-rc.N)."
            exit 1
          fi
          final="${RC_TAG%-rc.*}"
          series="release/${final}"
          if git rev-parse "refs/tags/${final}" >/dev/null 2>&1; then
            echo "::error::Final tag ${final} already exists -- ${RC_TAG} has already been promoted (or the version shipped)."
            exit 1
          fi
          if ! git rev-parse "refs/tags/${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::RC tag ${RC_TAG} does not exist."
            exit 1
          fi
          # Sanity: the RC's Release must exist and be a pre-release.
          ispre="$(gh release view "$RC_TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo missing)"
          if [ "$ispre" != "true" ]; then
            echo "::error::GitHub Release for ${RC_TAG} is missing or not marked pre-release (got: ${ispre})."
            exit 1
          fi
          rc_sha="$(git rev-list -n1 "refs/tags/${RC_TAG}")"
          git fetch --quiet origin "${series}:${series}" || {
            echo "::error::Branch ${series} not found -- an RC series is cut from a release branch (docs/release-candidate-process.md)."
            exit 1
          }
          if [ "$(git rev-parse "${series}")" != "$rc_sha" ]; then
            echo "::error::${RC_TAG} ($rc_sha) is not the tip of ${series} ($(git rev-parse "${series}")). Promote the latest RC of the series."
            exit 1
          fi
          {
            echo "FINAL_TAG=${final}"
            echo "SERIES_BRANCH=${series}"
            echo "RC_SHA=${rc_sha}"
          } >> "$GITHUB_ENV"
          echo "Promoting ${RC_TAG} ($rc_sha) -> ${final}."

      # #1195: release.yml skips these final-release-only obligations for
      # an RC and relies on promotion to run them, against the RC commit,
      # BEFORE any mutation, so a failure aborts with the final tag
      # unpushed. Shared script, same definition release.yml's final path
      # also calls.
      - name: Check out the RC commit for the release-only obligations
        env:
          RC_SHA: ${{ env.RC_SHA }}
        run: git checkout --detach "$RC_SHA"

      - name: Gate - ASVS/MASVS re-verification obligation
        env:
          ACK_ASVS_CURRENT: ${{ inputs.ack_asvs_current }}
        run: |
          set -eu
          bash .github/scripts/release-obligations.sh asvs --ack "${ACK_ASVS_CURRENT:-}"

      - name: Gate - per-release adversarial delta
        env:
          ACK_ADVERSARIAL_DELTA: ${{ inputs.ack_adversarial_delta }}
          FINAL_TAG: ${{ env.FINAL_TAG }}
        run: |
          set -eu
          bash .github/scripts/release-obligations.sh adversarial --release "$FINAL_TAG" --ack "${ACK_ADVERSARIAL_DELTA:-}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as docker-publish.yml -- v3.0.6 (v4.1.2's baked-in
          # default) has a keyless-signing regression against registries with
          # no OCI 1.1 Referrers API.
          cosign-release: 'v3.1.3'

      - name: Verify the RC images and record their digests
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY,,}"
          rc="${RC_TAG#v}"
          : > /tmp/rc-digests.txt
          for suffix in "" "-backend" "-frontend"; do
            ref="ghcr.io/${repo}${suffix}:${rc}"
            cosign verify "$ref" \
              --certificate-identity-regexp '^https://github\.com/DrewBrunning/mycorrhizal-crm/\.github/workflows/docker-publish\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')"
            echo "ghcr.io/${repo}${suffix} ${digest}" | tee -a /tmp/rc-digests.txt
          done

      - name: Register the final schema fixture on the release branch
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          FINAL_TAG: ${{ env.FINAL_TAG }}
          SERIES_BRANCH: ${{ env.SERIES_BRANCH }}
          RC_SHA: ${{ env.RC_SHA }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # #1020: a prior promotion attempt can have already pushed this
          # fixture commit and failed at a LATER step (v0.7.0 hit exactly
          # this). A naive re-dispatch re-derives an identical commit and
          # gets rejected as non-fast-forward. Skip registration -- adopting
          # the branch's tip as FINAL_SHA -- when it's already there.
          if git show "$SERIES_BRANCH:backend/internal/schemafixture/releases.go" 2>/dev/null | grep -qF "{Tag: \"${FINAL_TAG}\","; then
            echo "Schema fixture for ${FINAL_TAG} is already registered on ${SERIES_BRANCH} (a prior promotion attempt got this far) -- skipping."
            echo "FINAL_SHA=$(git rev-parse "$SERIES_BRANCH")" >> "$GITHUB_ENV"
          else
            git checkout -B "$SERIES_BRANCH" "$RC_SHA"

            migver=""
            for f in backend/database/migrations/[0-9]*_*.up.sql; do
              [ -f "$f" ] || continue
              n="${f##*/}"; n="${n%%_*}"; n=$((10#$n))
              if [ -z "$migver" ] || [ "$n" -gt "$migver" ]; then migver="$n"; fi
            done
            [ -n "$migver" ] || { echo "::error::no migration files found"; exit 1; }

            python3 - "$FINAL_TAG" "$migver" <<'PYEOF'
          import sys
          version, migver = sys.argv[1], sys.argv[2]
          path = "backend/internal/schemafixture/releases.go"
          lines = open(path).read().splitlines(keepends=True)
          idx = max(i for i, line in enumerate(lines) if line.lstrip().startswith("{Tag:"))
          lines.insert(idx + 1, f'\t{{Tag: "{version}", Version: {migver}}},\n')
          open(path, "w").writelines(lines)
          PYEOF
            gofmt -w backend/internal/schemafixture/releases.go
            ( cd backend && go run ./cmd/genschema )

            expected="?? backend/database/testdata/schemas/${FINAL_TAG}.sql"
            actual="$(git status --porcelain -- backend/database/testdata/schemas/)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::genschema did not regenerate as expected (want exactly: ${expected})"; echo "$actual"; exit 1
            fi
            ( cd backend && go test ./internal/schemafixture/... ./cmd/genschema/... ./cmd/releaselist/... )

            git add backend/internal/schemafixture/releases.go "backend/database/testdata/schemas/${FINAL_TAG}.sql"
            git commit -m "release: register ${FINAL_TAG} schema fixture (promoted from ${RC_TAG}) (issue #529, #446)"
            echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

            # shellcheck disable=SC2016
            helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
            git -c credential.helper="$helper" push origin "HEAD:${SERIES_BRANCH}"
          fi

      # Merge FIRST, tag LAST: the final tag is the point of no return, so
      # it's only pushed once the merge has landed and the images below
      # are proven byte-identical to the RC's. FINAL_SHA is an ancestor of
      # main after the --no-ff merge, so the tag still points at the RC's
      # tree.
      - name: Merge the release branch back into main
        env:
          FINAL_TAG: ${{ env.FINAL_TAG }}
          SERIES_BRANCH: ${{ env.SERIES_BRANCH }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          git fetch --quiet origin main
          git checkout -B main origin/main
          git merge --no-ff -m "release: merge ${SERIES_BRANCH} for ${FINAL_TAG} (issue #446)" "$SERIES_BRANCH"
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "HEAD:refs/heads/main"

      - name: Re-tag the images by digest, then cosign-sign the promoted tag
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          FINAL_TAG: ${{ env.FINAL_TAG }}
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY,,}"
          rc="${RC_TAG#v}"; final="${FINAL_TAG#v}"
          : > /tmp/final-digests.txt
          for suffix in "" "-backend" "-frontend"; do
            src="ghcr.io/${repo}${suffix}:${rc}"
            dst="ghcr.io/${repo}${suffix}:${final}"
            dst_latest="ghcr.io/${repo}${suffix}:latest"
            # Manifest copy: dst/dst_latest resolve to the SAME digest as
            # src. `latest` is moved here, not by docker-publish.yml, since
            # the final tag (pushed with GITHUB_TOKEN) never triggers that
            # workflow -- every promotion is to a final tag by construction,
            # so `latest` always moves here unconditionally.
            docker buildx imagetools create --tag "$dst" --tag "$dst_latest" "$src"
            digest="$(docker buildx imagetools inspect "$dst" --format '{{json .Manifest}}' | jq -r '.digest')"
            echo "ghcr.io/${repo}${suffix} ${digest}" | tee -a /tmp/final-digests.txt
            # Additional signature carrying the promote-rc.yml identity, on
            # top of the RC pipeline's own digest-scoped signature/
            # attestation (still valid, digest unchanged). By digest so it
            # covers both $dst and $dst_latest.
            cosign sign --yes "ghcr.io/${repo}${suffix}@${digest}"
          done

      # #997: this gate used to run AFTER the tag was pushed and the
      # Release published, so a mismatch was reported only once the bad
      # state was already live. Now runs before either exists: a mismatch
      # aborts with the tag unpushed and no Release created.
      - name: Verify promoted image digests match the RC's (before the tag is pushed)
        run: |
          set -eu
          mismatch=0
          images_json='[]'
          # Both files list ghcr.io/<repo><suffix> <digest>, same order.
          while read -r ref rc_digest _ final_digest; do
            match=true
            [ "$rc_digest" = "$final_digest" ] || { match=false; mismatch=1; }
            images_json="$(jq -c --arg n "$ref" --arg r "$rc_digest" --arg f "$final_digest" --argjson m "$match" \
              '. + [{ref:$n, digest_rc:$r, digest_final:$f, match:$m}]' <<<"$images_json")"
          done < <(paste -d' ' /tmp/rc-digests.txt /tmp/final-digests.txt)
          echo "$images_json" > /tmp/promotion-images.json

          if [ "$mismatch" -ne 0 ]; then
            echo "::error::A promoted image digest does not match the RC's -- promotion rebuilt instead of copying. Refusing to push the final tag or publish a Release for ${FINAL_TAG:-the final tag}; the GHCR :latest move above still needs manual cleanup."
            jq -c '.[] | select(.match == false)' /tmp/promotion-images.json
            exit 1
          fi

      - name: Create + push the final tag (GITHUB_TOKEN -> no rebuild)
        env:
          FINAL_TAG: ${{ env.FINAL_TAG }}
          FINAL_SHA: ${{ env.FINAL_SHA }}
          GH_TOKEN_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git tag "$FINAL_TAG" "$FINAL_SHA"
          # GITHUB_TOKEN never triggers on:push:tags, so docker-publish.yml
          # stays dormant -- this workflow does the publish.
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN_PUSH}"; }; f'
          git -c credential.helper="$helper" push origin "refs/tags/${FINAL_TAG}"

      - name: Publish the final GitHub Release with the RC's assets
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          FINAL_TAG: ${{ env.FINAL_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          work="$(mktemp -d)"
          gh release download "$RC_TAG" --dir "$work" --clobber
          # Integrity: the RC's SHA256SUMS must still verify these files.
          ( cd "$work" && grep -v ' SHA256SUMS$' SHA256SUMS | sha256sum -c - )

          gh release create "$FINAL_TAG" \
            --title "$FINAL_TAG" \
            --generate-notes \
            --latest \
            --notes "Promoted from ${RC_TAG} without rebuilding: container images re-tagged by digest, release assets copied byte-for-byte. See \`promotion-metadata.json\` (digest_rc == digest_final) and docs/release-candidate-process.md."

          # Skip the RC's SHA256SUMS (regenerated) and release-metadata.json
          # (RC-specific).
          find "$work" -maxdepth 1 -type f \
            ! -name SHA256SUMS ! -name release-metadata.json -print0 \
          | xargs -0 -I{} gh release upload "$FINAL_TAG" {} --clobber

          dl="$(mktemp -d)"
          gh release download "$FINAL_TAG" --dir "$dl" --clobber
          ( cd "$dl" && rm -f SHA256SUMS && sha256sum -- * | sort -k2 > SHA256SUMS && cat SHA256SUMS )
          gh release upload "$FINAL_TAG" "$dl/SHA256SUMS" --clobber

      - name: Emit + attach promotion metadata (proves copy, not rebuild)
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          FINAL_TAG: ${{ env.FINAL_TAG }}
          RC_SHA: ${{ env.RC_SHA }}
          FINAL_SHA: ${{ env.FINAL_SHA }}
          ACK_ASVS: ${{ inputs.ack_asvs_current }}
          ACK_ADV: ${{ inputs.ack_adversarial_delta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The digest_rc == digest_final comparison already ran above; this
          # step only formats the already-verified result.
          jq -n \
            --arg rc_tag "$RC_TAG" --arg final_tag "$FINAL_TAG" \
            --arg rc_sha "$RC_SHA" --arg final_sha "$FINAL_SHA" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run "$RUN_URL" \
            --arg ack_asvs "$ACK_ASVS" \
            --arg ack_adv "$ACK_ADV" \
            --argjson images "$(cat /tmp/promotion-images.json)" \
            '{rc_tag:$rc_tag, final_tag:$final_tag, rc_sha:$rc_sha, final_sha:$final_sha,
              promoted_at:$promoted_at, workflow_run:$workflow_run, images:$images,
              ack_asvs_current:$ack_asvs, ack_adversarial_delta:$ack_adv,
              rebuilt:false}' | tee promotion-metadata.json

          gh release upload "$FINAL_TAG" promotion-metadata.json --clobber

      - name: Upload promotion metadata (workflow artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-metadata
          path: promotion-metadata.json
          retention-days: 90

      - name: Summary
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          FINAL_TAG: ${{ env.FINAL_TAG }}
          SERIES_BRANCH: ${{ env.SERIES_BRANCH }}
        run: |
          {
            echo "### Promoted ${RC_TAG} -> ${FINAL_TAG}"
            echo
            echo "- images re-tagged by digest (\`digest_rc == digest_final\` in promotion-metadata.json) -- **not** rebuilt"
            echo "- release assets copied byte-for-byte from the ${RC_TAG} Release; SHA256SUMS regenerated"
            echo "- final tag pushed with GITHUB_TOKEN, so docker-publish.yml did not fire"
            echo "- the three GHCR image \`:latest\` tags were moved to this digest"
            echo "- the GitHub Release \`${FINAL_TAG}\` is marked **latest** and is no longer a pre-release"
            echo "- \`${SERIES_BRANCH}\` merged back into main"
            echo
            echo "Confirm Obtainium now offers \`${FINAL_TAG}\`, not the RC."
          } >> "$GITHUB_STEP_SUMMARY"
