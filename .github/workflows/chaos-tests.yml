name: Chaos Tests (failure injection)

# Issue #434 (TEST-06): the external-fault CI job -- faults that cannot be
# expressed as an error across an existing interface and must make the
# process or filesystem actually misbehave (rule: docs/development/
# fault-injection.md). Each interruption here asserts a *defined outcome*
# (recovered, or failed closed with data intact), not merely "it errored":
#
#   - SIGKILL mid-migration + the MIG-04 (#439/#546) fail-closed outcome:
#     restart REFUSES on the dirty flag naming the version + recovery, and
#     the operator-only `force` command recovers to latest, integrity ok.
#   - real ENOSPC during backup (VACUUM INTO against a tiny tmpfs) -- fails
#     closed, no partial output file, source database intact.
#   - real ENOSPC during a large upgrade (#530): with the backup target on
#     the same full disk, `migrate up` REFUSES before touching the database;
#     with a roomy backup target, the migration itself exhausts the disk
#     and lands dirty, refused on restart (MIG-04).
#   - DEPLOY-03 (#452): SIGKILLs a real upgrade at every point that
#     matters (before/during/between migrations, after migrations but
#     before ready); each kill point has a declared outcome via dbinspect's
#     exact-string contract, repeated kill/restart cycles converge on the
#     same state, and the #530 pre-migration backup survives.
#   - Issue #498: the constraint x op cells needing a real resource limit
#     (ENOSPC during bulk write/FTS rebuild, migration under a memory cap,
#     bulk write/FTS rebuild under a CPU cap) -- each asserts integrity_check
#     ok and no silent partial success. Table: docs/development/
#     capacity-under-constraint.md.
#
# Gating: slow by design, does NOT run on every push -- only when the
# injection harness changes, nightly, or on manual dispatch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '55 3 * * *' # 03:55 UTC nightly (consolidated nightly suite)
  workflow_dispatch:
  workflow_call:

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: chaos-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Issue #264 pattern: path-gated checks — see unit-tests.yml.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      chaos: ${{ steps.filter.outputs.chaos }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only (the *_files outputs are the attacker-influenced
      # ones on PRs and are never used). Passed as env vars so zizmor's
      # template-injection audit has nothing to flag.
      - name: Report gating decision
        run: |
          echo "chaos=$CHAOS_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          CHAOS_CHANGED: ${{ steps.filter.outputs.chaos }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  migration-kill:
    permissions:
      contents: read
    name: SIGKILL mid-migration, restart refuses, force recovers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Scheduled runs and manual dispatch always run (no diff to gate on);
    # otherwise only when the harness or the driven subprocesses change.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migrate and dbinspect CLIs
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      # The pause fault parks cmd/migrate right after the first migration's
      # commit, before its clean-mark -- the SIGKILL window.
      - name: Start a migration parked mid-flight
        working-directory: backend
        run: |
          rm -f "$RUNNER_TEMP/chaos.db" "$RUNNER_TEMP/chaos.db-wal" "$RUNNER_TEMP/chaos.db-shm"
          MYCORRHIZAL_FAULTS='database.migration.statement:pause:300s' SQLITE_DB_PATH="$RUNNER_TEMP/chaos.db" "$RUNNER_TEMP/migrate" up > /tmp/migrate1.log 2>&1 &
          echo "$!" > /tmp/migrate.pid

      - name: Wait for the mid-migration pause marker
        run: |
          for i in $(seq 1 60); do
            if grep -q 'injected fault pause' /tmp/migrate1.log; then
              echo "paused mid-migration after ${i}s"
              grep 'injected fault pause' /tmp/migrate1.log
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/migrate.pid)" 2>/dev/null; then
              echo "::error::migrate exited before reaching the pause fault"
              cat /tmp/migrate1.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::migrate never reached the pause fault (fault did not fire — this is the 'not silently skipped' check)"
          cat /tmp/migrate1.log
          exit 1

      - name: SIGKILL mid-migration
        run: |
          kill -9 "$(cat /tmp/migrate.pid)"
          echo "killed"

      # Crash signature: version 1 applied+committed, clean-mark never
      # written, integrity ok -- the state a restart must refuse on.
      - name: Assert the interrupted database is dirty at the first migration
        run: |
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/chaos.db")"
          echo "post-kill: $state"
          case "$state" in
            "integrity_check=ok version=1 dirty=true") ;;
            *) echo "::error::unexpected post-kill state: $state"; exit 1 ;;
          esac

      # Fail-closed (MIG-04, #439/#546): restart WITHOUT the fault must
      # refuse, naming the version + recovery -- never a warning + forced
      # boot. dbinspect confirms the refusal didn't touch the database.
      - name: Restart without the fault and assert the fail-closed refusal
        run: |
          set +e
          SQLITE_DB_PATH="$RUNNER_TEMP/chaos.db" "$RUNNER_TEMP/migrate" up > /tmp/migrate2.log 2>&1
          rc=$?
          set -e
          echo "restart exit=$rc"
          cat /tmp/migrate2.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::a dirty database booted (must refuse)"
            exit 1
          fi
          grep -q 'dirty migration state at version 1' /tmp/migrate2.log
          grep -q 'Restore the pre-migration backup' /tmp/migrate2.log
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/chaos.db")"
          echo "post-refusal: $state"
          case "$state" in
            "integrity_check=ok version=1 dirty=true") ;;
            *) echo "::error::the refusal modified the database: $state"; exit 1 ;;
          esac

      # DEPLOY-03 (#452) action 3: an orchestrator that keeps restarting a
      # crashed container must not compound the damage -- N restarts must
      # converge on the same state as one.
      - name: Repeated restarts of the dirty database converge (crash loop)
        run: |
          for i in 1 2 3 4 5; do
            set +e
            SQLITE_DB_PATH="$RUNNER_TEMP/chaos.db" "$RUNNER_TEMP/migrate" up > "/tmp/migrate-loop-$i.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::restart $i booted a dirty database (must refuse every time)"
              exit 1
            fi
            grep -q 'dirty migration state at version 1' "/tmp/migrate-loop-$i.log"
            state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/chaos.db")"
            if [ "$state" != "integrity_check=ok version=1 dirty=true" ]; then
              echo "::error::restart $i changed the state: $state"
              exit 1
            fi
          done
          echo "5 restarts, same defined state"

      # `migrate force` prompts for confirmation, marks version 1 clean, and
      # re-runs pending migrations to latest. Latest version is derived
      # from the migration file count, not hardcoded, so this doesn't rot.
      - name: Operator-only force recovers the interrupted database
        working-directory: backend
        run: |
          printf 'yes\n' | SQLITE_DB_PATH="$RUNNER_TEMP/chaos.db" "$RUNNER_TEMP/migrate" force
          latest="$(find database/migrations -maxdepth 1 -name '*.up.sql' | wc -l | tr -d ' ')"
          expected="integrity_check=ok version=${latest} dirty=false"
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/chaos.db")"
          echo "post-recovery: $state (expected $expected)"
          if [ "$state" != "$expected" ]; then
            echo "::error::recovery did not reach a clean latest schema"
            exit 1
          fi

  disk-full-backup:
    permissions:
      contents: read
    name: ENOSPC during backup fails closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'
    env:
      # cmd/backup signs the snapshot (issue #943) with a key derived from the
      # at-rest master key; give the CLI a fixed test key.
      DATA_ENCRYPTION_KEY: WlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlo=

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the backup, migrate and dbinspect CLIs
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/backup" ./cmd/backup
          go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      - name: Create a populated source database
        working-directory: backend
        run: |
          rm -f "$RUNNER_TEMP/src.db" "$RUNNER_TEMP/src.db-wal" "$RUNNER_TEMP/src.db-shm"
          SQLITE_DB_PATH="$RUNNER_TEMP/src.db" "$RUNNER_TEMP/migrate" up

      # A 512 KiB tmpfs is guaranteed smaller than the migrated schema DB
      # (~1 MiB+), so VACUUM INTO runs out of space mid-write — a real ENOSPC,
      # not a mocked one.
      - name: Mount a tiny filesystem to simulate disk exhaustion
        run: |
          sudo mkdir -p /mnt/diskfull
          sudo mount -t tmpfs -o size=512k tmpfs /mnt/diskfull
          echo "mounted 512k tmpfs at /mnt/diskfull"

      # Defined outcome: the CLI exits non-zero, no partial file appears at
      # the output path (backup is temp-then-link, fail-closed), and nothing
      # on the source is disturbed.
      - name: Backup to the full disk must fail closed
        working-directory: backend
        run: |
          set +e
          SQLITE_DB_PATH="$RUNNER_TEMP/src.db" "$RUNNER_TEMP/backup" /mnt/diskfull/backup.db > /tmp/backup.log 2>&1
          rc=$?
          set -e
          echo "backup exit=$rc"
          cat /tmp/backup.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::backup succeeded against a full disk"
            exit 1
          fi
          if [ -e /mnt/diskfull/backup.db ]; then
            echo "::error::a partial backup appeared at the output path (must fail closed)"
            exit 1
          fi
          echo "failed closed: no output file, non-zero exit"

      - name: Assert the source database is untouched
        run: |
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/src.db")"
          echo "source: $state"
          case "$state" in
            "integrity_check=ok version="*) ;;
            *) echo "::error::source database is not intact: $state"; exit 1 ;;
          esac

      # A successful backup to healthy storage is VACUUM INTO + verifyBackup,
      # so this proves the source was readable and structurally sound all
      # along — the ENOSPC failure did not touch it.
      - name: Prove the source still backs up to healthy storage
        working-directory: backend
        run: |
          rm -f "$RUNNER_TEMP/healthy.db"
          SQLITE_DB_PATH="$RUNNER_TEMP/src.db" "$RUNNER_TEMP/backup" "$RUNNER_TEMP/healthy.db"
          "$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/healthy.db"

      - name: Unmount the tiny filesystem
        if: always()
        run: |
          sudo umount /mnt/diskfull || true

  # Issue #495 hand-verify item: reduce available disk below what a
  # migration needs and confirm it fails closed rather than truncating.
  # RLIMIT_FSIZE is NOT a valid in-process proxy (Linux ftruncate ignores
  # it, and SQLite pre-extends files with ftruncate), so this is an
  # external-fault job: a real ~45MB floor database on a tmpfs sized to
  # hold it plus only 1 MiB, migrated until the WAL growth runs out of space.
  #
  # Defined outcome: `migrate up` fails non-zero, DIRTY at some migration
  # with integrity ok -- never truncated, never a healthy-looking
  # half-migration -- and the next startup REFUSES. Same fail-closed path
  # migration-kill proves with SIGKILL, here from disk exhaustion instead.
  large-migration-disk-full:
    permissions:
      contents: read
    name: ENOSPC during large migration fails closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    env:
      # The floor moved to v1.0.0 (= current latest, #1170), making a
      # version-31 database sub-floor; this job tests migration/interruption
      # behavior, not the floor refusal, so it uses the documented bridge
      # until a later release adds a migration above the floor.
      MYCORRHIZAL_ALLOW_SUB_FLOOR_MIGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migratebench, migrate and dbinspect CLIs
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migratebench" ./cmd/migratebench
          go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      # A 10k-contact floor database needs ~16 MB of transient extra disk
      # when pending migrations run (WAL growth from full-row backfills) --
      # that growth is what the constrained disk must exhaust.
      - name: Build a large floor database
        working-directory: backend
        run: |
          rm -f "$RUNNER_TEMP/src.db" "$RUNNER_TEMP/floor.db"
          "$RUNNER_TEMP/migratebench" seed --contacts 10000 --db "$RUNNER_TEMP/src.db"
          "$RUNNER_TEMP/migratebench" checkpoint --db "$RUNNER_TEMP/src.db" --version 31 --out "$RUNNER_TEMP/floor.db"
          rm -f "$RUNNER_TEMP/src.db" "$RUNNER_TEMP/src.db-wal" "$RUNNER_TEMP/src.db-shm"
          ls -la "$RUNNER_TEMP/floor.db"

      # Sized at floor + 1 MiB: room for the file, not the ~16MB the
      # migration needs. A real ENOSPC, not a mocked one.
      - name: Mount a constrained filesystem
        run: |
          floor_bytes="$(stat -c %s "$RUNNER_TEMP/floor.db")"
          size="$(( floor_bytes + 1048576 ))"
          sudo mkdir -p /mnt/diskfull
          sudo mount -t tmpfs -o "size=${size}" tmpfs /mnt/diskfull
          echo "mounted tmpfs size=${size} (floor=${floor_bytes}) at /mnt/diskfull"

      - name: Copy the large database onto the constrained filesystem
        run: |
          cp "$RUNNER_TEMP/floor.db" /mnt/diskfull/floor.db
          ls -la /mnt/diskfull/

      # Scenario A: backup target on the same full disk. The mandatory
      # pre-migration backup (#530) is fail-closed, so `migrate up` refuses
      # BEFORE any migration runs, database left exactly as it was.
      - name: Migrate must refuse when the pre-migration backup cannot be written
        working-directory: backend
        run: |
          set +e
          SQLITE_DB_PATH="/mnt/diskfull/floor.db" "$RUNNER_TEMP/migrate" up > /tmp/migrate-nobackup.log 2>&1
          rc=$?
          set -e
          echo "migrate exit=$rc"
          tail -5 /tmp/migrate-nobackup.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::migration proceeded without a pre-migration backup"
            exit 1
          fi
          grep -q 'pre-migration backup' /tmp/migrate-nobackup.log
          grep -q 'Refusing to migrate' /tmp/migrate-nobackup.log

      - name: The refused database is untouched (still at the floor, clean)
        run: |
          state="$("$RUNNER_TEMP/dbinspect" /mnt/diskfull/floor.db)"
          echo "post-refusal: $state"
          case "$state" in
            "integrity_check=ok version=31 dirty=false") ;;
            *) echo "::error::the pre-migration-backup refusal modified the database: $state"; exit 1 ;;
          esac
          # Clear the empty pre-migration/ dir and any WAL sidecars the refused
          # attempt's read-only version check left, so scenario B keeps its
          # full ~1 MiB of headroom.
          rm -rf /mnt/diskfull/pre-migration /mnt/diskfull/floor.db-wal /mnt/diskfull/floor.db-shm

      # Scenario B: backup succeeds (roomy separate target, the realistic
      # prod layout), and the migration ITSELF then exhausts the disk.
      - name: With a roomy backup target the migration itself hits ENOSPC
        working-directory: backend
        env:
          MYCORRHIZAL_PRE_MIGRATION_BACKUP_DIR: ${{ runner.temp }}/premig-backups
        run: |
          set +e
          SQLITE_DB_PATH="/mnt/diskfull/floor.db" "$RUNNER_TEMP/migrate" up > /tmp/migrate-full.log 2>&1
          rc=$?
          set -e
          echo "migrate exit=$rc"
          tail -3 /tmp/migrate-full.log
          ls -la "$RUNNER_TEMP/premig-backups/" || true
          if [ "$rc" -eq 0 ]; then
            echo "::error::migration succeeded against a disk too small for it"
            exit 1
          fi
          # The pre-migration snapshot was taken before the migration failed.
          ls "$RUNNER_TEMP"/premig-backups/floor-pre-migration-31-to-*.db >/dev/null

      # Fail-closed, not truncated: integrity ok, dirty at some migration.
      - name: Assert the interrupted database is dirty, not truncated
        run: |
          state="$("$RUNNER_TEMP/dbinspect" /mnt/diskfull/floor.db)"
          echo "post-enospc: $state"
          case "$state" in
            "integrity_check=ok version="*" dirty=true") ;;
            *) echo "::error::unexpected post-ENOSPC state: $state"; exit 1 ;;
          esac

      # Restart must refuse on the dirty flag (MIG-04) and not touch the
      # database. Backup target is set but unused: a dirty database is
      # refused before it's eligible for a pre-migration backup.
      - name: Restart must refuse the dirty migration state
        working-directory: backend
        env:
          MYCORRHIZAL_PRE_MIGRATION_BACKUP_DIR: ${{ runner.temp }}/premig-backups
        run: |
          set +e
          SQLITE_DB_PATH="/mnt/diskfull/floor.db" "$RUNNER_TEMP/migrate" up > /tmp/migrate-refuse.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::a dirty database booted (must refuse)"
            exit 1
          fi
          grep -q 'dirty migration state' /tmp/migrate-refuse.log
          state="$("$RUNNER_TEMP/dbinspect" /mnt/diskfull/floor.db)"
          echo "post-refusal: $state"
          case "$state" in
            "integrity_check=ok version="*" dirty=true") ;;
            *) echo "::error::the refusal modified the database: $state"; exit 1 ;;
          esac

      - name: Unmount the constrained filesystem
        if: always()
        run: |
          sudo umount /mnt/diskfull || true

  # DEPLOY-03 (#452): SIGKILL a real upgrade at every point that matters,
  # each with a DEFINED outcome (correct+complete, or refuses naming state +
  # recovery) -- nothing in between. Repeated kill/restart cycles converge
  # on the same state; the #530 pre-migration backup survives the kill.
  #
  # Kill points: before_migrations (parked before the first statement --
  # schema untouched, restart migrates normally; "during" is migration-kill
  # above); between_migrations (clean checkpoint at latest-1 -- restart
  # RESUMES to latest with no force); after_migrations (real server binary
  # killed between "Migrations applied" and "Server is ready" -- clean at
  # latest, restart reaches /health/ready == 200).
  startup-interruption-kill-points:
    permissions:
      contents: read
    name: SIGKILL at every startup kill point, restart converges
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    env:
      # The floor moved to v1.0.0 (= current latest, #1170), making a
      # version-31 database sub-floor; this job tests migration/interruption
      # behavior, not the floor refusal, so it uses the documented bridge
      # until a later release adds a migration above the floor.
      MYCORRHIZAL_ALLOW_SUB_FLOOR_MIGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migrate, dbinspect, migratebench CLIs and the server
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect
          go build -o "$RUNNER_TEMP/migratebench" ./cmd/migratebench
          go build -o "$RUNNER_TEMP/server" .

      # A small populated database at the v0.6.0 upgrade floor (migration 31) —
      # the state a real instance is in the moment before an in-place upgrade.
      - name: Build a populated floor database
        working-directory: backend
        run: |
          latest="$(find database/migrations -maxdepth 1 -name '*.up.sql' | wc -l | tr -d ' ')"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/migratebench" seed --contacts 50 --db "$RUNNER_TEMP/src.db"
          "$RUNNER_TEMP/migratebench" checkpoint --db "$RUNNER_TEMP/src.db" --version 31 --out "$RUNNER_TEMP/floor.db"
          contacts="$(sqlite3 "$RUNNER_TEMP/floor.db" 'SELECT count(*) FROM contacts')"
          echo "CONTACTS=$contacts" >> "$GITHUB_ENV"
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/floor.db")"
          echo "floor: $state ($contacts contacts)"
          case "$state" in
            "integrity_check=ok version=31 dirty=false") ;;
            *) echo "::error::floor database is not a clean v0.6.0 schema: $state"; exit 1 ;;
          esac

      # Kill point 1: park at the before_batch seam and SIGKILL, three
      # times. Every kill must leave the floor schema byte-for-byte
      # untouched -- an interruption in this window is a no-op.
      - name: SIGKILL before any migration begins — crash loop
        working-directory: backend
        run: |
          cp "$RUNNER_TEMP/floor.db" "$RUNNER_TEMP/before.db"
          want="integrity_check=ok version=31 dirty=false"
          for i in 1 2 3; do
            rm -f "$RUNNER_TEMP/before.db-wal" "$RUNNER_TEMP/before.db-shm"
            MYCORRHIZAL_FAULTS='database.migration.before_batch:pause:300s' \
              MYCORRHIZAL_PRE_MIGRATION_BACKUP_DIR="$RUNNER_TEMP/premig" \
              SQLITE_DB_PATH="$RUNNER_TEMP/before.db" "$RUNNER_TEMP/migrate" up > "/tmp/before-$i.log" 2>&1 &
            pid=$!
            reached=0
            for _ in $(seq 1 60); do
              if grep -q 'injected fault pause' "/tmp/before-$i.log"; then reached=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::migrate exited before reaching the before_batch seam (iteration $i)"
                cat "/tmp/before-$i.log"; exit 1
              fi
              sleep 1
            done
            if [ "$reached" -ne 1 ]; then
              echo "::error::iteration $i never reached the before_batch pause fault (fault silently skipped?)"
              cat "/tmp/before-$i.log"; exit 1
            fi
            kill -9 "$pid"; wait "$pid" 2>/dev/null || true
            state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/before.db")"
            if [ "$state" != "$want" ]; then
              echo "::error::kill $i moved the database: $state (want $want)"; exit 1
            fi
          done
          echo "3 kills before the first migration, schema untouched every time"

      # The #530 pre-migration backup is taken BEFORE the before_batch seam, so
      # it exists after the kill — a valid rollback point at the pre-upgrade
      # schema — and the crash loop reused it rather than rewriting it.
      - name: The pre-migration backup survived the kill and was reused
        run: |
          snap="$(find "$RUNNER_TEMP/premig" -maxdepth 1 -name 'before-pre-migration-31-to-*.db' | head -n1)"
          if [ -z "$snap" ]; then
            echo "::error::no pre-migration snapshot after the interrupted upgrade"
            ls -la "$RUNNER_TEMP/premig" || true
            exit 1
          fi
          test "$(find "$RUNNER_TEMP/premig" -maxdepth 1 -name 'before-pre-migration-31-to-*.db' | wc -l | tr -d ' ')" = "1" \
            || { echo "::error::a crash loop piled up pre-migration snapshots"; exit 1; }
          state="$("$RUNNER_TEMP/dbinspect" "$snap")"
          echo "snapshot: $state"
          case "$state" in
            "integrity_check=ok version=31 dirty=false") ;;
            *) echo "::error::the pre-migration snapshot is not a clean pre-upgrade schema: $state"; exit 1 ;;
          esac

      - name: Disarmed restart migrates the before-kill database normally
        run: |
          SQLITE_DB_PATH="$RUNNER_TEMP/before.db" "$RUNNER_TEMP/migrate" up
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/before.db")"
          echo "post-restart: $state"
          case "$state" in
            "integrity_check=ok version=${LATEST} dirty=false") ;;
            *) echo "::error::restart did not reach a clean latest schema: $state"; exit 1 ;;
          esac
          got="$(sqlite3 "$RUNNER_TEMP/before.db" 'SELECT count(*) FROM contacts')"
          [ "$got" = "$CONTACTS" ] || { echo "::error::contact count changed: $got != $CONTACTS"; exit 1; }

      # --- Kill point 2: between two migrations -----------------------------
      # A clean checkpoint at latest-1 is exactly what a process killed between
      # two migrations' clean-marks leaves: no dirty flag. A restart must RESUME.
      - name: Killed between two migrations — restart resumes, no force
        run: |
          "$RUNNER_TEMP/migratebench" checkpoint --db "$RUNNER_TEMP/src.db" --version "$((LATEST - 1))" --out "$RUNNER_TEMP/between.db"
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/between.db")"
          echo "intermediate: $state"
          case "$state" in
            "integrity_check=ok version=$((LATEST - 1)) dirty=false") ;;
            *) echo "::error::checkpoint is not a clean intermediate schema: $state"; exit 1 ;;
          esac
          SQLITE_DB_PATH="$RUNNER_TEMP/between.db" "$RUNNER_TEMP/migrate" up
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/between.db")"
          case "$state" in
            "integrity_check=ok version=${LATEST} dirty=false") ;;
            *) echo "::error::restart did not resume to latest: $state"; exit 1 ;;
          esac
          # A second restart of the now-healthy database is a clean no-op
          # (restart-loop convergence for the clean case).
          SQLITE_DB_PATH="$RUNNER_TEMP/between.db" "$RUNNER_TEMP/migrate" up
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/between.db")"
          case "$state" in
            "integrity_check=ok version=${LATEST} dirty=false") ;;
            *) echo "::error::a second restart changed the state: $state"; exit 1 ;;
          esac

      # Kill point 3: SIGKILL the real server binary in the window between
      # "migrations done" and "listening" -- a completed upgrade at the DB
      # level, so every kill leaves it clean at latest, restart reaches
      # /health/ready.
      - name: SIGKILL the server after migrations, before ready — crash loop
        run: |
          "$RUNNER_TEMP/migratebench" checkpoint --db "$RUNNER_TEMP/src.db" --version 31 --out "$RUNNER_TEMP/server.db"
          JWT_SECRET_KEY="$(openssl rand -base64 32)"
          export JWT_SECRET_KEY
          export PROFILE_PHOTO_DIR="$RUNNER_TEMP/photos"
          export ATTACHMENTS_DIR="$RUNNER_TEMP/attachments"
          mkdir -p "$PROFILE_PHOTO_DIR" "$ATTACHMENTS_DIR"
          export SQLITE_DB_PATH="$RUNNER_TEMP/server.db"
          export PORT=7399
          export FRONTEND_URL='*'
          want="integrity_check=ok version=${LATEST} dirty=false"
          for i in 1 2 3; do
            rm -f "$RUNNER_TEMP/server.db-wal" "$RUNNER_TEMP/server.db-shm"
            "$RUNNER_TEMP/server" > "/tmp/server-$i.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 120); do
              grep -qE 'Migrations applied successfully|No pending migrations|Server is ready to handle requests' "/tmp/server-$i.log" && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/server.db")"
            if [ "$state" != "$want" ]; then
              echo "::error::server kill $i left the database in $state (want $want)"
              cat "/tmp/server-$i.log"; exit 1
            fi
          done
          # Final restart: it must actually become ready.
          rm -f "$RUNNER_TEMP/server.db-wal" "$RUNNER_TEMP/server.db-shm"
          "$RUNNER_TEMP/server" > /tmp/server-final.log 2>&1 &
          pid=$!
          code=000
          for _ in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7399/health/ready || true)"
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::server never became ready after the kill loop (last /health/ready=$code)"
            cat /tmp/server-final.log; exit 1
          fi
          got="$(sqlite3 "$RUNNER_TEMP/server.db" 'SELECT count(*) FROM contacts')"
          [ "$got" = "$CONTACTS" ] || { echo "::error::contact count changed: $got != $CONTACTS"; exit 1; }
          echo "server reached /health/ready after 3 post-migration kills, data intact"

  # Issue #498: the constraint x operation cells needing a real resource
  # limit, not an in-process error seam. Each asserts integrity_check ok
  # and no silent partial success after the limit hits -- slow/failed is
  # fine, corrupt is not. Table: docs/development/capacity-under-constraint.md.

  disk-full-write:
    permissions:
      contents: read
    name: ENOSPC during a bulk write does not corrupt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migratebench and dbinspect CLIs
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migratebench" ./cmd/migratebench
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      # A ~2 MiB tmpfs holds the migrated schema but not thousands of
      # seeded contact rows, so the populate transaction hits real ENOSPC
      # mid-write -- the exact spot a low-disk box is said to corrupt.
      - name: Mount a tiny filesystem to simulate disk exhaustion
        run: |
          sudo mkdir -p /mnt/diskfull
          sudo mount -t tmpfs -o size=2m tmpfs /mnt/diskfull
          echo "mounted 2m tmpfs at /mnt/diskfull"

      - name: A bulk write that exhausts the disk must fail, not corrupt
        working-directory: backend
        run: |
          set +e
          "$RUNNER_TEMP/migratebench" seed --contacts 8000 --db /mnt/diskfull/seed.db > /tmp/seed.log 2>&1
          rc=$?
          set -e
          echo "seed exit=$rc"
          tail -n 20 /tmp/seed.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the bulk write succeeded on a 2 MiB disk — raise --contacts"
            exit 1
          fi
          # The non-negotiable outcome (issue #498): whatever is on disk is
          # never corrupt. An empty/absent file is fine (nothing committed); a
          # readable database must pass integrity_check.
          if [ -s /mnt/diskfull/seed.db ]; then
            ic="$(sqlite3 /mnt/diskfull/seed.db 'PRAGMA integrity_check' 2>&1 || true)"
            echo "integrity_check: $ic"
            if [ "$ic" != "ok" ]; then
              echo "::error::ENOSPC during a bulk write left a corrupt database: $ic"
              exit 1
            fi
          else
            echo "no partial database was committed"
          fi

      - name: The same write to healthy storage produces a clean database
        working-directory: backend
        run: |
          "$RUNNER_TEMP/migratebench" seed --contacts 8000 --db "$RUNNER_TEMP/healthy.db"
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/healthy.db")"
          echo "$state"
          case "$state" in
            "integrity_check=ok version="*) ;;
            *) echo "::error::healthy-storage seed did not produce a clean database: $state"; exit 1 ;;
          esac

      - name: Unmount the tiny filesystem
        if: always()
        run: |
          sudo umount /mnt/diskfull || true

  disk-full-fts-rebuild:
    permissions:
      contents: read
    name: ENOSPC during an FTS rebuild leaves the prior index intact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migratebench, backfill-search-index and dbinspect CLIs
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migratebench" ./cmd/migratebench
          go build -o "$RUNNER_TEMP/backfill-search-index" ./cmd/backfill-search-index
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      - name: Seed a populated database and build its search index
        working-directory: backend
        run: |
          "$RUNNER_TEMP/migratebench" seed --contacts 15000 --db "$RUNNER_TEMP/src.db"
          "$RUNNER_TEMP/backfill-search-index" -db "$RUNNER_TEMP/src.db"
          before="$(sqlite3 "$RUNNER_TEMP/src.db" 'SELECT count(*) FROM contacts_fts')"
          echo "FTS_BEFORE=$before" >> "$GITHUB_ENV"
          [ "$before" -gt 0 ] || { echo "::error::baseline FTS index is empty"; exit 1; }

      # A filesystem with only 64 KiB of slack over the database file cannot
      # hold the WAL a full DELETE-then-reINSERT of every FTS row generates, so
      # the rebuild transaction hits ENOSPC and rolls back.
      - name: Move the database onto a filesystem with almost no slack
        run: |
          bytes="$(stat -c %s "$RUNNER_TEMP/src.db")"
          size=$(( bytes + 65536 ))
          sudo mkdir -p /mnt/diskfull
          sudo mount -t tmpfs -o "size=${size}" tmpfs /mnt/diskfull
          cp "$RUNNER_TEMP/src.db" /mnt/diskfull/app.db
          echo "mounted tmpfs size=${size} (db=${bytes}) at /mnt/diskfull"

      - name: The rebuild fails closed and the prior index survives untouched
        working-directory: backend
        run: |
          set +e
          "$RUNNER_TEMP/backfill-search-index" -db /mnt/diskfull/app.db > /tmp/rebuild.log 2>&1
          rc=$?
          set -e
          echo "rebuild exit=$rc"
          tail -n 20 /tmp/rebuild.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the FTS rebuild somehow completed with almost no free space"
            exit 1
          fi
          ic="$(sqlite3 /mnt/diskfull/app.db 'PRAGMA integrity_check' 2>&1 || true)"
          echo "integrity_check: $ic"
          [ "$ic" = "ok" ] || { echo "::error::ENOSPC during FTS rebuild corrupted the database: $ic"; exit 1; }
          after="$(sqlite3 /mnt/diskfull/app.db 'SELECT count(*) FROM contacts_fts')"
          echo "FTS rows before=$FTS_BEFORE after=$after"
          [ "$after" = "$FTS_BEFORE" ] || { echo "::error::the rolled-back rebuild did not leave the prior index whole ($after != $FTS_BEFORE)"; exit 1; }

      - name: On healthy storage the rebuild succeeds and the index is consistent
        working-directory: backend
        run: |
          cp /mnt/diskfull/app.db "$RUNNER_TEMP/recovered.db"
          "$RUNNER_TEMP/backfill-search-index" -db "$RUNNER_TEMP/recovered.db"
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/recovered.db")"
          echo "$state"
          case "$state" in
            "integrity_check=ok version="*) ;;
            *) echo "::error::recovered database is not clean: $state"; exit 1 ;;
          esac
          live="$(sqlite3 "$RUNNER_TEMP/recovered.db" 'SELECT count(*) FROM contacts WHERE deleted_at IS NULL')"
          fts="$(sqlite3 "$RUNNER_TEMP/recovered.db" 'SELECT count(*) FROM contacts_fts')"
          echo "live contacts=$live indexed=$fts"
          [ "$fts" = "$live" ] || { echo "::error::the recovered FTS index is inconsistent ($fts != $live)"; exit 1; }

      - name: Unmount the tiny filesystem
        if: always()
        run: |
          sudo umount /mnt/diskfull || true

  mem-limited-migration:
    permissions:
      contents: read
    name: Migration under a tight memory cap completes or refuses — never corrupts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    env:
      # The floor moved to v1.0.0 (= current latest, #1170), making a
      # version-31 database sub-floor; this job tests migration/interruption
      # behavior, not the floor refusal, so it uses the documented bridge
      # until a later release adds a migration above the floor.
      MYCORRHIZAL_ALLOW_SUB_FLOOR_MIGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migratebench, migrate and dbinspect CLIs
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migratebench" ./cmd/migratebench
          go build -o "$RUNNER_TEMP/migrate" ./cmd/migrate
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      - name: Confirm systemd-run is available for the memory cap
        run: sudo systemd-run --version

      - name: Build a populated floor database
        working-directory: backend
        run: |
          "$RUNNER_TEMP/migratebench" seed --contacts 8000 --db "$RUNNER_TEMP/src.db"
          "$RUNNER_TEMP/migratebench" checkpoint --db "$RUNNER_TEMP/src.db" --version 31 --out "$RUNNER_TEMP/floor.db"
          rm -f "$RUNNER_TEMP/src.db" "$RUNNER_TEMP/src.db-wal" "$RUNNER_TEMP/src.db-shm"

      # 128 MiB, swap disabled: the migration either fits and completes, or the
      # kernel OOM-kills it. Both are defined outcomes for issue #498; the one
      # unacceptable result is a corrupt database.
      - name: Migrate the floor database under a 128 MiB memory cap
        run: |
          set +e
          sudo systemd-run --scope -p MemoryMax=128M -p MemorySwapMax=0 \
            env SQLITE_DB_PATH="$RUNNER_TEMP/floor.db" \
                MYCORRHIZAL_PRE_MIGRATION_BACKUP_DIR="$RUNNER_TEMP/premig" \
            "$RUNNER_TEMP/migrate" up 2>&1 | tee /tmp/migrate-mem.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "migrate exit=$rc"
          # systemd-run --scope ran as root; hand the files back so the
          # non-sudo restart step can open them read-write.
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP"/floor.db* "$RUNNER_TEMP/premig" 2>/dev/null || true

      - name: Whatever the outcome, the database is structurally intact
        run: |
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/floor.db")"
          echo "$state"
          case "$state" in
            "integrity_check=ok version="*) ;;
            *) echo "::error::migration under a memory cap left the database corrupt: $state"; exit 1 ;;
          esac

      - name: A restart converges — resumes to latest, or refuses a dirty state
        run: |
          set +e
          SQLITE_DB_PATH="$RUNNER_TEMP/floor.db" MYCORRHIZAL_PRE_MIGRATION_BACKUP_DIR="$RUNNER_TEMP/premig" \
            "$RUNNER_TEMP/migrate" up > /tmp/migrate-restart.log 2>&1
          set -e
          cat /tmp/migrate-restart.log
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/floor.db")"
          echo "restart state: $state"
          case "$state" in
            "integrity_check=ok version="*" dirty=false")
              echo "converged clean" ;;
            "integrity_check=ok version="*" dirty=true")
              grep -q "dirty migration state" /tmp/migrate-restart.log \
                || { echo "::error::database left dirty but the restart did not fail closed"; exit 1; }
              echo "left dirty and correctly refused (MIG-04)" ;;
            *)
              echo "::error::unexpected restart state: $state"; exit 1 ;;
          esac

  cpu-limited-correctness:
    permissions:
      contents: read
    name: Operations under a tight CPU cap stay correct (just slower)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.chaos == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build the migratebench and dbinspect CLIs, and backfill-search-index
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/migratebench" ./cmd/migratebench
          go build -o "$RUNNER_TEMP/backfill-search-index" ./cmd/backfill-search-index
          go build -o "$RUNNER_TEMP/dbinspect" ./cmd/dbinspect

      - name: Confirm systemd-run is available for the CPU cap
        run: sudo systemd-run --version

      # systemd-run --scope needs root, so the CLIs run as root and write
      # root-owned database files; chown them back so the later read-only
      # assertions run as the normal user without a WAL permission dance.
      - name: Seed a database and rebuild its search index under a 20% CPU cap
        run: |
          sudo systemd-run --scope -p CPUQuota=20% \
            "$RUNNER_TEMP/migratebench" seed --contacts 4000 --db "$RUNNER_TEMP/cpu.db"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP"/cpu.db*
          got="$(sqlite3 "$RUNNER_TEMP/cpu.db" 'SELECT count(*) FROM contacts')"
          [ "$got" -ge 4000 ] || { echo "::error::seed under a CPU cap produced $got contacts, want >= 4000"; exit 1; }

          sudo systemd-run --scope -p CPUQuota=20% \
            "$RUNNER_TEMP/backfill-search-index" -db "$RUNNER_TEMP/cpu.db"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP"/cpu.db*
          live="$(sqlite3 "$RUNNER_TEMP/cpu.db" 'SELECT count(*) FROM contacts WHERE deleted_at IS NULL')"
          fts="$(sqlite3 "$RUNNER_TEMP/cpu.db" 'SELECT count(*) FROM contacts_fts')"
          echo "live contacts=$live indexed=$fts"
          [ "$fts" = "$live" ] || { echo "::error::FTS rebuild under a CPU cap is inconsistent ($fts != $live)"; exit 1; }

      # dbinspect is the "never corrupt" assertion; the row counts above are
      # "still correct". `doctor`'s ADR-0012 pass is deliberately NOT run
      # here -- migratebench seeds attachment rows with no backing files,
      # so its INV-D4 check always fires and says nothing about throttling.
      - name: The result is structurally intact
        run: |
          state="$("$RUNNER_TEMP/dbinspect" "$RUNNER_TEMP/cpu.db")"
          echo "$state"
          case "$state" in
            "integrity_check=ok version="*) ;;
            *) echo "::error::CPU-capped operations left the database in $state"; exit 1 ;;
          esac
          fk="$(sqlite3 "$RUNNER_TEMP/cpu.db" 'PRAGMA foreign_key_check' 2>&1 || true)"
          [ -z "$fk" ] || { echo "::error::foreign_key_check reported rows: $fk"; exit 1; }
