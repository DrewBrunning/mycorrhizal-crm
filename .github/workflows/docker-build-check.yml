name: Docker Build Check

# Build-only validation for the split backend/frontend images (no push, no
# registry auth needed). The all-in-one root Dockerfile is deliberately not
# covered here — e2e-tests.yml already builds it on every PR as a
# prerequisite for the e2e run, so re-building it here would be redundant.
# These two are otherwise only built on tag push, in docker-publish.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  # The matrix here is split into two explicit jobs because `matrix` context
  # is not available in a job-level `if`.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

  # Keeps the shipped container's Go version in lockstep with the toolchain
  # CI actually tests against. backend/go.mod pins `toolchain go1.26.6`, and
  # the Dockerfiles hardcode `golang:1.26.6-alpine` independently -- when
  # Dependabot bumps the gomod toolchain it does not touch the Dockerfile
  # FROM line, so the two can drift silently and ship a container built with
  # an older Go than CI tested. The Go toolchain here is pinned deliberately
  # (see /CLAUDE.md); this enforces the pin in the one place it can still
  # drift out from under it. Pure text parsing, no Docker needed, so it runs
  # fast and independently of the two build jobs below.
  toolchain-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert Dockerfiles match backend/go.mod's pinned toolchain
        run: |
          set -euo pipefail
          toolchain_version=$(grep -oP '^toolchain go\K[0-9.]+' backend/go.mod)
          if [ -z "$toolchain_version" ]; then
            echo "::error file=backend/go.mod::No 'toolchain' directive found to check against."
            exit 1
          fi

          fail=0
          for f in Dockerfile backend/Dockerfile; do
            versions=$(grep -oP 'FROM[^\n]*\bgolang:\K[0-9.]+(?=-alpine)' "$f" || true)
            if [ -z "$versions" ]; then
              echo "::error file=$f::No 'golang:<version>-alpine' base image found."
              fail=1
              continue
            fi
            while IFS= read -r v; do
              if [ "$v" != "$toolchain_version" ]; then
                echo "::error file=$f::golang base image is $v but backend/go.mod pins toolchain go$toolchain_version"
                fail=1
              fi
            done <<< "$versions"
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: Dockerfile golang images match backend/go.mod toolchain go$toolchain_version"

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=./backend/Dockerfile
          cache-to: type=gha,scope=./backend/Dockerfile,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=./frontend/Dockerfile
          cache-to: type=gha,scope=./frontend/Dockerfile,mode=max
