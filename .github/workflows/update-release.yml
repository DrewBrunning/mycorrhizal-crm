name: Update Release

# Short-term release-prep helper that automates what PR #705 did by hand for
# v0.6.4 (register the release + commit its schema dump), plus the tag step
# that PR's merge note left as a manual follow-up ("the tag must be moved to a
# commit containing the dump"). It is deliberately narrow: it prepares the
# schema fixture and cuts the tag, but does NOT run pre-release testing or
# assemble release artifacts — that is the v0.7.0 unified release action's job,
# and this file should be deleted when that lands.
#
# Dispatch with a version (e.g. v0.6.6) and it:
#
#   1. validates the input and that no such tag already exists;
#   2. cuts release/<version> from main;
#   3. appends {Tag: <version>, Version: <highest migration in the tree>} to
#      backend/internal/schemafixture/releases.go. Version is the MIGRATION
#      version — the schema a release ships is fully determined by its highest
#      applied migration (see dump.go) — NOT "previous release version + 1":
#      a patch release that ships no migration keeps its predecessor's version,
#      and two tags may legitimately share one;
#   4. regenerates the schema dumps via `go run ./cmd/genschema`, and FAILS if
#      anything other than <version>.sql appears — existing dumps must
#      regenerate byte-identical, so any modification means an old migration
#      was edited and the frozen chain has drifted;
#   5. runs the schemafixture + genschema test gates (reproducibility and
#      completeness);
#   6. commits, creates the <version> tag at that commit, and pushes branch +
#      tag;
#   7. opens the PR to main.
#
# The tag points at the branch commit, not main: docker-publish.yml fires on
# the tag push and its schema-fixture-gate checks the TAGGED tree for the dump,
# which exists on this commit. If review changes the branch, the tag must be
# moved to the final commit before the release builds (the v0.6.4 trap).
#
# Repo setting required: "Allow GitHub Actions to create and approve pull
# requests" must be enabled, or the default GITHUB_TOKEN cannot open the PR
# (`gh pr create` fails with "Resource not accessible by integration").

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to prepare, e.g. v0.6.6'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cut from the true main tip; fetch-depth 0 so the "tag exists" check
          # and tag creation see the full ref set. persist-credentials: false
          # per repo convention — this job publishes no artifacts, and the
          # push step scopes its own credential.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like vMAJOR.MINOR.PATCH (e.g. v0.6.6); got '$VERSION'."
            exit 1
          fi
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists; pick a version that has not shipped."
            exit 1
          fi
          if grep -qF "{Tag: \"$VERSION\"," backend/internal/schemafixture/releases.go; then
            echo "::error::$VERSION is already registered in SupportedReleases."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/$VERSION" >> "$GITHUB_ENV"

      - name: Derive the migration version from the tree
        run: |
          set -eu
          migver=""
          for f in backend/database/migrations/[0-9]*_*.up.sql; do
            [ -f "$f" ] || continue
            n="${f##*/}"; n="${n%%_*}"
            n=$((10#$n))
            if [ -z "$migver" ] || [ "$n" -gt "$migver" ]; then migver="$n"; fi
          done
          if [ -z "$migver" ]; then
            echo "::error::No migration files found under backend/database/migrations/."
            exit 1
          fi
          echo "MIGRATION_VERSION=$migver" >> "$GITHUB_ENV"
          echo "Derived migration version $migver (highest 000NNN_*.up.sql in the tree)."

      - name: Create branch and register the release
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Append {Tag: "$VERSION", Version: $MIGRATION_VERSION} after the last
          # existing SupportedReleases entry, preserving release order.
          python3 - "$VERSION" "$MIGRATION_VERSION" <<'PYEOF'
          import sys
          version, migver = sys.argv[1], sys.argv[2]
          path = "backend/internal/schemafixture/releases.go"
          lines = open(path).read().splitlines(keepends=True)
          idx = max(i for i, line in enumerate(lines) if line.lstrip().startswith("{Tag:"))
          lines.insert(idx + 1, f'\t{{Tag: "{version}", Version: {migver}}},\n')
          open(path, "w").writelines(lines)
          PYEOF
          gofmt -w backend/internal/schemafixture/releases.go
          git diff -- backend/internal/schemafixture/releases.go

      - name: Regenerate schema dumps
        working-directory: backend
        run: go run ./cmd/genschema

      # The frozen-chain check: genschema rewrites every dump in place, so this
      # asserts exactly one new (untracked) file and zero modifications. A
      # modified pre-existing dump means an old migration was edited — fail
      # loudly rather than ship a rewritten history.
      - name: Assert only the new dump changed
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          expected="?? backend/database/testdata/schemas/${VERSION}.sql"
          actual="$(git status --porcelain -- backend/database/testdata/schemas/)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Schema dumps did not regenerate as expected."
            echo "::error::Expected exactly: ${expected}"
            echo "$actual"
            exit 1
          fi
          echo "Frozen chain holds: existing dumps byte-identical; ${VERSION}.sql is the only new file."

      - name: Verify schemafixture and genschema tests pass
        working-directory: backend
        run: go test ./internal/schemafixture/... ./cmd/genschema/...

      - name: Commit
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          git add backend/internal/schemafixture/releases.go backend/database/testdata/schemas/"$VERSION".sql
          git commit -m "chore: add $VERSION release schema fixture (issue #529)"

      - name: Create and push tag
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The tag must point at THIS commit (the one carrying the dump): the
          # docker-publish schema-fixture-gate checks the tagged tree.
          git tag "$VERSION"
          # Scoped credential for the push only; the token never appears in a
          # URL or argv (the helper reads it from the step env at runtime).
          # ${GITHUB_TOKEN} must expand at git-helper runtime, not here — early
          # expansion would embed the token in the script text.
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "HEAD:refs/heads/${BRANCH}"
          git -c credential.helper="$helper" push origin "refs/tags/${VERSION}"

      # The body is built before the PR step (which consumes the file), and
      # kept separate so the heredoc's escaped backticks are the only oddity.
      - name: Write PR body
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
        run: |
          cat > /tmp/update-release-pr-body.md <<BODY
          Prepared by the Update Release workflow, mirroring PR #705.

          - \`{Tag: "$VERSION", Version: $MIGRATION_VERSION}\` appended to \`backend/internal/schemafixture/releases.go\` (Version is the migration version, not a release counter)
          - \`backend/database/testdata/schemas/$VERSION.sql\` generated via \`cd backend && go run ./cmd/genschema\` — existing dumps regenerated byte-identical (frozen chain holds)
          - schemafixture + genschema tests pass
          - tag \`$VERSION\` created at the branch commit (the one containing the dump), so the docker-publish schema-fixture-gate passes on the tag push

          Note: the tag points at this branch's commit, not at main. If this branch changes during review, move the tag to the final commit before the release builds.
          BODY

      - name: Open pull request
        env:
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: prepare $VERSION (schema fixture + tag, issue #529)" \
            --body-file /tmp/update-release-pr-body.md
