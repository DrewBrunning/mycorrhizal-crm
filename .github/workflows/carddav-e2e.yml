name: CardDAV Real-Server E2E (reference-server matrix)

# Issues #496 + #681 (DATA — CardDAV round-trip integration tests / TEST-09):
# the real-server complement to the fake-based CardDAV suite. The fake
# (backend/services/fake_carddav_server_test.go) encodes OUR understanding of
# the protocol, so a fake-only suite reproduces exactly the failure ADR-0002
# warns about — code and tests consistently, confidently wrong, and green. A
# real server is the only thing that can contradict us. This job runs the
# same full sync lifecycle + TEST-02 fixture round trip against REAL reference
# servers (Radicale, Baikal, Nextcloud) and asserts semantic equality via
# TEST-03 (#431), pinning each server's documented divergences in the test
# itself (Radicale's vobject divergences, Baikal/Nextcloud's Sabre VObject
# vCard 4.0 -> 3.0 re-serialization).
#
# DAViCal is deliberately absent: the only docker image (janlo/davical) is a
# legacy Debian-stretch build whose nonstandard provisioning (SCRAM-incompatible
# libpq, no headless user/collection creation) made it unpinnable; documented
# in docs/development/testing.md. Radicale + Baikal + Nextcloud already exceed
# #496's single-server baseline.
#
# Gating: scheduled (nightly) and manual dispatch always run; on PR/push the
# job fires only when the `carddav` filter in .github/filters.yaml matches
# (the sync/CardDAV machinery or the harness itself) — NOT on every backend
# change. The fast deterministic fake suite stays the every-PR gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 3 * * *' # 03:45 UTC nightly (consolidated nightly suite)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Issue #264 pattern: path-gated checks — see unit-tests.yml / chaos-tests.yml.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      carddav: ${{ steps.filter.outputs.carddav }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      - name: Report gating decision
        run: |
          echo "carddav=$CARDDAV_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          CARDDAV_CHANGED: ${{ steps.filter.outputs.carddav }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  reference-servers:
    permissions:
      contents: read
    name: CardDAV round trip against real ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Scheduled runs and manual dispatch always run (no diff to gate on);
    # otherwise only when the CardDAV machinery or the harness changes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.carddav == 'true' || needs.changes.outputs.workflows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: Radicale
            id: radicale
            port: 5232
            user: syncuser
            password: syncsecret
          - server: Baikal
            id: baikal
            port: 5233
            user: syncuser
            password: syncsecret
          - server: Nextcloud
            id: nextcloud
            port: 5234
            user: syncuser
            password: SynCsecret-8f9a

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Radicale: a throwaway container with basic auth (htpasswd, plain) and
      # the owner_only rights model. Pinned by digest so the supply chain is
      # deterministic.
      - name: Start Radicale
        if: matrix.server == 'Radicale'
        run: |
          mkdir -p /tmp/radicale/config /tmp/radicale/data
          cat > /tmp/radicale/config/config <<'EOF'
          [server]
          hosts = 0.0.0.0:5232
          [auth]
          type = htpasswd
          htpasswd_filename = /config/users
          htpasswd_encryption = plain
          [rights]
          type = owner_only
          [storage]
          filesystem_folder = /data/collections
          EOF
          printf 'syncuser:syncsecret\n' > /tmp/radicale/config/users
          docker run -d --name radicale \
            -p 5232:5232 \
            -v /tmp/radicale/config:/config \
            -v /tmp/radicale/data:/data \
            tomsquest/docker-radicale@sha256:89fa44d02b134f0ac37cad809883327af8424499d913eec74f95085c458a93b7
          echo "Waiting for Radicale to listen..."
          timeout 60 bash -c 'until curl -s -o /dev/null -w "" http://127.0.0.1:5232/; do sleep 1; done'
          echo "Radicale is up"

      # Baikal: headless provisioning (install wizard + direct DB seeding) —
      # stdlib-only, no pip installs (zizmor audits pip) — see
      # .github/scripts/carddav-reference/provision-baikal.sh.
      - name: Start Baikal
        if: matrix.server == 'Baikal'
        run: .github/scripts/carddav-reference/provision-baikal.sh baikal 5233 /tmp/baikal-data

      # Nextcloud: occ-based provisioning — see
      # .github/scripts/carddav-reference/provision-nextcloud.sh.
      - name: Start Nextcloud
        if: matrix.server == 'Nextcloud'
        run: .github/scripts/carddav-reference/provision-nextcloud.sh nextcloud 5234

      - name: Run the real-server CardDAV round-trip suite
        working-directory: backend
        run: go test ./services/ -run '^TestCardDAVReferenceServer_RoundTrip$' -count=1 -v
        env:
          MYCORRHIZAL_CARDDAV_SERVER_ID: ${{ matrix.id }}
          MYCORRHIZAL_CARDDAV_SERVER_URL: http://127.0.0.1:${{ matrix.port }}
          MYCORRHIZAL_CARDDAV_USER: ${{ matrix.user }}
          MYCORRHIZAL_CARDDAV_PASSWORD: ${{ matrix.password }}

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== server logs ==="
          docker logs ${{ matrix.id }} || true

      - name: Stop server
        if: always()
        run: docker rm -f ${{ matrix.id }} || true
