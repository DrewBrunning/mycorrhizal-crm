name: Dependency Review

on:
  pull_request:

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scans the PR's dependency changes for known-vulnerable additions and
      # dependency-confusion / typosquatting attacks. Requires the Dependency
      # graph + Dependency submission to be enabled on the repo.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
