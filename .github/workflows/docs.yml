name: Deploy docs to GitHub Pages                                                                                                                                   
                                                                                                                                                                    
on:                                                                                                                                                                 
  push:                                                                                                                                                             
    branches: ["main"]                                                                                                                                              
    paths: ["docs/**"]                                                                                                                                              
  workflow_dispatch:
                                                                                                                                                                    
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build
        # base_path via env rather than inline ${{ }} (zizmor template-injection).
        run: bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
        working-directory: docs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/_site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # zizmor excessive-permissions (issue #358): pages/id-token are only
    # needed to publish, so they are scoped to this job instead of the
    # workflow level where the build job would inherit them too.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
