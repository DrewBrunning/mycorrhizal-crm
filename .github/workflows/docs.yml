name: Deploy docs to GitHub Pages

# Versioned documentation site (issue #2244). Each run rebuilds every published
# version and deploys them as one Pages artifact:
#   /          the newest release, built from its tag
#   /X.Y/      older releases (newest patch of each minor), built from their tags
#   /next/     the unreleased docs on main
# scripts/build-docs-versions.sh does the work; cmd/docsversions picks the tags.
on:
  push:
    branches: ["main"]
    # CHANGELOG.md is published as the site Changelog page, so a merge that
    # changes it redeploys the site and unreleased entries are visible at once.
    paths: ["docs/**", "CHANGELOG.md", "scripts/build-docs-versions.sh", "scripts/docs-release-tags.sh"]
  # A final release publishes its docs as the new root: release.yml and
  # promote-rc.yml dispatch this workflow on main once the tag exists. There is
  # deliberately no `push: tags` trigger: the github-pages environment only
  # deploys from main (a tag run would be refused), and promote-rc.yml pushes
  # the final tag with GITHUB_TOKEN, which starts no workflow at all
  # (internal/releaseworkflow CheckDocsPublish pins this).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always main: it holds the build script, the switcher and the /next/
      # docs. fetch-depth 0 brings every tag and the release/* branches, which
      # scripts/docs-release-tags.sh needs to tell reviewed tags from others.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build every docs version
        # base_path via env rather than inline ${{ }} (zizmor template-injection).
        run: scripts/build-docs-versions.sh docs-site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DOCS_NEXT_REF: main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # zizmor excessive-permissions (issue #358): pages/id-token are only
    # needed to publish, so they are scoped to this job instead of the
    # workflow level where the build job would inherit them too.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
