name: Build and Push Docker Images

on:
  push:
    tags: ['v*']

  # Manual fallback for a tag whose push event never produced a run (e.g. a
  # webhook-delivery outage, as happened 2026-08-06) -- the only other recovery
  # is deleting and re-pushing the tag. Takes the tag as an INPUT rather than
  # the dispatch ref, so it can rebuild a tag whose commit predates this change.
  #
  # Issue #1396 -- what the fallback does NOT produce: apk-provenance (SLSA,
  # push-only: the generator records the triggering ref, and a dispatch from a
  # branch is a branch ref slsa-verifier --source-tag rejects) and
  # create-release (the Release already exists). verify-release-assets and
  # post-publish-smoke DO run on dispatch; with no SLSA provenance the
  # completeness assertion fails, so a fallback-only release concludes RED and
  # is reported as not promotable (promote-rc.yml also refuses it up front).
  # Recovery: cut the next release candidate, or re-push the tag once the
  # workflow at the tag's commit is fixed. See docs/development/release-gates.md.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.3.0)'
        required: true
        type: string
      # REL-03 (issue #447): the only way past a failed release-gate. Empty on a
      # tag push (there is no dispatch), so a push always enforces. A non-empty
      # value is logged to the run summary with the actor. Policy:
      # docs/development/release-gates.md.
      override_reason:
        description: 'REL-03: reason to bypass the release-gate check (leave blank to enforce)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Everything below keys off this rather than github.ref_name/github.sha,
  # which on a dispatch point at the branch, not the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  # REL-01 (issue #445): release-tag format gate, so a malformed/stray tag
  # (the v1.7.0 class, #545) can't build/sign/publish. Pattern must match
  # docs/versioning-policy.md and backend/internal/versionpolicy/tagpattern.go
  # (drift-tested). Every root job depends on this.
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag against the versioning policy
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -eu
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Tag '$RELEASE_TAG' violates the versioning policy (vMAJOR.MINOR.PATCH, optional -rc.N). Refusing to publish. See docs/versioning-policy.md."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is a valid release tag."

  # Issue #1487: the tag-time battery used to re-run every gate that release.yml
  # had just passed -- every flaky suite got a second roll, and a second-battery
  # failure left a tag with no artifacts. This job decides whether the pre-tag
  # battery can be accepted instead: it reads the per-gate ledger release.yml
  # recorded in the release-readiness artifact, asks `releaseplan reuse` whether
  # EVERY composed gate is a recorded success for one validated commit AND the
  # tagged commit differs from it only by the schema-fixture registration
  # (releases.go + the new dump), and hands release-gate the skip list.
  # Anything unprovable (no artifact, expired, a gate not green, any other file
  # changed, a missing diff) is reuse=false and the full battery runs, as before.
  # continue-on-error: this job can only ever cost the reuse, never block a
  # release -- its outputs are then empty, which release-gate reads as "run all".
  reuse-decision:
    needs: validate-tag
    if: ${{ inputs.override_reason == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      # Read the release-readiness artifact.
      actions: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      skip_gates: ${{ steps.decide.outputs.skip_gates }}
      carried: ${{ steps.decide.outputs.carried }}
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Full history: the validated commit must be an ancestor of the tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Decide whether the pre-tag battery can be reused
        id: decide
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          ledger="${RUNNER_TEMP}/ledger.json"
          diff_file="${RUNNER_TEMP}/changed-files.txt"
          rm -f "$ledger" "$diff_file"
          art_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-readiness-${RELEASE_TAG}" \
                      --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty' 2>/dev/null || true)"
          if [ -n "$art_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}/zip" > "${RUNNER_TEMP}/readiness.zip"
            unzip -o -q "${RUNNER_TEMP}/readiness.zip" -d "${RUNNER_TEMP}/readiness"
            jq '.gate_ledger // []' "${RUNNER_TEMP}/readiness/release-readiness.json" > "$ledger"
            validated="$(jq -r --arg t "$RELEASE_TAG" '[.[] | select(.release_tag == $t) | .sha] | unique | if length == 1 then .[0] else empty end' "$ledger")"
            # The diff list is written ONLY when the validated commit is a real
            # ancestor of the tag; without it the tool refuses reuse.
            if [ -n "$validated" ] && git cat-file -e "${validated}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$validated" "$tag_sha"; then
              git diff --name-only "$validated" "$tag_sha" > "$diff_file"
            fi
          else
            echo "::notice::No release-readiness artifact for ${RELEASE_TAG} (tag not cut by release.yml, or it expired): the full battery runs."
          fi
          (cd backend && go run ./cmd/releaseplan reuse \
            -composer ../.github/workflows/release-validate.yml \
            -ledger "$ledger" -tag "$RELEASE_TAG" -tag-sha "$tag_sha" \
            -changed-files "$diff_file") > "${RUNNER_TEMP}/decision.txt"
          cat "${RUNNER_TEMP}/decision.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### Tag-time battery"
            echo
            echo "- reuse the pre-tag battery: \`$(sed -n 's/^reuse=//p' "${RUNNER_TEMP}/decision.txt")\`"
            echo "- reason: $(sed -n 's/^reason=//p' "${RUNNER_TEMP}/decision.txt")"
            echo "- gates carried instead of re-run: \`$(sed -n 's/^skip_gates=//p' "${RUNNER_TEMP}/decision.txt")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # REL-03 (issue #447), by composition (ADR 0021 / #1165): calls the same
  # reusable release-validate.yml that release.yml calls before tagging, so
  # "is this commit releasable" has one definition. A dispatch with a
  # non-empty override_reason skips this and records the bypass in the
  # sibling release-gate-override job instead. Full gate list:
  # docs/development/release-gates.md.
  release-gate:
    needs: [validate-tag, reuse-decision]
    if: ${{ inputs.override_reason == '' }}
    uses: ./.github/workflows/release-validate.yml
    # Issue #1484: the gate battery builds the all-in-one image ONCE (stamped
    # and labelled as this release) and tests exactly that image; `build-and-push`
    # below re-tags the digest it outputs instead of rebuilding. `source_ref` is
    # the tag so a manual dispatch builds the TAG's tree, not the branch's.
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
      source_ref: ${{ inputs.tag || github.ref_name }}
      # Issue #1487: when reuse-decision proved the tagged tree equals the tree
      # release.yml already validated, the gates it recorded green are carried
      # instead of re-rolled (build-candidate and the deploy-smoke floor still
      # run, so the digest that publishes is built from the tag and boot-tested).
      # Empty (no reuse) runs every gate, exactly as before.
      skip_gates: ${{ needs.reuse-decision.outputs.skip_gates }}
      carried_ledger: ${{ needs.reuse-decision.outputs.carried }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      # build-candidate pushes the candidate tag to GHCR.
      packages: write
      # GitHub validates nested-job permissions statically against every
      # caller in the chain, so these two are required even though the
      # steps that use them are skipped when composed (event_name ==
      # 'workflow_call'): security-events: write for release-validate.yml's
      # SARIF upload, statuses: write for unit-tests.yml's codecov-patch-stub
      # (#1188).
      security-events: write
      statuses: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The explicit, logged, attributed way past a failed gate (REL-03). Runs only
  # when an operator supplied an `override_reason` on a workflow_dispatch; it
  # records who bypassed the gate and why.
  release-gate-override:
    needs: validate-tag
    if: ${{ inputs.override_reason != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record the operator override
        env:
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          msg="RELEASE GATE OVERRIDDEN by ${ACTOR}: ${OVERRIDE_REASON}"
          echo "::warning::${msg}"
          echo "### :warning: ${msg}" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    runs-on: ubuntu-latest
    needs: [validate-tag, reuse-decision, release-gate, release-gate-override, build-android-apk]
    # #508: the protected `release` environment. Add required reviewers to it
    # (Settings -> Environments -> release) to gate publication behind a human;
    # until then it is a no-op. See docs/development/repo-governance.md.
    environment: release
    permissions:
      contents: write
      # Read the release-readiness artifact (ADR 0021, issue #1164).
      actions: read

    # push-only: a manual run recovers images for an existing release, and
    # re-running this would append a second Docker Images block. `always()` +
    # explicit result checks let it proceed on either gate outcome (ADR 0021/#1165).
    if: ${{ always() && github.event_name == 'push' && (needs.release-gate.result == 'success' || needs.release-gate-override.result == 'success') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REL-05 (#449): the operator-notes harvest below walks the commit
          # range since the previous tag, so needs full history + tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # zizmor cache-poisoning (#358): this job publishes the Release, so
          # no build cache from an earlier run is restored into it.
          cache: false

      # Resolve the exact refs build-and-push publishes rather than re-deriving
      # them here: (1) the build's semver tag drops the leading 'v'
      # (v0.6.5 -> 0.6.5), so a v-prefixed ref in the notes would 404; (2)
      # github.repository preserves account case but GHCR refs must be
      # lowercase. Keep in lockstep with the scan job's identical derivation.
      - name: Resolve published image references
        id: images
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${RELEASE_TAG#v}"
          {
            echo "all_in_one=ghcr.io/${repo}:${tag}"
            echo "backend=ghcr.io/${repo}-backend:${tag}"
            echo "frontend=ghcr.io/${repo}-frontend:${tag}"
          } >> "$GITHUB_OUTPUT"

      # REL-05 (#449): the operator-facing half of the changelog. GitHub's
      # generate_release_notes gives the categorized "what changed" list;
      # this harvests hand-written `## Upgrade notes`/`## Breaking changes`
      # blocks from PRs merged since the previous tag via cmd/releasenotes.
      # Best-effort: any failure still yields the tool's "no action required"
      # section, so it never blocks a release.
      - name: Harvest operator notes from the release's PRs
        id: opnotes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="${prev}..${RELEASE_TAG}"; else range="${RELEASE_TAG}"; fi
          echo "Harvesting operator notes over: ${range}"
          nums="$(git log "$range" --format='%s' | grep -oE '\(#[0-9]+\)$' | tr -cd '0-9\n' | sort -un || true)"
          prs='[]'
          for n in $nums; do
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" \
                    --jq '{number, title, url: .html_url, body}' 2>/dev/null || true)"
            if [ -n "$pr" ]; then
              prs="$(printf '%s\n%s\n' "$prs" "$pr" | jq -c -s '.[0] + [.[1]]')"
            fi
          done
          block="$(printf '%s' "$prs" | (cd backend && go run ./cmd/releasenotes))"
          {
            echo 'block<<OPNOTES_EOF'
            echo "$block"
            echo 'OPNOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # action-gh-release's append_body semantics (append to an existing
      # release on a manual recovery run) have no gh-CLI equivalent; replacing
      # it would change release behavior.
      - name: Create GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          append_body: true
          # RC-02 (#446): an `-rc.` tag is a SemVer pre-release; marking it
          # prerelease and never make_latest keeps it off the in-app update
          # check and Obtainium's default feed. Promotion flips both on the
          # final tag (promote-rc.yml); later attach steps pass only
          # tag_name + files, so they don't reset this.
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc.') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-rc.') }}
          body: |

            ${{ steps.opnotes.outputs.block }}

            ## Docker Images

            All-in-one image (frontend + backend in one container):
            ```
            ${{ steps.images.outputs.all_in_one }}
            ```

            Separate images:
            ```
            ${{ steps.images.outputs.backend }}
            ${{ steps.images.outputs.frontend }}
            ```

      # ADR 0021 (#1163): the workflow that owns the Release owns every asset
      # on it, including release-metadata.json -- moved here from release.yml
      # to remove the forward dependency on a Release that workflow hadn't
      # created yet (#1158/#1159). Regenerated from the tagged tree: one
      # producer, no cross-run artifact fetch.
      - name: Emit and attach release metadata
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          migver=""
          for f in backend/database/migrations/[0-9]*_*.up.sql; do
            [ -f "$f" ] || continue
            n="${f##*/}"; n="${n%%_*}"; n=$((10#$n))
            if [ -z "$migver" ] || [ "$n" -gt "$migver" ]; then migver="$n"; fi
          done
          residual="${RUNNER_TEMP:-/tmp}/residual-risk.json"
          (cd backend && go run ./cmd/residualrisk -out "$residual")
          rc=false
          case "$RELEASE_TAG" in *-rc.*) rc=true ;; esac
          jq -n \
            --arg version "$RELEASE_TAG" \
            --argjson migration_version "${migver:-0}" \
            --arg source_revision "$(git rev-parse HEAD)" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg cut_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson rc "$rc" \
            --slurpfile residual "$residual" \
            '{
              version: $version,
              rc: $rc,
              migration_version: $migration_version,
              source_revision: $source_revision,
              workflow_run: $workflow_run,
              cut_at: $cut_at,
              gates: { release_validation: "passed (release-validate.yml composition)" },
              residual_risk: $residual[0]
            }' | tee release-metadata.json
          {
            echo "### Release metadata"
            echo '```json'
            cat release-metadata.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$RELEASE_TAG" release-metadata.json --clobber

      # ADR 0021 (#1164): attach the release-readiness record produced by
      # release.yml. A hand-pushed or recovery-dispatched tag has none, so
      # this warns and skips rather than failing. `gh api` needs actions:
      # read (granted above).
      - name: Attach the release-readiness record (if any)
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Issue #1487: the tag-time battery decision (reuse or full battery,
          # why, which gates were carried) is recorded in the readiness asset.
          REUSE_DECISION: ${{ needs.reuse-decision.outputs.decision }}
        run: |
          set -eu
          name="release-readiness-${RELEASE_TAG}"
          art_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}" \
                      --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last | .id // empty' 2>/dev/null || true)"
          if [ -z "$art_id" ]; then
            echo "::warning::No release-readiness artifact for ${RELEASE_TAG} (tag not cut by release.yml, or it expired); skipping."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}/zip" > "${RUNNER_TEMP}/readiness.zip"
          unzip -o -q "${RUNNER_TEMP}/readiness.zip" -d "${RUNNER_TEMP}/readiness"
          decision="${REUSE_DECISION:-}"
          if ! printf '%s' "$decision" | jq -e . >/dev/null 2>&1; then
            decision='{"reuse":false,"reason":"the reuse decision was unavailable: the full battery ran"}'
          fi
          jq --argjson d "$decision" '. + {tag_time_battery: $d}' "${RUNNER_TEMP}/readiness/release-readiness.json" > "${RUNNER_TEMP}/readiness/release-readiness.recorded.json"
          mv "${RUNNER_TEMP}/readiness/release-readiness.recorded.json" "${RUNNER_TEMP}/readiness/release-readiness.json"
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/readiness/release-readiness.json" --clobber

  # Builds the same signed release APK android-apk-build.yml's manual "release"
  # variant produces, and attaches it to this tag's Release so Obtainium picks
  # it up. No `needs: create-release` (matching build-and-push): release
  # creation and asset upload are independent, so a signing problem here
  # shouldn't block the Docker images. No push-only `if:` either -- unlike
  # create-release, this never touches the release body, so it's also safe on
  # the manual recovery dispatch.
  build-android-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest
    # base64(sha256) of the exact APK attached to the Release, consumed by the
    # `apk-provenance` job below as the SLSA generator's subject (issue #355).
    outputs:
      hashes: ${{ steps.apk-hash.outputs.hashes }}
    # REL-03 / #527: the signed, apksigner-verified APK is now a mandatory
    # release gate -- create-release and build-and-push both `needs:` this
    # job, so a build/signing failure blocks the Docker images too
    # (rationale: docs/development/release-gates.md, "The Android decision").
    needs: [validate-tag, release-gate, release-gate-override]
    # Proceed on either gate outcome (ADR 0021/#1165); `always()` is required
    # since one of the two gate jobs is always skipped.
    if: ${{ always() && (needs.release-gate.result == 'success' || needs.release-gate-override.result == 'success') }}
    # #508: same protected `release` environment as create-release / build-and-push.
    environment: release
    # 90 min, doubled from 45 after v1.3.0-rc.1's APK job hit the old limit
    # mid-assemble (cancelled at exactly 45:16). Measured whole-job times: v1.1.0
    # 44.1 min (1 min under the old limit), v1.2.0-rc.2 32.2 min; #1390 then added
    # the uncached embedded-server Go cross-compile (~3.5 min). Runner variance alone
    # has moved unit tests + lint by ~6 min between runs, so keep generous headroom.
    timeout-minutes: 90
    permissions:
      contents: write
      # id-token + attestations let actions/attest-build-provenance mint a
      # short-lived Sigstore cert from GitHub's OIDC issuer and persist the
      # attestation (see "Attest the release APK" below). No key material.
      id-token: write
      attestations: write
    env:
      # Same rationale as android-apk-build.yml: nothing in the repo sets this,
      # and GitHub-hosted ubuntu runners install the SDK here.
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # Issue #1390 / ADR 0028 Decision 2: the release APK/AAB must embed the Go
      # server (lib/arm64-v8a/libmycorrhizal.so). android/app/build.gradle.kts
      # cross-compiles it with the `go` on PATH, using the toolchain backend/go.mod
      # pins; with -PMYCORRHIZAL_BUILD_EMBEDDED_SERVER=true a missing Go fails the
      # build, and the assertion step below re-checks the finished artifact.
      - name: Set up Go (embedded server)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # zizmor cache-poisoning (issue #358): this job builds the release APK
        # from a tagged commit and the resulting artifact is published, so no
        # cached build state from earlier (PR/other-trigger) runs is restored
        # into it — a poisoned cache entry would land in a shipped artifact.
        with:
          cache-disabled: true

      # Same gate as android-apk-build.yml, run first so a broken tagged commit
      # fails here instead of shipping a bad APK on the release.
      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest :app:testObtainiumDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug :app:lintObtainiumDebug

      # Same as android-apk-build.yml's "Materialize release keystore" step --
      # keep them in sync if either changes.
      - name: Materialize release keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release build requested but signing secrets are incomplete. Missing:$missing"
            echo "::error::All four signing secrets must be set (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "store_file=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_OUTPUT"

      # versionName strips 'v' and any `-rc.N` (#1022): promotion ships this
      # exact APK unrebuilt, so an RC reports the plain release it will
      # become. versionCode uses this workflow's own run number rather than
      # parsing the tag: tags aren't strict semver (e.g.
      # v0.2.0-alpha-candidate), so two tags could collide on
      # MAJOR.MINOR.PATCH. GITHUB_RUN_NUMBER only increases, so it's
      # guaranteed strictly increasing -- what Android requires to accept an
      # upgrade. +1000 is headroom above 1, the static placeholder every
      # non-release build still carries.
      - name: Compute release version
        id: version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          v="${RELEASE_TAG#v}"
          {
            echo "name=${v%%-*}"
            echo "code=$((1000 + GITHUB_RUN_NUMBER))"
            echo "commit=$(git rev-parse --short=7 HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MYCORRHIZAL_VERSION_NAME: ${{ steps.version.outputs.name }}
          MYCORRHIZAL_VERSION_CODE: ${{ steps.version.outputs.code }}
          MYCORRHIZAL_GIT_COMMIT: ${{ steps.version.outputs.commit }}
          MYCORRHIZAL_BUILD_DATE: ${{ steps.version.outputs.date }}
        # Version values via env, not inline ${{ }}: the tag name is the only
        # non-computed input here, and it is maintainer-chosen (zizmor
        # template-injection).
        run: |
          ./gradlew :app:assembleObtainiumRelease \
            -PMYCORRHIZAL_BUILD_EMBEDDED_SERVER=true \
            -PMYCORRHIZAL_VERSION_NAME="$MYCORRHIZAL_VERSION_NAME" \
            -PMYCORRHIZAL_VERSION_CODE="$MYCORRHIZAL_VERSION_CODE" \
            -PMYCORRHIZAL_GIT_COMMIT="$MYCORRHIZAL_GIT_COMMIT" \
            -PMYCORRHIZAL_BUILD_DATE="$MYCORRHIZAL_BUILD_DATE"

      # REL-03 / #527: "Materialize release keystore" only checks the signing
      # secrets are present -- a misconfigured signing block still produces an
      # unsigned APK. Verify the actual output; if ANDROID_SIGNING_CERT_SHA256
      # is set, also assert the signer cert matches. Failure message names
      # the PKCS12 trap (key/store password mismatch).
      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -eu
          apk="android/app/build/outputs/apk/obtainium/release/app-obtainium-release.apk"
          apksigner="$(find "$ANDROID_HOME"/build-tools -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          out="$("$apksigner" verify --print-certs --verbose "$apk" 2>&1)" || {
            echo "$out"
            echo "::error::apksigner could not verify $apk -- the release APK is not validly signed."
            echo "::error::Common cause: for this PKCS12 keystore, SIGNING_KEY_PASSWORD must EQUAL SIGNING_STORE_PASSWORD; a mismatch fails signing with an opaque padding error."
            exit 1
          }
          echo "$out"
          if ! printf '%s' "$out" | grep -qE 'Verified using v2 scheme .*: true' &&
            ! printf '%s' "$out" | grep -qE 'Verified using v3 scheme .*: true'; then
            echo "::error::APK is not signed with the v2 or v3 signature scheme; Android will refuse to install it."
            exit 1
          fi
          got="$(printf '%s' "$out" | grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')"
          echo "Signer certificate SHA-256: ${got:-<unparsed>}"
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            if [ "$got" != "$(printf '%s' "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')" ]; then
              echo "::error::APK signer certificate ($got) does not match ANDROID_SIGNING_CERT_SHA256 -- wrong keystore."
              exit 1
            fi
            echo "Signer certificate matches ANDROID_SIGNING_CERT_SHA256."
          else
            echo "::warning::ANDROID_SIGNING_CERT_SHA256 repo variable is not set; the APK is signature-verified but the certificate is not pinned. See docs/development/release-gates.md."
          fi

      # Issue #1390: a release APK with no embedded server silently hides
      # "Use on this device only" on every device (LocalServerAvailability), and
      # nothing else looks inside the APK. Hard-fail the release instead of
      # shipping that. Runs on the SIGNED output, after signature verification.
      - name: Assert the release APK embeds the local server binary
        run: |
          set -eu
          apk="android/app/build/outputs/apk/obtainium/release/app-obtainium-release.apk"
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libmycorrhizal.so' \
            || { echo "::error::$apk does not contain lib/arm64-v8a/libmycorrhizal.so -- the release would ship without local (on-device) mode (issue #1390)."; exit 1; }
          echo "ok: $apk contains lib/arm64-v8a/libmycorrhizal.so"

      # REL-03 / #527: the built APK's versionCode must equal the workflow's
      # computed value and be > 1 (the plugin's static placeholder), or an
      # in-place upgrade breaks. Full "install N then N+1" emulator test: #480.
      - name: Assert APK versionCode
        env:
          MYCORRHIZAL_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -eu
          apk="android/app/build/outputs/apk/obtainium/release/app-obtainium-release.apk"
          aapt2="$(find "$ANDROID_HOME"/build-tools -name aapt2 2>/dev/null | sort -V | tail -1)"
          got="$("$aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          echo "APK versionCode=$got, expected=$MYCORRHIZAL_VERSION_CODE"
          if [ "$got" != "$MYCORRHIZAL_VERSION_CODE" ]; then
            echo "::error::APK versionCode ($got) != computed release versionCode ($MYCORRHIZAL_VERSION_CODE) -- the -PMYCORRHIZAL_VERSION_CODE override did not take. Check MycorrhizalAndroidApplicationPlugin.kt."
            exit 1
          fi
          if [ "$got" -le 1 ]; then
            echo "::error::APK versionCode is $got (the static placeholder); an in-place upgrade over a real release would be refused by Android."
            exit 1
          fi

      # Subject digest for the SLSA provenance (#355), computed off the same
      # file the attach step uploads so the provenance attests the exact
      # bytes on the Release. base64 -w0: slsa-github-generator's
      # base64-subjects input is a single-line blob of sha256sum output.
      - name: Compute APK subject digest
        id: apk-hash
        run: |
          set -eu
          cd android/app/build/outputs/apk/obtainium/release
          echo "hashes=$(sha256sum app-obtainium-release.apk | base64 -w0)" >> "$GITHUB_OUTPUT"

      # No body/generate_release_notes here -- only uploads the asset,
      # leaving whatever create-release wrote untouched. Same pinned action
      # as the create step, for symmetry with its append_body recovery path.
      - name: Attach APK to GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: android/app/build/outputs/apk/obtainium/release/*.apk

      # SLSA build provenance as a GitHub-native attestation. GitHub
      # digest-matches the subject against the uploaded release asset, which
      # puts the "Verified" badge on the Release page. Verify downstream with
      # `gh attestation verify <apk> -R DrewBrunning/mycorrhizal-crm`. This
      # is NOT what satisfies Scorecard's Signed-Releases check (it lives in
      # the attestations API, not a release asset with a signature
      # extension) -- the cosign bundle below is what Scorecard sees.
      # Deliberately after the upload: the asset association happens when
      # the attestation is created, by matching against assets that exist
      # at that moment.
      - name: Attest the release APK (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: android/app/build/outputs/apk/obtainium/release/*.apk

      # Issue #578, B3: cosign co-signature on the release APK -- additive
      # ONLY, does not replace the SIGNING_* keystore signing that makes the
      # APK installable. Verify with
      # cosign verify-blob --bundle mycorrhizal-apk.sigstore.json <apk>.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin explicitly: v4.1.2's baked-in default (v3.0.6) silently fails
          # keyless signing against a registry with no OCI 1.1 Referrers API
          # (GHCR is one) -- `cosign sign` exits 0 but pushes no signature.
          # Found via v0.6.1 (three images published, none verifiable). Pin
          # the version, not the installer's default, so a future installer
          # bump can't silently regress this again.
          cosign-release: 'v3.1.3'

      - name: Cosign-sign the release APK (keyless, additive)
        run: |
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/mycorrhizal-apk.sigstore.json" \
            android/app/build/outputs/apk/obtainium/release/app-obtainium-release.apk

      # Scorecard's Signed-Releases check only recognizes a release ASSET
      # with a signature-extension filename (pure filename matching, not the
      # attestations API or OCI registry) -- so this bundle must also be a
      # release asset, or every release scores as unsigned.
      #
      # `gh release upload --clobber` + retry, not softprops/action-gh-release
      # (#1147): the action hit a transient GitHub 500 on this exact file for
      # v0.8.6, and since build-and-push `needs:` this job (#527), that one
      # failure skipped every image build. "Assert APK assets landed" below
      # remains the hard #527 gate.
      - name: Attach APK cosign signature to GitHub Release
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          bundle="$RUNNER_TEMP/mycorrhizal-apk.sigstore.json"
          for attempt in $(seq 1 5); do
            if gh release upload "$RELEASE_TAG" "$bundle" --clobber; then
              echo "Attached $(basename "$bundle") to $RELEASE_TAG."
              exit 0
            fi
            echo "::warning::gh release upload failed (attempt ${attempt}/5); retrying in 15s..."
            sleep 15
          done
          echo "::error::Could not attach mycorrhizal-apk.sigstore.json to $RELEASE_TAG after 5 attempts."
          exit 1

      - name: Upload APK cosign signature + certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-cosign-signature
          path: |
            ${{ runner.temp }}/mycorrhizal-apk.sigstore.json
          retention-days: 30

      # REL-03 / issue #527: asset upload is a separate operation that can fail
      # independently of the build (the upload can fail while the build is
      # green). Assert the two APK assets are actually on the Release.
      - name: Assert APK assets landed on the Release
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "Release assets: $assets"
          for want in app-obtainium-release.apk mycorrhizal-apk.sigstore.json; do
            case " $assets " in
              *" $want "*) echo "  ok: $want" ;;
              *) echo "::error::Expected release asset '$want' is missing from $RELEASE_TAG."; exit 1 ;;
            esac
          done

  # Issue #355: real SLSA build provenance for the release APK, attached as
  # `mycorrhizal-apk.intoto.jsonl` -- what Scorecard's Signed-Releases check
  # needs for the 10/10 tier (the cosign bundle above covers 8/10). The
  # reusable slsa-github-generator workflow signs the APK's sha256 subject
  # keyless with the run's ambient OIDC identity.
  #
  # `@v2.1.0` (not a SHA) is a KNOWN, PERMANENT exception to the SHA-pin
  # rule: the trusted-builder model requires the generator resolve its own
  # ref to establish builder identity, so it refuses to run pinned by commit
  # SHA. Accepted in docs/dependency-upgrade-policy.md; zizmor's
  # `unpinned-uses` is suppressed inline below; version bumps are a
  # deliberate tag change.
  #
  # `upload-assets: false` keeps release-asset ownership out of this job --
  # the generator uploads the .intoto.jsonl only as a workflow artifact, and
  # verify-release-assets attaches it alongside SHA256SUMS, sidestepping the
  # create-release/action-gh-release collision #355 flags.
  #
  # permissions.contents is write, not read, even though this job's own use
  # of it never writes (upload-assets: false): GitHub validates a
  # reusable-workflow caller's permissions as a ceiling for the WHOLE called
  # graph at parse time, before any `if:` runs -- the generator's internal
  # upload-assets job unconditionally declares contents: write at the job
  # level regardless of the input, so a narrower ceiling here breaks the run
  # before any job is created (#1006, a real STARTUP_FAILURE). Matches
  # hashicorp/packer's own reference usage of this generator.
  apk-provenance:
    name: SLSA provenance for the APK
    needs: [build-android-apk]
    # issue #1184: explicit guard so the skipped release-gate-override job does
    # not poison `success()` and silence the SLSA provenance attach.
    if: ${{ always() && github.event_name == 'push' && needs.build-android-apk.result == 'success' }}
    permissions:
      actions: read # the generator reads this workflow run to build the statement
      id-token: write # keyless Fulcio signing
      contents: write # ceiling for the generator's internal upload-assets job (unused here: upload-assets: false below)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build-android-apk.outputs.hashes }}
      provenance-name: mycorrhizal-apk.intoto.jsonl
      upload-assets: false

  # #436/#529: a release at or above the v1.0.0 floor (raised from v0.6.0 at
  # the 1.0 major, #1170) must ship a committed schema dump under
  # backend/database/testdata/schemas/, or it publishes an upgrade path CI
  # never tested. That must fail the publish, not be noticed later.
  schema-fixture-gate:
    runs-on: ubuntu-latest
    needs: [validate-tag, release-gate, release-gate-override]
    # Composed gate passed, or an operator recorded an override (ADR 0021 / #1165).
    if: ${{ always() && (needs.release-gate.result == 'success' || needs.release-gate-override.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # The discriminator for "is this a mycorrhizal supported-series
      # release" is the presence of the squashed migration baseline at that
      # tag: pre-fork upstream meerkat tags use different migration
      # numbering and never carry 000001_initial_schema.up.sql.
      - name: Verify release has a schema fixture
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -eu
          # RC-02 (#446): no in-place upgrade is ever supported *from* an RC,
          # so an `-rc.` tag carries no fixture of its own -- the final one
          # is registered at promotion (promote-rc.yml).
          if printf '%s' "$RELEASE_TAG" | grep -qE -- '-rc\.[0-9]+$'; then
            echo "$RELEASE_TAG is a release candidate; the final schema fixture is registered at promotion. Fixture gate not applicable."
            exit 0
          fi
          if [ ! -f backend/database/migrations/000001_initial_schema.up.sql ]; then
            echo "Not a mycorrhizal supported-series release ($RELEASE_TAG); fixture gate not applicable."
            exit 0
          fi
          floor="v1.0.0"
          oldest="$(printf '%s\n%s\n' "$floor" "$RELEASE_TAG" | sort -V | head -1)"
          if [ "$oldest" != "$floor" ]; then
            echo "Release $RELEASE_TAG is below the $floor floor; fixture gate not required (two-step upgrade applies)."
            exit 0
          fi
          # A tag predating the fixture machinery (v0.6.0..v0.6.3) is exempt
          # -- it cannot retroactively carry a fixture.
          if [ ! -d backend/database/testdata/schemas ]; then
            echo "Release $RELEASE_TAG predates the schema-fixture machinery; gate not applicable."
            exit 0
          fi
          if [ ! -s "backend/database/testdata/schemas/${RELEASE_TAG}.sql" ]; then
            echo "::error::Release $RELEASE_TAG is at or above the supported-upgrade floor but ships no committed schema fixture."
            echo "::error::Run \`cd backend && go run ./cmd/genschema\` (or \`make gen-schema-fixtures\`) and commit the dump before tagging."
            exit 1
          fi
          echo "Schema fixture present for $RELEASE_TAG."

  build-and-push:
    runs-on: ubuntu-latest
    # REL-03 / #527: also needs build-android-apk -- images don't publish
    # unless the release APK built and passed its signature check.
    needs: [schema-fixture-gate, build-android-apk, release-gate]
    # ADR 0021 (#1184): a skipped sibling job (release-gate-override on a
    # normal push) poisons the default `success()` downstream; `always()` +
    # explicit result checks restore the intended behaviour.
    if: ${{ always() && needs.schema-fixture-gate.result == 'success' && needs.build-android-apk.result == 'success' }}
    # #508: the protected `release` environment (see create-release).
    environment: release
    env:
      # Issue #1484: the digest of the image every release gate tested
      # (release-validate.yml's build-candidate). Non-empty means the all-in-one
      # leg RE-TAGS it instead of rebuilding; empty only when the gate was
      # overridden (a dispatch with override_reason), where the from-source
      # build below still runs.
      CANDIDATE_DIGEST: ${{ needs.release-gate.outputs.candidate_digest }}
    permissions:
      contents: read
      packages: write
      # id-token lets cosign / attest-build-provenance request a short-lived
      # OIDC identity token for keyless signing/attestation below.
      id-token: write
      # attestations: write persists the SLSA attestation (see below).
      attestations: write

    strategy:
      # One leg's failure must not cancel the others: with fail-fast: true,
      # the backend leg failing killed the other two legs mid-push, and
      # v0.6.1 shipped two images with no signature/provenance despite
      # release-verification.md promising all three are cosign-verifiable.
      # These are independent images; nothing to fail fast about.
      fail-fast: false
      matrix:
        include:
          - context: ./backend
            file: ./backend/Dockerfile
            suffix: -backend
          - context: ./frontend
            file: ./frontend/Dockerfile
            suffix: -frontend
          - context: .
            file: ./Dockerfile
            suffix: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit, so a manual run builds the TAG's tree rather than
          # whatever branch it was dispatched from.
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # issue #1109: pin the BuildKit builder image by digest, matching
      # reproducibility.yml's all-in-one-image job -- these published
      # images are exactly the "output is published" case the issue calls
      # out, and every other build-toolchain input here (base images, apk
      # packages, this job's own Actions) is already pinned.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 # v0.32.2

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The commit + a deterministic build date for the version stamp, read from
      # the checked-out tree -- NOT github.sha, which on a manual recovery run is
      # the dispatching branch's head, not the tag being built. `commit` is the
      # 12-char prefix buildinfo's VCS fallback also uses; `sha_full` is for the
      # OCI revision label.
      # Issue #1484: the stamp arithmetic (SOURCE_DATE_EPOCH, display version
      # -- see issue #1022 / REL-04 #448 in the script) is shared with
      # release-validate.yml's build-candidate via one script, so the candidate
      # and a from-source build cannot disagree.
      - name: Compute build stamp
        id: stamp
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: bash .github/scripts/release-image-stamp.sh "$RELEASE_TAG"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          # Each type takes an explicit value so tags come from RELEASE_TAG
          # and the checked-out commit; left implicit, semver reads the ref
          # and sha reads github.sha, both wrong on a manual run.
          #
          # `latest`: this tag never moved on any release (it sat frozen at
          # 0.6.12 until discovered when 0.7.0 shipped and `docker compose
          # pull` still reported it) -- gated to skip an `-rc.N` push so a
          # pre-release never becomes the bare-pull default, mirroring
          # create-release's make_latest. A final tag promoted via
          # promote-rc.yml never reaches this job (pushed with GITHUB_TOKEN,
          # so `on: push: tags` doesn't fire); that path moves `latest`
          # itself in its own re-tag step.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ steps.stamp.outputs.sha7 }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-rc.') }}
          # REL-04 (#448): pin identity labels explicitly -- metadata-action's
          # defaults (github.sha, wall-clock) are wrong on a manual run and
          # break image reproducibility.
          labels: |
            org.opencontainers.image.revision=${{ steps.stamp.outputs.sha_full }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.created=${{ steps.stamp.outputs.created }}

      # SHA-pinned per Scorecard's Pinned-Dependencies check; other actions
      # in this job still float on major tags (separate cleanup). Dependabot
      # updates the SHA + version comment together (#269).
      # Issue #1484: the all-in-one image is NOT rebuilt when a tested candidate
      # exists -- see "Re-tag the tested candidate" below. The backend/frontend
      # legs (never run by a gate) and the overridden-gate fallback still build.
      - name: Build and push
        id: build
        if: ${{ !(matrix.suffix == '' && env.CANDIDATE_DIGEST != '') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # REL-04 (#448): rewrites every layer/config timestamp so a rebuild
          # of the same tag yields the same image digest. See
          # docs/security/reproducible-builds.md for what this does and does
          # not make bit-reproducible (multi-arch manifest digest is not gated).
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.source_date_epoch }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the binary with the release it actually is, or /health
          # reports version "dev" like any other build. #1022: APP_VERSION is
          # `stamp`'s display_version (strips `-rc.N`), not metadata-action's
          # `version` output, which is the actual image tag and must keep it.
          build-args: |
            APP_VERSION=${{ steps.stamp.outputs.display_version }}
            APP_COMMIT=${{ steps.stamp.outputs.commit }}
            APP_BUILD_DATE=${{ steps.stamp.outputs.created }}
          # scope is required, not cosmetic: the GHA cache backend's default
          # scope is shared workflow-wide, so the three concurrent matrix legs
          # would read/write the same namespace. Not hypothetical -- v0.6.1's
          # CVE-2026-14456 fix built clean locally but the unscoped shared
          # cache served a stale pre-fix layer to the pushed image anyway
          # (`docker history` showed the old instruction despite a differing
          # cache key). Scoped per leg so each image's cache is isolated.
          cache-from: type=gha,scope=docker-publish${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-publish${{ matrix.suffix }}
          # SBOM + SLSA provenance, pushed alongside the image as referrers.
          provenance: true
          sbom: true

      # Issue #1484: "the artifact the gates tested is the artifact that ships".
      # The all-in-one release tags are created by re-tagging the candidate
      # INDEX BY DIGEST (`imagetools create` of a single source copies the
      # manifest list verbatim, attestation referrers and all -- the pattern
      # promote-rc.yml uses for rc -> final), never by building again. Each
      # resulting tag is resolved back and must equal the tested digest.
      - name: Re-tag the tested candidate (no rebuild)
        id: retag
        if: ${{ matrix.suffix == '' && env.CANDIDATE_DIGEST != '' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ env.CANDIDATE_DIGEST }}
        run: |
          set -euo pipefail
          bash .github/scripts/candidate-image.sh check-digest "$DIGEST"
          src="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(--tag "$t")
          done <<<"$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::metadata-action produced no tags to apply"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$src"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            got="$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r '.digest')"
            bash .github/scripts/candidate-image.sh assert-match "$DIGEST" "$got" "$t"
          done <<<"$TAGS"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published ${src} under the release tags without rebuilding."

      # One name for "the digest that was published", whichever path made it.
      - name: Resolve the published digest
        id: published
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          RETAGGED: ${{ steps.retag.outputs.digest }}
        run: |
          set -eu
          digest="${RETAGGED:-$BUILT}"
          bash .github/scripts/candidate-image.sh check-digest "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same v4.1.2-default regression as build-android-apk's cosign
          # install above (v3.0.6 silently fails keyless signing against a
          # Referrers-API-less registry like GHCR) -- pin the version, not
          # the installer's default.
          cosign-release: 'v3.1.3'

      # Keyless signing via cosign's ambient OIDC detection, using the
      # id-token: write permission granted above. Signs the digest, not a
      # tag (tags are mutable). Lowercased the same way the scan job below
      # resolves its image reference (github.repository preserves account
      # case; GHCR refs must be lowercase).
      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}@${DIGEST}"

      # Lowercase reference again for the attest step below (Actions
      # expressions have no lower()); also emits the semver-tagged reference
      # for the SBOM generation below.
      - name: Compute lowercase image reference
        env:
          SUFFIX: ${{ matrix.suffix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_ENV"
          echo "IMAGE_REF_TAGGED=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # GH-native SLSA provenance, in addition to buildkit's (`provenance:
      # true` on the build above) and the cosign signature just created --
      # different verifiers: buildkit's is pulled with cosign, this one with
      # `gh attestation verify oci://...` and surfaces in GitHub's UI. Signs
      # the digest, not a tag, same reason as the cosign line.
      - name: Attest the published image (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.published.outputs.digest }}

      # Issue #578, B3: portable signed SBOMs for the released images, on
      # top of buildkit's registry-only SBOM referrer. syft scans the
      # *published* image, emits SPDX + CycloneDX, signed keyless below.
      # syft-version pinned for reproducible output; per-suffix artifact
      # names avoid matrix collisions.
      - name: Generate SPDX SBOM from image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF_TAGGED }}
          format: 'spdx-json'
          output-file: 'sbom${{ matrix.suffix }}.spdx.json'
          syft-version: 'v1.51.0'
          artifact-name: 'sbom-spdx${{ matrix.suffix }}'
          upload-artifact-retention: 30
          # The action attaches SBOMs to the Release by default, needing
          # contents: write; this job is deliberately contents: read (failed
          # the backend leg on v0.6.1: "Resource not accessible by
          # integration"). Turned off rather than widening the token --
          # release-verification.md already documents these as 30-day
          # workflow artifacts, not Release assets.
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM from image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF_TAGGED }}
          format: 'cyclonedx-json'
          output-file: 'sbom${{ matrix.suffix }}.cdx.json'
          syft-version: 'v1.51.0'
          artifact-name: 'sbom-cdx${{ matrix.suffix }}'
          upload-artifact-retention: 30
          # Same reason as the SPDX step above.
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Keyless blob signing, same OIDC pattern as "Sign the published
      # image" (cosign-installer reused). Bundle rides along as an artifact:
      # cosign verify-blob --bundle <sbom>.sigstore.json <sbom>
      - name: Sign the image SBOMs (keyless)
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cosign sign-blob --yes \
            --bundle "sbom${SUFFIX}.spdx.json.sigstore.json" \
            "sbom${SUFFIX}.spdx.json"
          cosign sign-blob --yes \
            --bundle "sbom${SUFFIX}.cdx.json.sigstore.json" \
            "sbom${SUFFIX}.cdx.json"

      - name: Upload image SBOM signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-signatures${{ matrix.suffix }}
          path: |
            sbom${{ matrix.suffix }}.spdx.json.sigstore.json
            sbom${{ matrix.suffix }}.cdx.json.sigstore.json
          retention-days: 30

  scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    # issue #1184: explicit guard against the skipped release-gate-override job.
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      # Same two mismatches as "Resolve published image references" above
      # (lowercase account case, semver tag dropping the leading 'v') --
      # resolve the exact name the build pushed rather than re-deriving it
      # differently here; passing the raw repository made trivy fail to
      # parse the reference before contacting the registry.
      - name: Resolve the image reference the build actually published
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Pinned to an exact patch, not floating on a major like other actions
      # here: trivy-action is still pre-1.0, so every release can be
      # breaking. Dependabot (#269) still surfaces bumps as PRs.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Only gate on vulnerabilities that actually have a fix, so an
          # unfixable advisory doesn't block every release indefinitely.
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: 'trivy-results.sarif'

  # REL-03 / #527: the final "the artifacts actually landed" gate -- upload
  # is a separate operation that can fail even after a green build. Mandatory
  # gate (docs/development/release-gates.md).
  #
  # Issue #1396: this job also runs on the workflow_dispatch fallback. There,
  # create-release and apk-provenance are SKIPPED by design (the release
  # already exists; the SLSA generator cannot attest a branch-ref dispatch), so
  # the condition accepts `skipped` for those two ONLY on dispatch -- a push
  # still requires both to succeed. With no provenance the completeness
  # assertion below fails, so a fallback-only release concludes RED and says
  # it is not promotable, instead of silently going green.
  verify-release-assets:
    name: Verify release assets
    runs-on: ubuntu-latest
    needs: [create-release, build-and-push, build-android-apk, apk-provenance, scan, release-gate]
    # issue #1184: explicit guard against the skipped release-gate-override job.
    if: >-
      ${{ always()
      && (needs.create-release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.create-release.result == 'skipped'))
      && needs.build-and-push.result == 'success'
      && needs.build-android-apk.result == 'success'
      && (needs.apk-provenance.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.apk-provenance.result == 'skipped'))
      && needs.scan.result == 'success' }}
    permissions:
      # contents: write to attach the two assets this job owns: the SLSA
      # provenance (#355) and a SHA256SUMS over every asset (#499).
      contents: write
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # apk-provenance ran the slsa-github-generator with upload-assets: false,
      # so the *.intoto.jsonl lives only as a workflow artifact until here.
      # Issue #1396: absent on the dispatch fallback (apk-provenance skipped).
      - name: Download the SLSA provenance artifact
        if: ${{ needs.apk-provenance.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mycorrhizal-apk.intoto.jsonl
          path: release-assets

      # SHA256SUMS is generated last, from the asset list as it stands after
      # every other job has uploaded, so it covers everything. --clobber
      # makes a manual recovery re-run idempotent.
      - name: Attach SLSA provenance + SHA256SUMS to the Release
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #1015: this job has no checkout step, so `gh` has no git remote
          # to infer the target repo from ("not a git repository") -- GH_REPO
          # points it at one without needing a checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Issue #1396: on the dispatch fallback there is no provenance to
          # attach; SHA256SUMS is still (re)built over whatever is published.
          if compgen -G 'release-assets/*.intoto.jsonl' >/dev/null; then
            gh release upload "$RELEASE_TAG" release-assets/*.intoto.jsonl --clobber
          else
            echo "No SLSA provenance artifact in this run (apk-provenance did not run) -- not attaching one."
          fi
          work="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$work" --clobber
          ( cd "$work" && rm -f SHA256SUMS && sha256sum -- * | sort -k2 > SHA256SUMS && cat SHA256SUMS )
          gh release upload "$RELEASE_TAG" "$work/SHA256SUMS" --clobber

      - name: Assert the Release and images are complete
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See the previous step's comment -- same missing-checkout gap.
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Issue #1484: what the release gates tested vs what was published.
          CANDIDATE_DIGEST: ${{ needs.release-gate.outputs.candidate_digest }}
          GATE_RESULT: ${{ needs.release-gate.result }}
        run: |
          set -eu
          fail=0

          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "Release assets: $assets"
          for want in app-obtainium-release.apk mycorrhizal-apk.sigstore.json mycorrhizal-apk.intoto.jsonl release-metadata.json SHA256SUMS; do
            case " $assets " in
              *" $want "*) echo "  ok: $want" ;;
              *) echo "::error::Release $RELEASE_TAG is missing asset '$want'."; fail=1 ;;
            esac
          done

          # Issue #1396: the workflow_dispatch fallback cannot produce SLSA
          # provenance (apk-provenance is push-only -- the generator records the
          # triggering ref, and slsa-verifier --source-tag rejects a branch ref).
          # Say so explicitly, so a fallback-only release fails loudly instead of
          # being discovered at promotion time (promote-rc.yml needs it).
          case " $assets " in
            *" mycorrhizal-apk.intoto.jsonl "*) ;;
            *)
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                msg="Release $RELEASE_TAG was published via the workflow_dispatch fallback without SLSA provenance (mycorrhizal-apk.intoto.jsonl). It is NOT promotable. Recover by cutting the next release candidate, or -- once the workflow at the tag's commit is fixed -- by deleting and re-pushing the tag so a push-triggered run produces the provenance (issue #1396)."
                echo "::error::$msg"
                echo "### :x: Not promotable" >> "$GITHUB_STEP_SUMMARY"
                echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              fi
              fail=1
              ;;
          esac

          # Issue #1390: the attached APK (the asset users actually install)
          # must still carry the embedded server binary.
          apkdir="$(mktemp -d)"
          if gh release download "$RELEASE_TAG" --pattern app-obtainium-release.apk --dir "$apkdir" --clobber \
            && unzip -Z1 "$apkdir/app-obtainium-release.apk" | grep -qx 'lib/arm64-v8a/libmycorrhizal.so'; then
            echo "  ok: attached APK contains lib/arm64-v8a/libmycorrhizal.so"
          else
            echo "::error::Attached app-obtainium-release.apk is missing or does not contain lib/arm64-v8a/libmycorrhizal.so (issue #1390)."
            fail=1
          fi

          repo="${GITHUB_REPOSITORY,,}"
          tag="${RELEASE_TAG#v}"
          for img in "ghcr.io/${repo}:${tag}" "ghcr.io/${repo}-backend:${tag}" "ghcr.io/${repo}-frontend:${tag}"; do
            if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "  ok: $img"
            else
              echo "::error::Published image $img does not resolve in the registry."
              fail=1
            fi
          done

          # Issue #1484: the published all-in-one image must BE the image the
          # release gates tested -- the same digest, not a rebuild of the same
          # source. Skipped (loudly) only when the gate itself was overridden,
          # in which case there is no tested candidate to compare against.
          if [ -n "$CANDIDATE_DIGEST" ]; then
            published="$(docker buildx imagetools inspect "ghcr.io/${repo}:${tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [ "$published" = "$CANDIDATE_DIGEST" ]; then
              echo "  ok: published digest == tested digest (${published})"
            else
              echo "::error::Published image ghcr.io/${repo}:${tag} has digest ${published}, but the release gates tested ${CANDIDATE_DIGEST}. The image that shipped is not the image that was tested (issue #1484)."
              fail=1
            fi
          elif [ "$GATE_RESULT" = "success" ]; then
            echo "::error::The release gate passed but exported no candidate digest -- cannot prove the published image is the tested one (issue #1484)."
            fail=1
          else
            echo "::warning::release-gate was ${GATE_RESULT} (overridden): the image was built from source, so published==tested cannot be asserted (issue #1484)."
          fi

          exit "$fail"

  # DEPLOY-04 (#996, split from #923): the job above proves the published
  # image RESOLVES in the registry -- presence, not behavior.
  # deploy-smoke.yml proves a FROM-SOURCE build boots correctly, but a
  # release-path-only defect (broken entrypoint, bad baked-in env default, a
  # migration that only fails inside the real Dockerfile's build context)
  # could still reach operators undetected. This pulls the just-published
  # image BY DIGEST (never the mutable tag) and runs the same end-to-end
  # workflow against the real artifact.
  #
  # Issue #1396: this runs on the workflow_dispatch fallback too -- it only
  # needs the published image, so a dispatch-published release is smoke-tested
  # even when verify-release-assets fails on the (unavoidable) missing SLSA
  # provenance. On a push it still waits for verify-release-assets to pass.
  post-publish-smoke:
    name: Post-publish smoke (published image, ${{ matrix.arch }})
    # Issue #1485: the same digest is a multi-arch index; each leg's docker
    # pulls its own platform, so arm64 users' image is actually executed.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs: [build-and-push, verify-release-assets]
    # issue #1184: explicit guard against the skipped release-gate-override job.
    if: >-
      ${{ always()
      && needs.build-and-push.result == 'success'
      && (needs.verify-release-assets.result == 'success'
          || (github.event_name == 'workflow_dispatch' && needs.verify-release-assets.result != 'skipped' && needs.verify-release-assets.result != 'cancelled')) }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # zizmor cache-poisoning (#358), same as create-release above.
          cache: false

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same pin as build-and-push above and promote-rc.yml.
          cosign-release: 'v3.1.3'

      - name: Verify the published image and resolve its digest
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -eu
          repo="${GITHUB_REPOSITORY,,}"
          tag="${RELEASE_TAG#v}"
          ref="ghcr.io/${repo}:${tag}"

          # Same identity check promote-rc.yml runs before trusting an image.
          cosign verify "$ref" \
            --certificate-identity-regexp '^https://github\.com/DrewBrunning/mycorrhizal-crm/\.github/workflows/docker-publish\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "Testing ghcr.io/${repo}@${digest} (published as ${ref})"
          echo "MYCORRHIZAL_IMAGE=ghcr.io/${repo}@${digest}" >> "$GITHUB_ENV"

      - name: Assert the image runs on this leg's architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          case "$(uname -m)" in x86_64) host=amd64 ;; aarch64) host=arm64 ;; *) host=other ;; esac
          [ "$host" = "$ARCH" ] || { echo "::error::leg expects $ARCH, runner is $host"; exit 1; }

      - name: Bring up the published image
        run: docker compose -f docker-compose.published-smoke.yml up -d --wait --wait-timeout 240

      - name: Run the end-to-end workflow against the published image
        env:
          DEPLOYSMOKE_BASE_URL: http://localhost:7300
        run: |
          set -euo pipefail
          cd backend
          go run ./cmd/deploysmoke

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.published-smoke.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.published-smoke.yml down -v
