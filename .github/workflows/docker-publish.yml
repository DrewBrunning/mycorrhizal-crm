name: Build and Push Docker Images

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: |

            ## Docker Images

            All-in-one image (frontend + backend in one container):
            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Separate images:
            ```
            ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}
            ```

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: ./backend
            file: ./backend/Dockerfile
            suffix: -backend
          - context: ./frontend
            file: ./frontend/Dockerfile
            suffix: -frontend
          - context: .
            file: ./Dockerfile
            suffix: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Short SHA and an ISO-8601 build timestamp for the version stamp. The
      # full github.sha is 40 chars, which is unwieldy in a UI badge and in a
      # bug report; buildinfo's own VCS fallback truncates to 12, so match it.
      - name: Compute build stamp
        id: stamp
        run: |
          echo "commit=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the binary with the release it actually is. Without these the
          # Dockerfile's defaults apply and /health reports version "dev" --
          # so a published v0.2.0 image could not be told apart from any other
          # build, which is the exact problem the buildinfo package exists to
          # solve. metadata-action's `version` output is the semver derived
          # from the tag that triggered this run.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ steps.stamp.outputs.commit }}
            APP_BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
