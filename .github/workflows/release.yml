name: Release

# REL-06 (issue #499): the single automated release workflow. Cutting a release
# is one human action -- dispatch this with a version -- and everything
# downstream is automatic and gated.
#
# FINAL vs RELEASE CANDIDATE (RC-02, issue #446). The `version` input decides:
#   - `vX.Y.Z`      -> a final release, cut from `main` (the default `ref`).
#   - `vX.Y.Z-rc.N` -> a release candidate, cut from `ref: release/vX.Y.0`.
# An RC composes the SAME gate battery (`validate`, via release-validate.yml)
# -- "RC gates match release gates" (#446 action 7) -- but SKIPS the two
# final-release-only pieces:
#   - the schema-fixture registration: an RC ships the same schema the final
#     will, and you never support in-place upgrade *from* an RC, so the fixture
#     is registered once, at promotion (promote-rc.yml);
#   - the ASVS/MASVS re-verification changelog-row gate and the per-release
#     adversarial delta: final-release obligations. The RC still runs
#     `citecheck`.
# docker-publish.yml marks an `-rc.` tag's GitHub Release as a pre-release and
# never `make_latest`, so it stays off the in-app update check and Obtainium.
# Promotion (RC -> final, same artifact by digest) is promote-rc.yml.
# Full policy: docs/release-candidate-process.md.
#
# What a run does (ADR 0021, issue #1162): three jobs, no cross-run polling.
#
#   1. `preflight` -- validates the version string, that no such tag exists, and
#      (final only) whether it is already registered in SupportedReleases
#      (registered-but-untagged means an interrupted release and is RESUMED,
#      issue #1142; an existing tag is a hard refusal); verifies the checkout is
#      the true tip of `ref`; runs `citecheck` + `releasegatecheck`.
#   2. `validate` -- calls the reusable `release-validate.yml`, which composes
#      EVERY gate with real `needs: dependencies: the `release_gate:true` per-PR
#      checks (the same workflow files the per-PR ruleset runs) and the
#      release-tier suites. This is the one definition of "is this commit
#      releasable"; docker-publish.yml calls the same workflow for a
#      tag-triggered cut, so the two cannot drift. The tagged commit is the
#      checked-out tip for an RC; for a final the fixture commit is created by
#      job 3 *after* this composition, and the generated dump it adds is
#      validated by "Verify test gates" and docker-publish's schema-fixture-gate.
#   3. `release` -- the release-only bookkeeping: the ASVS/MASVS re-verification
#      row gate and the per-release adversarial delta (final only, issue
#      #608/#953), the schema-fixture registration + regeneration + frozen-chain
#      assertion + test gates (final only), then the App-token-signed tag push.
#
# `release-metadata.json` and everything attached to the GitHub Release are now
# owned by docker-publish.yml (ADR 0021, issue #1163); this workflow ends at the
# tag and never waits for a Release to appear.
#
# The tag push is what triggers docker-publish.yml (build + sign the three
# images and the release APK, mint SBOMs + SLSA provenance + SHA256SUMS, create
# the GitHub Release). That works -- and needs NO change to docker-publish.yml's
# trigger -- only because the push here uses a GitHub App token, not
# GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN cannot trigger another workflow.
# For a final release the tag points at a real commit on main (the one carrying
# the dump), so docker-publish's schema-fixture-gate passes and source<->release
# correspondence is exact; for an RC the tag points at the release-branch tip
# and schema-fixture-gate is exempt for `-rc.` tags.
#
# DRY RUN (`dry_run: true`): runs the whole gate composition, the fixture
# regeneration and the test gates (final only) -- but makes NO commit, push, tag
# or artifact. This is how the workflow is exercised without cutting a release
# (issue #499: "the workflow is itself tested"); the "tag exists / already
# registered" checks in `preflight` are downgraded to warnings so a dry run can
# target the last shipped version. `release-dry-run.yml` is what actually does
# this: weekly + on demand, it dispatches this workflow with dry_run: true
# against the last entry in SupportedReleases (issue #929 -- previously nothing
# did, so a defect in the final-release path was only ever discovered by cutting
# a real release).
#
# Rehearsing an ALREADY-REGISTERED version (issue #929): the "Register the
# release" step skips re-appending a SupportedReleases entry when the
# version is already there (`.github/scripts/release-register-decide.sh`) --
# a dry run against the last shipped version regenerates every dump from the
# UNCHANGED release set and must reproduce them byte-identical, so the
# "Assert only the new dump changed" step expects NO diff at all in that
# case, not a new untracked file. A dry run against a version that has not
# shipped yet still expects exactly one new untracked dump, same as before.
#
# One-time setup (see docs/security/release-verification.md, "How a release is
# cut"):
#   - a GitHub App with Contents: write, installed on this repo;
#   - repo variable RELEASE_APP_ID + repo secret RELEASE_APP_PRIVATE_KEY;
#   - the App added to main's branch-protection / ruleset bypass list (and to
#     any v* tag ruleset's bypass list), so it can push the commit and the tag.
#
# Re-entrant / resumable (issue #1142): re-dispatching the same version is the
# recovery path for every failure before the tag exists. The fixture
# registration is idempotent (release-register-decide.sh returns SKIP when
# already present), the fixture commit is a no-op when it already landed, the
# release commit is the checked-out tip (so a fix merged to main since the
# interrupted attempt is included in the release), and the full mandatory gate
# battery + release-tier suites re-run before the tag.
#
# Failure modes:
#   - a gate or the registration fails -> nothing was pushed; fix and re-dispatch.
#   - (final) fixture pushed, the tag push fails -> the fixture commit
#     is on main; fix on main and re-dispatch this workflow. It RESUMES at the
#     new tip (already-registered + untagged is now a warning, not a refusal)
#     and tags that commit. (An RC pushes nothing before the tag, so this
#     window does not exist there.)
#   - tag pushed, docker-publish.yml fails -> recover the images via
#     docker-publish.yml -> Run workflow -> `tag` input. Do NOT re-dispatch this
#     workflow for an already-tagged version -- it refuses an existing tag
#     rather than move a released one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to cut, e.g. v0.6.6 or v1.0.0-rc.1'
        required: true
        type: string
      ref:
        description: 'Branch to cut from -- main for a final release, release/vX.Y.0 for an RC (RC-02, issue #446)'
        required: false
        type: string
        default: main
      dry_run:
        description: 'Run every gate + regenerate the fixture, but make no commit/push/tag'
        required: false
        type: boolean
        default: false
      ack_asvs_current:
        description: 'Reason the ASVS/MASVS claim is current without a new re-verification row (leave blank to require the row)'
        required: false
        type: string
        default: ''
      ack_adversarial_delta:
        description: 'Reason to proceed without a recorded per-release adversarial delta for added surface (leave blank to require it)'
        required: false
        type: string
        default: ''

# Read-only by default (StepSecurity "Restrict permissions for GITHUB_TOKEN").
permissions:
  contents: read

# ADR 0021 (issue #1164): serialize cuts of one version so two overlapping
# dispatches cannot interleave their fixture commit and tag.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # --- Job 1: preflight ------------------------------------------------------
  # Fast, read-only checks that reject a bad dispatch before any expensive gate
  # runs: the version is well-formed and unshipped, the checkout is the true tip
  # of `ref`, and the two local gate-registry checks pass. Outputs feed the
  # later jobs (ADR 0021, issue #1162).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_rc: ${{ steps.validate.outputs.is_rc }}
      resume: ${{ steps.validate.outputs.resume }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `main` for a final release, `release/vX.Y.0` for an RC. fetch-depth 0
          # so the "tag exists" check and the "previous release tag" lookup see
          # the full ref set. persist-credentials: false per repo convention --
          # the push step scopes its own credential (the App token) via an
          # ephemeral helper.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate version input
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          # Canonical release-tag pattern (REL-01, issue #445):
          # docs/versioning-policy.md and backend/internal/versionpolicy/tagpattern.go.
          # Kept byte-identical to the gate in docker-publish.yml; a drift test
          # (internal/versionpolicy) fails if these diverge.
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Version must match the versioning policy: vMAJOR.MINOR.PATCH with an optional -rc.N suffix (e.g. v0.6.6 or v1.0.0-rc.1). Got '$VERSION'. See docs/versioning-policy.md."
            exit 1
          fi
          # RC-02 (issue #446): classify. An `-rc.N` suffix is a release
          # candidate -- it skips the schema-fixture registration and the ASVS
          # changelog-row gate, and docker-publish marks its Release as a
          # pre-release. Everything else is identical.
          if printf '%s' "$VERSION" | grep -qE -- '-rc\.[0-9]+$'; then
            IS_RC=true
            echo "Release candidate: $VERSION (cut from ${GITHUB_REF_NAME:-the checked-out ref})."
          else
            IS_RC=false
          fi
          echo "is_rc=$IS_RC" >> "$GITHUB_OUTPUT"

          # Facts for the resume decision below. fetch-depth: 0 in the checkout
          # makes an existing tag visible here. SupportedReleases only ever
          # records final releases (you never upgrade *from* an RC), so that
          # lookup is final-only.
          tag_exists=false
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then tag_exists=true; fi
          registered=false
          if [ "$IS_RC" != "true" ] && grep -qF "{Tag: \"$VERSION\"," backend/internal/schemafixture/releases.go; then registered=true; fi

          # Issue #1142: one decision point, tested in
          # .github/scripts/tests/release-validate-decide.test.sh. A version
          # that is already registered but has no tag can only be an
          # interrupted final release (its fixture commit was pushed, then the
          # tag push failed) -- RESUME the release at the
          # checked-out tip instead of refusing, so "fix on main and
          # re-dispatch" actually works. A tag that already exists still
          # hard-fails: a released tag is never moved.
          decision="$(.github/scripts/release-validate-decide.sh "$IS_RC" "$DRY_RUN" "$tag_exists" "$registered")"
          case "$decision" in
            FAIL_TAG_EXISTS)
              echo "::error::Tag $VERSION already exists; pick a version that has not shipped."
              exit 1
              ;;
            RESUME)
              echo "::warning::$VERSION is already registered in SupportedReleases and has no tag yet -- resuming the interrupted release at the checked-out tip."
              echo "resume=true" >> "$GITHUB_OUTPUT"
              ;;
            PROCEED)
              # Dry runs downgrade the two checks to warnings (issue #929: the
              # rehearsal targets the last shipped version deliberately).
              if [ "$DRY_RUN" = "true" ] && [ "$tag_exists" = "true" ]; then
                echo "::warning::Tag $VERSION already exists -- allowed for a dry run (no tag is pushed)."
              fi
              if [ "$DRY_RUN" = "true" ] && [ "$registered" = "true" ]; then
                echo "::warning::$VERSION is already registered in SupportedReleases -- allowed for a dry run."
              fi
              ;;
            *)
              echo "::error::release-validate-decide.sh returned an unrecognized decision: ${decision}"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --- Step 2: repository state ------------------------------------------

      - name: Verify repository state
        id: verify
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          git fetch --quiet origin "$REF"
          head="$(git rev-parse HEAD)"
          origin="$(git rev-parse "origin/${REF}")"
          echo "Local HEAD:      $head"
          echo "origin/${REF}:  $origin"
          if [ "$head" != "$origin" ]; then
            echo "::error::Checkout is not at the tip of origin/${REF} ($head != $origin). Re-dispatch; do not cut from a stale ref."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean on a fresh checkout -- refusing."
            git status --porcelain
            exit 1
          fi
          echo "release_commit=$head" >> "$GITHUB_OUTPUT"

      # --- Step 3: the mandatory gate battery ------------------------------

      - name: Gate - security-doc citations (citecheck)
        working-directory: backend
        run: |
          echo "citecheck must exit 0 for a release to proceed (issue #608)."
          go run ./cmd/citecheck

      - name: Gate - release-gate registry is coherent
        working-directory: backend
        run: go run ./cmd/releasegatecheck


  # --- Job 2: the composed gate battery (ADR 0021, issue #1162) -------------
  # One reusable workflow composes the mandatory per-PR gates and the
  # release-tier suites with real `needs:` dependencies -- the same check
  # workflows the per-PR/schedule paths run, not a second definition. This
  # replaces the dispatch-and-poll steps that used to live in this job.
  #
  # The gate scope is read-only: contents/pull-requests read and actions read
  # (cache introspection). The SARIF-uploading scans skip their upload when
  # composed, so no write scope is granted to a reusable-workflow caller
  # (OWASP/OpenSSF Token-Permissions). Recorded in
  # asvs-l2-verification-report.md §9.
  validate:
    needs: preflight
    uses: ./.github/workflows/release-validate.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # --- Job 3: register the schema fixture and push the tag ------------------
  release:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    # The metadata tail is gone (it moved into docker-publish.yml, ADR 0021 /
    # issue #1163), so the job now ends at the tag -- no 6-hour ceiling needed.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IS_RC: ${{ needs.preflight.outputs.is_rc }}
      RESUME: ${{ needs.preflight.outputs.resume }}
      REF: ${{ inputs.ref }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `main` for a final release, `release/vX.Y.0` for an RC. fetch-depth 0
          # so the "tag exists" check and the "previous release tag" lookup see
          # the full ref set. persist-credentials: false per repo convention --
          # the push step scopes its own credential (the App token) via an
          # ephemeral helper.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Gate - ASVS/MASVS re-verification obligation
        if: ${{ env.IS_RC != 'true' }}
        env:
          ACK_ASVS_CURRENT: ${{ inputs.ack_asvs_current }}
        run: |
          set -eu
          report="docs/security/asvs-l2-verification-report.md"
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "No previous release tag found -- treating the current report as the baseline."
            echo "ASVS_REVERIFICATION=baseline" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Previous release: $prev"
          # A re-verification pass adds a row to the report's section 10
          # changelog: `| N.N | DATE | ... |`. Require at least one such added
          # line since the previous release tag.
          added="$(git diff "${prev}..HEAD" -- "$report" | grep -cE '^\+\|[[:space:]]*[0-9]+\.[0-9]+[[:space:]]*\|' || true)"
          if [ "$added" -gt 0 ]; then
            echo "$report carries $added new changelog row(s) since $prev."
            echo "ASVS_REVERIFICATION=row-present" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$ACK_ASVS_CURRENT" ]; then
            msg="ASVS re-verification row absent; dispatcher acknowledged current: ${ACK_ASVS_CURRENT}"
            echo "::warning::${msg}"
            echo "### :warning: ${msg}" >> "$GITHUB_STEP_SUMMARY"
            echo "ASVS_REVERIFICATION=acked: ${ACK_ASVS_CURRENT}" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::$report has no new section-10 changelog row since $prev. Re-verify per section 8 and add the row, or re-dispatch with ack_asvs_current=<reason>."
          exit 1

      - name: Gate - per-release adversarial delta
        if: ${{ env.IS_RC != 'true' }}
        env:
          ACK_ADVERSARIAL_DELTA: ${{ inputs.ack_adversarial_delta }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          ledger="docs/security/adversarial-deltas.md"
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "No previous release tag found -- treating the current ledger as the baseline."
            echo "ADVERSARIAL_DELTA=baseline" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Previous release: $prev"
          # Feed cmd/adversarialdelta the paths changed since the previous tag.
          # It classifies any security-relevant surface class they touch and
          # requires $ledger to hold a row for this release naming each class it
          # touched. A release that touched no recognised class passes with
          # nothing to record. This is the per-release backstop for a new
          # surface class none of §9's per-class checks anticipated (#953).
          set +e
          out="$(git diff --name-only "${prev}..HEAD" | (cd backend && go run ./cmd/adversarialdelta -release "$VERSION" -ack "$ACK_ADVERSARIAL_DELTA"))"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            if printf '%s' "$out" | grep -q '::warning::'; then
              echo "ADVERSARIAL_DELTA=acked" >> "$GITHUB_ENV"
            elif printf '%s' "$out" | grep -q 'records the new surface'; then
              echo "ADVERSARIAL_DELTA=row-present" >> "$GITHUB_ENV"
            else
              echo "ADVERSARIAL_DELTA=no-surface" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          # A dry run rehearses the path; it does not release memory. A missing
          # ledger row while the register is being populated must not make the
          # weekly rehearsal red for a version that is not being cut, so a dry
          # run records the would-block as a warning and continues. A real
          # release fails hard.
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::Adversarial-delta gate would block a real release of $VERSION; dry run continues. See $ledger."
            echo "ADVERSARIAL_DELTA=would-block" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::Adversarial-delta gate failed. Record the delta in $ledger, or re-dispatch with ack_adversarial_delta=<reason>."
          exit 1

      # --- Step 4: register + regenerate the schema fixture ---------------
      # Final-release only. An RC ships the same schema the final will, and no
      # in-place upgrade is ever supported *from* an RC, so the fixture is
      # registered once -- at promotion (promote-rc.yml), against the final tag.

      - name: Derive the migration version from the tree
        run: |
          set -eu
          migver=""
          for f in backend/database/migrations/[0-9]*_*.up.sql; do
            [ -f "$f" ] || continue
            n="${f##*/}"; n="${n%%_*}"
            n=$((10#$n))
            if [ -z "$migver" ] || [ "$n" -gt "$migver" ]; then migver="$n"; fi
          done
          if [ -z "$migver" ]; then
            echo "::error::No migration files found under backend/database/migrations/."
            exit 1
          fi
          echo "MIGRATION_VERSION=$migver" >> "$GITHUB_ENV"
          echo "Derived migration version $migver (highest 000NNN_*.up.sql in the tree)."

      - name: Register the release
        if: ${{ env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
        run: |
          set -eu
          # issue #929: a dry run is allowed (preflight downgrades it to a warning)
          # to target a version already in SupportedReleases -- the documented
          # way to rehearse the final-release path against the last shipped
          # release. That is the ONLY way this step can be reached with an
          # already-registered $VERSION (a real, non-dry-run cut of an
          # already-registered version fails preflight outright). Skip re-adding
          # it: appending a second entry for the same tag corrupted the
          # frozen-chain assertion below every time (genschema regenerated
          # that version's dump byte-identical, so the assertion's expected
          # "one new untracked file" was never true).
          decision="$(.github/scripts/release-register-decide.sh backend/internal/schemafixture/releases.go "$VERSION")"
          echo "REGISTRATION=$decision" >> "$GITHUB_ENV"
          if [ "$decision" = "SKIP" ]; then
            echo "$VERSION is already registered in SupportedReleases -- skipping re-registration (dry-run rehearsal of an already-shipped version)."
            exit 0
          fi
          # Append {Tag: "$VERSION", Version: $MIGRATION_VERSION} after the last
          # existing SupportedReleases entry, preserving release order.
          python3 - "$VERSION" "$MIGRATION_VERSION" <<'PYEOF'
          import sys
          version, migver = sys.argv[1], sys.argv[2]
          path = "backend/internal/schemafixture/releases.go"
          lines = open(path).read().splitlines(keepends=True)
          idx = max(i for i, line in enumerate(lines) if line.lstrip().startswith("{Tag:"))
          lines.insert(idx + 1, f'\t{{Tag: "{version}", Version: {migver}}},\n')
          open(path, "w").writelines(lines)
          PYEOF
          gofmt -w backend/internal/schemafixture/releases.go
          git diff -- backend/internal/schemafixture/releases.go

      - name: Regenerate schema dumps
        if: ${{ env.IS_RC != 'true' }}
        working-directory: backend
        run: go run ./cmd/genschema

      # The frozen-chain check: genschema rewrites every dump in place. A new
      # release expects exactly one new (untracked) file and zero
      # modifications. issue #929: rehearsing an already-registered version
      # (REGISTRATION=SKIP, above -- only reachable via a dry run) appends
      # nothing new to SupportedReleases, so regenerating from the unchanged
      # set must reproduce every dump byte-identical -- the correct
      # expectation there is NO diff at all, not a new file that was never
      # going to appear.

      - name: Assert only the new dump changed
        if: ${{ env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRATION: ${{ env.REGISTRATION }}
        run: |
          set -eu
          if [ "$REGISTRATION" = "SKIP" ]; then
            expected=""
            description="no changes (dry run rehearsing already-registered ${VERSION}: the frozen chain must reproduce it byte-identically)"
          else
            expected="?? backend/database/testdata/schemas/${VERSION}.sql"
            description="exactly: ${expected}"
          fi
          actual="$(git status --porcelain -- backend/database/testdata/schemas/)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Schema dumps did not regenerate as expected."
            echo "::error::Expected ${description}"
            echo "$actual"
            exit 1
          fi
          if [ "$REGISTRATION" = "SKIP" ]; then
            echo "Frozen chain holds: regenerating from the current (unchanged) release set reproduced every dump byte-identical."
          else
            echo "Frozen chain holds: existing dumps byte-identical; ${VERSION}.sql is the only new file."
          fi

      - name: Verify test gates
        if: ${{ env.IS_RC != 'true' }}
        working-directory: backend
        run: go test ./internal/schemafixture/... ./cmd/genschema/... ./cmd/releaselist/...

      # --- Step 6: release metadata -------------------------------------

      - name: Dry run - summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run complete"
            echo
            echo "Every gate passed and \`${VERSION}\` checked cleanly. No commit, push or tag was made."
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Commit + push the fixture (final release only) -----------------
      # Mint the App token HERE, not at the top of the workflow. The composed
      # gate battery in `validate` can take a long time; a GitHub App
      # installation token lives only ~1 hour, so a token minted before the
      # gates is already dead by "Push main". Confirmed failing for real: the
      # resumed v0.8.7 cut (run 35381018703) spent ~75 minutes in the old gate
      # poll and died on "Push main" with "Invalid username or
      # token ... Password authentication is not supported for Git
      # operations", the token minted at 18:36 having expired.

      - name: Mint GitHub App token (fresh -- for the fixture push)
        id: app-token
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: the minted token can push the fixture commit and
          # the tag, nothing else -- even if the App is granted more.
          permission-contents: write

      - name: Commit the schema fixture
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRATION: ${{ env.REGISTRATION }}
        run: |
          set -eu
          # Idempotent (issue #1142): a resumed release reaches here with
          # REGISTRATION=SKIP -- the fixture commit is already on main. Leave
          # RELEASE_COMMIT at the checked-out tip set by "Verify repository
          # state": that tip carries the fix that made the earlier attempt
          # fail, and is what the tag should point at.
          if [ "$REGISTRATION" = "SKIP" ]; then
            echo "$VERSION is already registered; nothing to commit. Release commit remains $(git rev-parse --short HEAD)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/schemafixture/releases.go backend/database/testdata/schemas/"$VERSION".sql
          git commit -m "release: register $VERSION schema fixture (issue #529, #499)"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push main
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          # No-op on a resume: RELEASE_COMMIT is the checked-out tip of main,
          # which "Verify repository state" already confirmed equals
          # origin/main, and the commit step above added nothing.
          # Ephemeral credential helper for the push only. ${GH_APP_TOKEN} must
          # expand at git-helper runtime, not when this script is parsed.
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "HEAD:refs/heads/main"

      # ADR 0021 (issue #1164): the durable record of what was validated and
      # tagged, emitted once every gate has passed and the release commit is
      # final. Kept as a workflow artifact for audit and for a future
      # re-dispatch to resume from rather than re-deriving state from `git`.
      - name: Emit release-readiness artifact
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          IS_RC: ${{ env.IS_RC }}
          RESUME: ${{ env.RESUME }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          REF: ${{ inputs.ref }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg source_commit "$RELEASE_COMMIT" \
            --arg source_ref "$REF" \
            --argjson rc "${IS_RC:-false}" \
            --argjson resumed "${RESUME:-false}" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$version, source_commit:$source_commit, source_ref:$source_ref, rc:$rc, resumed:$resumed, validation:"release-validate.yml passed", generated_at:$generated_at}' \
            | tee release-readiness.json

      - name: Upload release-readiness artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-${{ env.VERSION }}
          path: release-readiness.json
          retention-days: 90

      - name: Re-mint GitHub App token (fresh -- for the tag push)
        id: app-token-2
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          GH_APP_TOKEN: ${{ steps.app-token-2.outputs.token }}
        run: |
          set -eu
          # The tag points at the release commit: the fixture commit for a
          # final release (docker-publish's schema-fixture-gate checks the
          # tagged tree), or the release-branch tip for an RC (that gate is
          # exempt for `-rc.` tags). The tag push triggers docker-publish.yml,
          # which owns the Release and every asset on it (ADR 0021, #1163) --
          # this workflow no longer waits for that Release.
          git tag "$VERSION" "$RELEASE_COMMIT"
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "refs/tags/${VERSION}"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
          RC: ${{ env.IS_RC }}
          REF: ${{ inputs.ref }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          RESUME: ${{ env.RESUME }}
        run: |
          set -eu
          {
            if [ "$RC" = "true" ]; then
              echo "### Release candidate ${VERSION} cut"
              echo
              echo "- cut from \`${REF}\` at \`$(git rev-parse --short "$RELEASE_COMMIT")\` -- no schema fixture (registered at promotion), no ASVS row gate"
              echo "- every mandatory gate + release-tier suite green (or deadline-warned) before the tag"
              echo "- tag \`${VERSION}\` pushed; \`docker-publish.yml\` marks its GitHub Release a **pre-release** (off the update check + Obtainium)"
              echo "- promote to \`${VERSION%-rc.*}\` with \`promote-rc.yml\` once the exit criteria in docs/release-candidate-process.md are met"
            else
              echo "### Release ${VERSION} cut"
              echo
              echo "- \`{Tag: \"${VERSION}\", Version: ${MIGRATION_VERSION}}\` registered in \`backend/internal/schemafixture/releases.go\`"
              echo "- \`backend/database/testdata/schemas/${VERSION}.sql\` committed to \`main\` ($(git rev-parse --short HEAD))"
              echo "- every mandatory gate + release-tier suite green (or deadline-warned) before the tag"
              echo "- tag \`${VERSION}\` pushed to that commit"
              if [ "${RESUME:-false}" = "true" ]; then
                echo "- **resumed** an interrupted attempt: the fixture was already registered, so no new commit was made; the gates + release-tier suites were re-run at the checked-out tip before tagging"
              fi
            fi
            echo
            echo "\`docker-publish.yml\` is now building + signing the images and APK, minting SBOMs + SLSA provenance + SHA256SUMS, and creating the GitHub Release:"
            echo "<https://github.com/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
