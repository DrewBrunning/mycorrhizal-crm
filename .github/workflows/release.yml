name: Release

# REL-06 (issue #499): the single automated release workflow -- dispatch
# with a version and everything downstream is automatic and gated.
#
# FINAL vs RC (RC-02, #446): `vX.Y.Z` is a final release cut from `main`;
# `vX.Y.Z-rc.N` is a release candidate cut from `release/vX.Y.0`. An RC
# composes the SAME gate battery ("RC gates match release gates", #446
# action 7) but SKIPS the two final-only pieces: the schema-fixture
# registration (an RC ships the final's schema and is never itself an
# in-place upgrade source; registered once at promotion, promote-rc.yml)
# and the ASVS/MASVS re-verification + adversarial-delta obligations (an RC
# still runs citecheck). docker-publish.yml marks an `-rc.` tag's Release as
# a pre-release, off the update check and Obtainium. Promotion (same
# artifact by digest) is promote-rc.yml. Full policy:
# docs/release-candidate-process.md.
#
# What a run does (ADR 0021, #1162), three jobs, no cross-run polling:
#   1. `preflight` -- validates the version string and that it's unshipped
#      (registered-but-untagged is an interrupted release, RESUMED per
#      #1142; an existing tag is a hard refusal); verifies the checkout is
#      the true tip of `ref`; runs citecheck + releasegatecheck.
#   2. `validate` -- calls the reusable release-validate.yml, which composes
#      every mandatory + release-tier gate with real `needs:` -- the ONE
#      definition of "is this commit releasable" (docker-publish.yml calls
#      the same workflow for a tag-triggered cut, so the two cannot drift).
#   3. `release` -- release-only bookkeeping: the ASVS/adversarial-delta
#      gates (final only, #608/#953), schema-fixture registration +
#      regeneration + frozen-chain assertion + test gates (final only), then
#      the App-token-signed tag push.
#
# release-metadata.json and every Release asset are owned by
# docker-publish.yml (ADR 0021, #1163); this workflow ends at the tag and
# never waits for a Release to appear. The tag push is what triggers
# docker-publish.yml, and only works with a GitHub App token (not
# GITHUB_TOKEN, which cannot trigger another workflow).
#
# DRY RUN (`dry_run: true`): runs the whole gate composition + fixture
# regeneration + test gates, but makes NO commit/push/tag/artifact (#499:
# "the workflow is itself tested"). `preflight`'s tag-exists/already-
# registered checks downgrade to warnings so a dry run can target the last
# shipped version. `release-dry-run.yml` dispatches this weekly + on demand
# against the last SupportedReleases entry (#929).
#
# Rehearsing an ALREADY-REGISTERED version (#929): "Register the release"
# skips re-appending when the version is already there
# (release-register-decide.sh) -- a dry run against the last shipped
# version must reproduce every dump byte-identical, so "Assert only the new
# dump changed" expects NO diff there, not a new untracked file.
#
# One-time setup (docs/security/release-verification.md, "How a release is
# cut"): a GitHub App with Contents: write installed on this repo; repo
# variable RELEASE_APP_ID + secret RELEASE_APP_PRIVATE_KEY; the App on
# main's branch-protection/ruleset bypass list.
#
# Re-entrant/resumable (#1142): re-dispatching the same version is the
# recovery path for every failure before the tag exists -- registration is
# idempotent, the fixture commit is a no-op if already landed, the release
# commit is the checked-out tip, and the full gate battery re-runs before
# the tag.
#
# Failure modes: a gate/registration fails -> nothing pushed, fix and
# re-dispatch. (final) fixture pushed but tag push fails -> fix on main and
# re-dispatch (RESUMES at the new tip; an RC has no such window, nothing is
# pushed before its tag). Tag pushed, docker-publish.yml fails -> recover
# via docker-publish.yml's `tag` dispatch input, never re-dispatch this
# workflow for an already-tagged version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to cut, e.g. v0.6.6 or v1.0.0-rc.1'
        required: true
        type: string
      ref:
        description: 'Branch to cut from -- main for a final release, release/vX.Y.0 for an RC (RC-02, issue #446)'
        required: false
        type: string
        default: main
      dry_run:
        description: 'Run every gate + regenerate the fixture, but make no commit/push/tag'
        required: false
        type: boolean
        default: false
      ack_asvs_current:
        description: 'Reason the ASVS/MASVS claim is current without a new re-verification row (leave blank to require the row)'
        required: false
        type: string
        default: ''
      ack_adversarial_delta:
        description: 'Reason to proceed without a recorded per-release adversarial delta for added surface (leave blank to require it)'
        required: false
        type: string
        default: ''

# Read-only by default (StepSecurity "Restrict permissions for GITHUB_TOKEN").
permissions:
  contents: read

# ADR 0021 (issue #1164): serialize cuts of one version so two overlapping
# dispatches cannot interleave their fixture commit and tag.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Job 1: fast, read-only checks that reject a bad dispatch before any
  # expensive gate runs (ADR 0021, #1162).
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Read a prior run's release-readiness artifact (ADR 0021, #1164).
      actions: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_rc: ${{ steps.validate.outputs.is_rc }}
      resume: ${{ steps.validate.outputs.resume }}
      resumed_from_run: ${{ steps.validate.outputs.resumed_from_run }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 so tag-exists / previous-release-tag lookups see
          # the full ref set; persist-credentials false, the push step
          # scopes its own credential (App token) via an ephemeral helper.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate version input
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Canonical release-tag pattern (REL-01, #445). Kept byte-identical
          # to docker-publish.yml's gate; a drift test fails if they diverge.
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Version must match the versioning policy: vMAJOR.MINOR.PATCH with an optional -rc.N suffix (e.g. v0.6.6 or v1.0.0-rc.1). Got '$VERSION'. See docs/versioning-policy.md."
            exit 1
          fi
          # RC-02 (#446): classify -- an `-rc.N` suffix is a release
          # candidate, see the header comment.
          if printf '%s' "$VERSION" | grep -qE -- '-rc\.[0-9]+$'; then
            IS_RC=true
            echo "Release candidate: $VERSION (cut from ${GITHUB_REF_NAME:-the checked-out ref})."
          else
            IS_RC=false
          fi
          echo "is_rc=$IS_RC" >> "$GITHUB_OUTPUT"

          # Resume decision (ADR 0021, #1164). Primary signal: the durable
          # release-readiness artifact a prior run uploaded before tagging.
          # Git state is the permanent backstop + fail-closed consistency
          # check: a final version already in SupportedReleases with no tag
          # is an interrupted release. An existing tag always hard-fails.
          tag_exists=false
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then tag_exists=true; fi
          registered=false
          if [ "$IS_RC" != "true" ] && grep -qF "{Tag: \"$VERSION\"," backend/internal/schemafixture/releases.go; then registered=true; fi

          prior_run=""
          prior_fixture=false
          if [ "$IS_RC" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            art="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-readiness-${VERSION}" \
                     --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | last // empty' 2>/dev/null || true)"
            if [ -n "$art" ]; then
              art_id="$(printf '%s' "$art" | jq -r '.id')"
              prior_run="$(printf '%s' "$art" | jq -r '.workflow_run.id')"
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}/zip" > "${RUNNER_TEMP}/readiness.zip"
              unzip -o -q "${RUNNER_TEMP}/readiness.zip" -d "${RUNNER_TEMP}/readiness"
              prior_fixture="$(jq -r '.fixture_registered // false' "${RUNNER_TEMP}/readiness/release-readiness.json")"
              echo "Found a prior release-readiness artifact (run ${prior_run}); fixture_registered=${prior_fixture}."
            fi
          fi

          if [ "$tag_exists" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Tag $VERSION already exists; pick a version that has not shipped."
            exit 1
          fi

          # Fail closed if the durable record and git disagree: never tag a
          # commit whose schema fixture is not actually registered.
          if [ "$prior_fixture" = "true" ] && [ "$registered" != "true" ]; then
            echo "::error::release-readiness artifact for $VERSION records fixture_registered=true, but $VERSION is not in SupportedReleases. Refusing."
            exit 1
          fi

          if [ "$IS_RC" != "true" ] && [ "$DRY_RUN" != "true" ] && [ "$tag_exists" != "true" ] \
             && { [ -n "$prior_run" ] || [ "$registered" = "true" ]; }; then
            if [ -n "$prior_run" ]; then
              echo "::warning::$VERSION has a prior release-readiness artifact (run ${prior_run}) and no tag -- resuming from the recorded state at the checked-out tip."
            else
              echo "::warning::$VERSION is already registered in SupportedReleases with no tag yet, but no readiness artifact was found -- resuming from the git registration at the checked-out tip."
            fi
            echo "resume=true" >> "$GITHUB_OUTPUT"
            echo "resumed_from_run=$prior_run" >> "$GITHUB_OUTPUT"
          else
            # Dry runs downgrade the two checks to warnings (#929: the
            # rehearsal targets the last shipped version deliberately).
            if [ "$DRY_RUN" = "true" ] && [ "$tag_exists" = "true" ]; then
              echo "::warning::Tag $VERSION already exists -- allowed for a dry run (no tag is pushed)."
            fi
            if [ "$DRY_RUN" = "true" ] && [ "$registered" = "true" ]; then
              echo "::warning::$VERSION is already registered in SupportedReleases -- allowed for a dry run."
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify repository state
        id: verify
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          git fetch --quiet origin "$REF"
          head="$(git rev-parse HEAD)"
          origin="$(git rev-parse "origin/${REF}")"
          echo "Local HEAD:      $head"
          echo "origin/${REF}:  $origin"
          if [ "$head" != "$origin" ]; then
            echo "::error::Checkout is not at the tip of origin/${REF} ($head != $origin). Re-dispatch; do not cut from a stale ref."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean on a fresh checkout -- refusing."
            git status --porcelain
            exit 1
          fi
          echo "release_commit=$head" >> "$GITHUB_OUTPUT"

      - name: Gate - security-doc citations (citecheck)
        working-directory: backend
        run: |
          echo "citecheck must exit 0 for a release to proceed (issue #608)."
          go run ./cmd/citecheck

      - name: Gate - release-gate registry is coherent
        working-directory: backend
        run: go run ./cmd/releasegatecheck


  # Job 2 (ADR 0021, #1162): the reusable workflow that composes the
  # mandatory per-PR gates and release-tier suites with real `needs:`,
  # replacing the old dispatch-and-poll steps. Grants two write scopes GitHub
  # validates statically against every caller in the chain even though each
  # is inert when composed: security-events (SARIF uploads) and statuses
  # (unit-tests.yml's codecov-patch-stub, #1188). Recorded in
  # asvs-l2-verification-report.md §9.
  validate:
    needs: preflight
    uses: ./.github/workflows/release-validate.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      security-events: write
      # Required by unit-tests.yml's `codecov-patch-stub` job (#1188); inert
      # when composed (the job is skipped off pull_request events).
      statuses: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 3: register the schema fixture and push the tag.
  release:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    # The metadata tail moved into docker-publish.yml (ADR 0021/#1163), so
    # the job now ends at the tag -- no 6-hour ceiling needed.
    timeout-minutes: 120
    permissions:
      contents: read
      # Download the composer's per-gate results artifact for the
      # release-readiness record (ADR 0021, #1164).
      actions: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IS_RC: ${{ needs.preflight.outputs.is_rc }}
      RESUME: ${{ needs.preflight.outputs.resume }}
      RESUMED_FROM_RUN: ${{ needs.preflight.outputs.resumed_from_run }}
      REF: ${{ inputs.ref }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 so tag-exists / previous-release-tag lookups see
          # the full ref set; persist-credentials false, the push step
          # scopes its own credential (App token) via an ephemeral helper.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Both obligations live in one shared script so promote-rc.yml runs
      # the same definition at promotion (#1195) -- unconditionally there,
      # `if: is_rc != true` here.
      - name: Gate - ASVS/MASVS re-verification obligation
        if: ${{ env.IS_RC != 'true' }}
        env:
          ACK_ASVS_CURRENT: ${{ inputs.ack_asvs_current }}
        run: |
          set -eu
          bash .github/scripts/release-obligations.sh asvs --ack "${ACK_ASVS_CURRENT:-}"

      - name: Gate - per-release adversarial delta
        if: ${{ env.IS_RC != 'true' }}
        env:
          ACK_ADVERSARIAL_DELTA: ${{ inputs.ack_adversarial_delta }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          if [ "$DRY_RUN" = "true" ]; then
            bash .github/scripts/release-obligations.sh adversarial --release "$VERSION" --ack "${ACK_ADVERSARIAL_DELTA:-}" --dry-run
          else
            bash .github/scripts/release-obligations.sh adversarial --release "$VERSION" --ack "${ACK_ADVERSARIAL_DELTA:-}"
          fi

      # Register + regenerate the schema fixture, final-release only (an RC
      # is never itself an upgrade source; registered once at promotion).
      - name: Derive the migration version from the tree
        run: |
          set -eu
          migver=""
          for f in backend/database/migrations/[0-9]*_*.up.sql; do
            [ -f "$f" ] || continue
            n="${f##*/}"; n="${n%%_*}"
            n=$((10#$n))
            if [ -z "$migver" ] || [ "$n" -gt "$migver" ]; then migver="$n"; fi
          done
          if [ -z "$migver" ]; then
            echo "::error::No migration files found under backend/database/migrations/."
            exit 1
          fi
          echo "MIGRATION_VERSION=$migver" >> "$GITHUB_ENV"
          echo "Derived migration version $migver (highest 000NNN_*.up.sql in the tree)."

      - name: Register the release
        if: ${{ env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
        run: |
          set -eu
          # #929: a dry run (preflight downgrades to a warning) is the ONLY
          # way to reach here with an already-registered $VERSION (a real
          # cut fails preflight outright). Skip re-adding: a second entry
          # for the same tag corrupted the frozen-chain assertion below
          # every time.
          decision="$(.github/scripts/release-register-decide.sh backend/internal/schemafixture/releases.go "$VERSION")"
          echo "REGISTRATION=$decision" >> "$GITHUB_ENV"
          if [ "$decision" = "SKIP" ]; then
            echo "$VERSION is already registered in SupportedReleases -- skipping re-registration (dry-run rehearsal of an already-shipped version)."
            exit 0
          fi
          # Append {Tag: "$VERSION", Version: $MIGRATION_VERSION} after the last
          # existing SupportedReleases entry, preserving release order.
          python3 - "$VERSION" "$MIGRATION_VERSION" <<'PYEOF'
          import sys
          version, migver = sys.argv[1], sys.argv[2]
          path = "backend/internal/schemafixture/releases.go"
          lines = open(path).read().splitlines(keepends=True)
          idx = max(i for i, line in enumerate(lines) if line.lstrip().startswith("{Tag:"))
          lines.insert(idx + 1, f'\t{{Tag: "{version}", Version: {migver}}},\n')
          open(path, "w").writelines(lines)
          PYEOF
          gofmt -w backend/internal/schemafixture/releases.go
          git diff -- backend/internal/schemafixture/releases.go

      - name: Regenerate schema dumps
        if: ${{ env.IS_RC != 'true' }}
        working-directory: backend
        run: go run ./cmd/genschema

      # The frozen-chain check: genschema rewrites every dump in place. A
      # new release expects exactly one new (untracked) file and zero
      # modifications; #929's REGISTRATION=SKIP rehearsal expects NO diff at
      # all (nothing new was appended to regenerate against).
      - name: Assert only the new dump changed
        if: ${{ env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRATION: ${{ env.REGISTRATION }}
        run: |
          set -eu
          if [ "$REGISTRATION" = "SKIP" ]; then
            expected=""
            description="no changes (dry run rehearsing already-registered ${VERSION}: the frozen chain must reproduce it byte-identically)"
          else
            expected="?? backend/database/testdata/schemas/${VERSION}.sql"
            description="exactly: ${expected}"
          fi
          actual="$(git status --porcelain -- backend/database/testdata/schemas/)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Schema dumps did not regenerate as expected."
            echo "::error::Expected ${description}"
            echo "$actual"
            exit 1
          fi
          if [ "$REGISTRATION" = "SKIP" ]; then
            echo "Frozen chain holds: regenerating from the current (unchanged) release set reproduced every dump byte-identical."
          else
            echo "Frozen chain holds: existing dumps byte-identical; ${VERSION}.sql is the only new file."
          fi

      - name: Verify test gates
        if: ${{ env.IS_RC != 'true' }}
        working-directory: backend
        run: go test ./internal/schemafixture/... ./cmd/genschema/... ./cmd/releaselist/...

      - name: Dry run - summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run complete"
            echo
            echo "Every gate passed and \`${VERSION}\` checked cleanly. No commit, push or tag was made."
          } >> "$GITHUB_STEP_SUMMARY"

      # Mint the App token HERE, not at the top of the workflow: an App
      # installation token lives only ~1 hour, and the composed gate battery
      # in `validate` can run well past that -- confirmed failing for real
      # (the resumed v0.8.7 cut died on "Push main" with an expired token
      # after ~75 minutes in the old gate poll).
      - name: Mint GitHub App token (fresh -- for the fixture push)
        id: app-token
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: the minted token can push the fixture commit and
          # the tag, nothing else -- even if the App is granted more.
          permission-contents: write

      - name: Commit the schema fixture
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRATION: ${{ env.REGISTRATION }}
        run: |
          set -eu
          # Idempotent (#1142): a resumed release reaches here with
          # REGISTRATION=SKIP -- the fixture commit is already on main.
          if [ "$REGISTRATION" = "SKIP" ]; then
            echo "$VERSION is already registered; nothing to commit. Release commit remains $(git rev-parse --short HEAD)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/schemafixture/releases.go backend/database/testdata/schemas/"$VERSION".sql
          git commit -m "release: register $VERSION schema fixture (issue #529, #499)"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push main
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          # No-op on a resume: RELEASE_COMMIT is already origin/main's tip.
          # Ephemeral credential helper for the push only; ${GH_APP_TOKEN}
          # must expand at git-helper runtime, not when this script is parsed.
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "HEAD:refs/heads/main"

      # ADR 0021 (#1164): the durable release-readiness record, emitted once
      # every gate has passed and the release commit is final. A re-dispatch
      # reads it rather than re-deriving state from git; docker-publish
      # attaches it to the Release.
      - name: Download the composer's per-gate results
        if: ${{ !inputs.dry_run }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gate-results
          path: release-gate-results

      - name: Emit release-readiness artifact
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          IS_RC: ${{ env.IS_RC }}
          RESUME: ${{ env.RESUME }}
          RESUMED_FROM_RUN: ${{ env.RESUMED_FROM_RUN }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
          REF: ${{ inputs.ref }}
          ACK_ASVS: ${{ inputs.ack_asvs_current }}
          ACK_ADV: ${{ inputs.ack_adversarial_delta }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          # The residual-risk statement (#953), same input docker-publish.yml's
          # release metadata uses.
          residual="${RUNNER_TEMP:-/tmp}/residual-risk.json"
          (cd backend && go run ./cmd/residualrisk -out "$residual")
          jq -n \
            --arg version "$VERSION" \
            --arg source_commit "$RELEASE_COMMIT" \
            --arg source_ref "$REF" \
            --argjson rc "${IS_RC:-false}" \
            --argjson resumed "${RESUME:-false}" \
            --arg resumed_from_run "${RESUMED_FROM_RUN:-}" \
            --argjson migration_version "${MIGRATION_VERSION:-0}" \
            --arg workflow_run "$RUN_URL" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson fixture_registered "$( [ "$IS_RC" = "true" ] && echo false || echo true )" \
            --arg ack_asvs "$ACK_ASVS" \
            --arg ack_adv "$ACK_ADV" \
            --slurpfile gates release-gate-results/release-gate-results.json \
            --slurpfile residual "$residual" \
            '{version:$version, source_commit:$source_commit, source_ref:$source_ref, rc:$rc, resumed:$resumed, resumed_from_run:$resumed_from_run, migration_version:$migration_version, workflow_run:$workflow_run, generated_at:$generated_at, fixture_registered:$fixture_registered, gates:$gates[0], ack_asvs_current:$ack_asvs, ack_adversarial_delta:$ack_adv, residual_risk:$residual[0]}' \
            | tee release-readiness.json

      - name: Upload release-readiness artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-${{ env.VERSION }}
          path: release-readiness.json
          retention-days: 90

      - name: Re-mint GitHub App token (fresh -- for the tag push)
        id: app-token-2
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          GH_APP_TOKEN: ${{ steps.app-token-2.outputs.token }}
        run: |
          set -eu
          # Tag points at the fixture commit (final) or the release-branch
          # tip (RC, schema-fixture-gate exempt for `-rc.` tags). Triggers
          # docker-publish.yml, which owns the Release (ADR 0021, #1163).
          git tag "$VERSION" "$RELEASE_COMMIT"
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "refs/tags/${VERSION}"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
          RC: ${{ env.IS_RC }}
          REF: ${{ inputs.ref }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          RESUME: ${{ env.RESUME }}
        run: |
          set -eu
          {
            if [ "$RC" = "true" ]; then
              echo "### Release candidate ${VERSION} cut"
              echo
              echo "- cut from \`${REF}\` at \`$(git rev-parse --short "$RELEASE_COMMIT")\` -- no schema fixture (registered at promotion), no ASVS row gate"
              echo "- every mandatory gate + release-tier suite green (or deadline-warned) before the tag"
              echo "- tag \`${VERSION}\` pushed; \`docker-publish.yml\` marks its GitHub Release a **pre-release** (off the update check + Obtainium)"
              echo "- promote to \`${VERSION%-rc.*}\` with \`promote-rc.yml\` once the exit criteria in docs/release-candidate-process.md are met"
            else
              echo "### Release ${VERSION} cut"
              echo
              echo "- \`{Tag: \"${VERSION}\", Version: ${MIGRATION_VERSION}}\` registered in \`backend/internal/schemafixture/releases.go\`"
              echo "- \`backend/database/testdata/schemas/${VERSION}.sql\` committed to \`main\` ($(git rev-parse --short HEAD))"
              echo "- every mandatory gate + release-tier suite green (or deadline-warned) before the tag"
              echo "- tag \`${VERSION}\` pushed to that commit"
              if [ "${RESUME:-false}" = "true" ]; then
                echo "- **resumed** an interrupted attempt: the fixture was already registered, so no new commit was made; the gates + release-tier suites were re-run at the checked-out tip before tagging"
              fi
            fi
            echo
            echo "\`docker-publish.yml\` is now building + signing the images and APK, minting SBOMs + SLSA provenance + SHA256SUMS, and creating the GitHub Release:"
            echo "<https://github.com/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
