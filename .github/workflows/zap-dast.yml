name: DAST (OWASP ZAP)

# Issue #368: everything in CI so far is static (SAST/SCA/supply-chain); nothing
# attacks the *running* application. This workflow is the dynamic complement:
# it boots the real all-in-one image (docker-compose.test.yml), runs OWASP ZAP
# against it — an authenticated API scan seeded from backend/openapi.yaml plus
# an active scan of the SPA and the CardDAV/CalDAV discovery surface — and
# gates on High/Medium findings via backend/cmd/zapgate's ignore-list-with-
# justification (zap/dast.ignore). The verdict is zapgate; the full ZAP
# report.json is kept as a 30-day run artifact. Results are deliberately NOT
# uploaded to code scanning: GitHub anchors every SARIF result to a source
# line inside the checkout, and a DAST finding is a property of the running
# system with no honest repo-relative path (issue #615).
#
# Scheduled (nightly) + manual dispatch only — deliberately NOT on push/PR:
# DAST is slow and flaky (the issue calls this out), so it is a periodic
# regression sweep, not a per-PR gate. The scan runs against a throwaway
# test database only; it must never point at real data.

on:
  schedule:
    - cron: '50 1 * * *' # 01:50 UTC nightly (issue #578: moved off the weekly cadence)
  workflow_dispatch:
  workflow_call:
    inputs:
      # Issue #1484: digest of the candidate image release-validate.yml built
      # once (sha256:<64 hex>). When set, the all-in-one image is pulled by
      # digest instead of built from source. Empty (every non-composed run:
      # per-PR, push, schedule, dispatch) keeps the from-source build.
      image_digest:
        description: 'Candidate image digest to test instead of building from source (release composition only).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: zap-dast
  cancel-in-progress: false

jobs:
  dast:
    name: Run DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The canary + gate are Go commands in the backend module; built and run
      # directly on the runner (not in the app image).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the same all-in-one image e2e-tests.yml builds (the shipped
      # artifact), so ZAP attacks what actually ships.
      - name: Log in to Container Registry (candidate image)
        if: ${{ inputs.image_digest != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #1484: composed into the release battery, the image under test is
      # the ONE candidate release-validate.yml built, pulled by digest and
      # tagged under the name the rest of this job expects -- not a from-source
      # rebuild. The build step below is skipped in that case; per-PR,
      # push and schedule runs (no image_digest) still build from source.
      - name: Pull the candidate image (build-once)
        if: ${{ inputs.image_digest != '' }}
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: bash .github/scripts/candidate-image.sh pull "$IMAGE_DIGEST" mycorrhizal-crm-test:latest

      - name: Build all-in-one image
        if: ${{ inputs.image_digest == '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start the app (throwaway test DB)
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for the app to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # dastcanary is the deliberately-vulnerable sibling server whose planted
      # reflected-XSS proves the scan is actually detecting (see backend/cmd/
      # dastcanary). It runs on the host at :7301, reachable by ZAP via
      # --network host.
      - name: Build and start the DAST canary
        working-directory: backend
        run: |
          go build -o dastcanary ./cmd/dastcanary
          nohup ./dastcanary > /tmp/dastcanary.log 2>&1 </dev/null &
          echo "Waiting for the canary to be ready..."
          timeout 30 bash -c 'until curl -s http://localhost:7301/health/live > /dev/null 2>&1; do sleep 1; done'
          echo "Canary is ready"

      # The app's login only sets an httpOnly cookie, so ZAP cannot drive it
      # with its JSON-authentication method. Instead: register a throwaway
      # user, log in, mint a full-scope API token, and hand the bearer token to
      # ZAP via the documented ZAP_AUTH_HEADER[_VALUE|_SITE] env vars. The
      # token is written to the environment for the next step (never logged).
      - name: Bootstrap authenticated session (register + login + API token)
        run: |
          set -euo pipefail
          BASE="http://localhost:7300/api/v1"
          USER="dast_$(date +%s)"
          PASS='DastPassword123!'

          curl -sS -c /tmp/cookies.txt -o /dev/null \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${USER}\",\"email\":\"${USER}@example.com\",\"password\":\"${PASS}\"}" \
            "${BASE}/register"

          curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt -o /dev/null \
            -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"${USER}\",\"password\":\"${PASS}\"}" \
            "${BASE}/login"

          curl -sS -b /tmp/cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"name":"dast","scope":"full"}' \
            "${BASE}/api-tokens" > /tmp/token.json

          TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/token.json"))["token"])')"

          test -n "${TOKEN}"
          # Register the token as a secret BEFORE it reaches $GITHUB_ENV.
          # Without this the "not shown" below is untrue: the next step
          # interpolates DAST_TOKEN into ZAP_AUTH_HEADER_VALUE, and the runner
          # prints every step's resolved `env:` block, so the bearer token
          # appeared in plaintext in the log. It is minted per run against the
          # ephemeral compose stack, so the blast radius was small -- but the
          # step already intended to hide it.
          echo "::add-mask::${TOKEN}"
          echo "DAST_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "Authenticated session ready (token minted, not shown)."

      # ZAP runs headless via its automation framework (zap/zap-dast.yaml).
      # --network host lets the container reach both the app (:7300, exposed by
      # compose) and the canary (:7301, a host process). The plan writes
      # report.json into ./zap for the gate (and the run artifact). -Xmx6g caps
      # the JVM heap so the active scan fits the runner while still leaving
      # headroom for the docker-compose app stack alongside it (zap.sh
      # otherwise sizes 1/4 of host memory, which overcommits a standard
      # runner).
      #
      # Was -Xmx3g until run 36393384309 (issue #1278): the report's own
      # `insights` block recorded `insight.memory.usage: High, "Exceeded
      # High", 98%`, and the canary's activeScan job -- which normally spends
      # several seconds probing the planted reflected-XSS parameter --
      # completed in ~1s. The report came back with *zero* alerts on either
      # site (not just the canary), including the self-test signal zapgate
      # requires, which is consistent with the JVM running out of heap
      # partway through the active scan and silently dropping in-progress
      # alert data rather than crashing outright. 325 URLs get seeded from
      # openapi.yaml today; 3g was sized for a smaller surface. Bumped to 6g,
      # comfortably inside the ~16GB a GitHub-hosted runner reports (see the
      # same run's "Available memory: 15989 MB" line) with room left for the
      # app + canary containers.
      # Scan + gate live in one script so a BLIND scan (zapgate exit 3: only the
      # canary self-test missing, the issue #1278 JVM-pressure symptom) can be
      # re-scanned once -- and nothing else is retried: a real app finding is a
      # verdict, never re-rolled (issue #1487). The script carries the scan
      # invocation's own commentary (exit-code handling, the zap/ chmod).
      - name: Run ZAP scan and gate on findings (zapgate)
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: "Bearer ${{ env.DAST_TOKEN }}"
          ZAP_AUTH_HEADER_SITE: localhost:7300
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          # The gate: apply zap/dast.ignore, fail on unaccepted High/Medium
          # app findings, assert the canary self-test (planted XSS) was seen.
          ZAPGATE_REPORT: ../zap/report.json
          ZAPGATE_IGNORE: ../zap/dast.ignore
        run: bash .github/scripts/zap-scan-gate.sh

      # DAST findings are not uploaded to code scanning. GitHub anchors every
      # SARIF result to a source line inside the checkout; ZAP locates findings
      # by the URL it scanned (http://localhost:7300/...), and the upload is
      # rejected outright:
      #
      #   SARIF URI scheme "http" did not match the checkout URI scheme "file"
      #
      # A DAST finding is a property of the deployed system, not of a source
      # line, so there is no honest repo-relative path to give it. The gate is
      # backend/cmd/zapgate (ignore-list-with-justification, same shape as
      # .trivyignore / .grype.yml); the full ZAP report.json is kept as the
      # run artifact below. See issue #615 for the decision.
      - name: Upload ZAP JSON report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-dast-report
          path: zap/report.json
          retention-days: 30

      - name: Show app logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: |
          pkill -f dastcanary || true
          docker compose -f docker-compose.test.yml down -v
