name: License Compliance

# Issue #361: the CVEs of a dependency are scanned (govulncheck, Trivy), but
# its *license* never is. For an MIT-licensed project that is a silent
# contamination risk: a GPL/AGPL transitive dependency in the Go or npm tree
# would make the whole repo copyleft without anyone noticing, and
# THIRD_PARTY_SOURCES.md is hand-maintained and drifts.
#
# This workflow scans the two dependency trees that ship in the published
# Docker images — backend (Go, go.mod/go.sum) and frontend (npm, yarn.lock) —
# with Trivy's license scanner, and hard-fails when a forbidden/copyleft
# license (GPL/AGPL/LGPL — trivy's "restricted" bucket) appears. Everything
# else (MIT/Apache/BSD/MPL/UNKNOWN) is emitted to the log and attached as a
# JSON report so license questions are answerable without reading the whole
# tree.
#
# Trivy's license detection is file-based: for Go it reads LICENSE files from
# the module cache, and for npm it reads node_modules' package.json/license
# files. Both therefore need dependencies *resolved* first (go mod download /
# yarn install), not just the lockfiles. That is why this is path-gated on the
# narrow `go-manifests`/`npm-manifests` filters rather than the wider
# backend/frontend areas — resolution is expensive and only worth it when the
# dependency set actually changed (issue #264 pattern).
#
# Issue #942 added the third leg: Android/Gradle now emits a `gradle.lockfile`
# per module (dependency locking on the `release` compile/runtime classpaths —
# the classpath that actually ships, see android/build.gradle.kts), so Trivy
# has something to enumerate Gradle licenses from. Same shape as the other two
# legs: resolve real dependency files first (the `downloadLicenseScanArtifacts`
# task, this repo's equivalent of `go mod download` / `yarn install`), then
# scan + gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 2 * * *' # 02:10 UTC nightly (issue #578: consolidated nightly suite)

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go-manifests: ${{ steps.filter.outputs['go-manifests'] }}
      npm-manifests: ${{ steps.filter.outputs['npm-manifests'] }}
      gradle-manifests: ${{ steps.filter.outputs['gradle-manifests'] }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      - name: Report gating decision
        run: |
          echo "go-manifests=$GO_MANIFESTS_CHANGED"
          echo "npm-manifests=$NPM_MANIFESTS_CHANGED"
          echo "gradle-manifests=$GRADLE_MANIFESTS_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          # Boolean outputs only (the *_files outputs are the
          # attacker-influenced ones on PRs); passed as env vars so zizmor's
          # template-injection audit has nothing to flag in this workflow.
          GO_MANIFESTS_CHANGED: ${{ steps.filter.outputs['go-manifests'] }}
          NPM_MANIFESTS_CHANGED: ${{ steps.filter.outputs['npm-manifests'] }}
          GRADLE_MANIFESTS_CHANGED: ${{ steps.filter.outputs['gradle-manifests'] }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  backend-license:
    name: Backend (Go) license scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs['go-manifests'] == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Trivy reads LICENSE files from $GOPATH/pkg/mod, so the modules must be
      # extracted there — `go mod download` does that for every module in
      # go.mod (direct and indirect). Without it every dependency reports an
      # UNKNOWN license and the copyleft gate is useless.
      - name: Download Go modules (populate license source)
        working-directory: backend
        run: go mod download

      # Full inventory, no severity filter and no exit-code gate: this is the
      # report that answers "what license is X under?" for every detected
      # dependency, including UNKNOWN ones worth a human look.
      - name: Scan licenses (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          scanners: license
          format: json
          output: backend-license-report.json

      # The gate: trivy maps license classifications to severity (forbidden ->
      # CRITICAL, restricted/copyleft -> HIGH, reciprocal -> MEDIUM, permissive
      # -> LOW). Failing on CRITICAL,HIGH is the deliberate "no GPL/AGPL/LGPL
      # in an MIT repo" line; MPL/EPL (MEDIUM) and permissive licenses still
      # pass but are visible in the report above. exit-code: 1 makes the step
      # (and job) fail when a forbidden/copyleft license is found.
      - name: Gate on copyleft licenses (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-license-report
          path: backend-license-report.json
          retention-days: 30

  frontend-license:
    name: Frontend (npm) license scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs['npm-manifests'] == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # Trivy reads license fields + LICENSE files from node_modules, so the
      # tree must be materialized first. Dev dependencies are intentionally
      # not in scope of the gate (trivy excludes them by default) — they don't
      # ship in the image.
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Scan licenses (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          scanners: license
          format: json
          output: frontend-license-report.json

      - name: Gate on copyleft licenses (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-license-report
          path: frontend-license-report.json
          retention-days: 30

  android-license:
    name: Android (Gradle) license scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs['gradle-manifests'] == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The verify-lockfile step (issue #942's fix): a manifest change (a
      # version-catalog bump, a new dependency) that isn't matched by a
      # regenerated `gradle.lockfile` fails here — dependency locking itself
      # is the check (see android/build.gradle.kts's `verifyDependencyLocks`
      # doc comment for why this needs eager artifact resolution rather than
      # just the resolved graph). Runs before the download step below so a
      # stale lockfile is reported as a lock-drift failure, not muddled into
      # a generic download error.
      - name: Verify Gradle lockfiles are current
        working-directory: android
        run: ./gradlew verifyDependencyLocks

      # Trivy reads license metadata from the actual downloaded dependency
      # files, not the lockfile's coordinates alone — same reason Go needs
      # `go mod download` and npm needs `yarn install` above. Populates the
      # local Gradle module cache with the real `release`-classpath
      # jars/aars (local project modules excluded — first-party code, not a
      # license question).
      - name: Download Gradle dependencies (populate license source)
        working-directory: android
        run: ./gradlew downloadLicenseScanArtifacts

      - name: Scan licenses (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./android
          scanners: license
          format: json
          output: android-license-report.json

      - name: Gate on copyleft licenses (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./android
          scanners: license
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-license-report
          path: android/android-license-report.json
          retention-days: 30
