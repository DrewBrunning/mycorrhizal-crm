name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # Issue #578, B4: nightly is the full-length fuzz pass (-fuzztime=2m, see
  # FUZZTIME below) and re-runs the whole suite (Tier 3), which is why the
  # suite jobs exempt `schedule` from path-gating below.
  schedule:
    - cron: '5 2 * * *' # 02:05 UTC nightly
  # Issue #543: lets the release mandatory-gate step dispatch this against
  # an exact release commit instead of waiting for check-runs a `push` to
  # release/** never produces (a `push: release/**` trigger would trip
  # zizmor's cache-poisoning audit; workflow_dispatch needs write access,
  # unlike a push). Not for ad hoc manual runs.
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks. This job always runs and computes which
  # areas changed (.github/filters.yaml); a suite job below skipped by its
  # `if:` reports "Success", so every check here can be a required branch
  # check without unrelated areas blocking a PR.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
      android: ${{ steps.resolve.outputs.android }}
      openapi: ${{ steps.resolve.outputs.openapi }}
      workflows: ${{ steps.resolve.outputs.workflows }}
      changelog-relevant: ${{ steps.resolve.outputs.changelog-relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only (the *_files outputs are the attacker-influenced
      # ones on PRs), passed as env vars so zizmor's template-injection audit
      # has nothing to flag.
      #
      # workflow_dispatch forces every area true (issue #543): the
      # mandatory-gate dispatch path re-verifies a release commit's gates
      # for real, which needs the whole suite -- a manual dispatch has no
      # diff boundary for paths-filter to compute against anyway.
      - name: Resolve gating decision
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            backend=true; frontend=true; android=true; openapi=true; workflows=true; changelog=true
          else
            backend="$BACKEND_CHANGED"; frontend="$FRONTEND_CHANGED"; android="$ANDROID_CHANGED"
            openapi="$OPENAPI_CHANGED"; workflows="$WORKFLOWS_CHANGED"; changelog="$CHANGELOG_RELEVANT"
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "android=$android"
            echo "openapi=$openapi"
            echo "workflows=$workflows"
            echo "changelog-relevant=$changelog"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          ANDROID_CHANGED: ${{ steps.filter.outputs.android }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}
          CHANGELOG_RELEVANT: ${{ steps.filter.outputs.changelog-relevant }}

  # Issue #378: the security checklists' `file:line`/test citations rot when
  # *code moves*, not when the doc is edited (74 drifted before this existed)
  # -- so this job is deliberately NOT path-gated: any PR can orphan a
  # citation, and .github/filters.yaml maps docs/** to nothing anyway.
  docs-citations:
    permissions:
      contents: read
    name: Docs & security-doc citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Two gates: (1) every citation resolves and every cited row has one;
      # (2) no line-range citation has drifted past what
      # docs/security/citation-drift.ignore accepts (74 accumulated before
      # #378). `go run ./cmd/citecheck -drift` (not a CI step) lists every
      # candidate including accepted ones, for a verification pass.
      - name: Verify security-doc citations (resolution + drift)
        working-directory: backend
        run: go run ./cmd/citecheck

      # COMPAT-03 (#474): the dependency-advisory exception ledger promises a
      # fix/renewal before its `expires` date. Unconditional like citecheck
      # above (and every check below) so an expired exception surfaces even
      # with no PR activity to trip it.
      - name: Verify dependency-exception ledger freshness
        working-directory: backend
        run: go run ./cmd/depexceptions

      # MAINT-01 (#490): the deprecation register promises nothing on a
      # covered surface is removed before its window (>=1 minor release,
      # >=90 days) fully elapses.
      - name: Verify deprecation register
        working-directory: backend
        run: go run ./cmd/deprecations

      # DOC-04 (#489): docs/** links/anchors/repo-file refs resolve,
      # operator command blocks assume the right toolchain, and the
      # supported-versions/integration-ownership pages match code (#486/#488).
      - name: Verify docs structure (links, commands, drift)
        working-directory: backend
        run: go run ./cmd/docscheck

      # REL-03 (#447): .github/release-gates.json is well-formed, every gate
      # names a real workflow, and release-gates.md's table matches it.
      - name: Verify release-gate registry
        working-directory: backend
        run: go run ./cmd/releasegatecheck

      # #508/#513: .github/rulesets/*.json parse, main-protection.json's
      # required checks are exactly the mandatory gates (derived from #447,
      # never hand-drifted), repo-governance.md matches, and every cosign
      # verify identity is pinned to a workflow (#513).
      - name: Verify governance settings
        working-directory: backend
        run: go run ./cmd/governancecheck

      # Issue #979: codecov.yml maps to no path filter, so a one-line edit to
      # it would otherwise merge on human review alone. Asserts its
      # patch-status targets match coverage.md and every ignore: entry
      # carries a justifying comment.
      - name: Verify codecov.yml (patch targets, ignore justifications)
        working-directory: backend
        run: go run ./cmd/codecovcheck

      # nightlyalertcheck fails the build when the set of `schedule:`-
      # triggered workflow names diverges (either direction) from
      # nightly-failure-alert.yml's registration list, so a scheduled
      # workflow can't silently go unwatched.
      - name: Verify nightly-failure-alert.yml registration matches schedule triggers
        working-directory: backend
        run: go run ./cmd/nightlyalertcheck

      # coverage.md's Override path asks for a reason on every
      # coverage-exclusion marker; pragmacheck makes that mechanical over
      # `# pragma: no cover` (backend) and `/* v8 ignore ... */` (frontend).
      - name: Verify coverage-override markers carry a reason
        working-directory: backend
        run: go run ./cmd/pragmacheck

  # REL-05 (#449): a PR touching an operator-visible surface
  # (`changelog-relevant` in .github/filters.yaml) must carry an `##
  # Upgrade notes`/`## Security-relevant changes`/`## Breaking changes`
  # block, or `no-changelog: <reason>`. Pull-request only (no PR body on a
  # push); a skipped job reports success so it can be a required check.
  # Policy: docs/changelog-policy.md.
  changelog-note:
    name: Changelog note for operator-visible change
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changelog-relevant == 'true'
    permissions:
      contents: read
    steps:
      - name: Require an Upgrade notes block or an explicit opt-out
        env:
          # Via env, never inline -- PR body is attacker-controlled.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          if printf '%s' "$PR_BODY" | grep -qiE '^#{1,6}[[:space:]]+(upgrade notes|security-relevant changes|breaking changes)[[:space:]]*$'; then
            echo "Found an operator-notes block (Upgrade notes / Security-relevant changes / Breaking changes)."
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -qiE 'no-changelog:[[:space:]]*\S'; then
            echo "Found a 'no-changelog: <reason>' opt-out."
            exit 0
          fi
          echo "::error::This PR changes an operator-visible surface (a migration, the config surface, or .env.example) but its description has no operator-notes block (## Upgrade notes / ## Security-relevant changes / ## Breaking changes) and no 'no-changelog: <reason>' line. See docs/changelog-policy.md."
          exit 1

  # Issue #1188: Codecov only creates `codecov/patch/<area>` check runs once
  # it gets a coverage upload for the commit. On a PR whose changed paths
  # trigger none of the coverage-uploading suites (docs-only, infra-only,
  # codecov.yml itself), no report is ever uploaded and the three required
  # contexts sit at "Expected" forever (#1187: a docs-only PR could then
  # only merge through a bypass). This job closes that gap by always
  # running and posting a success status per area when no suite will
  # upload -- the same verdict Codecov would reach for a commit it never
  # sees. Same-repo backstop for codecov.yml's
  # `flag_coverage_not_uploaded_behavior: pass`, which covers Dependabot PRs
  # whose read-only token can't post here (the `head.repo.full_name` guard
  # below).
  #
  # PATCH_AREAS must equal codecov.yml's coverage.status.patch keys;
  # cmd/codecovcheck fails on drift.
  codecov-patch-stub:
    name: Codecov patch no-op
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.backend != 'true' &&
      needs.changes.outputs.frontend != 'true' &&
      needs.changes.outputs.android != 'true' &&
      needs.changes.outputs.openapi != 'true' &&
      needs.changes.outputs.workflows != 'true'
    permissions:
      contents: read
      # No read-only way to post the codecov/patch/* commit statuses; the
      # grant is job-scoped, needed only on the no-upload path.
      statuses: write
    steps:
      - name: Post a success status for every unmeasured codecov area
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PATCH_AREAS: backend frontend android
        run: |
          set -euo pipefail
          for area in $PATCH_AREAS; do
            echo "codecov/patch/${area}: no coverage was uploaded for this commit; posting success (issue #1188)"
            gh api --method POST "repos/${GH_REPO}/statuses/${SHA}" \
              -f state=success \
              -f context="codecov/patch/${area}" \
              -f description="No coverage upload for this commit -- nothing to gate (issue #1188)" \
              -f target_url="${RUN_URL}" >/dev/null
          done

  # Issue #630: the backend test suite is split into parallel legs
  # (`backend-tests` matrix) so `controllers`/`services` (~20min each under
  # -race, no t.Parallel yet -- #774) get their own runner instead of
  # serializing. Each is sharded `-1`/`-2` by test-name regex
  # (`^(Test|Fuzz)[A-G]`/`[H-Z]`, ~1.5:1 split); `rest` is every other
  # package. "Verify shard split is exhaustive" below fails the leg if a
  # name ever falls outside A-Z.
  #
  # `internal/schemafixture` is NOT in any leg here -- its migration-hop
  # suite is owned by migration-tests.yml, which gained a coverage-bearing
  # run so the `backend` Codecov flag still sees those lines.
  #
  # Non-test checks (fmt/vet, benchmarks, fuzz, govulncheck, golangci-lint)
  # run once here in `backend-checks`; the `backend` job below is a thin
  # gate + aggregator so the required status check keeps the name "Backend
  # (Go)" (branch protection references it verbatim).
  #
  # Issue #251 history: -race + -covermode=atomic instrumentation plus
  # issue #632's per-package migrated-template (internal/dbtest, replacing
  # a full database.InitDB per test) are the other half of this speed-up.
  backend-checks:
    permissions:
      contents: read
    name: Backend checks (fmt/vet/bench/fuzz/lint)
    runs-on: ubuntu-latest
    # Issue #712: nightly fuzz is 8 targets at -fuzztime=2m (~16m) plus
    # golang/go#75804 hardening retries (up to +2m/target), so schedule gets
    # real headroom; PRs stay tight.
    timeout-minutes: ${{ github.event_name == 'schedule' && 40 || 20 }}
    needs: changes
    # Scheduled runs always run the full suite (no diff to gate on) -- same
    # exemption pattern as zizmor.yml/sast.yml.
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting and vet
        working-directory: backend
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
          go vet ./...

      - name: Run benchmarks (issue #261)
        working-directory: backend
        # Issue #261: exercise every benchmark body once. The regression gate
        # is the query-count assertions shipped alongside them
        # (*_QueryCountIsBounded), NOT wall-clock time (CI-hardware-variable).
        # -benchtime=1x keeps this cheap.
        run: go test -run '^$' -bench . -benchtime=1x ./...

      # Issue #265 (extended by #376): a short native Go fuzz run per target,
      # seeded from docs/golden-fixtures or inline fixtures. One step per
      # target since `go test -fuzz` accepts only one regexp. A crash writes
      # a regression file under <pkg>/testdata/fuzz/ and fails the step --
      # not hypothetical, FuzzExtractICalEvents found a real go-ical decoder
      # panic on its first run (fixed by decodeCalendarSafely).
      # Issue #712: the loop lives in a committed script
      # (.github/scripts/run-fuzz-targets.sh), hardened against the
      # golang/go#75804 deadline-boundary race (a clean run can be
      # intermittently reported as "context deadline exceeded"; fixed
      # upstream in go1.27, not backported to this repo's 1.26 toolchain).
      # Retries a deadline-only failure once and soft-fails only if it
      # repeats; a real crash still fails the step. Pinned by
      # .github/scripts/tests/run-fuzz-targets.test.sh (run in actionlint.yml).
      - name: Run fuzz targets (issues #265, #376, #712)
        working-directory: backend
        # Issue #578, B4: the PR/push path is the short smoke (15s — the
        # regression tripwire); the nightly schedule event runs the same
        # targets at 2m each. -fuzztime comes in via env, never inline.
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '2m' || '15s' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-fuzz-targets.sh"

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Issue #358: golangci-lint (backend/.golangci.yml), the complementary
      # fast analyzer to CodeQL. v2.14.0: v2.12.2 panicked in
      # staticcheck/unused under Go 1.27. `go run ...@version`, not the
      # golangci-lint-action, so the binary comes from the Go module proxy.
      - name: Lint (golangci-lint gosec + bodyclose + correctness set)
        working-directory: backend
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

      # CLAUDE.md backend trap #4: a GORM finisher (Create/Save/Updates/
      # Delete/First/Find/Exec/...) returns *gorm.DB, not error, so errcheck
      # cannot see a discarded `.Error`. This repo-local analyzer
      # (backend/internal/lint/gormerr) flags every one in non-test code.
      - name: Lint (gormerrcheck — unchecked GORM .Error)
        working-directory: backend
        run: go run ./cmd/gormerrcheck ./...

  backend-tests:
    permissions:
      contents: read
    name: Backend tests (${{ matrix.leg }})
    runs-on: ubuntu-latest
    # Each leg owns a whole runner. PRs/main merges stay tight (a hung job
    # must not eat a runner); nightly schedule runs for hours, where the
    # deep generative/property pass lives (RAPID_CHECKS below).
    #
    # Speed levers after #630/#632/#774: standard 4-vCPU runner, no paid
    # larger ones -- moving a regrown leg to a bigger runner only helps
    # after t.Parallel (#774), since a package's tests run serially on one
    # core regardless of runner size. The two test passes below (gate
    # `-race`, then a separate no-rerun `-coverprofile` pass) must not be
    # collapsed: `gotestsum --rerun-fails` truncates the coverprofile on
    # rerun (#639).
    #
    # issue #1014: two guessed small GO_TEST_TIMEOUT increments both
    # undershot for services-2 (H-Z), each costing a ~45min CI cycle to find
    # out. 65m leaves real margin over the largest observed job time while
    # staying under the 75-minute release-gate poll deadline
    # (docs/development/release-gates.md). If still not enough, split
    # `services` into more shards, not another timeout bump.
    timeout-minutes: ${{ github.event_name == 'schedule' && 240 || 65 }}
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'
    strategy:
      # One slow/failing leg must not cancel the others — we want full signal
      # from every leg on every run.
      fail-fast: false
      matrix:
        # controllers-1/-2 and services-1/-2 are the same package sharded by
        # test-name regex (see the Resolve step). `database` is the
        # migration/persistence package, next-heaviest after schemafixture.
        # `property` is the rapid/large-data generative packages. `rest` is
        # everything else.
        leg: [controllers-1, controllers-2, services-1, services-2, database, property, rest]

    env:
      # TEST-07 (#435): property-test iteration budget tiered by trigger --
      # PR 200 (cheap tripwire), push/merge 1000, nightly schedule 8000 (the
      # deep search only the next night's run bounds). GO_TEST_TIMEOUT below
      # scales with it so a deep run isn't killed by the PR-sized timeout.
      #
      # issue #1014: this was a two-armed ternary that silently gave every
      # non-PR/push event (including workflow_dispatch) the nightly depth --
      # live once #543 made every RC-tag gate dispatch this workflow, so RC
      # verification ran property tests at 8000/10000 iterations instead of
      # the intended push tier, and the `property` leg hit its 65-minute job
      # timeout and was cancelled outright. workflow_dispatch is now an
      # explicit third arm at the push tier; any future event name defaults
      # to the same safe tier rather than nightly depth.
      RAPID_CHECKS: ${{ github.event_name == 'pull_request' && '200' || (github.event_name == 'schedule' && '8000' || '1000') }}
      # issue #1014: services-2 (H-Z, which catches every
      # Search*/TestSearchMutationPath_* test) needed 55m (job time ~45m)
      # after two smaller bumps both undershot -- real cost, unrelated to
      # the RAPID_CHECKS tier bug above. Kept generous; stays under the
      # 75-minute release-gate poll deadline with margin for queueing.
      GO_TEST_TIMEOUT: ${{ github.event_name == 'schedule' && '200m' || '55m' }}
      # Same tiered treatment for the pre-rapid seeded property tests
      # (address_normalization_property_test.go): 200/2000/10000 (#1014).
      ADDRESS_PROPERTY_ITERATIONS: ${{ github.event_name == 'pull_request' && '200' || (github.event_name == 'schedule' && '10000' || '2000') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # actions/setup-go's own cache keys purely on go.sum and doesn't
      # re-save on a hit, so the race-instrumented objects freeze at
      # whatever first populated that key. A unique `key` per run + a
      # prefix `restore-keys` fallback restores the newest snapshot and
      # saves an updated one every run.
      - name: Cache Go race build objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-${{ runner.os }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-

      # Issue #680 (TEST-08): backend/differential lives in the `rest` leg,
      # so only that leg needs the pinned reference (vobject 0.9.9),
      # installed with --require-hashes (zizmor audits pip for unpinned refs).
      - name: Install vobject reference (TEST-08 differential)
        if: matrix.leg == 'rest'
        run: python3 -m pip install --quiet --break-system-packages --require-hashes -r backend/differential/reference/vobject/requirements.txt

      # MYCORRHIZAL_REQUIRE_REFERENCES turns the default t.Skip-when-missing
      # into a hard failure, so TEST-08 can't silently pass having tested
      # nothing. A separate step, not folded into the blanket run below:
      # the JSContact-calcard leg (same package, no reference installed
      # here -- that's differential-e2e.yml's job) must keep default skip.
      - name: Verify the vCard-vobject differential leg is not silently skipped
        if: matrix.leg == 'rest'
        working-directory: backend
        env:
          MYCORRHIZAL_REQUIRE_REFERENCES: "1"
        run: go test ./differential/ -run '^TestVCardVObjectDifferential$' -count=1 -v

      # Each leg resolves to a package list plus an optional -run regex (see
      # the case below). `rest`'s exclusion grep is anchored (`$`) so a
      # future subpackage of an excluded tree lands in `rest` rather than
      # being dropped from every leg. The [A-G]/[H-Z] shards are total only
      # while every Test/Fuzz name starts uppercase -- the next step
      # enforces that.
      - name: Resolve packages for this leg
        id: pkgs
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            controllers-1) list="./controllers/..."; run='^(Test|Fuzz)[A-G]' ;;
            controllers-2) list="./controllers/..."; run='^(Test|Fuzz)[H-Z]' ;;
            services-1)    list="./services/...";    run='^(Test|Fuzz)[A-G]' ;;
            services-2)    list="./services/...";    run='^(Test|Fuzz)[H-Z]' ;;
            database)      list="./database/...";    run='' ;;
            property)      list="./internal/propertytest/... ./internal/largedata/... ./internal/contactgen/..."; run='' ;;
            rest)          list="$(go list ./... | grep -vE 'mycorrhizal/(controllers|services|database|internal/schemafixture|internal/propertytest|internal/largedata|internal/contactgen)$' | tr '\n' ' ')"; run='' ;;
            *)             echo "unknown leg: $LEG" >&2; exit 1 ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # A -run shard silently drops any Test/Fuzz func matching neither
      # half; every name in a sharded package must start A-Z so [A-G] ∪
      # [H-Z] is total. Fails loudly on a future `Test_foo`/lowercase/digit
      # name, and logs the balance.
      - name: Verify shard split is exhaustive
        if: steps.pkgs.outputs.run != ''
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            controllers-*) dir=controllers ;;
            services-*)    dir=services ;;
            *)             echo "shard guard on unexpected leg: $LEG" >&2; exit 1 ;;
          esac
          names="$(grep -rhoE '^func (Test|Fuzz)[A-Za-z0-9_]+' "$dir"/*_test.go | sed -E 's/^func (Test|Fuzz)//')"
          bad="$(printf '%s\n' "$names" | grep -vE '^[A-Z]' || true)"
          if [ -n "$bad" ]; then
            echo "::error::$dir: these Test/Fuzz funcs do not start A-Z, so the [A-G]/[H-Z] shards would skip them:"
            printf '%s\n' "$bad"
            exit 1
          fi
          a="$(printf '%s\n' "$names" | grep -cE '^[A-G]' || true)"
          b="$(printf '%s\n' "$names" | grep -cE '^[H-Z]' || true)"
          echo "$dir shard balance — [A-G]=$a  [H-Z]=$b  (total $((a + b)))"

      # Issue #268: gotestsum retries a failed test once (`--rerun-fails=1`)
      # instead of flaking the check, and produces JUnit for test-report.yml;
      # scoped/suffixed per leg so artifacts don't collide.
      #
      # Issue #974: retry-everywhere with no flake budget meant a test
      # failing 1-in-5 reruns stayed green forever with no hard-fail surface.
      # RERUN_FAILS is 0 on `schedule` so every flake gets one non-retried
      # surface per day; PR/push keep retry-and-report so a rare CI blip
      # doesn't flake a required check.
      #
      # Issue #639: NO -coverprofile here -- `--rerun-fails` re-invokes `go
      # test` for the failed package and TRUNCATES the coverprofile on that
      # second invocation (a single flaky test once collapsed controllers'
      # profile 72.4% -> 1.2%). Coverage is a separate no-rerun pass below.
      - name: Run tests (retry-on-failure, except nightly)
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
          PKGS: ${{ steps.pkgs.outputs.list }}
          RUN: ${{ steps.pkgs.outputs.run }}
          RERUN_FAILS: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: >
          go run gotest.tools/gotestsum@v1.13.0
          --rerun-fails="$RERUN_FAILS" --rerun-fails-max-failures=20
          --rerun-fails-report="rerun-fails-${LEG}.txt"
          --junitfile="junit-${LEG}.xml"
          --packages="$PKGS"
          -- -race -run "$RUN" -timeout="$GO_TEST_TIMEOUT"

      # Issue #639: dedicated coverage pass -- no --rerun-fails (nothing
      # rewrites the profile mid-run), no -race (halves wall-clock, doesn't
      # change which statements execute). continue-on-error keeps a flake
      # from failing the leg; the aggregator drops the Codecov upload
      # entirely if a leg's profile is missing rather than uploading a
      # partial (carryforward holds the last known number).
      - name: Collect coverage (no retry)
        if: always()
        continue-on-error: true
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
          PKGS: ${{ steps.pkgs.outputs.list }}
          RUN: ${{ steps.pkgs.outputs.run }}
        run: |
          read -ra pkgs <<< "$PKGS"
          go test "${pkgs[@]}" -run "$RUN" -timeout="$GO_TEST_TIMEOUT" -coverprofile="coverage-${LEG}.out" -covermode=atomic

      # Issue #268: flake signal, visibility only. Always empty on the
      # nightly run (RERUN_FAILS=0, #974).
      - name: Report flaky tests (failed once, passed on retry)
        if: always()
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
        run: |
          if [ -s "rerun-fails-${LEG}.txt" ]; then
            echo "::group::Flaky tests (passed only on retry) — ${LEG}"
            cat "rerun-fails-${LEG}.txt"
            echo "::endgroup::"
          else
            echo "No tests required a rerun in ${LEG}."
          fi

      # Per-leg parts; the `backend` gate job merges them into the single
      # backend-coverage / backend-junit-results artifacts the rest of CI
      # expects.
      - name: Upload test parts (coverage + JUnit + flake report)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-parts-${{ matrix.leg }}
          path: |
            backend/coverage-${{ matrix.leg }}.out
            backend/junit-${{ matrix.leg }}.xml
            backend/rerun-fails-${{ matrix.leg }}.txt
          retention-days: 7
          if-no-files-found: ignore

  backend:
    permissions:
      contents: read
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, backend-checks, backend-tests]
    # Always run so this required status check still reports when the two
    # upstream jobs are path-gated out — they come back "skipped", which the
    # gate step treats as green (same net effect as the old single job's
    # `if:` making a skipped job report Success, issue #264).
    if: always()

    steps:
      - name: Gate on backend-checks and backend-tests
        env:
          CHECKS: ${{ needs.backend-checks.result }}
          TESTS: ${{ needs.backend-tests.result }}
        run: |
          echo "backend-checks=$CHECKS  backend-tests=$TESTS"
          for r in "$CHECKS" "$TESTS"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::backend gate failed (result=$r)"; exit 1 ;;
            esac
          done

      - name: Checkout repository
        if: needs.backend-tests.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.backend-tests.result == 'success'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download test parts from all legs
        if: needs.backend-tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-test-parts-*
          merge-multiple: true
          path: backend

      # Issue #630: controllers-1/-2 (and services-1/-2) are the SAME
      # package under disjoint -run shards, so every block appears in both
      # profiles (count 0 in the shard that skipped it). A plain concat
      # would double-count; sum the count field per block key instead
      # (atomic mode: additive, and blocks from different packages never
      # share a key).
      #
      # Issue #639: require every leg's profile before uploading -- a
      # crashed/timed-out no-rerun coverage pass leaves `coverage-<leg>.out`
      # missing (continue-on-error) rather than clobbered. Merging whatever
      # is present would silently upload a partial and tank the number;
      # instead skip the upload and let Codecov's per-flag `carryforward`
      # hold the last known coverage.
      #
      # Issue #979: informational `::warning::` on push/schedule (matches
      # codecov.yml's `only_pulls: true`), but a hard failure on
      # `pull_request` -- a missing leg there would evaluate
      # codecov/patch/backend against stale carryforward instead of this
      # PR's real coverage.
      - name: Merge coverage profiles
        id: merge
        if: needs.backend-tests.result == 'success'
        working-directory: backend
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          files=""
          missing=""
          for leg in controllers-1 controllers-2 services-1 services-2 database property rest; do
            f="coverage-${leg}.out"
            if [ ! -s "$f" ] || [ "$(wc -l < "$f")" -lt 2 ]; then
              missing="$missing $leg"
            else
              files="$files $f"
            fi
          done
          if [ -n "$missing" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::error::coverage profile missing for leg(s):$missing — codecov/patch/backend would be evaluated against stale carryforward data instead of this PR's coverage. Re-run the job; if it keeps happening, a leg is crashing/timing out in the no-rerun coverage pass and needs investigating."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::coverage profile missing for leg(s):$missing — skipping Codecov upload, carryforward holds last known coverage"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086 # $files is a controlled space-joined list
          awk '
            FNR == 1 { mode = $0; next }
            { if (!($1 in stmt)) { order[++n] = $1; stmt[$1] = $2 }
              count[$1] += $3 }
            END { print mode; for (i = 1; i <= n; i++) print order[i], stmt[order[i]], count[order[i]] }
          ' $files > coverage.out
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Issue #294: informational only -- a failed upload must not fail the
      # build (fail_ci_if_error: false). disable_search so only the merged
      # profile is sent, not the per-leg parts alongside it (#639).
      - name: Upload coverage to Codecov
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          disable_search: true
          flags: backend
          fail_ci_if_error: false

      # Issue #251: the project-wide number stays informational. The hard
      # gate is the diff-based codecov/patch status (issue #267) — new
      # uncovered lines in the changed files fail the PR.
      - name: Coverage summary
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        working-directory: backend
        run: go tool cover -func=coverage.out

      # Per-file no-regression ratchet (frontend counterpart below):
      # codecov/patch/backend only judges lines a PR actually changed, so a
      # file already at 0% trips nothing. Compares backend/coverage.out
      # against internal/coverageratchet/testdata/baseline.json. PR-only:
      # RAPID_CHECKS is tiered by trigger, so push/schedule coverage numbers
      # aren't comparable to the PR-tier baseline this is generated from.
      - name: Per-file coverage ratchet (pull_request only)
        if: github.event_name == 'pull_request' && needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        working-directory: backend
        run: go run ./cmd/coverageratchet

      - name: Render HTML coverage report
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        working-directory: backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 7

      # Issue #268: one combined JUnit + flake artifact so test-report.yml
      # needs no per-leg wiring.
      - name: Upload test results (JUnit + flake report)
        if: needs.backend-tests.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-junit-results
          path: |
            backend/junit-*.xml
            backend/rerun-fails-*.txt
          retention-days: 7

  frontend:
    permissions:
      contents: read
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Scheduled runs must always run the full suite (there is no diff to gate
    # on) — same exemption pattern as zizmor.yml/sast.yml.
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (#472) / COMPAT-02 (#473): read the floor from
          # package.json's "engines.node" (>=22.22.2, jsdom@30's real
          # constraint, not this project's own) so the declared floor is
          # the one CI actually runs.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: yarn test:coverage
        env:
          CI: true

      # Per-file no-regression ratchet (backend counterpart:
      # cmd/coverageratchet). Compares coverage/coverage-summary.json
      # against frontend/coverage-baseline.json. Regenerate via
      # `yarn coverage:ratchet:update`.
      - name: Per-file coverage ratchet
        working-directory: frontend
        run: yarn coverage:ratchet

      # Issue #294: see the backend job's identical step for why
      # fail_ci_if_error is false.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: yarn lint

      # Issue #251: the project-wide number stays informational. The hard
      # gate is the diff-based codecov/patch status (issue #267).
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      # Issue #268: JUnit XML (written by vitest's junit reporter) consumed by
      # test-report.yml (dorny/test-reporter). Flaky vitest tests are surfaced
      # separately by the github-actions reporter's job summary.
      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-junit-results
          path: frontend/junit.xml
          retention-days: 7

  # Issue #556 (web PERF counterpart to #468-#471): production `vite build`
  # then `yarn budget`, which fails when a chunk grows past
  # frontend/bundle-budget.json's tolerance. Wall-clock load time is a
  # trend measured by the Playwright @perf specs, not here. Separate job
  # from `frontend` above because it needs the full build that job skips.
  frontend-bundle-budget:
    permissions:
      contents: read
    name: Frontend bundle-size budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        working-directory: frontend
        run: yarn build

      - name: Check bundle-size budget
        working-directory: frontend
        run: yarn budget
