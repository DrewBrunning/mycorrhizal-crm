name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    permissions:
      contents: read
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting and vet
        working-directory: backend
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
          go vet ./...

      - name: Run tests
        working-directory: backend
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Security analysis (gosec)
        working-directory: backend
        # G104 (unhandled errors) is excluded: the 44 findings are intentional
        # best-effort paths (cron scheduling, cleanup os.Remove, src.Seek), not
        # bugs. Revisit if the discipline around them changes.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -tests=false -exclude=G104 ./...

  frontend:
    permissions:
      contents: read
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vitest config passes --no-experimental-webstorage, which requires Node >= 22.4
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: yarn test
        env:
          CI: true

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: yarn lint
