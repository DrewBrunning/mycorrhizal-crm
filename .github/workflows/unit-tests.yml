name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks. This job always runs and computes which
  # areas the PR/push touches (shared filters in .github/filters.yaml); the
  # suite jobs below run only when their area is affected. A suite job that
  # is skipped by its `if` conditional reports "Success", so every check here
  # can be made required in branch protection without unrelated areas
  # blocking a PR.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (the *_files
      # outputs are the attacker-influenced ones on PRs, and we don't use them).
      # Passed as env vars rather than inline ${{ }} in the run block so
      # zizmor's template-injection audit has nothing to flag even if the
      # outputs ever stopped being booleans.
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "frontend=$FRONTEND_CHANGED"
          echo "openapi=$OPENAPI_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  backend:
    permissions:
      contents: read
    name: Backend (Go)
    runs-on: ubuntu-latest
    # Issue #251: -race + -covermode=atomic stack their per-access/per-block
    # instrumentation on top of each other, and the services package alone
    # re-runs the full real-schema migration set (database.InitDB) across
    # dozens of tests — on GitHub's shared runners that combination pushed
    # one package past `go test`'s default 10m internal timeout even though
    # nothing was actually hung (PR #285 CI run 32417613740). 15 -> 30 here,
    # plus an explicit -timeout below, to give it headroom without going
    # unbounded.
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting and vet
        working-directory: backend
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
          go vet ./...

      # Issue #268: run tests through gotestsum so (a) a failed test is
      # retried once (`--rerun-fails=1`) instead of flaking the required
      # check, (b) a JUnit XML report is produced for the dorny/test-reporter
      # check run (test-report.yml), and (c) tests that only passed on retry
      # are written to rerun-fails.txt so the flake is surfaced, not hidden.
      # -timeout raised from the go test default (10m) — see the job's
      # timeout-minutes comment above for why race+coverage need the room.
      - name: Run tests with coverage (retry-on-failure)
        working-directory: backend
        run: go run gotest.tools/gotestsum@v1.13.0 --rerun-fails=1 --rerun-fails-max-failures=20 --rerun-fails-report=rerun-fails.txt --junitfile=junit.xml --packages="./..." -- -race -timeout=20m -coverprofile=coverage.out -covermode=atomic

      # Issue #268: the flake signal for Go. gotestsum's rerun report lists
      # every test that failed once and then passed on retry, with counts.
      # Visibility only — a flaky test that passed on retry does not fail the
      # job (the "rerun" exists precisely to keep the gate green), but it IS
      # called out here and uploaded as an artifact for triage.
      - name: Report flaky tests (failed once, passed on retry)
        if: always()
        working-directory: backend
        run: |
          if [ -s rerun-fails.txt ]; then
            echo "::group::Flaky tests (passed only on retry)"
            cat rerun-fails.txt
            echo "::endgroup::"
          else
            echo "No tests required a rerun."
          fi

      # Issue #294: durable coverage tracking + per-PR diff comment on top of
      # the artifact above. Informational only (see codecov.yml) — a failed
      # upload (app not installed yet, Codecov outage) must not fail the
      # build, hence fail_ci_if_error: false.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Run benchmarks (issue #261)
        working-directory: backend
        # Issue #261: exercise every benchmark body once. The regression gate
        # is the query-count assertions shipped alongside them (the
        # *_QueryCountIsBounded tests fail deterministically when a hot path
        # gains an N+1 or the reach-out job goes superlinear) — NOT wall-clock
        # time, which varies across CI hardware. -benchtime=1x keeps this
        # cheap while still compiling and executing the benchmark paths.
        run: go test -run '^$' -bench . -benchtime=1x ./...

      # Issue #265: a short, time-boxed native Go fuzz run per target,
      # seeded from the golden fixtures (docs/golden-fixtures — the RFC
      # oracle). go test -fuzz only accepts one target (a regexp matching
      # exactly one Fuzz function) per invocation, hence two steps. A found
      # crash writes a regression file under vcard4/testdata/fuzz/ and fails
      # the step; -fuzztime is deliberately short (a few seconds each) to
      # keep CI cost low — see FuzzImportVCard4/FuzzExportVCard4's own doc
      # comments for the longer local run this is not a substitute for.
      - name: Run vCard4 fuzz targets (issue #265)
        working-directory: backend
        run: |
          go test ./vcard4/ -run '^$' -fuzz='^FuzzImportVCard4$' -fuzztime=15s
          go test ./vcard4/ -run '^$' -fuzz='^FuzzExportVCard4$' -fuzztime=15s

      # Issue #251: visibility only, no threshold/gate — printed to the log
      # and uploaded below for anyone who wants the per-func breakdown.
      - name: Coverage summary
        working-directory: backend
        run: go tool cover -func=coverage.out

      - name: Render HTML coverage report
        working-directory: backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Issue #358: golangci-lint (config: backend/.golangci.yml) is the
      # complementary fast analyzer to CodeQL, replacing the old standalone
      # gosec step. Enables the security-focused set (gosec + bodyclose +
      # govet); the standard correctness layer and noctx are deliberately
      # deferred there — see the config's comments for the rationale (the
      # repo documents best-effort unhandled errors as accepted, and the
      # HTTP/DB layers don't thread contexts yet). Run via `go run ...@version`
      # rather than the golangci-lint-action so the binary comes from the Go
      # module proxy like every other Go tool here, not a raw release download.
      - name: Lint (golangci-lint gosec + bodyclose)
        working-directory: backend
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 7

      # Issue #268: JUnit XML + flake report consumed by test-report.yml
      # (dorny/test-reporter) and by anyone triaging flakes.
      - name: Upload test results (JUnit + flake report)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-junit-results
          path: |
            backend/junit.xml
            backend/rerun-fails.txt
          retention-days: 7

  frontend:
    permissions:
      contents: read
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vitest config passes --no-experimental-webstorage, which requires Node >= 22.4
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: yarn test:coverage
        env:
          CI: true

      # Issue #294: see the backend job's identical step for why
      # fail_ci_if_error is false.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: yarn lint

      # Issue #251: visibility only, no threshold/gate.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      # Issue #268: JUnit XML (written by vitest's junit reporter) consumed by
      # test-report.yml (dorny/test-reporter). Flaky vitest tests are surfaced
      # separately by the github-actions reporter's job summary.
      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-junit-results
          path: frontend/junit.xml
          retention-days: 7
