name: Migration Tests

# Issue #437 (MIG-02): every supported historical migration path runs in CI,
# each supported-release fixture as a NAMED matrix entry so a failure names
# the release that broke. Supported set: v1.0.0+ (issue #529, raised from
# v0.6.0 at the 1.0 major, #1170); fixtures from MIG-01 (#436,
# internal/schemafixture).
#
# Shapes that run here:
#   - schemafixture-suite: the whole package in one non-race coverage run --
#     the catch-all + coverage source (moved from unit-tests.yml's `rest`
#     leg, where it was ~17min under -race, the PR gate's long pole).
#   - upgrade-matrix: every fixture migrated to CURRENT via database.InitDB
#     (the real boot path), asserting final version + every table's row
#     count. v1.0.0 is the longest supported skip. One job/subtest per release.
#   - adjacent-hops: one release -> the next, naming the exact broken hop.
#   - down-direction: every migration round-trips up -> down -> up against a
#     POPULATED fixture (#530: empty-schema proves nothing), plus the
#     no-.down.sql gate.
#   - full-install-upgrade (DEPLOY-02, #451): the full three-piece install
#     (database + PROFILE_PHOTO_DIR + ATTACHMENTS_DIR) upgraded in place,
#     with row counts, semantic content (MIG-03), attachment/photo files,
#     and the #530 pre-migration backup all verified, driven through the
#     real HTTP stack; plus sub-floor/dirty refusals.
#
# Gate: the `backend` filter in .github/filters.yaml; required in branch
# protection -- a migration change must not merge red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # Nightly re-run so a schema/chain change elsewhere still exercises the full
  # migration matrix even on a PR that did not touch backend/.
  schedule:
    - cron: '35 3 * * *' # 03:35 UTC nightly
  # RC-02 (#446): release.yml dispatches this against a release/* ref when
  # cutting a release candidate -- an RC-fix push to release/* does not trigger
  # push:main, so the release-tier suites are dispatched instead.
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Branch-scoped cancellation: a force-push to an open PR cancels this
# workflow's own still-running superseded run instead of paying for the old
# matrix to finish. The group is event-partitioned so `schedule` and
# `push:main` runs never share a group (which would serialize them) and are
# never cancelled by a PR; only `pull_request` events cancel in progress.
concurrency:
  group: migration-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Issue #264 pattern: path-gated checks — see unit-tests.yml.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only (the *_files outputs are the attacker-influenced
      # ones on PRs, and we don't use them). Passed as env vars so zizmor's
      # template-injection audit has nothing to flag.
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  # Upgrade-matrix legs, one per supported release, derived from
  # internal/schemafixture.SupportedReleases rather than a hand-maintained
  # list (which had already drifted). cmd/releaselist emits the matrix
  # JSON; a release added by release.yml is covered with no edit here.
  release-matrix:
    permissions:
      contents: read
    name: Enumerate supported releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Bare JSON array built from the Go registry -- not attacker-influenced,
      # safe to fromJSON into the matrix.
      - name: List SupportedReleases as matrix JSON
        id: list
        working-directory: backend
        run: |
          set -eu
          matrix="$(go run ./cmd/releaselist)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # One job per supported release, each running only that release's subtest
  # of TestUpgradeFixtureToCurrent (#437 action 1), so a failure names the
  # release that broke.
  upgrade-matrix:
    permissions:
      contents: read
    name: Upgrade ${{ matrix.entry }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, release-matrix]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    strategy:
      # One release's failure must not cancel the others — full signal from
      # every release on every run.
      fail-fast: false
      # Cap the fan-out (~22 legs today): unbounded, a release cut
      # oversubscribes the account's runners and starves the emulator jobs
      # beside it, which then flake (#1174).
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # `go test -run '<Test>/<release>'` exits 0 even when no subtest
      # matches (vacuous pass), so the pass is asserted against verbose
      # output, not exit code -- a release that falls out of the registry
      # fails this job. RELEASE via env, never inline (zizmor).
      - name: Migrate ${{ matrix.release }} fixture to current
        working-directory: backend
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          set -eo pipefail
          # `|| true`: `var="$(cmd)"` is itself the checked command under
          # -e, so a failing `go test` would abort here before `echo "$out"`
          # runs, discarding the failure output. The real pass/fail is the
          # grep below. (Same pattern repeats throughout this file.)
          out="$(go test ./internal/schemafixture/ -run "TestUpgradeFixtureToCurrent/${RELEASE}" -count=1 -v 2>&1)" || true
          echo "$out"
          if ! grep -q -- "--- PASS: TestUpgradeFixtureToCurrent/${RELEASE} " <<<"$out"; then
            echo "::error::expected subtest TestUpgradeFixtureToCurrent/${RELEASE} did not pass (release not in SupportedReleases?)"
            exit 1
          fi

  # The adjacent-hop shape (issue #437 action 2): v0.6.N -> v0.6.N+1, one
  # migration or a few. Also runs in the regular Go suite; this job is the
  # named, required gate for the migration change class.
  adjacent-hops:
    permissions:
      contents: read
    name: Adjacent release hops
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Upgrade each adjacent hop
        working-directory: backend
        run: go test ./internal/schemafixture/ -run '^TestUpgradeEachAdjacentHop$' -count=1 -v

  # The down direction (issue #437 action 6): every migration up -> down -> up
  # against a populated fixture, and the "no .down.sql ships" gate.
  down-direction:
    permissions:
      contents: read
    name: Down round-trips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Every migration up → down → up on populated fixtures
        working-directory: backend
        run: go test ./internal/schemafixture/ -run '^TestEveryMigrationRoundTripsUpDownUp$' -count=1 -v

      - name: Every migration ships its .down.sql
        working-directory: backend
        run: go test ./database/ -run '^TestEveryMigrationHasADownMigration$' -count=1 -v

  # The whole internal/schemafixture package in one non-race run with a
  # coverprofile -- the catch-all covering what the named slices above don't
  # (cross-version restore, semantic-content preservation, fixture loaders,
  # dump/expectation tests) AND the coverage source. Not on a critical path:
  # runs in parallel with every other job here.
  #
  # `go test`'s 10-minute self-timeout is independent of this job's
  # timeout-minutes and crossed at 21 supported releases (the runtime scales
  # with SupportedReleases, per #529) while the suite was still doing real
  # work, not hung. Explicit -timeout with headroom; bump both together if
  # it ever gets close.
  schemafixture-suite:
    permissions:
      contents: read
    name: schemafixture suite + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Non-race, matching this workflow's convention -- the one
      # backup-consistency test's -race signal is an accepted loss;
      # unit-tests.yml keeps the database package's own -race coverage.
      - name: Run the full schemafixture package with coverage
        working-directory: backend
        run: go test ./internal/schemafixture/ -count=1 -timeout=25m -covermode=atomic -coverprofile=coverage-schemafixture.out

      # Issue #294: multiple `backend`-flag uploads are merged by Codecov, so
      # this composes with unit-tests.yml's upload. Informational only.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage-schemafixture.out
          disable_search: true
          flags: backend
          fail_ci_if_error: false

  # DEPLOY-02 (issue #451): the full-stack analogue of upgrade-matrix — not
  # just the database, the whole three-piece install (database +
  # PROFILE_PHOTO_DIR + ATTACHMENTS_DIR), upgraded in place and driven through
  # the real HTTP stack.
  full-install-upgrade:
    permissions:
      contents: read
    name: Full-install upgrade (DEPLOY-02)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Three-piece install upgraded in place, backed up, and exercised
        working-directory: backend
        run: go test ./internal/schemafixture/ -run '^TestFullInstallUpgrade' -count=1 -v

  # Issue #495: every supported release's database, populated at 134x the
  # canonical pathological manifest (2,010 contacts incl. soft-delete +
  # vcard-uid-recreate traps at scale), migrates to current with every
  # table's row count + integrity intact; plus interrupted-migration
  # fail-closed, backup-restore-at-scale, and cross-version-restore-at-scale
  # (#923) properties.
  #
  # Gated behind MYCORRHIZAL_LARGE_TESTS=1, SKIPPED in the default Go suite
  # (minutes under -race per PR is too expensive); runs on main merge and
  # nightly instead.
  large-dataset:
    permissions:
      contents: read
    name: Large-dataset migration (issue #495)
    runs-on: ubuntu-latest
    # Bumped from 60: the PERF-02/03 at-scale steps below inherited `go
    # test`'s 10m default and were silently killed on every main push since
    # PERF-02 landed (#778). They now pass explicit `-timeout`s; 100 leaves
    # headroom over both plus the seed.
    timeout-minutes: 100
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Upgrade every supported release at scale
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # `|| true`: same reason as "Migrate ... fixture to current" above.
          out="$(go test ./internal/schemafixture/ -run '^TestLargeDatasetUpgradeToCurrent$' -count=1 -v 2>&1)" || true
          echo "$out"
          # Fail-safe: env-gated, so a typo'd variable would silently skip
          # these and pass vacuously.
          if ! grep -q -- "--- PASS: TestLargeDatasetUpgradeToCurrent/v1.0.0 " <<<"$out"; then
            echo "::error::expected large-dataset subtest v1.0.0 did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi
          if grep -q -- "--- SKIP: TestLargeDatasetUpgradeToCurrent" <<<"$out"; then
            echo "::error::large-dataset tests skipped (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi

      - name: Interrupted migration fails closed, backup restores at scale
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: >
          go test ./internal/schemafixture/ -run
          '^TestLargeDatasetInterruptedMigrationFailsClosed$|^TestLargeDatasetBackupRestoresAtScale$|^TestLargeDatasetUpgradeEmitsProgress$|^TestCrossVersionRestoreAtScale$'
          -count=1 -v

      - name: Large-dataset generator unit tests
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # `|| true`: same reason as "Migrate ... fixture to current" above.
          out="$(go test ./internal/largedata/ -count=1 -v 2>&1)" || true
          echo "$out"
          # Fail-safe: env-gated, so a typo'd variable would silently skip
          # these and pass vacuously.
          for want in "TestScalePopulatesLargeDataset " "TestProfilePopulatesAtScale "; do
            if ! grep -q -- "--- PASS: $want" <<<"$out"; then
              echo "::error::expected large-dataset test '$want' did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
              exit 1
            fi
          done

      # PERF-01 (#468): the `large` benchmark profile, the biggest dataset a
      # consumer (#469/#470/#498/#453) runs against. Seeding is a ~2-minute
      # one-off, cached as a CI artifact keyed on the generator inputs.
      - name: Cache the large benchmark-profile database
        id: perf01-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf01-large.db
          key: perf01-large-${{ hashFiles('testdata/canonical-fixture/manifest.json', 'backend/internal/largedata/**', 'backend/internal/canonicalfixture/**', 'backend/cmd/migratebench/**', 'backend/database/migrations/**') }}

      - name: Seed + verify the large benchmark profile
        working-directory: backend
        run: |
          set -eo pipefail
          db="$RUNNER_TEMP/perf01-large.db"
          if [ -f "$db" ]; then
            echo "large profile DB restored from cache ($(stat -c%s "$db") bytes) — skipping the ~2-minute seed"
          else
            time go run ./cmd/migratebench seed --profile large --db "$db"
          fi
          # Prove the cached/seeded artifact is a sound database at rest.
          # DB-01 guarantee: TestProfileDatasetPassesDB01 (smoke, every PR)
          # and TestProfilePopulatesAtScale (typical, this job).
          out="$(go run ./cmd/dbinspect "$db" 2>/dev/null)"
          echo "$out"
          grep -q 'integrity_check=ok' <<<"$out" || { echo "::error::large profile DB failed integrity_check"; exit 1; }
          grep -q 'dirty=false' <<<"$out" || { echo "::error::large profile DB is dirty"; exit 1; }

      # PERF-02 (#469): cross-scale core-operation benchmark check -- smoke +
      # typical + large. Verifies the baseline is fresh, no operation's
      # growth class regresses, and query counts stay bounded (contact
      # list/detail, FTS, graph traversal, dashboard, cadence, reach-out,
      # duplicate detection, merge, delete cascade). Its
      # WithinBudgetsAtScale/WallClockTrend subtests are the PERF-04 (#471)
      # release-validation gate.
      - name: Cross-scale core-operation benchmarks
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # Explicit -timeout: `go test`'s 10m default silently killed this
          # job on every main push since PERF-02 landed (#778); the
          # graph.traverse_* blow-ups are now SkipAtScale in the registry.
          # `|| true`: same reason as "Migrate ... fixture to current" above.
          out="$(go test ./internal/perfbench/ -run '^TestBenchmarksAtScale$' -count=1 -v -timeout 30m 2>&1)" || true
          echo "$out"
          # Fail-safe: env-gated. Trailing space matters -- an unanchored
          # grep for the bare test name also matches subtest lines (e.g.
          # ".../CommittedBaselineIsCurrent") even when the top-level test
          # FAILed (#795/#796's step-10 failure stayed silently green this
          # way). No `/` follows a top-level PASS line's test name, only a
          # space before "(duration)".
          if ! grep -q -- "--- PASS: TestBenchmarksAtScale " <<<"$out"; then
            echo "::error::PERF-02 cross-scale benchmarks did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi

      # PERF-03 (#470): cross-scale data-movement benchmark check -- smoke +
      # typical + large for import, export (3 formats), FTS rebuild, backup,
      # restore, delete cascade, duplicate detection; plus the migration
      # resource envelope (#495 owns migration depth). Its
      # WithinBudgetsAtScale subtest is the PERF-04 (#471) release-validation
      # gate for peak-heap ceilings.
      - name: Cross-scale data-movement benchmarks
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # Explicit -timeout, same reason as the core-operation step above --
          # this one runs ~20 min locally (duplicates.find_pairs's recorded
          # super-linear finding plus the 3 exporters over `large`).
          # `|| true`: same reason as "Migrate ... fixture to current" above.
          out="$(go test ./internal/perfbench/ -run '^TestDataMovementAtScale$|^TestMigrationAtScaleResourceEnvelope$' -count=1 -v -timeout 45m 2>&1)" || true
          echo "$out"
          # Fail-safe: env-gated. Trailing space on each $want, same
          # unanchored-substring reason as the core-operation step above.
          if ! grep -q -- "--- PASS: TestDataMovementAtScale " <<<"$out"; then
            echo "::error::PERF-03 check 'TestDataMovementAtScale ' did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi
          # TestMigrationAtScaleResourceEnvelope measures a migration ABOVE
          # the supported floor; right after a major there's nothing to
          # measure and it skips by design (#1170: floor v1.0.0 == migration
          # 57), not because the variable was unset. Any other absence is
          # still a fail-safe miss.
          if ! grep -q -- "--- PASS: TestMigrationAtScaleResourceEnvelope " <<<"$out" \
             && ! grep -q -- "no pending migration to measure" <<<"$out"; then
            echo "::error::PERF-03 check 'TestMigrationAtScaleResourceEnvelope ' did not run and did not skip for the floor==latest reason (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi
