name: localization-change
base_ref: 64585cbe63430b3491516e56a65d195d73988e46
suite: localization-change
timeout: 20m
requires: [node, yarn]
agent_command: "true"
agent_name: dry-run
agent_model: none
agent_version: "0"
expect_paths:
  - frontend/src/**
forbid_paths:
  - backend/**
  - android/**
  - .github/**
content_checks:
  - name: every locale carries the plural key
    files:
      - frontend/src/i18n/locales/en.json
      - frontend/src/i18n/locales/de.json
      - frontend/src/i18n/locales/es.json
      - frontend/src/i18n/locales/fr.json
      - frontend/src/i18n/locales/it.json
    contains_all:
      - '"total_one"'
      - '"total_other"'
  - name: CLDR many-form locales carry the many form
    files:
      - frontend/src/i18n/locales/es.json
      - frontend/src/i18n/locales/fr.json
      - frontend/src/i18n/locales/it.json
    contains_all:
      - '"total_many"'
