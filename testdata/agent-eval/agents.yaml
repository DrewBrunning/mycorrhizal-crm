# Pinned agent profiles for cmd/agenteval (issue #2030).
#
# A baseline is only comparable when the agent, model and CLI version are
# fixed, so a profile with a moving version or a command that omits {prompt}
# fails validation. `pinned-opencode` is the real profile promoted by issue
# #2042 and selected by the AGENT_EVAL_PROFILE repository variable; `dry-run`
# stays for local smoke tests.
#
# The command installs the exact CLI version with npx so the collector does not
# depend on a preinstalled agent. Only AGENT_EVAL_MODEL_KEY is available to the
# agent subprocess; map it to the provider variable opencode reads.
version: 1
profiles:
  pinned-opencode:
    command: 'DEEPSEEK_API_KEY="$AGENT_EVAL_MODEL_KEY" npx -y opencode-ai@1.19.4 run --pure --auto --model deepseek/deepseek-flash {prompt}'
    name: opencode
    model: deepseek/deepseek-flash
    version: "1.19.4"
  pinned-claude-sonnet:
    command: 'env ${AGENT_EVAL_MODEL_KEY:+ANTHROPIC_API_KEY=$AGENT_EVAL_MODEL_KEY} npx -y @anthropic-ai/claude-code@2.1.308 -p {prompt} --model claude-sonnet-5-5 --permission-mode acceptEdits --allowedTools Bash'
    name: claude-code
    model: claude-sonnet-5-5
    version: "2.1.308"
  dry-run:
    command: "true"
    name: dry-run
    model: none
    version: "0"
    dry_run: true
