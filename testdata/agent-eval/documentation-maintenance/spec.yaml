name: documentation-maintenance
base_ref: 64585cbe63430b3491516e56a65d195d73988e46
suite: documentation-maintenance
timeout: 20m
requires: [go]
agent_command: "true"
agent_name: dry-run
agent_model: none
agent_version: "0"
expect_paths:
  - docs/**
  - README-developer.md
forbid_paths:
  - backend/**
  - frontend/**
  - android/**
  - .github/**
content_checks:
  - name: names the regeneration command
    paths:
      - docs/**
      - README-developer.md
    contains_any:
      - gen-schema-fixtures
      - cmd/genschema
      - genschema
  - name: states the never-hand-edit rule
    paths:
      - docs/**
      - README-developer.md
    contains_any:
      - hand-edit
      - hand edit
      - by hand
  - name: identifies the schema drift
    paths:
      - docs/**
      - README-developer.md
    contains_any:
      - drift
      - mismatch
      - does not match
      - doesn't match
      - out of date
      - stale
