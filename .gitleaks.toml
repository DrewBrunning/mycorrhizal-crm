# Issue #376: gitleaks config for the local pre-commit hook (.githooks/pre-commit)
# and any future CI secret-scan step. Extends gitleaks' built-in default rule
# pack rather than redefining it, plus the application-specific rule added for
# issue #1877.
#
# If a rule ever false-positives on deliberately-fake test material (e.g. a
# placeholder PEM block in a _test.go fixture), add a scoped allowlist regex
# here with a comment naming the file and why it's safe, rather than disabling
# the rule globally.
title = "mycorrhizal-crm gitleaks config"

[extend]
useDefault = true

# Issue #1877: the application mints two long-lived bearer formats that no
# provider rule knows:
#
#   API tokens   "mycorrhizal_"      + 43 base64url chars
#   Feed tokens  "mycorrhizal_feed_" + 43 base64url chars
#
# (backend/controllers/api_token_controller.go#generateApiToken and
# feed_controller.go#generateFeedToken.) The exact length is load-bearing: it
# keeps the Prometheus metric names that share the prefix
# (mycorrhizal_storage_bytes, mycorrhizal_ratelimiter_entries) from matching,
# and the entropy floor keeps deliberately-fake all-zero/all-Z test fixtures
# quiet. This is the staged-change/pre-commit layer only — it does not replace
# GitHub push protection or git-history scanning, and those layers do not know
# this format (see docs/security/asvs-l2.md V1.1.1).
[[rules]]
id = "mycorrhizal-app-token"
description = "Mycorrhizal API or feed token"
regex = '''mycorrhizal_(?:feed_)?[A-Za-z0-9_-]{43}'''
entropy = 4.0
keywords = ["mycorrhizal_"]

# Issue #1938: the app also mints two unprefixed 32-byte base64url secrets —
# webhook signing secrets (backend/controllers/webhook_controller.go#generateSecret)
# and device-grant tokens (backend/services/device_grant_service.go#generateDeviceGrantToken).
# Deliberately no bespoke rule here. A bare 43-character base64url value is
# indistinguishable from any other 32-byte base64url value (SHA-256 digests,
# PKCE verifiers, random IDs), so an unanchored rule cannot be low-noise, and a
# context-scoped rule would only duplicate the default pack's generic-api-key
# rule, which already catches the labelled/assigned forms (`WEBHOOK_SECRET=…`,
# `"device_token":"…"`, `Secret: "…"`). Bare/unlabelled values are accepted
# residual risk; a recognizable prefix would make them detectable but is a
# credential-format change deferred out of the v1.5.1 patch scope. See
# docs/security/asvs-l2.md V1.1.1 and the verification report row 2.38.

# Issue #1293 / ADR 0034: an Android passkey ceremony origin is
# "android:apk-key-hash:" + base64url of the SHA-256 of an app's PUBLIC signing
# certificate — the same value published in /.well-known/assetlinks.json. It is
# not a secret; the golden vectors in the androidpasskey/passkey tests trip the
# generic-api-key rule on entropy alone.
[[allowlists]]
description = "Android apk-key-hash passkey origins (public certificate digests)"
regexTarget = "line"
regexes = ['''android:apk-key-hash:[A-Za-z0-9_-]{43}''']

# Issue #1623: the controllers test suite shares a deliberately-fake JWT secret
# literal to sign tokens and encrypt test credentials; the hex tail trips the
# generic-api-key rule on entropy alone. Not a secret — it exists only in
# _test.go files and the value is public in the test source.
[[allowlists]]
description = "Fake JWT secret literal in controllers tests (#1623)"
regexTarget = "line"
regexes = ['''test-jwt-secret-0123456789abcdef0123456789abcdef''']

# Issue #1901: the Kotlin formatting commit moved two deliberately-fake API
# token fixtures into added lines, so the staged-diff scan reported them on
# entropy alone. The `mcrh_live_` prefix is test-only (the real formats are
# `mycorrhizal_`/`mycorrhizal_feed_`) and these placeholder values never reach
# a server; ApiTokensScreenTest.kt and ApiClientTest.kt both use them.
[[allowlists]]
description = "Fake mcrh_live_ API token fixtures in Android tests (#1901)"
regexTarget = "line"
regexes = ['''mcrh_live_[A-Za-z0-9]+''']
