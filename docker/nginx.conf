# Mycorrhizal CRM - All-in-one image nginx configuration
#
# Single container: nginx serves the SPA and proxies API/health/CardDAV to the
# Go backend running in the same container on 127.0.0.1:8081 with nginx on 8080.

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Health check proxy - forward to backend
    location /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy - forward requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # CardDAV well-known discovery
    location /.well-known/carddav {
        return 301 /carddav/;
    }

    # CardDAV proxy - forward to backend
    location /carddav/ {
        proxy_pass http://127.0.0.1:8081/carddav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Support WebDAV methods
        proxy_method $request_method;

        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer for streaming
        proxy_buffering off;

        # Ensure UTF-8 charset for vCard responses
        charset utf-8;
        charset_types text/vcard text/xml application/xml;
    }

    # CalDAV well-known discovery
    location /.well-known/caldav {
        return 301 /caldav/;
    }

    # CalDAV proxy - forward to backend (T12b: serve Interactions/LifeEvents)
    location /caldav/ {
        proxy_pass http://127.0.0.1:8081/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Support WebDAV methods
        proxy_method $request_method;

        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer for streaming
        proxy_buffering off;

        # Ensure UTF-8 charset for iCalendar responses
        charset utf-8;
        charset_types text/calendar text/xml application/xml;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker script and the app shell must never be served stale.
    #
    # Both would otherwise be caught by the 1-year immutable rule below (the
    # regex matches any *.js, and index.html is served through it via the SPA
    # fallback). For a hashed bundle chunk that is correct; for these two it is
    # how a deployment gets stuck. An exact-match location takes precedence over
    # a regex one in nginx, so these win.
    #
    # Modern browsers already bypass the HTTP cache for the top-level worker
    # script (updateViaCache defaults to 'imports'), but that does not bind
    # intermediate proxies, and it is not a property to rely on for the file
    # that decides whether every other update is ever seen.
    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    }

    # RFC 9116 vulnerability disclosure (issue #363).
    #
    # The SPA fallback above would otherwise swallow this path and serve
    # index.html (the browser would then refuse it as a security.txt), so the
    # file is served straight off disk via an exact-match location. The file
    # itself ships in the frontend build (frontend/public/.well-known/
    # security.txt). Do NOT remove this block as dead config - it is the
    # machine-readable disclosure endpoint scanners and researchers probe.
    location = /.well-known/security.txt {
        default_type text/plain;
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache static assets
    # Note: add_header directives must be repeated here because nginx does not
    # inherit server-level add_header when a location block defines its own.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    }
}
