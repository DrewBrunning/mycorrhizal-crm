# Mycorrhizal CRM Docker Compose - All-in-one image
#
# Single-container with bundled frontend and backend (+ nginx)
#
# USAGE:
#   cp .env.example .env && edit .env, then:
#   docker compose up -d --build

services:
  mycorrhizal:
    build: .
    container_name: mycorrhizal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
      - ${PHOTOS_PATH:-./photos}:/app/static/photos
      - ${ATTACHMENTS_PATH:-./attachments}:/app/static/attachments
    ports:
      - "${FRONTEND_PORT:-7300}:8080"
    healthcheck:
      # Liveness only (issue #421): "is the process up", so a degraded-but-alive
      # instance (an optional integration down) is never restarted by Compose.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
